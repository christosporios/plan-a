# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΕΥΚΟΛΗ ΜΕΤΑΚΙΝΗΣΗ» ──────────────────────────────
contribution:
  body: |
    Η Αθήνα είναι μια πόλη όπου η μετακίνηση με τα πόδια ανάμεσα σε αρκετές
    γειτονιές είναι απόλυτα βατή. Όμως στην πράξη το περπάτημα είναι συχνά
    δυσάρεστο ή και επικίνδυνο. Ένας κύριος λόγος είναι ότι τα πεζοδρόμια είναι
    στενά.
  callouts:
    - |
      Βάσει των προδιαγραφών που θέτει η νομοθεσία, το ελάχιστο πλάτος των
      πεζοδρομίων θα έπρεπε να είναι 2,1 μέτρα (ώστε να χωρούν τουλάχιστον δύο
      άτομα). Στην Αθήνα, το 70% των πεζοδρομίων, όμως, είναι [εκτός αυτών των
      προδιαγραφών](https://walkable.cityofathens.gr/map)^1 ενώ το 41% έχει
      πλάτος μικρότερο του ενός μέτρου. Το 5% των δρόμων δεν έχει καν πεζοδρόμιο.
  body_after: |
    Σε ορισμένες περιοχές της πόλης, δεν υπάρχει λόγος ο δρόμος να χωρίζεται με
    αυτόν τον τρόπο: μικρό πεζοδρόμιο για τον άνθρωπο, μεγάλος δρόμος για το
    αυτοκίνητο. Αν επιλέξουμε να πεζοδρομήσουμε τέτοιους δρόμους, ο χώρος που
    ελευθερώνεται αποδίδεται στον πεζό. Περισσότεροι πεζόδρομοι κάνουν το
    περπάτημα πιο ελκυστικό και άρα, τη μετακίνηση στην πόλη με τα πόδια πιο
    εύκολη.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Τι γίνεται με όσους θέλουν να παρκάρουν στο πάρκινγκ του σπιτιού τους;"
    a: >
      Το μέτρο θα εφαρμοστεί σε δρόμους όπου τα κτίρια εκατέρωθεν δεν διαθέτουν
      ιδιόκτητο πάρκινγκ. Το κρίσιμο βήμα είναι να γίνει η σωστή και
      τεκμηριωμένη αντιστοίχιση: ποιοι συγκεκριμένοι δρόμοι πληρούν αυτή την
      προϋπόθεση και είναι κατάλληλοι για πεζοδρόμηση δεδομένου του αντίκτυπου
      στην κυκλοφορία.

  - q: "Τι γίνεται με όσους θέλουν να παρκάρουν στον δρόμο;"
    a: >
      Οι κάτοικοι που σήμερα παρκάρουν στον δρόμο θα βρεθούν με λιγότερες
      διαθέσιμες θέσεις – και αυτό είναι εν μέρει ο στόχος. Θέλουμε η πόλη να
      γίνει λιγότερο εξαρτημένη από το αυτοκίνητο, και αυτό σημαίνει ότι το να
      έχεις αυτοκίνητο στην Αθήνα πρέπει να γίνει λιγότερο βολικό αλλά και
      λιγότερο αναγκαίο ταυτόχρονα. Αυτό το σχέδιο δράσης υποστηρίζει αυτή την
      κατεύθυνση από διαφορετικές πλευρές: οι πεζοδρομήσεις κάνουν το περπάτημα
      πιο ασφαλές και ελκυστικό, η επέκταση του δικτύου ποδηλάτων προσφέρει μια
      ρεαλιστική εναλλακτική για καθημερινές μετακινήσεις (βλ. πρόταση 5).
      Παράλληλα, μια λιγότερο ελκυστική τιμολόγηση στάθμευσης στον δρόμο (βλ.
      πρόταση 3) θα λειτουργήσει ως αντικίνητρο για όσους φέρνουν αυτοκίνητο στη
      γειτονιά χωρίς να κατοικούν εκεί – αποδεσμεύοντας έτσι θέσεις για τους
      ίδιους τους κατοίκους.

  - q: "Θα αυξηθεί η κίνηση;"
    a: >
      Σε μελέτη που ανέλυσε δρόμους της Βαρκελώνης όπου εφαρμόστηκαν αντίστοιχες
      παρεμβάσεις πεζοδρόμησης, στις γύρω οδούς καταγράφηκε [ελαφριά μείωση της
      κίνησης](https://www.sciencedirect.com/science/article/pii/S2213624X22002085)^2
      – όχι αύξηση –, με εξαίρεση τους άμεσα παράλληλους δρόμους, όπου
      παρατηρήθηκε μια πάρα πολύ μικρή αύξηση της τάξης του 0,7%. Αυτό συνάδει με
      το φαινόμενο που οι ειδικοί ονομάζουν «traffic evaporation»: όταν μειώνεται
      ο διαθέσιμος οδικός χώρος, ένα μέρος της κίνησης δεν μεταφέρεται αλλού αλλά
      απλώς εξαφανίζεται, καθώς οι οδηγοί αλλάζουν συνήθειες, μέσο ή ώρα
      μετακίνησης. Το αντίστροφο φαινόμενο – ότι περισσότεροι δρόμοι σημαίνουν
      λιγότερη κίνηση – έχει επίσης διαψευστεί: τα δεδομένα δείχνουν ότι κάθε 1%
      αύξησης στην προσφορά δρόμων παράγει [1% περισσότερη
      κυκλοφορία](https://ideas.repec.org/p/uab/wprdea/wpdea2011.html)^3.

  - q: "Οι επιχειρήσεις θα χάσουν πελάτες;"
    a: >
      Οι έμποροι μπορεί να φοβούνται ότι η πεζοδρόμηση θα μειώσει τους πελάτες
      τους, υποθέτοντας ότι οι αγοραστές έρχονται κυρίως με αυτοκίνητο. Τα
      δεδομένα δείχνουν το αντίθετο. Στη Βαρκελώνη, για παράδειγμα, στο superblock
      του Poblenou, ο αριθμός των τοπικών επιχειρήσεων [αυξήθηκε κατά
      30%](https://green-living-areas.interreg-euro-med.eu/wp-content/uploads/sites/7/policy-brief-superblocks_fv_1903.pdf)^4
      μετά την εφαρμογή του μέτρου, αναδεικνύοντας τα οικονομικά οφέλη του μέτρου.

  - q: "Δυσκολεύει η προσβασιμότητα και η τροφοδοσία;"
    a: >
      Η πεζοδρόμηση δεν σημαίνει αποκλεισμός. Θα προβλέπονται ράμπες για ΑμΕΑ,
      καθορισμένες ώρες φόρτωσης-εκφόρτωσης για καταστήματα και πρόσβαση για
      οχήματα έκτακτης ανάγκης.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Πιο δροσερές γειτονιές
    body: >
      Οι προσομοιώσεις του Δήμου Βαρκελώνης εκτιμούν μείωση θερμοκρασίας [κατά
      1,2°C](https://climate-adapt.eea.europa.eu/en/metadata/case-studies/barcelona-trees-tempering-the-mediterranean-city-climate)^5
      τις ζεστές ημέρες από την εφαρμογή του προγράμματος superblock.

  - title: Λιγότερη ηχορύπανση
    body: >
      Στο superblock του Sant Antoni στη Βαρκελώνη, [η ηχορύπανση
      μειώθηκε](https://www.oneearth.org/barcelona-tackles-air-pollution-by-expanding-its-superblocks-street-plan/)^6
      κατά 4,1 dB κατά τη διάρκεια της ημέρας και κατά 5,3 dB τη νύχτα. Μιλάμε για
      μια αλλαγή που γίνεται σαφώς αντιληπτή από το ανθρώπινο αυτί, ιδίως τη νύχτα
      όταν η ησυχία έχει άμεση επίδραση στην ποιότητα του ύπνου.
    callouts:
      - |
        Δεν υπάρχουν συστηματικές μετρήσεις ηχορύπανσης για την Αθήνα, αλλά το
        πρόβλημα είναι βιωματικά αδιαμφισβήτητο. Σύμφωνα με τον ΠΟΥ, τουλάχιστον
        [1,6 εκατομμύρια υγιή χρόνια ζωής
        χάνονται](https://www.ahajournals.org/doi/10.1161/CIRCRESAHA.123.323584)^7
        ετησίως στη Δυτική Ευρώπη από τον θόρυβο της κυκλοφορίας, με τεκμηριωμένες
        επιπτώσεις σε ισχαιμικές καρδιοπάθειες, εγκεφαλικό, υπέρταση και διαβήτη
        τύπου 2.

  - title: Καλύτερη ποιότητα αέρα
    body: >
      Στο superblock του Sant Antoni, τα επίπεδα διοξειδίου του αζώτου [μειώθηκαν
      κατά 33%](https://www.oneearth.org/barcelona-tackles-air-pollution-by-expanding-its-superblocks-street-plan/)^6.
    callouts:
      - |
        Στην Αθήνα, πάνω από το 70% των ρύπων διοξειδίου του αζώτου προέρχονται
        [από τα
        οχήματα](https://www.kathimerini.gr/society/1059674/ta-ochimata-eythynontai-gia-to-70-ton-rypon-oxeidioy-toy-azotoy-stin-athina/)^8,
        σχεδόν διπλάσιο από τον μέσο όρο 30 μεγάλων ευρωπαϊκών πόλεων στο 40%, ενώ
        σε κάποιες πόλεις όπως η Λισαβόνα το ποσοστό είναι μόλις 20%.

  - title: Περισσότερη ασφάλεια και ανεξαρτησία για τα παιδιά
    body: >
      Ένας από τους λόγους που όλο και λιγότερο αφήνουμε τα παιδιά να κάνουν μόνα
      τους μια μικρή δουλειά στη γειτονιά ή να πάνε σχολείο χωρίς συνοδεία, είναι
      ότι πρέπει να περάσουν έστω και έναν δρόμο. Ένας πεζόδρομος λύνει ακριβώς
      αυτό το πρόβλημα και αρκετά παιδιά θα μπορούν να αποκτήσουν μια πρώτη
      καθημερινή αυτονομία.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Χαρτογράφηση σημείων εφαρμογής
    body: >
      Να εντοπιστούν δρόμοι που πληρούν δύο κριτήρια ταυτόχρονα: δεν έχουν ακίνητα
      με ιδιόκτητες θέσεις στάθμευσης (ώστε η πεζοδρόμηση να μην αφαιρέσει την
      πρόσβαση σε πάρκινγκ) και δεν είναι αρτηρίες που η πεζοδρόμησή τους θα
      επηρεάσει σημαντικά την κυκλοφορία.

  - title: Επικοινωνία με πόλεις που έχουν ήδη εφαρμόσει παρόμοιο μοντέλο
    body: >
      Να αναζητηθούν συγκεκριμένες επαφές στον Δήμο της Βαρκελώνης, με στόχο μια
      άμεση συνομιλία για τις προκλήσεις που προέκυψαν κατά τον σχεδιασμό και την
      πρώτη φάση λειτουργίας των superblocks που ενδεχομένως δεν αποτυπώνονται
      πλήρως στη βιβλιογραφία.

