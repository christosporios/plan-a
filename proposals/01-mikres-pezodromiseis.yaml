number: 1
slug: mikres-pezodromiseis
theme: mobility
title: Μικρές πεζοδρομήσεις ανά ομάδες οικοδομικών τετραγώνων
one_line: >
  Οι πολυκατοικίες συχνά στερούνται χώρου στάθμευσης, τα πεζοδρόμια είναι
  στενά και οι δρόμοι το ίδιο – μια κατάσταση που αφήνει και πεζούς και
  οδηγούς μετρίως ικανοποιημένους. Η επιλεκτική πεζοδρόμηση συγκεκριμένων
  δρόμων ανά ομάδες οικοδομικών τετραγώνων, με φύτευση και πράσινο, αποδίδει
  στη γειτονιά χώρο για πεζούς και ανάσες πρασίνου, απελευθερώνοντας χώρο για
  ήπια κυκλοφορία, χωρίς να ανατρέπεται η κίνηση της πόλης συνολικά.

problem:
  body: |
    Η Αθήνα είναι μια πόλη όπου η μετακίνηση με τα πόδια ανάμεσα σε αρκετές
    γειτονιές είναι απόλυτα βατή. Όμως στην πράξη το περπάτημα είναι συχνά
    δυσάρεστο κι επικίνδυνο. Ένας κύριος λόγος είναι ότι τα πεζοδρόμια είναι
    στενά.
  callouts:
    - |
      Βάσει των προδιαγραφών που θέτει η νομοθεσία, το ελάχιστο πλάτος των
      πεζοδρομίων θα έπρεπε να είναι 2,1 μέτρα (ώστε να χωρούν τουλάχιστον δύο
      άτομα). Στην Αθήνα, το 70% των πεζοδρομίων είναι εκτός αυτών των
      προδιαγραφών ενώ το 41% έχει πλάτος μικρότερο του ενός μέτρου. Το 5% των
      δρόμων δεν έχει καν πεζοδρόμιο.^1

proposal:
  body: |
    Σε ορισμένες περιοχές της πόλης, δεν υπάρχει λόγος ο δρόμος να χωρίζεται με
    αυτόν τον τρόπο: μικρό πεζοδρόμιο για τον άνθρωπο, μεγάλος δρόμος για το
    αυτοκίνητο. Αν επιλέγουμε να πεζοδρομήσουμε τέτοιους δρόμους, ο χώρος που
    ελευθερώνεται αποδίδεται στον πεζό. Περισσότεροι πεζόδρομοι κάνουν το
    περπάτημα πιο ελκυστικό και άρα τη μετακίνηση στην πόλη με τα πόδια πιο
    εύκολη.

limitations:
  - q: "Τι γίνεται με όσους θέλουν να παρκάρουν στο πάρκινγκ του σπιτιού τους;"
    a: >
      Το μέτρο θα εφαρμοστεί σε δρόμους όπου τα κτίρια εκατέρωθεν δεν διαθέτουν
      ιδιόκτητο πάρκινγκ. Το κρίσιμο βήμα είναι να γίνει η σωστή και
      τεκμηριωμένη αντιστοίχιση: ποιοι συγκεκριμένα δρόμοι πληρούν αυτή την
      προϋπόθεση και είναι κατάλληλοι για πεζοδρόμηση δεδομένου του αντίκτυπου
      στην κυκλοφορία.

  - q: "Τι γίνεται με όσους θέλουν να παρκάρουν στον δρόμο;"
    a: >
      Οι κάτοικοι που σήμερα παρκάρουν στον δρόμο θα βρεθούν με λιγότερες
      διαθέσιμες θέσεις — και αυτό είναι εν μέρει ο στόχος. Θέλουμε η πόλη να
      γίνει λιγότερο εξαρτημένη από το αυτοκίνητο, και αυτό σημαίνει ότι το να
      έχεις αυτοκίνητο στην Αθήνα πρέπει να γίνει λιγότερο βολικό αλλά και
      λιγότερο αναγκαίο ταυτόχρονα. Αυτό το σχέδιο δράσης υποστηρίζει αυτή την
      κατεύθυνση από διαφορετικές πλευρές: οι πεζοδρομήσεις κάνουν το περπάτημα
      πιο ασφαλές και ελκυστικό, η επέκταση του δικτύου ποδηλάτων προσφέρει μια
      ρεαλιστική εναλλακτική για καθημερινές μετακινήσεις, ενώ η έξυπνη
      τιμολόγηση στάθμευσης λειτουργεί ως αντικίνητρο για όσους φέρνουν
      αυτοκίνητο στη γειτονιά χωρίς να κατοικούν εκεί — αποδεσμεύοντας έτσι
      θέσεις για τους ίδιους τους κατοίκους.

  - q: "Θα αυξηθεί η κίνηση στους γύρω δρόμους;"
    a: >
      Σε μελέτη που ανέλυσε δρόμους της Βαρκελώνης όπου εφαρμόστηκαν αντίστοιχες
      παρεμβάσεις πεζοδρόμησης, στις γύρω οδούς καταγράφηκε ελαφριά μείωση της
      κίνησης — όχι αύξηση —, με εξαίρεση τους άμεσα παράλληλους δρόμους, όπου
      παρατηρήθηκε μια πάρα πολύ μικρή αύξηση της τάξης του 0,7%.^2 Αυτό συνάδει
      με το φαινόμενο που οι ειδικοί ονομάζουν «traffic evaporation»: όταν
      μειώνεται ο διαθέσιμος οδικός χώρος, ένα μέρος της κίνησης δεν μεταφέρεται
      αλλού αλλά απλώς εξαφανίζεται, καθώς οι οδηγοί αλλάζουν συνήθειες, μέσο ή
      ώρα μετακίνησης. Το αντίστροφο φαινόμενο — ότι περισσότεροι δρόμοι
      σημαίνουν λιγότερη κίνηση — έχει επίσης διαψευσθεί: τα δεδομένα δείχνουν
      ότι κάθε 1% αύξησης στην προσφορά δρόμων παράγει 1% περισσότερη
      κυκλοφορία.^3

  - q: "Οι επιχειρήσεις θα χάσουν πελάτες;"
    a: >
      Οι έμποροι μπορεί να φοβούνται ότι η πεζοδρόμηση θα μειώσει τους πελάτες
      τους, υποθέτοντας ότι οι αγοραστές έρχονται κυρίως με αυτοκίνητο. Τα
      δεδομένα δείχνουν το αντίθετο. Στη Βαρκελώνη, για παράδειγμα, στο
      superblock του Poblenou, ο αριθμός των τοπικών επιχειρήσεων αυξήθηκε κατά
      30% μετά την εφαρμογή του μέτρου, αναδεικνύοντας τα οικονομικά οφέλη του
      μέτρου.^4

  - q: "Δυσκολεύει η προσβασιμότητα και η τροφοδοσία;"
    a: >
      Η πεζοδρόμηση δεν σημαίνει αποκλεισμός. Θα προβλέπονται ράμπες για ΑμΕΑ,
      καθορισμένες ώρες φόρτωσης-εκφόρτωσης για καταστήματα και πρόσβαση για
      οχήματα έκτακτης ανάγκης.

benefits:
  - title: Πιο δροσερές γειτονιές
    body: >
      Οι προσομοιώσεις του Δήμου Βαρκελώνης εκτιμούν μείωση θερμοκρασίας κατά
      1,2°C τις ζεστές ημέρες από την εφαρμογή του προγράμματος superblock.^5

  - title: Λιγότερη ηχορύπανση
    body: >
      Στο superblock του Sant Antoni στη Βαρκελώνη, η ηχορύπανση μειώθηκε κατά
      4,1 dB κατά τη διάρκεια της ημέρας και κατά 5,3 dB τη νύχτα.^6 Μιλάμε για
      μια αλλαγή που γίνεται σαφώς αντιληπτή από το ανθρώπινο αυτί, ιδίως τη
      νύχτα όταν η ησυχία έχει άμεση επίδραση στην ποιότητα του ύπνου.

      Δεν υπάρχουν συστηματικές μετρήσεις ηχορύπανσης για την Αθήνα, αλλά
      βιωματικά το πρόβλημα είναι αδιαμφισβήτητο. Σύμφωνα με τον ΠΟΥ,
      τουλάχιστον 1,6 εκατομμύρια υγιή χρόνια ζωής χάνονται ετησίως στη Δυτική
      Ευρώπη από τον θόρυβο της κυκλοφορίας, με τεκμηριωμένες επιπτώσεις σε
      ισχαιμική καρδιοπάθεια, εγκεφαλικό, υπέρταση και διαβήτη τύπου 2.^7

  - title: Καλύτερη ποιότητα αέρα
    body: >
      Στο superblock του Sant Antoni, τα επίπεδα διοξειδίου του αζώτου μειώθηκαν
      κατά 33%.^8 Στην Αθήνα, πάνω από το 70% των ρύπων διοξειδίου του αζώτου
      προέρχονται από τα οχήματα, σχεδόν διπλάσιο από τον μέσο όρο 30 μεγάλων
      ευρωπαϊκών πόλεων στο 40%, ενώ σε κάποιες πόλεις όπως η Λισαβόνα το
      ποσοστό είναι μόλις 20%.^9

  - title: Περισσότερη ασφάλεια και ανεξαρτησία για τα παιδιά
    body: >
      Ένας από τους λόγους που όλο και λιγότερο αφήνουμε τα παιδιά να κάνουν
      μόνα τους μια μικρή δουλειά στη γειτονιά ή να πάνε σχολείο χωρίς συνοδεία,
      είναι ότι πρέπει να περάσουν έστω και έναν δρόμο. Ένας πεζόδρομος λύνει
      ακριβώς αυτό το πρόβλημα και αρκετά παιδιά θα μπορούν να αποκτήσουν μια
      πρώτη καθημερινή αυτονομία.

