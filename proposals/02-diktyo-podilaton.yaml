number: 2
slug: diktyo-podilaton
theme: mobility
title: Δίκτυο κοινόχρηστων ποδηλάτων
one_line: >
  Σε δεκάδες ευρωπαϊκές πόλεις το κοινόχρηστο ποδήλατο έχει γίνει κομμάτι της
  καθημερινότητας, και η μικρή κλίμακα της Αθήνας θα ταίριαζε απόλυτα σε αυτό
  το μοντέλο. Το εμπόδιο της ανηφόρας λύνεται από τα ηλεκτρικά ποδήλατα. Το
  κλειδί είναι η πυκνότητα: πολλά ποδήλατα σε πολλά σημεία κάνουν το σύστημα
  ελκυστικό, και η ζήτηση που θα δημιουργηθεί θα φέρει μαζί της πίεση για
  ποδηλατοδρόμους και περαιτέρω υποδομές που θα κάνουν και την ιδιοκτησία
  ποδηλάτου πιο ελκυστική. Απαραίτητη όμως είναι και η καλή ρύθμιση του
  παρκαρίσματός τους καθώς ο δημόσιος χώρος στην Αθήνα είναι ήδη υπό πίεση.

problem:
  body: |
    Η Αθήνα είναι η μόνη ευρωπαϊκή πρωτεύουσα χωρίς δημοτικό σύστημα
    κοινόχρηστων ποδηλάτων. Παρίσι, Βαρκελώνη, Λισαβόνα, Λονδίνο, Βερολίνο —
    κάθε συγκρίσιμη πόλη λειτουργεί ένα. Η Αθήνα όχι.

    Η πόλη δεν στερείται σχεδίων. Το 2013, ο Δήμος ενέκρινε πρόγραμμα 1.000
    ποδηλάτων σε 70 σταθμούς. Δεν υλοποιήθηκε ποτέ. Η μόνη υλοποίηση ήταν μια
    πιλοτική εγκατάσταση ~10 ποδηλάτων στην Τεχνόπολη Γκαζιού, η οποία δεν
    κλιμακώθηκε. Αυτό δεν ήταν αποτυχία αγοράς — ήταν αποτυχία εκτέλεσης.

    Στο μεταξύ, η κινητικότητα στην πόλη παραμένει εγκλωβισμένη σε ένα μοντέλο
    που δυσλειτουργεί. Ο μέσος Αθηναίος χάνει 143 ώρες τον χρόνο στην
    κυκλοφοριακή συμφόρηση^1 — σχεδόν έξι ολόκληρες ημέρες. Η μέση ταχύτητα
    στο κέντρο είναι 15,5 χλμ./ώρα, αριθμός που σημαίνει ότι ένα ποδήλατο —
    ακόμα και μηχανικό — είναι ταχύτερο από αυτοκίνητο σε πολλές διαδρομές
    εντός Δήμου.

    Το ποδήλατο αντιπροσωπεύει μόλις ~2% των μετακινήσεων στην Αθήνα, ενώ το
    ΙΧ καλύπτει πάνω από το μισό. Αυτό δεν αντανακλά κάποια ιδιαίτερη
    αντιπάθεια των Αθηναίων προς το ποδήλατο. Αντανακλά απλώς ότι δεν υπάρχει
    η υποδομή: ο Δήμος διαθέτει μόλις 25–30 χλμ. αποσπασματικών
    ποδηλατοδρόμων, χωρίς ενιαίο δίκτυο, και χωρίς κοινόχρηστο στόλο.

    Και η ατμοσφαιρική ρύπανση που συνοδεύει αυτό το μοντέλο δεν είναι
    αφηρημένη. Η ετήσια μέση τιμή PM2.5 στην Αθήνα ξεπερνά κατά 3,8 φορές το
    όριο του Παγκόσμιου Οργανισμού Υγείας.^2 Η οδική κυκλοφορία είναι η κύρια
    πηγή οξειδίων του αζώτου στην πόλη.

    Ο ιδιωτικός τομέας δεν έχει καλύψει το κενό. Η RideMovi εγκατέλειψε τα
    ηλεκτρικά ποδήλατά της λόγω εκτεταμένου βανδαλισμού. Η Lime επέστρεψε το
    2024 μετά από τετραετή απουσία, αλλά μόνο με πατίνια. Η Dott εγκαινίασε
    300 πατίνια τον Μάρτιο 2025. Σήμερα, πάνω από 4.000 ηλεκτρικά πατίνια
    κυκλοφορούν στο κέντρο — αλλά μηδέν κοινόχρηστα ποδήλατα. Τα πατίνια
    εξυπηρετούν ένα τμήμα ζήτησης, αλλά δεν αποτελούν σύστημα αστικής
    μεταφοράς: δεν έχουν σταθερούς σταθμούς, δεν ενσωματώνονται στα ΜΜΜ, δεν
    εξυπηρετούν συστηματικά το πρώτο/τελευταίο χιλιόμετρο.
  callouts:
    - |
      TomTom Traffic Index 2025: Συμφόρηση 54,7% στο κέντρο Αθήνας. Μέση
      χρονική απώλεια 143 ωρ./κάτοικο/έτος, αυξημένη κατά 6+ ώρες σε σχέση με
      το προηγούμενο έτος. Ταχύτητα αιχμής: 12,3 χλμ./ώρα.
    - |
      IQAir 2019: Ετήσιος μέσος PM2.5 στην Αθήνα: 22,3 μg/m³. Κατευθυντήριο
      όριο ΠΟΥ: 5 μg/m³. Η ΕΕ θα απαιτήσει συμμόρφωση στα 10 μg/m³ ως το
      2030, βάσει αναθεωρημένης Οδηγίας για την Ποιότητα Αέρα.

proposal:
  body: |
    Δημοτικό σύστημα 2.000 κοινόχρηστων ποδηλάτων σε 200 σταθμούς σύνδεσης
    εντός του Δήμου Αθηναίων, ενσωματωμένο στο δίκτυο ΜΜΜ μέσω της κάρτας
    ATH.ENA.

    Τουλάχιστον 60% του στόλου (1.200 ποδήλατα) θα είναι ηλεκτρικά. Η Λισαβόνα
    ξεκίνησε με μεικτό στόλο και κατέληξε να ηλεκτροδοτεί όλα τα μηχανικά
    ποδήλατα γιατί κανείς δεν τα χρησιμοποιούσε λόγω λόφων. Η Βαρκελώνη —
    πόλη με ανάλογο κλίμα — βλέπει το 80% των διαδρομών να γίνεται σε
    ηλεκτρικά ποδήλατα. Στη ζέστη και στις ανηφόρες, το μηχανικό ποδήλατο δεν
    αποτελεί λειτουργική επιλογή για τη μέση μετακίνηση.

    Οι σταθμοί θα τοποθετηθούν κατά προτεραιότητα σε τρεις τύπους σημείων:
    **σταθμοί Μετρό/Τραμ** χωρίς συνδετική μεταφορά (πρώτο/τελευταίο
    χιλιόμετρο), **κομβικά σημεία εργασίας** (Σύνταγμα, Ομόνοια, Μοναστηράκι,
    Κεραμεικός), και **σημεία σύνδεσης** με τον υπό κατασκευή Μητροπολιτικό
    Ποδηλατόδρομο Γκάζι–Κηφισιά (17,8 χλμ.).

    Η χρέωση θα ακολουθεί ευρωπαϊκά πρότυπα: ετήσια συνδρομή με δωρεάν τα
    πρώτα 30 λεπτά κάθε διαδρομής. Οι κάτοχοι μηνιαίας κάρτας ATH.ENA θα
    λαμβάνουν μειωμένη ή μηδενική συνδρομή — κατά το πρότυπο Λισαβόνας, όπου
    η κάρτα Navegante παρέχει δωρεάν πρόσβαση στα κοινόχρηστα ποδήλατα Gira.

implementation:
  body: |
    Ο Δήμος Αθηναίων έχει σαφή αρμοδιότητα. Οι νόμοι 3463/2006 και 3852/2010
    αναθέτουν στους Δήμους την ευθύνη τοπικών μεταφορών, ρύθμισης κυκλοφορίας
    και διαχείρισης δημόσιου χώρου. Τα κοινόχρηστα ποδήλατα δεν εμπίπτουν
    στην αρμοδιότητα του ΟΑΣΑ — ο οργανισμός καλύπτει μέσα σταθερής τροχιάς
    και λεωφορεία, όχι ελαφρά οχήματα. Το ίδιο το ΣΒΑΚ Αθήνας (2021), που ο
    Δήμος υποχρεούται να εκπονήσει βάσει του Ν. 4784/2021, θέτει τη ρητή
    δέσμευση για προώθηση ήπιων μορφών μετακίνησης, συμπεριλαμβανομένης της
    ποδηλασίας.

    Η προμήθεια μπορεί να ακολουθήσει δύο μοντέλα. Πρώτον, **σύμβαση
    υπηρεσίας** βάσει Ν. 4412/2016: ο Δήμος προκηρύσσει διαγωνισμό
    design–build–operate και αναθέτει σε ιδιώτη ανάδοχο, διατηρώντας την
    κυριότητα. Δεύτερον, **σύμβαση παραχώρησης** βάσει Ν. 4413/2016: ο
    ιδιώτης αναλαμβάνει τον λειτουργικό κίνδυνο, αντλώντας έσοδα από
    χρεώσεις χρηστών και διαφημιστική αξιοποίηση — κατά το πρότυπο του
    αρχικού Vélib' στο Παρίσι, όπου η JCDecaux κάλυψε €100–120 εκ. κόστους
    εγκατάστασης αντί αποκλειστικής πρόσβασης σε 1.628 διαφημιστικά πλαίσια.
    Στην περίπτωση παραχώρησης, η δημοτική δαπάνη μειώνεται σημαντικά.

    Σημαντικό: η τεχνική υποδομή ένταξης στα ΜΜΜ υπάρχει ήδη. Το νέο
    Αυτόματο Σύστημα Συλλογής Κομίστρου (AFC) του ΟΑΣΑ, που κατασκεύασε η
    HST (Όμιλος ΤΕΡΝΑ ΕΝΕΡΓΕΙΑΚΗ), σχεδιάστηκε ρητά για Mobility as a
    Service, με πρόβλεψη ένταξης ηλεκτρικών ποδηλάτων. Το tap2ride (ανέπαφη
    πληρωμή) λειτουργεί από τον Ιανουάριο 2025 σε όλα τα μέσα. Η προσθήκη
    κοινόχρηστου ποδηλάτου στο σύστημα δεν απαιτεί νέα τεχνολογική υποδομή —
    απαιτεί θεσμική συμφωνία.

limitations:
  - q: "Βανδαλισμός: η RideMovi αποχώρησε από την Αθήνα λόγω εκτεταμένου βανδαλισμού στα ηλεκτρικά ποδήλατά της. Στο Παρίσι, το 80% του αρχικού στόλου Vélib' αντικαταστάθηκε μέσα σε δύο χρόνια. Ο κίνδυνος είναι πραγματικός."
    a: >
      Τα ποδήλατα docking-station (σε αντίθεση με τα free-floating που
      χρησιμοποιούσε η RideMovi) είναι σημαντικά πιο ανθεκτικά — η υποχρέωση
      επιστροφής σε σταθμό μειώνει δραστικά τον βανδαλισμό. Η σύμβαση με τον
      ανάδοχο πρέπει να περιλαμβάνει αντιβανδαλιστικό σχεδιασμό (ενισχυμένα
      πλαίσια, GPS tracking), ρήτρες SLA για ταχεία αντικατάσταση, και
      ρεαλιστικό προϋπολογισμό αντικατάστασης στόλου 10–15% ετησίως.
      Παράλληλα, η κοινωνική ένταξη του συστήματος μέσω ΜΜΜ — δηλαδή η
      μετατροπή του ποδηλάτου σε εργαλείο καθημερινής μετακίνησης και όχι
      σε τουριστικό gadget — δημιουργεί κοινότητα χρηστών που λειτουργεί
      αποτρεπτικά.

  - q: "Ελλιπής υποδομή ποδηλατοδρόμων: ο Δήμος διαθέτει μόλις 25–30 χλμ. αποσπασματικών ποδηλατοδρόμων. Η εγκατάσταση κοινόχρηστων ποδηλάτων χωρίς ασφαλείς διαδρομές ενέχει κίνδυνο χαμηλής χρήσης."
    a: >
      Η πρώτη φάση εστιάζει στον πυρήνα του κέντρου και όχι σε κεντρικές
      αρτηρίες, που είναι σε μεγάλο βαθμό επίπεδες, με χαμηλές ταχύτητες
      οχημάτων και ήδη ημι-πεζοδρομημένες. Παράλληλα, ο υπό κατασκευή
      Μητροπολιτικός Ποδηλατόδρομος Γκάζι–Κηφισιά (17,8 χλμ.) και τα 17,3
      χλμ. νέων ποδηλατοδρόμων που ανακοίνωσε ο Δήμος τον Δεκέμβριο 2025
      ενισχύουν δραστικά το δίκτυο τα επόμενα έτη.

  - q: "Καλοκαιρινή ζέστη: η Αθήνα καταγράφει μέσες μέγιστες θερμοκρασίες 33–35°C τον Ιούλιο-Αύγουστο, με καύσωνες πάνω από 40°C."
    a: >
      Η Βαρκελώνη αντιμετωπίζει παρεμφερές κλίμα και καταγράφει αυξημένη
      χρήση ηλεκτρικών ποδηλάτων ακόμα και το καλοκαίρι — ακριβώς επειδή τα
      ηλεκτρικά ελαχιστοποιούν τη σωματική καταπόνηση. Η Αθήνα απολαμβάνει
      8–10 μήνες ιδανικού καιρού για ποδηλασία. Ακόμα και με μειωμένη
      μεσημεριανή χρήση τους δύο θερινούς μήνες, η ετήσια χρηστικότητα
      παραμένει υψηλή.

  - q: "Περιχαράκωση εντός Δήμου Αθηναίων: ένα σύστημα ποδηλάτων που σταματά στα σύνορα του Δήμου αφήνει εκτός το μεγαλύτερο μέρος της μητροπολιτικής περιοχής."
    a: >
      Αυτός ο περιορισμός είναι πραγματικός, αλλά δεν μπορεί να γίνει λόγος
      μη-δράσης. Το Bicing της Βαρκελώνης ξεκίνησε αποκλειστικά εντός
      δημοτικών ορίων. Η Αθήνα μπορεί να κάνει το ίδιο, και αν το σύστημα
      πετύχει, οι γειτονικοί Δήμοι θα έχουν κίνητρο να ενταχθούν — ή η
      Περιφέρεια Αττικής να αναλάβει μητροπολιτικό ρόλο.


