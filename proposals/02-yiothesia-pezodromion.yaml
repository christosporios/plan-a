number: 2
slug: yiothesia-pezodromion
theme: mobility
title: Επισκευές πεζοδρομίων με την εποπτεία κατοίκων και χρήματα του δήμου
one_line: >
  Ο Δήμος δίνει voucher σε κατοίκους που εντοπίζουν και καταγγέλλουν
  προβληματικά πεζοδρόμια, αναθέτοντάς τους το project management της επισκευής
  — χωρίς να βάλουν ούτε ευρώ από την τσέπη τους.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Στην Αθήνα, προϋπολογίζονται τεράστια ποσά για την αναβάθμιση πεζοδρομίων αλλά η αίσθηση πραγματικής βελτίωσης παραμένει απούσα. Το νομικό πλαίσιο επιτρέπει ήδη σε πολίτες να αναλαμβάνουν την αποκατάσταση ενός πεζοδρομίου αλλά με δικούς τους πόρους. Η πρόταση είναι ο δήμος να δίνει voucher σε πολίτες που εντοπίζουν και καταγγέλλουν προβληματικά πεζοδρόμια, αναθέτοντάς τους το project management της επισκευής, χωρίς όμως να βάλουν ούτε ευρώ από την τσέπη τους. Άλλωστε κανείς δεν έχει μεγαλύτερο κίνητρο να δει τη δουλειά να γίνεται σωστά και γρήγορα από αυτόν που περπατά εκεί κάθε μέρα.

