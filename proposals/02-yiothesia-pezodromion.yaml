# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΕΥΚΟΛΗ ΜΕΤΑΚΙΝΗΣΗ» ──────────────────────────────
contribution:
  body: |
    Η κατάσταση των πεζοδρομίων της πόλης είναι προβληματική.

    ::: callout
    [1.915 χιλιόμετρα](https://walkable.cityofathens.gr/map)^1 υπολογίζεται ότι είναι η έκταση του χώρου στον οποίο υπάρχει (ή θα έπρεπε να υπάρχει) πεζοδρόμιο στην Αθήνα.

    Μόλις το 14% θεωρείται ότι είναι σε καλή κατάσταση ενώ το 82% θεωρείται ότι είναι σε μέτρια ή κακή κατάσταση.

    Βάσει των προδιαγραφών που θέτει η νομοθεσία, το ελάχιστο πλάτος των πεζοδρομίων θα έπρεπε να είναι 2,1 μέτρα (ώστε να χωρούν τουλάχιστον δύο άτομα). Το 70% των πεζοδρομίων, όμως, είναι εκτός αυτών των προδιαγραφών ενώ το 41% έχει πλάτος μικρότερο του ενός μέτρου. Το 5% των δρόμων δεν έχει καν πεζοδρόμιο.

    Η προσβασιμότητα είναι επίσης περιορισμένη. Στο 90% των πεζοδρομίων δεν υπάρχει η απαραίτητη υποδομή για την όδευση των τυφλών.
    :::

    Η κακή ποιότητα και το ανεπαρκές πλάτος των πεζοδρομίων αποτρέπει τους κατοίκους από το να περπατούν, μειώνοντας τη σωματική δραστηριότητα στην πόλη. [Έρευνα στην κομητεία Μοντγκόμερι του Μέριλαντ](https://pmc.ncbi.nlm.nih.gov/articles/PMC2789060/)^2 διαπίστωσε ότι οι κάτοικοι που ζούσαν σε περιοχές με καλύτερη κατάσταση πεζοδρομίων πραγματοποιούσαν σχεδόν διπλάσιες εβδομαδιαίες μετακινήσεις με τα πόδια σε σχέση με αυτούς που ζούσαν σε περιοχές με κακής ποιότητας πεζοδρόμια. Αυτό έχει [άμεσες συνέπειες για τη δημόσια υγεία](https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(16)30383-X/abstract)^3: παγκοσμίως, η σωματική αδράνεια εκτιμάται ότι οδηγεί σε 13,4 εκ. χρόνια ζωής με αναπηρία από ασθένειες όπως καρδιοπάθειες, διαβήτης τύπου 2, εγκεφαλικό επεισόδιο, καρκίνος του μαστού και καρκίνος του παχέος εντέρου.

    Ανατρέχοντας κανείς στην ειδησεογραφία, θα βρει πολλές ανακοινώσεις φιλόδοξων προγραμμάτων αναβάθμισης πεζοδρομίων, πολλών εκατομμυρίων ευρώ. Στην Αθήνα, για παράδειγμα, ο Δήμος Αθηναίων ξεκίνησε από το 2021 το μεγαλύτερο πρόγραμμα ανακατασκευής πεζοδρομίων από την εποχή των Ολυμπιακών Αγώνων, με προϋπολογισμό [24 εκατομμυρίων ευρώ](https://www.kathimerini.gr/society/561832075/anakataskeyazontai-410-pezodromia-sto-kentro-kai-tis-geitonies-tis-athinas/)^4 και στόχο την αναβάθμιση 410 πεζοδρομίων σε όλες τις δημοτικές κοινότητες. Ωστόσο, το αντίκρισμα αυτών των έργων δεν είναι ορατό: οι κάτοικοι δεν φαίνεται να αναγνωρίζουν κάποια σαφή βελτίωση στην κατάσταση των πεζοδρομίων και αυτό δεν μπορεί παρά να οφείλεται στο ότι αυτά τα έργα δεν κατάφεραν να αναβαθμίσουν αισθητά την καθημερινή εμπειρία στην πόλη.

    Το πρόβλημα των πεζοδρομίων στην Αθήνα είναι τόσο διάχυτο – αφορά δεκάδες χιλιάδες τετραγωνικά μέτρα, εκατοντάδες δρόμους, πολλές διαφορετικές γειτονιές – που ένα πρόγραμμα γενικής αποκατάστασης κινδυνεύει να χαθεί στην κλίμακα του προβλήματος. Στη [Νέα Υόρκη](https://www.nyc.gov/mayors-office/news/2026/04/mayor-mamdani-fills-100-000th-pothole-in-first-100-days)^5, υλοποιείται ένα πρόγραμμα μαζικής επισκευής των δρόμων. Τα αποτελέσματα μετριώνταν και ανακοινώνονταν συνεχώς βάσει ενός απλού αριθμού: πόσες λακκούβες έχουν επισκευαστεί. Το μάθημα για την Αθήνα δεν αφορά τη μέθοδο (στη Νέα Υόρκη, ο Δήμος κάνει τη δουλειά μόνος του), αλλά τη λογική του μετρήσιμου στόχου: ένα πρόγραμμα που μπορεί να μετρηθεί – π.χ. «500 πεζοδρόμια ανακατασκευάστηκαν από κατοίκους» – αποκτά ορατότητα και αξιοπιστία που ένας αόριστος προϋπολογισμός εκατομμυρίων αδυνατεί να παράγει.

    Η πρότασή αυτή κινείται σε διαφορετική λογική: αντί ο Δήμος να κατανέμει μεγάλα κονδύλια με κεντρικό σχεδιασμό, προσπαθώντας να καλύψει όσο περισσότερο έδαφος μπορεί, η ιδέα είναι να ανατραπεί η κατεύθυνση της διαδικασίας. Οι κάτοικοι αναλαμβάνουν να εντοπίσουν το πρόβλημα, να το τεκμηριώσουν και να διεκδικήσουν τη λύση του. Ο Δήμος χρηματοδοτεί. Ο κάτοικος που έχει μπει στη διαδικασία να αναδείξει ένα πρόβλημα που τον αφορά προσωπικά, θα το παρακολουθήσει καλύτερα και θα διεκδικήσει τη λύση του με έναν ζήλο που κανένας κεντρικός σχεδιαστής δεν μπορεί να υποκαταστήσει. Ο κάτοικος αναλαμβάνει δηλαδή το project management της επισκευής.

    Ο Δήμος Αθηναίων ήδη διαθέτει ψηφιακή υπηρεσία με τίτλο «Χορήγηση άδειας επισκευής πεζοδρομίου», μέσω της οποίας κάθε κάτοικος μπορεί να υποβάλει αίτηση στη Διεύθυνση Τεχνικών Υπηρεσιών και να προχωρήσει σε κατασκευή, ανακατασκευή ή διαπλάτυνση του πεζοδρομίου έξω από την ιδιοκτησία του, με δικό του κόστος, τηρώντας τις προδιαγραφές του Δήμου. Η διαδικασία είναι αρκετά απλή αλλά στην πράξη, η δυνατότητα αυτή ενεργοποιείται σπάνια: το κόστος της κατασκευής παραμένει ολοκληρωτικά στον κάτοικο, κι αυτό αποτελεί ουσιαστικό αντικίνητρο.

    Η πρόταση επιδιώκει να άρει ακριβώς αυτό το εμπόδιο. Ο κάτοικος υποβάλλει αίτηση, τεκμηριώνει το πρόβλημα όπως ήδη προβλέπεται – με φωτογραφίες, περιγραφή και εντοπισμό στο χάρτη – και λαμβάνει χρηματοδότηση σε μορφή voucher για να καλύψει το κόστος της επισκευής. Το voucher εξαργυρώνεται αποκλειστικά μέσω αναδόχων από ένα αναγνωρισμένο δίκτυο επαγγελματιών που έχουν δεσμευτεί εκ των προτέρων σε συγκεκριμένες τιμές ανά τετραγωνικό μέτρο και είδος εργασίας. Στο δίκτυο αυτό μπορούν να συμμετέχουν: πολιτικοί μηχανικοί και εργολάβοι δημοσίων έργων (για ανακατασκευές μεγαλύτερης κλίμακας), τοπογράφοι μηχανικοί (για αποτύπωση και πιστοποίηση των εργασιών), καθώς και εξειδικευμένοι τεχνίτες οδοστρωμάτων (για επισκευές μικρότερης έκτασης).

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Μήπως ο πολίτης αναλαμβάνει να κάνει τη δουλειά που θα έπρεπε να κάνει το κράτος;"
    a: |
      Ένας εύλογος προβληματισμός είναι ότι η πρόταση αυτή μετακυλίει στον πολίτη μια ευθύνη που ανήκει στον δήμο. Αυτό σε κάποιο βαθμό ισχύει. Ωστόσο, η κεντρική παρέμβαση με τεράστιους προϋπολογισμούς έχει αποδειχθεί στην πράξη ανεπαρκής: τα χρήματα δαπανώνται, αλλά η αίσθηση ότι η πόλη αλλάζει δεν έρχεται. Σε αυτό το πλαίσιο, αξίζει να δοκιμαστεί ένα πιο ενεργό μοντέλο συμμετοχής για να αξιοποιηθεί η τοπική γνώση και ο προσωπικός ζήλος που η κεντρική διοίκηση αδυνατεί να αναπαράγει. Στη [Βοστώνη](https://www.boston.gov/departments/new-urban-mechanics/adopt-hydrant)^6, για παράδειγμα, υπήρχε το πρόγραμμα «[Adopt-a-Hydrant](https://github.com/codeforamerica/adopt-a-hydrant)^7», όπου κάτοικοι «υιοθετούσαν» υδροστόμια και δεσμεύονταν να τα καθαρίζουν από το χιόνι. Αντίστοιχα, στο [Σαν Φρανσίσκο](https://www.sfpuc.gov/learning/how-you-can-help/adopt-drain-sf)^8, υπήρχε το πρόγραμμα υιοθεσίας ενός από τα 25.000 φρεάτια της πόλης, όπου κάτοικοι το καθαρίζουν πριν τις καταιγίδες. Στο [Οκλαχόμα Σίτι](https://www.okc.gov/Infrastructure-Development/Public-Works/Resident-and-Community-Resources/Sidewalk-Repair-and-Replacement-Program)^9, ο δήμος υλοποιεί ένα πρόγραμμα όπου για την επισκευή των πεζοδρομίων, οι κάτοικοι μπορούν να υποβάλλουν αίτηση, ο δήμος επιθεωρεί, και αν πληρούνται συγκεκριμένα αντικειμενικά κριτήρια, καλύπτει το 50% του κόστους επισκευής ενώ ο κάτοικος πληρώνει το υπόλοιπο 50%. Το μάθημα εδώ είναι διπλό: πρώτον, ότι η «υιοθεσία» μιας υποδομής φαίνεται να λειτουργεί ακόμα και όταν ο κάτοικος βάζει χρόνο και ενέργεια χωρίς να αποζημιώνεται – το αίσθημα ευθύνης και συμμετοχής στη ζωή της πόλης αποδεικνύεται από μόνο του κίνητρο· και δεύτερον, ότι δεν χρειάζεται να ενεργοποιηθούν όλοι – αν ένα μέρος των κατοίκων ανταποκριθεί, το πρόγραμμα ήδη παράγει αποτέλεσμα. Στη δική μας πρόταση, αυτή η λογική ενισχύεται με τη χρηματοδότηση καθώς ο πήχης συμμετοχής γίνεται ακόμα χαμηλότερος.

  - q: "Μήπως τα voucher ανεβάσουν τις τιμές;"
    a: |
      Αυτός ο φόβος αντιμετωπίζεται με προκαθορισμένο τιμοκατάλογο: οι ανάδοχοι που εντάσσονται στο μητρώο δεσμεύονται εκ των προτέρων σε συγκεκριμένες τιμές ανά τετραγωνικό μέτρο και ανά κατηγορία εργασίας. Το voucher καλύπτει αυτές τις τιμές και μόνο αυτές, δεν υπάρχει περιθώριο για αυθαίρετη χρέωση.

  - q: "Πώς θα διασφαλίζεται ο υγιής ανταγωνισμός στους αναδόχους;"
    a: |
      Για να αποφευχθεί η συγκέντρωση των έργων σε «ημετέρους», η ένταξη στο μητρώο αναδόχων θα γίνεται μέσω ανοιχτής πρόσκλησης με σαφείς και αντικειμενικούς όρους, όπως επαγγελματική κατάρτιση, ασφαλιστική και φορολογική ενημερότητα, αποδοχή του τιμοκαταλόγου. Οποιοσδήποτε πληροί τις προϋποθέσεις μπορεί να συμμετάσχει. Το σύστημα θα είναι ανοιχτό.

  - q: "Πώς θα αποφευχθεί η ευνοϊκή μεταχείριση στην έγκριση αιτημάτων;"
    a: |
      Για να μην υπάρχει ευνοϊκή μεταχείριση στην έγκριση αιτημάτων, η χρηματοδότηση δεν θα λειτουργεί ως διακριτική απόφαση αλλά ως αυτόματο δικαίωμα: εφόσον ένα αίτημα πληροί συγκεκριμένες, αντικειμενικά ελέγξιμες προϋποθέσεις – τεκμηριωμένη φθορά, εντοπισμός στο χάρτη, πλήρη δικαιολογητικά – εγκρίνεται αυτόματα. Δεν θα υπάρχει επιτροπή που «αποφασίζει» ποιος παίρνει χρήματα και ποιος όχι. Αυτή η λογική ενέχει έναν δημοσιονομικό κίνδυνο: αν η ζήτηση αποδειχθεί μεγαλύτερη από τον αρχικό εκτιμώμενο προϋπολογισμό – και δεδομένης της κλίμακας του προβλήματος στην Αθήνα, αυτό δεν είναι απίθανο – το πρόγραμμα κινδυνεύει να εξαντλήσει γρήγορα τους διαθέσιμους πόρους ή και να τους υπερβεί. Μια αντιμετώπιση αυτού του προβλήματος είναι να λειτουργεί η χρηματοδότηση σε δόσεις: ο Δήμος διαθέτει ένα αρχικό κονδύλι ως πιλότο, παρατηρεί τη ζήτηση, και τροποποιεί τους όρους ανάλογα με το τι αποκαλύπτει η πρώτη φάση.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Λιγότερα ατυχήματα
    body: |
      Έρευνες καταδεικνύουν ότι η έλλειψη ή η ανεπάρκεια υποδομών για πεζούς (πεζοδρόμια, διαβάσεις, νησίδες) αυξάνει σημαντικά τον κίνδυνο τραυματισμού ή θανάτου πεζών. Σε [έρευνα στην πόλη Πόντιακ του Μίσιγκαν](https://pmc.ncbi.nlm.nih.gov/articles/PMC8666347/)^10, όπου έχουν διαπιστωθεί ιδιαίτερα προβληματικές συνθήκες στο δίκτυο πεζοδρομίων, η αναλογία θανατηφόρων ατυχημάτων που αφορούσαν πεζούς (45,8%) ήταν σχεδόν τριπλάσια από τον μέσο όρο της πολιτείας (16,5%). Και μία από τις κύριες αιτίες φαίνεται να είναι ότι η κακή κατάσταση των πεζοδρομίων οδηγεί τους πεζούς να περπατούν στο οδόστρωμα, βάζοντας σε μεγαλύτερο κίνδυνο τη ζωή τους.

  - title: Πιο συμπεριληπτική πόλη
    body: |
      [Μελέτη στο Σικάγο](https://pmc.ncbi.nlm.nih.gov/articles/PMC3853178/)^11 διαπίστωσε ότι ηλικιωμένοι με κινητικές δυσκολίες είχαν τετραπλάσιες πιθανότητες να αναφέρουν σοβαρή δυσκολία περπατήματος όταν κατοικούσαν σε γειτονιές με δρόμους σε κακή κατάσταση, σε σύγκριση με αυτούς που ζούσαν σε γειτονιές με καλές συνθήκες. Ανώμαλα πεζοδρόμια, ανεπαρκείς ράμπες και κακοσχεδιασμένες διαβάσεις περιορίζουν δυσανάλογα την κινητικότητα ατόμων με οπτικές και άλλες αναπηρίες, επηρεάζοντας τόσο την ασφάλειά τους όσο και την ανεξαρτησία τους στην πόλη.

  - title: Καλύτερα πεζοδρόμια ως μορφή πρωτοβάθμιας φροντίδας υγείας
    body: |
      Ένας τραυματισμός που προκαλείται από κακές υποδομές μπορεί να οδηγήσει σε μακροχρόνιες επιπλοκές υγείας που πέρα από την ταλαιπωρία του ατόμου, επιβαρύνουν και το σύστημα υγείας εν γένει. Αξίζει να σημειωθεί ότι θα είχε μεγάλο ενδιαφέρον μια έρευνα που να απομονώνει το κόστος που επιφέρει η κακή ποιότητα των ελληνικών πεζοδρομίων στο εθνικό σύστημα υγείας.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - category: costing
    body: |
      Να δημιουργηθεί ένας ρεαλιστικός τιμοκατάλογος ανά κατηγορία εργασίας που θα επιτρέψει στον Δήμο να εκτιμήσει το κόστος ενός πιλότου, να θέσει όρια χρηματοδότησης ανά αίτημα και να αναζητήσει αναδόχους.

  - category: financial-flow
    body: |
      Να σχεδιαστεί ρητά ο τρόπος με τον οποίο κινούνται τα χρήματα ώστε να ικανοποιούνται ταυτόχρονα τρεις απαιτήσεις: ο κάτοικος να μην χρειάζεται να προκαταβάλει/βάλει ούτε ένα ευρώ από την τσέπη του για να υπάρχει θέμα ρευστότητας, ο ανάδοχος να έχει εγγύηση πληρωμής από την αρχή (καθώς τα μεροκάματα θέλουν χρήμα μπροστά), και το συνολικό κονδύλι να αποδεσμεύεται στον ανάδοχο μόνο αφού η εργασία πιστοποιηθεί από τον Δήμο. Αν ο κάτοικος τελικά δεν προχωρήσει, να μην υπάρχει κανένας οικονομικός αντίκτυπος για εκείνον ώστε η διαδικασία να παραμένει χωρίς ρίσκο, ώστε ο φόβος της δέσμευσης να μην αποτρέπει κανέναν από το να υποβάλει αίτηση.

