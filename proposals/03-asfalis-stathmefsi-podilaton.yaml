number: 3
slug: asfalis-stathmefsi-podilaton
theme: mobility
title: Δίκτυο ασφαλούς στάθμευσης ποδηλάτων
one_line: >
  Δίκτυο κλειστών, ασφαλών θέσεων στάθμευσης ποδηλάτων (cycle hangars) σε
  παρόδιες θέσεις στάθμευσης αυτοκινήτων και σε σταθμούς Μετρό/ΗΣΑΠ. Μία θέση
  αυτοκινήτου εξυπηρετεί 12 ποδηλάτες.

problem:
  body: |
    Στην Αθήνα, το 27% των ενηλίκων κατέχει ποδήλατο — περίπου 810.000 άτομα
    στο λεκανοπέδιο. Αλλά μόνο **1–2% των μετακινήσεων γίνεται με ποδήλατο**.
    Στο 75% του πληθυσμού, το ποδήλατο δεν χρησιμοποιείται ποτέ.^1

    Αυτό το χάσμα δεν είναι πολιτισμικό αλλά κατασκευαστικό. Ο Δήμος αποτελείται
    σχεδόν αποκλειστικά από πολυκατοικίες 4–7 ορόφων, χτισμένες κυρίως μεταξύ
    1950 και 1980 με το σύστημα της αντιπαροχής. Τα ασανσέρ είναι στενά. Οι
    σκάλες χωρίς χώρο. Αποθήκες δεν υπάρχουν. Οι πυλωτές, οι είσοδοι των
    πολυκατοικιών, ή η ασφάλιση στον δρόμο αποτελούν επιλογές που καθιστούν την
    κλοπή εξαιρετικά πιθανή.

    Σε ευρωπαϊκό επίπεδο, 2,5–4 εκατομμύρια ποδήλατα κλέβονται κάθε χρόνο. Μόνο
    το 20% δηλώνεται στην αστυνομία. Και η συνέπεια δεν είναι μόνο οικονομική:
    το **45% των θυμάτων κλοπής μειώνει ή σταματά εντελώς την ποδηλασία**.^2

    Τον Δεκέμβριο 2025, ο Δήμος ανακοίνωσε 17,3 χιλιόμετρα νέων ποδηλατοδρόμων
    σε κεντρικές γειτονιές, με προϋπολογισμό €2,5 εκατομμυρίων. Αλλά
    ποδηλατόδρομοι χωρίς ασφαλή στάθμευση δεν λύνουν το πρόβλημα. Αν δεν μπορείς
    να αφήσεις με ασφάλεια το ποδήλατό σου κάτω τη νύχτα και η μόνη σου επιλογή
    είναι να το ανεβοκατεβάζεις από τις σκάλες και να το κρατάς στο σαλόνι σου,
    οι πιθανότητες του να το χρησιμοποιείς σε καθημερινή βάση μειώνονται
    δραστικά.

proposal:
  body: |
    Εγκατάσταση ενός δικτύου **κλειστών θέσεων στάθμευσης ποδηλάτων (cycle
    hangars)** σε θέσεις παρόδιας στάθμευσης αυτοκινήτων. Κάθε μονάδα χωράει
    6 ποδήλατα σε κλειστό μεταλλικό κουτί, με κλειδαριά υψηλής ασφάλειας και
    πρόσβαση μέσω smartphone ή ηλεκτρονικού κλειδιού. Δύο μονάδες χωράνε σε
    μία θέση αυτοκινήτου — δηλαδή μία θέση αυτοκινήτου εξυπηρετεί 12
    ποδηλάτες.^3

    Η πρώτη φάση περιλαμβάνει **100 μονάδες σε 5 κεντρικές γειτονιές** (Κυψέλη,
    Εξάρχεια, Παγκράτι, Κουκάκι, Πετράλωνα) και **40 μονάδες σε 20 σταθμούς
    Μετρό/ΗΣΑΠ**. Συνολικά: 140 μονάδες, 840 ασφαλείς θέσεις, σε 50 θέσεις
    αυτοκινήτων στις γειτονιές και 20 σημεία κοντά σε σταθμούς.

    **Τιμολόγηση:** €50/θέση/έτος (€4,17/μήνα). Δωρεάν πρόσβαση για δικαιούχους
    κοινωνικού τιμολογίου. Στους σταθμούς Μετρό, δωρεάν πρόσβαση για κατόχους
    ενεργής κάρτας ATH.ENA Card, €30/έτος για τους υπόλοιπους. Η τιμή τίθεται
    σκοπίμως κάτω από τα τέλη ελεγχόμενης στάθμευσης αυτοκινήτων
    (€1,80–3,50/ώρα στην Αθήνα) ώστε να μην αναπαράγεται η ανισότητα που
    παρατηρείται στο Λονδίνο, όπου μια τετραμελής οικογένεια πληρώνει για
    στάθμευση ποδηλάτων σχεδόν πενταπλάσια από ό,τι για κάρτα στάθμευσης
    αυτοκινήτου.^4

    Η κατανομή θέσεων γίνεται μέσω online πλατφόρμας. Κάτοικοι εντός 200 μέτρων
    από κάθε μονάδα έχουν προτεραιότητα. Μέγιστο 2 θέσεις ανά νοικοκυριό.
    Κλήρωση αν η ζήτηση υπερβαίνει τις θέσεις.
  callouts:
    - |
      **Cyclehoop Bikehangar:** 2.550×2.030×1.365 mm, 280 kg, 6 ποδήλατα,
      πιστοποίηση Sold Secure Diamond (υψηλότερη πιστοποίηση ασφαλείας στο
      Ηνωμένο Βασίλειο). Δύο μονάδες = 1 θέση αυτοκινήτου (~5×2m).
    - |
      Clean Cities Campaign (2024): μια τετραμελής οικογένεια στο Λονδίνο
      πληρώνει κατά μέσο όρο £231,60/έτος για στάθμευση ποδηλάτων σε hangars,
      έναντι £50 για κάρτα στάθμευσης αυτοκινήτου.

implementation:
  body: |
    Ο Δήμος έχει σαφή αρμοδιότητα. Η παραχώρηση κοινόχρηστου χώρου για
    τοποθέτηση hangars γίνεται με **άδεια χρήσης κοινόχρηστου χώρου**
    (Ν.4483/2017, Άρθρο 66), χωρίς δημοπρασία, με απόφαση Δημάρχου. Ο
    Ν.3852/2010 (Καλλικράτης) αναθέτει στους δήμους αρμοδιότητες τοπικής
    ανάπτυξης και ποιότητας ζωής. Το Δημοτικό Συμβούλιο μπορεί να αποφασίσει
    τη μετατροπή θέσεων στάθμευσης αυτοκινήτων σε θέσεις ποδηλάτων χωρίς
    νομοθετική αλλαγή.

    Τα hangars μπορούν να ενταχθούν ως μέτρο υλοποίησης του ΣΒΑΚ Αθήνας
    (Ν.4784/2021), το οποίο είναι υποχρεωτικό για δήμους άνω 30.000 κατοίκων
    και υποχρεούται να περιλαμβάνει ποδηλατική υποδομή. Για τα hangars στους
    σταθμούς Μετρό, απαιτείται πρωτόκολλο συνεργασίας Δήμου–ΣΤΑΣΥ–ΟΑΣΑ.

limitations:
  - q: "Αντίδραση ιδιοκτητών αυτοκινήτων: η μετατροπή θέσεων στάθμευσης αυτοκινήτων σε ποδηλατοστάσια θα προκαλέσει αντιδράσεις, ιδίως σε γειτονιές με ήδη σοβαρό πρόβλημα στάθμευσης."
    a: >
      Η δημόσια διαβούλευση πριν από κάθε εγκατάσταση (κατά το πρότυπο του
      Λονδίνου, με ενημερωτικές επιστολές σε κατοίκους εντός 50 μέτρων) μετριάζει
      την αντίδραση. Η βασική απάντηση είναι αριθμητική: μία θέση αυτοκινήτου
      εξυπηρετεί 1 οδηγό, ενώ τα ίδια τετραγωνικά εξυπηρετούν 12 ποδηλάτες.
      Ωστόσο, η πολιτική αντίσταση είναι αναπόφευκτη και απαιτεί σαφή πολιτική
      δέσμευση.

  - q: "Βανδαλισμός: στο Λονδίνο, τα hangars αντιμετωπίζουν γκράφιτι, παραβίαση καπακιών, και σκουπίδια."
    a: >
      Απαιτείται πρωτόκολλο ταχείας επισκευής (εντός 48 ωρών) και εξαμηνιαίες
      προγραμματισμένες επιθεωρήσεις. Η πιστοποίηση Sold Secure Diamond σημαίνει
      αντοχή σε ηλεκτρικό τροχό — η βίαιη παραβίαση είναι σπάνια.

  - q: "Θερμοκρασία: μεταλλικά hangars σε θερινές θερμοκρασίες 40°C+ μπορεί να γίνονται πολύ ζεστά."
    a: >
      Προδιαγραφή ανοιχτού χρώματος βαφής (αντανάκλαση θερμότητας) στον
      διαγωνισμό προμήθειας. Εξαερισμός μέσω σχεδιασμού πλευρικών πάνελ.


