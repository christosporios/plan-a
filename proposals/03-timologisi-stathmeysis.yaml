# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Αντί να γίνει η χρήση του αυτοκινήτου πιο ακριβή, δεν θα έπρεπε να γίνουν οι εναλλακτικές λύσεις πιο ελκυστικές;"
    a: >
      Η ερώτηση είναι εύλογη, αλλά θέτει ένα ψευδές δίλημμα. Και τα δύο είναι
      απαραίτητα, η διαφορά είναι ότι η βελτίωση των εναλλακτικών απαιτεί σοβαρή
      επένδυση σε υποδομές, χρόνο και πολιτική βούληση, ενώ η τιμολόγηση του
      δημόσιου χώρου μπορεί να ξεκινήσει άμεσα και να χρηματοδοτήσει αυτή ακριβώς
      την επένδυση και άρα, ευθυγραμμίζεται καλύτερα με το πεδίο του Plan A. Όπως
      δείχνουν τα παραπάνω διαγράμματα, οι Αθηναίοι δεν μένουν ικανοποιημένοι από
      τα μέσα μαζικής μεταφοράς ως προς την προσιτότητα, την ασφάλεια, την
      ευχρηστία, τη συχνότητα ούτε και την αξιοπιστία τους.

  - q: "Μα πληρώνω ήδη τέλη κυκλοφορίας – γιατί να πληρώνω και για στάθμευση;"
    a: >
      Τα τέλη κυκλοφορίας είναι φόρος για το δικαίωμα να κυκλοφορεί ένα όχημα στο
      δημόσιο οδικό δίκτυο – όχι για το δικαίωμα να καταλαμβάνει χώρο σε αυτό.
      Κυκλοφορία και στάθμευση είναι δύο διαφορετικές χρήσεις του δημόσιου χώρου.
      Η δωρεάν στάθμευση στον δρόμο, ως αποκλειστική χρήση δημόσιας γης για
      αποθήκευση ιδιωτικής περιουσίας, είναι εξίσου παράλογη με το να βάζει μια
      επιχείρηση τραπεζοκαθίσματα σε ένα πεζοδρόμιο απλώς και μόνο επειδή πληρώνει
      ενοίκιο σε όμορο κατάστημα.

  - q: "Δεν θα αντιδράσουν οι κάτοικοι καθώς χάνουν κάτι που είχαν μάθει να έχουν δωρεάν;"
    a: >
      Η αντίδραση είναι αναμενόμενη αλλά η εμπειρία δείχνει ότι είναι διαχειρίσιμη
      όταν οι κάτοικοι βλέπουν ξεκάθαρα τι κερδίζουν. Στη Βιέννη, έρευνα πριν την
      εφαρμογή τέλους στάθμευσης για κατοίκους έδειξε [56%
      υποστήριξη](https://urban-mobility-observatory.transport.ec.europa.eu/resources/case-studies/park4sump-objectives-and-key-messages-parking-management-cities_en)^4
      επειδή οι κάτοικοι αντιλαμβάνονταν τα άμεσα οφέλη: λιγότερα αυτοκίνητα στη
      γειτονιά, λιγότερος χρόνος για αναζήτηση θέσης, πιο καθαροί δρόμοι. Είναι
      σημαντικό να επικοινωνηθεί το μέτρο όχι ως τιμωρητικός μηχανισμός εσόδων
      αλλά ως μέτρο με χειροπιαστό αντίκτυπο στην ποιότητα ζωής του νοικοκυριού
      του κέντρου.

  - q: "Δεν είναι άδικο για τους κατοίκους που δεν έχουν αυτοκίνητο;"
    a: >
      Το τέλος των κατοίκων παραμένει σημαντικά ευνοϊκότερο από την τιμή για τον
      επισκέπτη. Ωστόσο, ο κάτοικος χωρίς αυτοκίνητο δεν έχει πρόσβαση ούτε σε
      αυτή την προνοιακή τιμή – όπως δεν είχε πριν και πρόσβαση στο προνόμιο της
      ελεύθερης στάθμευσης. Για να μην αντιμετωπίζεται αυτή η επιλογή ως
      μειονέκτημα, προτείνεται η ανταμοιβή των κατοίκων χωρίς όχημα με δωρεάν
      ετήσια κάρτα ΜΜΜ.

  - q: "Τι εγγυάται ότι οι οδηγοί θα πληρώνουν πράγματι;"
    a: >
      Η τιμολόγηση χωρίς αποτελεσματικό έλεγχο δεν αλλάζει κάτι. Γι' αυτό και η
      αποτελεσματικότητα αυτής της πρότασης εξαρτάται από την εφαρμογή και της
      επόμενης πρότασης (βλ. πρόταση 4), ώστε να διασφαλίζονται ορατές συνέπειες
      όταν υπάρχει παράβαση.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Λιγότερο ελκυστική η κτήση και χρήση αυτοκινήτου
    body: >
      Η δωρεάν στάθμευση αποτελεί έμμεσο κίνητρο κτήσης και χρήσης του
      αυτοκινήτου, σε μια πόλη που έχει ήδη πάρα πολλά αυτοκίνητα.
    callouts:
      - |
        Η περιφέρεια Αττικής καταγράφει [903 επιβατικά αυτοκίνητα ανά 1.000
        κατοίκους](https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Stock_of_vehicles_at_regional_level)^5,
        τον υψηλότερο δείκτη μεταξύ των περιφερειών της ΕΕ για τις οποίες υπάρχουν
        δεδομένα και ένα νούμερο διπλάσιο του μέσου όρου της ΕΕ στα 574 αυτοκίνητα
        ανά 1.000 κατοίκους.

  - title: Περισσότεροι πόροι για αλλαγές στην πόλη
    body: >
      Τα έσοδα από τη στάθμευση, σύμφωνα με τον Ν. 1900/1990, πρέπει να είναι
      ανταποδοτικά και πρέπει να χρησιμοποιούνται για «βελτίωση κυκλοφοριακών
      συνθηκών». Τα χρήματα, λοιπόν, που θα παράγουν τα νέα τέλη θα επιστρέφουν
      στον δήμο. Σε αντίθεση, με τα τέλη κυκλοφορίας που είναι εισπρακτικός φόρος
      και που μόλις το 50% αποδίδεται στους ΟΤΑ αλλά χωρίς δεσμευμένη χρήση.
    callouts:
      - |
        Το 2023, τα τέλη κυκλοφορίας απέφεραν €130 ανά όχημα – από τα χαμηλότερα
        στην Ευρώπη – ενώ το πραγματικό κόστος των οχημάτων σε τροχαία, ρύπανση,
        συμφόρηση και κατάληψη δημόσιου χώρου, εκτιμάται στα €21,5 δισ. ετησίως.
        Τα τέλη καλύπτουν μόλις το 5,4% αυτού του κόστους, δηλαδή ο φόρος δεν έχει
        καμία αναλογία με την πραγματική επιβάρυνση που δημιουργεί το αυτοκίνητο
        και δεν επιφέρει πόρους επαρκείς για να την αντισταθμίσει.

        Πηγή: Take Back the City, 2024

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Τιμολόγηση (1)
    body: >
      Να εξεταστεί αν έχει νόημα η τιμολόγηση να μην είναι ενιαία αλλά δυναμική,
      με σύνδεση με την πραγματική προσβασιμότητα σε δίκτυο ΜΜΜ, ώστε το τέλος να
      αντικατοπτρίζει την ύπαρξη ρεαλιστικής εναλλακτικής: όπου η κάλυψη είναι
      καλή και η επιλογή να μην χρησιμοποιήσεις αυτοκίνητο είναι πρακτική, το
      τέλος μπορεί να είναι υψηλότερο, όπου η κάλυψη είναι αδύναμη και το
      αυτοκίνητο παραμένει αναγκαιότητα, το τέλος να είναι χαμηλότερο.

  - title: Τιμολόγηση (2)
    body: >
      Να εξεταστεί ο τρόπος με τον οποίο το μέτρο δεν θα επιβαρύνει δυσανάλογα τα
      άτομα με χαμηλότερα εισοδήματα. Οι υφιστάμενες εξαιρέσεις για ΑμεΑ και
      πολύτεκνους μπορούν να διατηρηθούν αλλά καλύπτουν ειδικές κατηγορίες και δεν
      αντιμετωπίζουν το ευρύτερο ζήτημα της εισοδηματικής ανισότητας. Να
      αξιολογηθεί αν χρειάζεται ένας πιο στοχευμένος μηχανισμός εισοδηματικής
      εξαίρεσης ή κάποιου επιπρόσθετου κινήτρου για πρόσβαση σε εναλλακτικές (π.χ.
      δωρεάν κάρτα ΜΜΜ).

