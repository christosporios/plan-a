number: 3
slug: timologisi-stathmeysis
theme: mobility
title: Λιγότερο ελκυστική τιμολόγηση στάθμευσης στον δρόμο
one_line: >
  Ο δρόμος είναι κοινός χώρος και η κατάληψή του έχει κόστος για όλους. Ο
  κάτοικος που παρκάρει στον δρόμο να πληρώνει ένα αντίτιμο και ο επισκέπτης
  τιμή εφάμιλλη των ιδιωτικών πάρκινγκ — σε όλη την πόλη, όχι μόνο στο κέντρο.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Έχουμε συνηθίσει να παρκάρουμε το αυτοκίνητό μας στον δρόμο σαν να είναι
    αυτονόητο, αλλά ο δρόμος είναι κοινός χώρος και η κατάληψή του έχει κόστος
    για όλους. Ο κάτοικος που παρκάρει στον δρόμο να πληρώνει ένα αντίτιμο, και ο
    επισκέπτης οδηγός να πληρώνει τιμή εφάμιλλη των ιδιωτικών πάρκινγκ, ώστε να
    προτιμά να παρκάρει εκεί. Το σύστημα αυτό πρέπει να εφαρμοστεί σε όλη την πόλη
    κι όχι μόνο σε ζώνες του κέντρου, γιατί αλλιώς απλά μετακινούμε το πρόβλημα
    χωρίς να το λύνουμε.

# ── ΑΠΟ ΤΟ POL.IS ───────────────────────────────────────────────────────────
polis:
  - statement: "Υπόγεια πάρκινγκ για κατοίκους και επισκέπτες, όπως στο εξωτερικό, παρά το αρχικό κόστος, με παράλληλη αφαίρεση επίγειων θέσεων στάθμευσης."
    statement_id: 170
    overall: { agree: 76, disagree: 7, pass: 15, count: 409 }
    groups:
      - { label: A, agree: 69, disagree: 11, pass: 19, count: 62 }
      - { label: B, agree: 85, disagree: 2, pass: 11, count: 78 }
      - { label: C, agree: 75, disagree: 8, pass: 15, count: 269 }

# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΕΥΚΟΛΗ ΜΕΤΑΚΙΝΗΣΗ» ──────────────────────────────
contribution:
  body: |
    Η κίνηση που προκαλούν τα αυτοκίνητα είναι σημαντικό ζήτημα της πόλης.
  callouts:
    - |
      Οι οδηγοί στην Αθήνα χάνουν κατά μέσο όρο [111
      ώρες](https://www.kathimerini.gr/visual/infographics/563921827/chanoyme-111-ores-ton-chrono-sto-mpotiliarisma-tis-athinas/)^1
      τον χρόνο «κολλημένοι» στην κίνηση. Αυτός ο χρόνος αντιστοιχεί σε σχεδόν 14
      οκτάωρα εργασίας ή περίπου 5 ολόκληρες μέρες, με το ετήσιο κόστος για κάθε
      οδηγό να υπολογίζεται περίπου στα 1.000 ευρώ σε καύσιμα και χαμένη
      παραγωγικότητα.
  body_after: |
    Ο Donald Shoup, βρήκε ότι [το 30% της κίνησης στα κέντρα πόλεων αποτελείται
    από οδηγούς που ψάχνουν θέση
    στάθμευσης](https://www.sciencedirect.com/science/article/abs/pii/S0967070X06000448)^2,
    με μέσο χρόνο αναζήτησης 8,1 λεπτά. Στην Αθήνα, όπου η στάθμευση είναι σχεδόν
    πλήρως ανεξέλεγκτη, το ποσοστό εκτιμάται ότι θα αγγίζει ή και θα ξεπερνά αυτό
    το επίπεδο.

    Αυτός ο χώρος παραχωρείται δωρεάν. Πληρώνουμε για την αγορά του αυτοκινήτου,
    τη βενζίνη, τη συντήρηση, και την ασφάλεια, αλλά όχι για την αποθήκευσή του σε
    δημόσια γη. Συνολικά, πρόκειται για 10.244 θέσεις στάθμευσης: 5.177 θέσεις
    κατοίκων, 3.463 θέσεις επισκεπτών και 1.604 θέσεις μοτοσικλετών.

    Προτείνονται τρία πράγματα:

    1. **Επέκταση ελεγχόμενης στάθμευσης σε όλο τον Δήμο:** Αυτή τη στιγμή το
    Σύστημα Ελεγχόμενης Στάθμευσης καλύπτει μόνο 12 ζώνες στο κέντρο, αφήνοντας τη
    συντριπτική πλειοψηφία του Δήμου χωρίς κανέναν έλεγχο ή χρονικό περιορισμό. Η
    επέκταση σε όλες τις γειτονιές θα μειώσει την ελκυστικότητα του αυτοκινήτου
    στην πόλη και άρα, η κυκλοφορία που προκαλείται από οδηγούς που αναζητούν θέση
    – το λεγόμενο «cruising» – θα μειωθεί.
    2. **Τιμολόγηση στάθμευσης στον δρόμο εφάμιλλη του ιδιωτικού parking:** Η
    τρέχουσα τιμολόγηση της ελεγχόμενης στάθμευσης είναι σημαντικά χαμηλότερη από
    αυτή των ιδιωτικών parking, δημιουργώντας ανταγωνιστική ανισορροπία υπέρ της
    στάθμευσης στον δρόμο. Η προσαρμογή των τιμών στα επίπεδα της αγοράς
    εξασφαλίζει ότι ο δημόσιος χώρος τιμολογείται ανάλογα με την αξία του. Αυτό
    δημιουργεί κίνητρο για τη χρήση ιδιωτικών υποδομών ή εναλλακτικών τρόπων
    μετακίνησης, μειώνοντας ξανά τον χρόνο που περνούν οι οδηγοί αναζητώντας θέση
    στάθμευσης στην πόλη.
    3. **Τέλος στάθμευσης κατοίκων:** Σήμερα οι κάτοικοι σταθμεύουν το όχημά τους
    σε δημόσιο χώρο εντελώς δωρεάν. Η θέσπιση ενός εύλογου τέλους δεν αποσκοπεί
    στην τιμωρία των κατοίκων, αλλά στην αναγνώριση ότι ο δρόμος είναι κοινό αγαθό
    με εναλλακτικές χρήσεις υψηλής αξίας. Ακόμη και ένα χαμηλό τέλος αλλάζει τη
    σχέση του πολίτη με τον δημόσιο χώρο, καθιστώντας τον ορατό ως πόρο που έχει
    κόστος.

    Αξίζει να σημειωθεί ότι [η εντύπωση που έχουν οι Αθηναίοι για τα μέσα μαζικής
    μεταφοράς](https://www.greeceinfigures.com/poiotita-sygkoinonion-stin-athina/)^3
    είναι πολύ αρνητική: δεν μένουν ικανοποιημένοι από την προσιτότητα, την
    ασφάλεια, την ευχρηστία, τη συχνότητα ούτε και την αξιοπιστία τους σε σχέση με
    τις υπόλοιπες ευρωπαϊκές πρωτεύουσες.
