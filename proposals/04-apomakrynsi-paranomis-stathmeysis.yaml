number: 4
slug: apomakrynsi-paranomis-stathmeysis
theme: mobility
title: Συστηματική απομάκρυνση παράνομα σταθμευμένων αυτοκινήτων
one_line: >
  Οι απαγορεύσεις στάθμευσης στην Αθήνα υπάρχουν – αυτό που λείπει είναι η
  συστηματική τήρησή τους. Ένας ξεκάθαρος δημόσιος στόχος, όπως η απομάκρυνση
  ενός παράνομα παρκαρισμένου αυτοκινήτου κάθε δύο ώρες, κάνει τις συνέπειες
  ορατές και αλλάζει τη λογική του «δεν θα με πιάσουν».

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Οι απαγορεύσεις στάθμευσης στην Αθήνα υπάρχουν – αυτό που λείπει είναι η
    συστηματική τήρησή τους. Έτσι, οι οδηγοί παρκάρουν παράνομα γιατί ξέρουν ότι
    οι συνέπειες είναι σπάνιες. Ο δήμος σήμερα βασίζεται στην Τροχαία, ενώ θα
    μπορούσε να δράσει πιο αποτελεσματικά με έναν-δύο δικούς του γερανούς – το
    νομικό πλαίσιο υπάρχει ήδη. Ένας ξεκάθαρος δημόσιος στόχος, όπως η απομάκρυνση
    ενός παράνομα παρκαρισμένου αυτοκινήτου κάθε δύο ώρες και 4.380 αυτοκινήτων
    τον χρόνο, κάνει τις συνέπειες ορατές και αλλάζει τη λογική του «δεν θα με
    πιάσουν».

# ── ΑΠΟ ΤΟ POL.IS ───────────────────────────────────────────────────────────
polis:
  - statement: "Το κράτος να εφαρμόσει τον νόμο, όχι απλά να βγάλει νέους. Π.χ. η στάθμευση σε πεζοδρόμια ανέκαθεν απαγορεύεται, σχεδόν ποτέ δεν τιμωρείται."
    statement_id: 5
    overall: { agree: 89, disagree: 3, pass: 7, count: 454 }
    groups:
      - { label: A, agree: 82, disagree: 8, pass: 9, count: 62 }
      - { label: B, agree: 95, disagree: 0, pass: 4, count: 84 }
      - { label: C, agree: 88, disagree: 3, pass: 7, count: 308 }

# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΕΥΚΟΛΗ ΜΕΤΑΚΙΝΗΣΗ» ──────────────────────────────
contribution:
  body: |
    Κάθε αυτοκίνητο που μπλοκάρει ένα πεζοδρόμιο αναγκάζει τον πεζό να βγει στο
    οδόστρωμα. Κάθε αυτοκίνητο που καταλαμβάνει τη γωνία μιας διασταύρωσης κάνει
    την οδήγηση πιο επικίνδυνη. Κάθε αυτοκίνητο που παρκάρει σε λωρίδα ποδηλάτου ή
    λεωφορείου κάνει τη μετακίνηση στην πόλη με αυτά τα μέσα πιο δυσχερή.

    Η παράνομη στάθμευση είναι, με άλλα λόγια, ένα από τα πιο χειροπιαστά εμπόδια
    για οποιονδήποτε κινείται στην πόλη χωρίς αυτοκίνητο – και αυτό που διαιωνίζει
    το πρόβλημα δεν είναι η απουσία κανόνων αλλά η βεβαιότητα ότι δεν
    εφαρμόζονται. Τα στοιχεία το επιβεβαιώνουν. Μελέτη διαπίστωσε ότι σχεδόν ένα
    στα πέντε ατυχήματα πεζών και ποδηλατιστών στη
    [Γερμανία](https://www.udv.de/udv-en/accident-risk-of-parking-for-pedestrians-and-cyclists-75572)^1
    οφείλεται σε παράνομα σταθμευμένο αυτοκίνητο. Στη
    [Φιλαδέλφεια](https://www.nbcphiladelphia.com/news/local/its-official-septa-will-use-ai-enforcement-program-to-ticket-cars-parked-illegally-in-bus-lanes/3691274/)^2,
    υπολογίστηκε ότι η παράνομη στάθμευση αυτοκινήτων σε λωρίδες λεωφορείων
    κοστίζει στους επιβάτες 30 επιπλέον ώρες στην κίνηση ετησίως.
  callouts:
    - |
      Στην Αθήνα, σε μία μόνο στοχευμένη δράση 12 ημερών, η Δημοτική Αστυνομία
      βεβαίωσε [πάνω από 5.270 παραβάσεις
      στάθμευσης](https://www.kathimerini.gr/visual/infographics/563446786/proteyoysa-paranomoy-parkingk/)^3.
      Οι περισσότεροι οδηγοί φαίνεται να προτιμούν να παρκάρουν – παράνομα – στα
      πεζοδρόμια, εφόσον 2.119 κλήσεις αφορούσαν παρκάρισμα σε σημεία από τα οποία
      κανονικά διέρχονται οι πεζοί.
  body_after: |
    Για την παράνομη στάθμευση, ο ΚΟΚ προβλέπει ότι πρώτα, κόβεται κλήση. Αν η
    παράνομη στάθμευση συνεχίζεται πέρα από τρεις ώρες, βεβαιώνεται δεύτερη κλήση.
    Μετά την πάροδο του δεύτερου τρίωρου, δηλαδή έξι ώρες συνολικά από την πρώτη
    βεβαίωση, προβλέπεται μεταφορά του οχήματος με γερανό. Ωστόσο, ο ΚΟΚ επιτρέπει
    στα αρμόδια όργανα να μεταφέρουν άμεσα όχημα που σταθμεύει σε απαγορευμένη
    θέση, εφόσον εξαιτίας της στάθμευσης παρεμποδίζεται η κυκλοφορία, χωρίς να
    απαιτείται η αναμονή του εξαώρου, κάτι που στην πράξη αφήνει μεγάλο περιθώριο
    κρίσης στα αρμόδια όργανα για ενεργοποίηση της δυνατότητας σηκώματος ενός
    αυτοκινήτου με γερανό.

    Και στις δύο περιπτώσεις, όμως, το σήκωμα ενός αυτοκινήτου γίνεται με γερανούς
    που ανήκουν αποκλειστικά στα αστυνομικά όργανα, στην Τροχαία. Η Δημοτική
    Αστυνομία βεβαιώνει κλήσεις αλλά δεν έχει δικό της γερανό. Δεν υπάρχει κανένας
    περιορισμός που να εμποδίζει τον δήμο να αποκτήσει δικό του γερανό: το νομικό
    πλαίσιο το επιτρέπει, η αρμοδιότητα της Δημοτικής Αστυνομίας στη στάθμευση
    υπάρχει, αλλά ο γερανός που θα επέτρεπε την άμεση, ορατή εφαρμογή του νόμου
    λείπει. Αυτό σημαίνει ότι ακόμα και όταν η Δημοτική Αστυνομία εντοπίζει
    παράβαση, η απομάκρυνση εξαρτάται από την παρουσία και τη διαθεσιμότητα της
    Τροχαίας, και αυτή η εξάρτηση δυσκολεύει την εφαρμογή του νόμου.

    Ένας ξεκάθαρος δημόσιος στόχος αλλάζει αυτή τη λογική. Αν ο δήμος ανακοινώσει
    ότι απομακρύνει ένα παράνομα σταθμευμένο αυτοκίνητο κάθε δύο ώρες – 4.380 τον
    χρόνο – οι συνέπειες γίνονται ορατές και μετρήσιμες, μετατρέποντας μια
    αφηρημένη απειλή σε κάτι που γίνεται αντιληπτό στην καθημερινότητα,
    απελευθερώνοντας συγχρόνως τον χώρο που ανήκει δικαιωματικά σε όσους κινούνται
    στην πόλη χωρίς αυτοκίνητο.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Γιατί να αποκτήσει δικό του γερανό ο δήμος και να μην ενισχυθεί απλά η Τροχαία;"
    a: >
      Η Τροχαία έχει ευρύτατο φάσμα αρμοδιοτήτων. Η παράνομη στάθμευση
      ανταγωνίζεται πάντα αυτές τις προτεραιότητες για χρόνο και προσωπικό, και
      σχεδόν πάντα χάνει γιατί ένα διπλοπαρκαρισμένο αυτοκίνητο σε πεζοδρόμιο δεν
      είναι ποτέ επείγον με την ίδια έννοια που είναι ένα τροχαίο ατύχημα. Έχει
      νόημα λοιπόν να αποκτήσει και το εργαλείο που του επιτρέπει να εφαρμόζει τον
      νόμο στην πληρότητά του, ακριβώς επειδή έχει το ισχυρότερο κίνητρο να το
      κάνει.

  - q: "Γιατί να θέσουμε έναν ποσοτικό δημόσιο στόχο αριθμού αυτοκινήτων που θέλουμε να απομακρυνθούν;"
    a: >
      Πρώτον, επειδή ο οδηγός που αποφασίζει αν θα παρκάρει παράνομα κάνει μια
      γρήγορη εκτίμηση του πόσο πιθανό είναι να τον πιάσουν. Αν η απάντηση είναι
      «δεν ξέρω, μάλλον δεν θα με πιάσουν», παρκάρει παράνομα. Ένας συγκεκριμένος
      αριθμός – όπως 4.380 αυτοκίνητα τον χρόνο, ένα κάθε δύο ώρες – καθιστά αυτή
      την εκτίμηση διαφορετική γιατί μας κάνει να σκεφτούμε ότι δεν αποκλείεται να
      είμαι εγώ το επόμενο αυτοκίνητο που θα απομακρυνθεί. Ο αριθμός εξυπηρετεί
      όμως και έναν δεύτερο σκοπό: τη λογοδοσία του δήμου. Αν ο δήμος ανακοινώνει
      έναν στόχο που παρακολουθείται δημόσια, δημιουργεί πίεση για συνέπεια που
      δεν μπορεί να παράγει μια εσωτερική υπηρεσιακή οδηγία.

  - q: "Αντί να γίνει η χρήση του αυτοκινήτου πιο δύσκολη, δεν θα έπρεπε να γίνουν οι εναλλακτικές λύσεις πιο ελκυστικές;"
    a: >
      Όπως είπαμε και στην προηγούμενη πρόταση, η ερώτηση είναι εύλογη, αλλά θέτει
      ένα ψευδές δίλημμα. Και τα δύο είναι απαραίτητα, η διαφορά είναι ότι η
      βελτίωση των εναλλακτικών απαιτεί σοβαρή επένδυση σε υποδομές, χρόνο και
      πολιτική βούληση, ενώ η τιμολόγηση του δημόσιου χώρου μπορεί να ξεκινήσει
      άμεσα και να χρηματοδοτήσει αυτή ακριβώς την επένδυση και άρα,
      ευθυγραμμίζεται καλύτερα με το πεδίο του Plan A.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Λιγότερο ελκυστική η κτήση και χρήση αυτοκινήτου
    body: >
      Όπως είδαμε και στην προηγούμενη πρόταση, η εύκολη στάθμευση αποτελεί έμμεσο
      κίνητρο κτήσης και χρήσης του αυτοκινήτου, σε μια πόλη που έχει ήδη πάρα
      πολλά αυτοκίνητα.
    callouts:
      - |
        Η περιφέρεια Αττικής καταγράφει [903 επιβατικά αυτοκίνητα ανά 1.000
        κατοίκους](https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Stock_of_vehicles_at_regional_level)^4,
        τον υψηλότερο δείκτη μεταξύ των περιφερειών της ΕΕ για τις οποίες υπάρχουν
        δεδομένα και ένα νούμερο διπλάσιο του μέσου όρου της ΕΕ στα 574 αυτοκίνητα
        ανά 1.000 κατοίκους.

  - title: Ανάκτηση εμπιστοσύνης στον δήμο
    body: >
      Η παράνομη στάθμευση είναι ένα από τα πιο ορατά σημάδια ότι οι κανόνες δεν
      εφαρμόζονται. Όταν ένας πολίτης βλέπει καθημερινά αυτοκίνητα να παρκάρουν σε
      πεζοδρόμια χωρίς συνέπειες, δεν βγάζει απλώς συμπέρασμα για το πώς
      διαχειρίζεται ο δήμος το ζήτημα της στάθμευσης, βγάζει και ένα πιο γενικό
      συμπέρασμα για το κατά πόσο ο δήμος είναι σε θέση να κάνει αυτά που λέει.
      Ένας δήμος που θέτει μετρήσιμο στόχο και τον πετυχαίνει κερδίζει την πολύ
      σημαντική πεποίθηση ότι οι κανόνες ισχύουν για όλους και που εμπιστεύονται
      περισσότερο τη δημόσια διοίκηση. Ένας πολίτης που πιστεύει ότι το σύστημα
      λειτουργεί είναι πιο πρόθυμος να συμμετέχει σε αυτό, να ακολουθεί κανόνες,
      να εμπλακεί σε συμμετοχικές διαδικασίες, να επενδύσει στην πόλη του.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Αποσαφήνιση νομικού πλαισίου
    body: >
      Να εντοπιστούν τα ακριβή βήματα που πρέπει να γίνουν για να κινηθεί η
      διαδικασία χρήσης γερανού από τον δήμο, γιατί παρόλο που δεν αποκλείεται από
      τον δήμο, η δυνατότητα αυτή δεν έχει δοκιμαστεί στην πράξη.

  - title: Εύρεση βέλτιστης οικονομικής ροής
    body: >
      Να σχεδιαστεί ρητά το χρηματοδοτικό μοντέλο, κυρίως αν ο γερανός πρέπει να
      είναι δημόσιος ή θα λειτουργεί μέσω ιδιώτη με σύμβαση, και ποιο είναι το
      ύψος του τέλους που καταβάλλει ο παραβάτης, αρκετά υψηλό ώστε να αποτρέπει,
      αρκετά δίκαιο ώστε να τηρεί την αρχή της αναλογικότητας, και ιδανικά με
      πλεόνασμα που επιστρέφει στον δήμο για επένδυση σε υποδομές.

