number: 4
slug: dromoi-irias-kykloforias
theme: mobility
title: Δρόμοι που σε αναγκάζουν να πας αργά
one_line: >
  Από τον Ιανουάριο 2026, ισχύει όριο 30 km/h σε κάθε μονόδρομο αστικής
  περιοχής – ένα σημαντικό βήμα, γιατί η Αθήνα είναι ασυνήθιστα επικίνδυνη
  πόλη για πεζούς. Αλλά ένα όριο ταχύτητας χωρίς φυσικό εμπόδιο είναι πολύ
  λιγότερο πιθανό να τηρηθεί. Αυτό που χρειάζεται είναι φυσικές υποδομές:
  φρεσκοβαμμένες διαβάσεις, υπερυψωμένες διαβάσεις και σαμαράκια. Πρόκειται
  για δράσεις χαμηλού κόστους και μεγάλης ορατότητας, ιδανικές για δράσεις
  εταιρικής κοινωνικής ευθύνης και ο Δήμος έχει κάθε λόγο να τις προωθεί
  ενεργά ως τέτοιες.

problem:
  body: |
    Από τον Ιανουάριο 2026, ισχύει όριο 30 km/h σε κάθε μονόδρομο αστικής
    περιοχής (Ν.5209/2025). Το ΕΜΠ εκτιμά ότι αυτό θα σώσει πάνω από 100 ζωές
    ετησίως και θα αποφέρει καθαρό οικονομικό όφελος €35 εκατ. μέχρι το 2030.
    Αλλά ένα όριο ταχύτητας χωρίς φυσικό εμπόδιο είναι εθελοντικό. Και η
    σημερινή συμμόρφωση δεν αφήνει πολλά περιθώρια αισιοδοξίας: μόλις 58,8%
    των οδηγών τηρούν τα αστικά όρια ταχύτητας.^1

    Η Αθήνα είναι μια ασυνήθιστα επικίνδυνη πόλη για πεζούς. Το 50% όλων των
    θανάτων σε τροχαία στην Ελλάδα συμβαίνει μέσα σε πόλεις — ο μέσος όρος ΕΕ
    είναι 39%. Η Αττική συγκεντρώνει το 55% των ατυχημάτων πανελλαδικά, με
    δείκτη 1.514 ατυχημάτων ανά εκατομμύριο κατοίκους — 43% πάνω από τον εθνικό
    μέσο. Στο 2023, σκοτώθηκαν 102 πεζοί — σχεδόν δύο την εβδομάδα. Οι
    ηλικιωμένοι 65+ αποτελούν το 28,8% των νεκρών, με το 30% αυτών να είναι
    πεζοί.

    Αυτό που λείπει, και που αποτελεί πρότυπο σε σχεδόν κάθε άλλη ευρωπαϊκή
    πρωτεύουσα, είναι φυσικές υποδομές ελέγχου ταχύτητας. Η Αθήνα δεν διαθέτει
    καμία υπερυψωμένη διάβαση πεζών. Δεν υπάρχουν speed tables μπροστά σε
    σχολεία. Δεν υπάρχει καν κεντρική καταγραφή. Η Ελλάδα έχει μόνο «μερικές»
    προδιαγραφές σχεδιασμού για υποδομές ασφάλειας πεζών, ενώ 25 από τις 27
    χώρες ΕΕ διαθέτουν πλήρεις.

    Η ακαδημαϊκή τεκμηρίωση δεν αφήνει αμφιβολία. Μετα-ανάλυση 24 μελετών από
    10 χώρες (Muse et al., 2025) δείχνει ότι τα φυσικά εμπόδια —
    υπερυψωμένες διαβάσεις, speed tables — μειώνουν τα ατυχήματα με
    τραυματισμό κατά 23%.^2 Η μετα-ανάλυση Elvik (2001, 33 μελέτες) βρήκε
    μείωση ~25% σε κατοικημένους δρόμους.^3 Αντίθετα, τα όρια ταχύτητας χωρίς
    φυσικά εμπόδια μειώνουν τα ατυχήματα μόλις κατά 3%.
  callouts:
    - |
      Η Ελλάδα εκδίδει μόνο 19,3 κλήσεις ταχύτητας ανά 1.000 κατοίκους — ο
      μέσος όρος ΕΕ είναι 139,7. Δηλαδή, 7 φορές λιγότερη αστυνόμευση
      ταχύτητας. Η Αθήνα δεν έχει ούτε ένα σύστημα κάμερας ταχύτητας σε
      αστικό δρόμο.

proposal:
  body: |
    Εγκατάσταση φυσικών υποδομών ελέγχου ταχύτητας σε 1.000 σημεία σε ολόκληρο
    τον δήμο, σε τρία χρόνια:

    **300 υπερυψωμένες διαβάσεις πεζών** σε σχολεία, νοσοκομεία, στάσεις ΜΜΜ
    και εμπορικούς δρόμους. Η υπερυψωμένη διάβαση είναι το πιο ευέλικτο
    εργαλείο: μειώνει την ταχύτητα κατά 15–20 km/h, εξασφαλίζει
    προσβασιμότητα ΑμΕΑ (αντικαθιστά τη ράμπα), και καθιστά φυσικά αδύνατη τη
    στάθμευση πάνω στη διάβαση. Κόστος: €4.000–12.000/τεμ. σε άσφαλτο,
    €8.000–20.000/τεμ. σε κυβόλιθο. Ζωή: 15–20 χρόνια.

    **500 speed tables σε σχολεία, πάρκα και κατοικημένες γειτονιές.** Τα
    speed tables διαφέρουν ουσιαστικά από τα σαμαράκια: μήκος 3–6 μ. αντί <1
    μ., ομαλό προφίλ, μικρός κίνδυνος ζημιάς.^4 Κάθε σχολείο αποκτά
    τουλάχιστον ένα speed table στην κύρια είσοδο. Κόστος: €2.000–7.000/τεμ.

    **200 πεζοδρομήσεις γωνιών (curb extensions)** σε διασταυρώσεις υψηλού
    κινδύνου. Το πεζοδρόμιο «βγαίνει» στη γωνία, μειώνοντας ταυτόχρονα την
    απόσταση που διασχίζει ο πεζός και την ταχύτητα στροφής των οχημάτων. Η
    πρώτη φάση γίνεται με προσωρινά μέσα — ζαρντινιέρες, χρώμα εδάφους,
    κολωνάκια — πριν τη μόνιμη κατασκευή. Κόστος tactical: <€1.000/γωνία.
    Μόνιμη κατασκευή: €4.000–14.000/γωνία.

    Η βασική αρχή: ένα φυσικό εμπόδιο λειτουργεί 24 ώρες, 365 ημέρες, χωρίς
    κόστος προσωπικού. Μια υπερυψωμένη διάβαση κόστους €8.000 λειτουργεί
    αυτόνομα για 15–20 χρόνια. Αν αποτρέψει έστω και έναν σοβαρό τραυματισμό
    πεζού, η κοινωνική αξία εκτιμάται στα ~€950.000 — αναλογία κόστους-οφέλους
    μεγαλύτερη από 100:1.

implementation:
  body: |
    Ο Δήμος έχει σαφή αρμοδιότητα. Ο νέος ΚΟΚ (Ν.5209/2025, Άρθρο 55)
    εξουσιοδοτεί ρητά τους δήμους να χαρακτηρίζουν ζώνες ήπιας κυκλοφορίας.
    Ο Ν.4313/2014 (Άρθρο 52) προβλέπει ότι οι δήμοι μπορούν να αλλάζουν τη
    διατομή οδών. Η Υ.Α. ΔΜΕΟ/Ο/3050/2013 παρέχει τεχνικές προδιαγραφές
    ειδικά για υπερυψωμένες διαβάσεις. Η Υ.Α. ΥΠΕΝ/ΔΜΕΑΑΠ/124964/1561/2022
    αναφέρει τις υπερυψωμένες διαβάσεις ως μέσο προσβασιμότητας ΑμΕΑ.

    Αν η μείωση ταχύτητας στα πιλοτικά σημεία είναι κάτω από 10 km/h μετά 12
    μήνες, αναθεωρείται ο σχεδιασμός πριν προχωρήσει η δεύτερη φάση.

limitations:
  - q: "Κόστος: ένα πρόγραμμα ~€5 εκατ. ανταγωνίζεται άλλες δημοτικές ανάγκες."
    a: >
      Τα φυσικά εμπόδια είναι επιλέξιμα για ευρωπαϊκή χρηματοδότηση: ΕΣΠΑ
      2021–2027 (τουλάχιστον 8% του ΕΤΠΑ σε βιώσιμη αστική ανάπτυξη), Πράσινο
      Ταμείο (ετήσιες προσκλήσεις ΣΒΑΚ), CEF (Αθήνα ως κόμβος TEN-T). Ο
      Ν.4784/2021 ορίζει ότι τα μέτρα ΣΒΑΚ προτεραιοποιούνται στο ΠΔΕ.
      Δυνητική εξωτερική χρηματοδότηση: €1,5–5 εκατ.

  - q: "Αντιδράσεις οδηγών: speed tables και υπερυψωμένες διαβάσεις μπορεί να θεωρηθούν ενοχλητικά."
    a: >
      Η πρόταση δεν εισάγει νέους κανόνες. Τα 30 km/h σε μονόδρομους ισχύουν
      ήδη. Τα φυσικά εμπόδια απλώς μετατρέπουν αυτόν τον κανόνα από εθελοντικό
      σε αυτόματο. Η δημόσια στήριξη δεν είναι ζητούμενο: σε πανευρωπαϊκή
      έρευνα (ESRA3), 54,5% των Ελλήνων υποστηρίζουν τα 30 km/h — τρίτο
      υψηλότερο ποσοστό στην ΕΕ.

  - q: "Νομική ευθύνη: η εγκατάσταση φυσικών εμποδίων δημιουργεί κίνδυνο αστικής ευθύνης."
    a: >
      Η ευθύνη υπάρχει μόνο αν η κατασκευή δεν πληροί τις προδιαγραφές (Άρθρα
      105–106 ΕισΝΑΚ). Οι υπερυψωμένες διαβάσεις κατά ΔΜΕΟ/Ο/3050/2013
      φέρουν χαμηλότερο ρίσκο από τα σαμαράκια. Αντιστρόφως: η μη
      εγκατάσταση μέτρων ασφαλείας σε σημεία γνωστού κινδύνου μπορεί να
      θεμελιώσει ευθύνη του δήμου.

  - q: "Ο Μεγάλος Περίπατος: στην Αθήνα, κάθε πρόταση που αφορά μείωση αυτοκινήτων φέρει τη σκιά του 2020."
    a: >
      Ο Μεγάλος Περίπατος δέχτηκε κριτική γιατί ήταν μεγάλης κλίμακας αλλαγή
      χωρίς σταδιακή εφαρμογή, χωρίς ενισχυμένα ΜΜΜ, χωρίς διαβούλευση. Η
      παρούσα πρόταση λειτουργεί αντίστροφα: σημειακές παρεμβάσεις σε
      ολόκληρο τον δήμο, πιλοτική φάση, μετρήσεις πριν/μετά, δυνατότητα
      αφαίρεσης αν δεν αποδώσουν. Δεν αφαιρεί λωρίδες κυκλοφορίας. Δεν
      κλείνει δρόμους. Απλώς αναγκάζει τα αυτοκίνητα να τηρήσουν τον νόμο.


