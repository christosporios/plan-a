number: 4
slug: timologisi-stathmeysis
theme: mobility
title: "Το πάρκινγκ στον δρόμο δεν είναι δικαίωμα: τιμολόγηση στάθμευσης"
one_line: >
  Η ελεγχόμενη στάθμευση επεκτείνεται σε ολόκληρο τον Δήμο με κλιμακωτή
  τιμολόγηση. Τα έσοδα επιστρέφουν στις γειτονιές ως βελτιωμένος δημόσιος χώρος.

problem:
  body: |
    Κάθε βράδυ στην Αθήνα, περίπου 414.000 αυτοκίνητα σταθμεύουν στους δρόμους,
    καταλαμβάνοντας σχεδόν 5 εκατομμύρια τετραγωνικά μέτρα δημόσιου χώρου —
    δηλαδή περίπου 12,75% της έκτασης του Δήμου.^1

    Αυτός ο χώρος παραχωρείται δωρεάν. Πληρώνουμε για την αγορά του αυτοκινήτου,
    τη βενζίνη, τη συντήρηση και την ασφάλεια, αλλά όχι για την αποθήκευσή του
    σε δημόσια γη. Ο Δήμος Αθηναίων λειτουργεί Σύστημα Ελεγχόμενης Στάθμευσης
    (ΣΕΣ) σε 12 ζώνες, κυρίως στο κέντρο. Εκτός αυτών των 12 ζωνών —
    δηλαδή στη μεγάλη πλειοψηφία του Δήμου — η στάθμευση στον δρόμο είναι
    ελεύθερη χωρίς κανένα τέλος ή χρονικό περιορισμό.^2

    Η συνηθέστερη απάντηση σε αυτό είναι: «Μα πληρώνω τέλη κυκλοφορίας.» Τα
    τέλη κυκλοφορίας όμως είναι εισπρακτικός φόρος που πηγαίνει στο γενικό
    ταμείο του κράτους. Δεν συνδέονται με τη στάθμευση, ούτε με τη συντήρηση
    δρόμων.^3

    Η κυκλοφοριακή επιβάρυνση είναι άμεση συνέπεια. Σε ανάλυση 16 μελετών, το
    30% της κίνησης στα κέντρα πόλεων αποτελείται από οδηγούς που ψάχνουν θέση
    στάθμευσης, με μέσο χρόνο αναζήτησης 8,1 λεπτά.^4 Οι Αθηναίοι χάνουν 143
    ώρες τον χρόνο σε κυκλοφοριακή συμφόρηση. Παράλληλα, η δωρεάν στάθμευση
    στον δρόμο είναι μια τεράστια κρυφή επιδότηση που επιβαρύνει δυσανάλογα τα
    νοικοκυριά χωρίς αυτοκίνητο.
  callouts:
    - |
      Η εκτίμηση των 414.000 οχημάτων βασίζεται σε ανάλυση του Take Back the
      City (2024). Δεν υπάρχει επίσημη καταμέτρηση σταθμευμένων αυτοκινήτων από
      τον Δήμο.
    - |
      Το 2023, τα τέλη κυκλοφορίας απέφεραν €1,16 δισ. από 8,9 εκατ. οχήματα —
      €130 ανά όχημα, από τα χαμηλότερα στην Ευρώπη. Το πραγματικό κόστος των
      οχημάτων για την κοινωνία (τροχαία, ρύπανση, συμφόρηση, δωρεάν στάθμευση)
      εκτιμάται στα €21,5 δισ. ετησίως — δηλαδή τα τέλη κυκλοφορίας καλύπτουν
      μόλις το 5,4% του κόστους.

proposal:
  body: |
    Η ελεγχόμενη στάθμευση επεκτείνεται σε ολόκληρο τον Δήμο με εισαγωγή
    κλιμακωτής τιμολόγησης — τόσο για κατοίκους όσο και για επισκέπτες — με τα
    έσοδα να επιστρέφουν στις γειτονιές ως βελτιωμένος δημόσιος χώρος.

    Συγκεκριμένα, τέσσερα πράγματα αλλάζουν.

    **Πρώτον**, η ελεγχόμενη στάθμευση επεκτείνεται από 12 ζώνες στο σύνολο
    των 7 δημοτικών διαμερισμάτων. Σε κάθε δρόμο ορίζονται θέσεις, ώρες,
    κανόνες. Η ανεξέλεγκτη στάθμευση παύει να είναι η προεπιλογή.

    **Δεύτερον**, κάθε μη κάτοικος που σταθμεύει στον Δήμο πληρώνει ωριαία
    χρέωση. Η τιμή ορίζεται ώστε να είναι ελαφρώς υψηλότερη από τα ιδιωτικά
    γκαράζ της περιοχής — κίνητρο να χρησιμοποιηθούν πρώτα οι υπόγειοι χώροι
    και τα μέσα μεταφοράς.

    **Τρίτον**, η κάρτα κατοίκου αντικαθίσταται από ψηφιακή άδεια με κλιμακωτό
    τέλος: €50–€120 τον χρόνο για το 1ο αυτοκίνητο (ανάλογα με τη ζώνη),
    €120–€300 για το 2ο, €250–€600 για το 3ο. Οχήματα Euro 0–3 πληρώνουν 50%
    επιπλέον. Ηλεκτρικά μηδενικών ρύπων εξαιρούνται (Ν. 4710/2020). ΑμΕΑ και
    πολύτεκνοι εντάσσονται σε μειωμένη κλίμακα.

    **Τέταρτον**, τα καθαρά έσοδα κατανέμονται: 60% στο δημοτικό διαμέρισμα
    προέλευσης — για δέντρα, πλατείες, parklets, ποδηλατοδρόμους — 30% σε
    κεντρικό ταμείο βιώσιμης κινητικότητας, 10% σε κοινωνικές εξαιρέσεις. Η
    κατανομή δημοσιεύεται ετησίως.

implementation:
  body: |
    Το Άρθρο 4 του Ν. 1900/1990 εξουσιοδοτεί τους δήμους να επιβάλλουν τέλη
    στάθμευσης με απόφαση δημοτικού συμβουλίου. Τα έσοδα είναι ανταποδοτικά. Το
    Άρθρο 79 του Ν. 3463/2006 (Δημοτικός Κώδικας) εξουσιοδοτεί κανονιστικές
    αποφάσεις για χώρους στάθμευσης και παρκόμετρα. Ο Ν. 5003/2022 επανίδρυσε
    τη Δημοτική Αστυνομία με ρητές αρμοδιότητες ελέγχου στάθμευσης. Η
    τεχνολογία LPR (αναγνώριση πινακίδων), που ήδη χρησιμοποιείται στη
    Θεσσαλονίκη, επιτρέπει σε 10 εξοπλισμένα οχήματα να σαρώνουν 10.000+
    πινακίδες την ημέρα.

limitations:
  - q: "Πολιτική αντίδραση: η χρέωση στάθμευσης σε γειτονιές που πάντα πάρκαραν δωρεάν θα προκαλέσει αντιδράσεις."
    a: >
      Η Βιέννη αντιμετώπισε την ίδια πρόκληση. Προέρευνα έδειξε 56% υποστήριξη
      πριν εφαρμοστεί το μέτρο. Ο λόγος: οι κάτοικοι βλέπουν τι κερδίζουν —
      λιγότερα αυτοκίνητα, λιγότερη αναζήτηση, πιο καθαρές γειτονιές. Η
      δημοσιοποίηση των εσόδων και η ορατή επανεπένδυση (δέντρα, πλατείες,
      parklets) είναι κρίσιμη.

  - q: "Ελλιπές enforcement: σε ευρωπαϊκές πόλεις χωρίς αποτελεσματικό έλεγχο, μόνο το 20% των οδηγών πληρώνει."
    a: >
      Ακριβώς γι' αυτό η πρόταση δίνει βαρύτητα στην τεχνολογία LPR αντί σε
      αύξηση προσωπικού. Η Θεσσαλονίκη πέτυχε αύξηση turnover στάθμευσης 689%
      με ψηφιακό enforcement. Η μετάβαση από 20% σε 70% συμμόρφωση τριπλασιάζει
      τα έσοδα χωρίς αύξηση τιμών.

  - q: "Κοινωνική δικαιοσύνη: μια οριζόντια χρέωση μπορεί να πλήξει δυσανάλογα νοικοκυριά χαμηλού εισοδήματος που εξαρτώνται από αυτοκίνητο."
    a: >
      Η κλιμακωτή τιμολόγηση (€50 στη Ζώνη Γ, €120 στη Ζώνη Α) λαμβάνει υπόψη
      τη γεωγραφική διαφοροποίηση. Εξαιρέσεις για ΑμΕΑ, πολύτεκνους και
      ηλεκτρικά οχήματα αντιμετωπίζουν τις πιο ευάλωτες περιπτώσεις. Η πιλοτική
      φάση μπορεί να αξιολογήσει αν χρειάζεται και εισοδηματική εξαίρεση.


