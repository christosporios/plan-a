number: 4
slug: to-chthes-sto-simera
theme: public-space
title: Το χθες στο σήμερα
one_line: >
  Δημιουργείται ένα ενιαίο δίκτυο σηματοδότησης ιστορικής μνήμης για την Αθήνα:
  ένα σύστημα φυσικής σήμανσης στον δημόσιο χώρο, με κοινή σχεδιαστική
  ταυτότητα, δίγλωσσα, που αναδεικνύει σταθμούς ιστορικής, κοινωνικής και
  πολιτιστικής σημασίας σε όλη την πόλη.

problem:
  body: |
    Η Αθήνα είναι μια από τις ελάχιστες πόλεις στον κόσμο όπου αρχαία,
    μεσαιωνική και νεότερη ιστορία συνυπάρχουν στους ίδιους δρόμους. Παρόλα
    αυτά, η αφήγηση της ιστορίας στον δημόσιο χώρο απουσιάζει εντελώς. Τόσο ο
    κάτοικος όσο και ο επισκέπτης δυσκολεύονται να ανακαλύψουν την ιστορία της
    πόλης πέρα από τα μεγάλα μνημεία – και τα μνημεία που κυριαρχούν ανήκουν
    σχεδόν αποκλειστικά στην κλασική αρχαιότητα. Ό,τι βρίσκεται έξω από αυτό
    το πλαίσιο, παραμένει στο περιθώριο.

    Αυτό είναι πρόβλημα για δύο λόγους.

    Πρώτον, μια πόλη που αφηγείται μόνο ένα στρώμα του παρελθόντος της
    δυσκολεύεται να κατανοήσει πώς έφτασε να είναι αυτό που είναι σήμερα. Η
    Αθήνα δεν είναι μόνο η κλασική αρχαιότητα – είναι και μια πόλη που
    πλάστηκε από τη βυζαντινή ιστορία, από τέσσερις αιώνες οθωμανικής
    παρουσίας, από την προσφυγιά, από τη βιαστική μεταπολεμική ανοικοδόμηση.
    Όσο αυτή η ποικιλομορφία γίνεται ορατή, τόσο η πόλη γίνεται αντιληπτή ως
    αποτέλεσμα ανθρώπινων διαδρομών που δεν μοιάζουν απαραίτητα με τη δική
    μας. Αυτή η επαφή, όσο έμμεση κι αν είναι, δημιουργεί μια πόλη που
    οικειότητα με ομάδες και συνθήκες που διαφορετικά παραμένουν αφηρημένες
    και απόμακρες. Μια πόλη που αφηγείται τον εαυτό της πλήρως δίνει στους
    κατοίκους της περισσότερα σημεία επαφής με περισσότερους ανθρώπους – και
    αυτό, δημιουργεί μια πόλη πιο ανοιχτόμυαλη και άρα, ανοιχτή.

    Δεύτερον, μια πόλη δεν είναι ωραίο να είναι υπερβολικά λεία και
    προβλέψιμη – πόσο μάλλον όταν κατασκευάζει η ίδια αυτή τη λειότητα,
    επιλέγοντας τι θα δείξει και τι θα αποκρύψει. Υπάρχει αξία στο να σε
    σταματά κάτι που δεν περίμενες. Να ανακαλύπτεις, περπατώντας, ότι ο χώρος
    που πατάς έχει βάθος που δεν φαινόταν. Μια πόλη είναι σημαντικό να
    καλλιεργεί φιλοπεριέργεια στους ανθρώπους της, να τους μαθαίνει να
    παρατηρούν, να αναρωτιούνται για αυτά που βλέπουν, να σκέφτονται και να
    αναζητούν.

proposal:
  body: |
    Προτείνουμε τη δημιουργία ενός ενιαίου δικτύου σηματοδότησης ιστορικής
    μνήμης για την Αθήνα: ένα σύστημα φυσικής σήμανσης στον δημόσιο χώρο, με
    κοινή σχεδιαστική ταυτότητα, δίγλωσσα (ελληνικά και αγγλικά), που θα
    αναδεικνύει σταθμούς ιστορικής, κοινωνικής και πολιτιστικής σημασίας σε
    όλη την πόλη.

    Το δίκτυο δεν επαναλαμβάνει ό,τι κάνουν ήδη οι επίσημοι αρχαιολογικοί
    χώροι. Επικεντρώνεται στα κενά ανάμεσά τους. Περιλαμβάνει τόπους
    ενδιαφέροντος που βρίσκονται εκτός αρχαιολογικών χώρων, κτίρια με
    αρχιτεκτονική/ιστορική αξία, σημεία που συνδέονται με γεγονότα, κινήματα
    ή πρόσωπα – αλλά και χώρους λαϊκής μνήμης.

    Κάθε σημείο σήμανσης φέρει σύντομο, περιεκτικό κείμενο – αρκετό για να
    ιντριγκάρει, όχι αρκετό για να κουράσει. Το κείμενο δεν θα παραπέμπει
    κάπου (π.χ. με κάποιο QR code), δεν θα ζητά καμία ενέργεια. Αν κάποιος
    θέλει να μάθει περισσότερα, ξέρει πώς να ψάξει. Σήμερα το πρόβλημα δεν
    είναι η εύρεση πληροφορίας, είναι η απουσία αφορμής για να την
    αναζητήσεις. Η πληροφορία για σχεδόν κάθε γωνιά της Αθήνας υπάρχει ήδη
    κάπου. Το προτεινόμενο δίκτυο σήμανσης δεν ανταγωνίζεται τη Wikipedia ή
    το ChatGPT – η προστιθέμενη αξία του είναι ότι σου προσφέρει μια
    απρόσμενη αφορμή για να αναρωτηθείς.

implementation:
  body: |
    Η διαχείριση και ανάδειξη του δημόσιου χώρου εμπίπτει άμεσα στις
    αρμοδιότητες του Δήμου Αθηναίων. Για μνημεία και αρχαιολογικούς χώρους
    υπό κρατική εποπτεία, απαιτείται συνεργασία με το Υπουργείο Πολιτισμού και
    την αρμόδια Εφορεία Αρχαιοτήτων – κάτι όχι αδύνατο, αλλά που χρειάζεται
    πολιτική βούληση και συντονισμό. Η συμμετοχή μεγάλων πολιτιστικών
    ιδρυμάτων της πόλης μπορεί να αποδειχθεί καθοριστική: ως χρηματοδότες
    αλλά και ως εγγυητές της ποιότητας και της συνέχειας του εγχειρήματος
    πέρα από εκλογικούς κύκλους.

limitations:
  - q: "Κάθε απόφαση για το τι σηματοδοτείται και τι όχι έχει ιδεολογικό πρόσημο. Η επιλογή να αναδειχθεί ένα μνημείο και όχι ένα άλλο, μια περίοδος και όχι μια άλλη, μια κοινότητα και όχι μια άλλη, δεν είναι ποτέ ουδέτερη – αντικατοπτρίζει πάντα μια άποψη για το τι αξίζει να θυμόμαστε."
    a: >
      Αυτό δεν είναι λόγος να μην γίνει τίποτα· είναι λόγος να γίνει με
      επίγνωση. Ένα δίκτυο που σχεδιάζεται κεντρικά, από μια ομοιογενή ομάδα
      ειδικών, κινδυνεύει να αναπαράγει τις ίδιες ιεραρχίες που ήδη
      κυριαρχούν: να σηματοδοτεί τη δόξα και να παραλείπει την ήττα, να τιμά
      τους επιφανείς και να αγνοεί τους ανώνυμους. Για την πρόληψη αυτού του
      κινδύνου, μπορεί να συσταθεί μια επιτροπή με ευρεία και ανομοιογενή
      σύνθεση – ιστορικοί, αρχιτέκτονες, καλλιτέχνες, εκπρόσωποι κοινοτήτων,
      νέοι – που θα διενεργήσει ανοιχτή πρόσκληση προς τους δημότες να
      προτείνουν τόπους και να γράψουν οι ίδιοι τα κείμενα.

  - q: "Η σήμανση ως οπτικός θόρυβος. Η Αθήνα έχει ήδη αρκετή οπτική ρύπανση. Ένα δίκτυο σήμανσης που δεν σέβεται τον χώρο στον οποίο μπαίνει – πολλές πλάκες, κακός σχεδιασμός, υλικά που δεν εναρμονίζονται με το περιβάλλον τους – αντί να αναδείξει τον δημόσιο χώρο, θα τον επιβαρύνει."
    a: >
      Μπορεί να προβλεφθεί ανοιχτός σχεδιαστικός διαγωνισμός με σαφείς
      προδιαγραφές: διακριτική παρουσία, ενιαία ταυτότητα, υλικά εναρμονισμένα
      με το αστικό τοπίο. Το πρότυπο των μπλε πλακών του Λονδίνου είναι
      ενδεικτικό ως αισθητική: η απλότητα είναι αυτή που κάνει κάτι διαχρονικό
      και σήμα κατατεθέν.

good_practices:
  - city: Λονδίνο
    period: 1866–σήμερα
    body: >
      Στο Λονδίνο, από το 1866, πάνω από 1.000 επίσημες πλάκες έχουν
      τοποθετηθεί σε κτίρια ανά την πόλη.^1 Το πρόγραμμα έχει περάσει από
      τέσσερις διαφορετικούς φορείς διαχείρισης και επέζησε ακόμα και όταν,
      το 2013-14, κρατικές περικοπές απείλησαν τη συνέχειά του καθώς
      ιδιωτικές δωρεές κάλυψαν το κενό. Εξελίχθηκε όμως και ως προς το
      περιεχόμενο: από το 2016, πάνω από τις μισές νέες πλάκες αφορούν
      γυναίκες, και έχει εστιάσει συστηματικά στην ανάδειξη της LGBTQ+
      ιστορίας και της ιστορίας των μαύρων κατοίκων του Λονδίνου. Αυτή η
      ικανότητα του προγράμματος να παραμένει ευέλικτο ως προς τις μορφές
      χρηματοδότησής του και ανοιχτό ως προς το να επανεξετάζει ποιες
      ιστορίες αξίζουν να ειπωθούν του επιτρέπει να διατηρείται ζωντανό και
      ενδιαφέρον για 150 χρόνια, εδραιώνοντας τη θέση τους ως μέρους της
      ταυτότητας της πόλης.

  - city: Βερολίνο
    period: 1985–σήμερα
    body: >
      Στο Βερολίνο, οι Berliner Gedenktafeln – ορθογώνιες πορσελάνινες πλάκες
      με κοβαλτί γραφή σε λευκό φόντο – εισήχθησαν το 1985 εν όψει της 750ής
      επετείου της πόλης.^2 Ο σχεδιασμός τους προέκυψε από ανοιχτό διαγωνισμό,
      τον οποίο κέρδισε ο γραφίστας Wieland Schütz. Σήμερα, πάνω από 2.800
      πλάκες είναι διάσπαρτες σε όλη την πόλη τιμώντας πρόσωπα, τόπους και
      γεγονότα της ιστορίας του Βερολίνου. Η ιδέα ενός ανοιχτού σχεδιαστικού
      διαγωνισμού για την ταυτότητα της σήμανσης είναι κάτι που αξίζει να
      υιοθετηθεί και στην Αθήνα, ειδικά καθώς αποτελεί μια σχεδιαστική επιλογή
      που θα ζήσει στον δημόσιο χώρο για δεκαετίες.

