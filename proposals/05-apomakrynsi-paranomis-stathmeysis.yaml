slug: apomakrynsi-paranomis-stathmeysis
theme: mobility
title: Συστηματική απομάκρυνση παράνομα σταθμευμένων αυτοκινήτων
one_line: >
  Οι απαγορεύσεις στάθμευσης στην Αθήνα υπάρχουν – αυτό που λείπει είναι η
  συστηματική τήρησή τους. Έτσι, οι οδηγοί παρκάρουν παράνομα γιατί ξέρουν ότι
  οι συνέπειες είναι σπάνιες. Ο Δήμος σήμερα βασίζεται στην Τροχαία, ενώ θα
  μπορούσε να δράσει πιο αποτελεσματικά με έναν-δύο δικούς του γερανούς – το
  νομικό πλαίσιο υπάρχει ήδη. Ένας ξεκάθαρος δημόσιος στόχος, όπως η
  απομάκρυνση ενός παράνομα παρκαρισμένου αυτοκινήτου κάθε δύο ώρες και 4.380
  αυτοκινήτων τον χρόνο, κάνει τις συνέπειες ορατές και αλλάζει τη λογική του
  «δεν θα με πιάσουν».
