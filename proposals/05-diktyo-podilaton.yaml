number: 5
slug: diktyo-podilaton
theme: mobility
title: Δίκτυο κοινόχρηστων ποδηλάτων
one_line: >
  Ένα πυκνό δίκτυο κοινόχρηστων ηλεκτρικών ποδηλάτων ταιριάζει στη μικρή κλίμακα
  της Αθήνας: τα ηλεκτρικά λύνουν την ανηφόρα και η πυκνότητα — πολλά ποδήλατα σε
  πολλά σημεία — κάνει το σύστημα πραγματικά χρηστικό.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Σε δεκάδες ευρωπαϊκές πόλεις το κοινόχρηστο ποδήλατο έχει γίνει κομμάτι της
    καθημερινότητας, και η μικρή κλίμακα της Αθήνας θα ταίριαζε απόλυτα σε αυτό το
    μοντέλο. Το εμπόδιο της ανηφόρας λύνεται από τα ηλεκτρικά ποδήλατα. Το κλειδί
    είναι η πυκνότητα: πολλά ποδήλατα σε πολλά σημεία κάνουν το σύστημα χρηστικό,
    και η ζήτηση που θα δημιουργηθεί θα φέρει μαζί της πίεση για ποδηλατοδρόμους
    και περαιτέρω υποδομές που θα κάνουν και την ιδιοκτησία ποδηλάτου πιο
    ελκυστική. Απαραίτητη όμως είναι και η καλή ρύθμιση του παρκαρίσματός τους
    καθώς ο δημόσιος χώρος στην Αθήνα είναι ήδη υπό πίεση.

# ── ΑΠΟ ΤΟ POL.IS ───────────────────────────────────────────────────────────
