# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΕΥΚΟΛΗ ΜΕΤΑΚΙΝΗΣΗ» ──────────────────────────────
contribution:
  body: |
    Η Αθήνα είναι μια πόλη σχετικά μικρής κλίμακας. Αυτό σημαίνει ότι τα δύο κύρια
    κίνητρα που οδηγούν τους κατοίκους στη χρήση αυτοκινήτου δεν είναι η απόσταση
    αυτή καθαυτή, αλλά κάτι διαφορετικό.

    Το πρώτο έχει να κάνει με μια ψευδαίσθηση εγγύτητας. Πολλές διαδρομές στην
    Αθήνα είναι μικρές χρονικά. Στην πράξη όμως η τοπογραφία της πόλης, οι
    ανηφόρες και τα ανώμαλα πεζοδρόμια, μετατρέπουν διαδρομές που μοιάζουν κοντά
    σε κουραστικές εμπειρίες.

    Το δεύτερο είναι το λεγόμενο πρόβλημα «του πρώτου και τελευταίου χιλιομέτρου».
    Ακόμα κι αυτοί που χρησιμοποιούν ΜΜΜ, συναντούν ένα εμπόδιο στα δύο άκρα της
    διαδρομής: τη γεφύρωση μεταξύ σταθμού και της αφετηρίας ή/και του τελικού
    προορισμού τους – π.χ. δεκαπέντε λεπτά με τα πόδια ως τον σταθμό, και άλλα
    δεκαπέντε από τον σταθμό ως τον προορισμό, και πάλι πίσω, κάτι που κάνει
    πολλούς να επιλέγουν το αυτοκίνητο, ακόμα κι όταν το μεγαλύτερο μέρος της
    διαδρομής θα μπορούσε άνετα να γίνει με ΜΜΜ.
  body_after: |
    Το ποδήλατο μπορεί να απαντήσει και στα δύο αυτά προβλήματα: καλύπτει
    αποτελεσματικά αυτές τις ενδιάμεσες αποστάσεις που είναι πολύ κοντά για
    αυτοκίνητο αλλά κουραστικές για τα πόδια, και το κενό μεταξύ σταθμού ΜΜΜ και
    αφετηρίας/προορισμού. Για αυτό προτείνεται η δημιουργία ενός δικτύου
    κοινόχρηστων ποδηλάτων για την πόλη. Δύο χαρακτηριστικά είναι κρίσιμα για να
    λειτουργήσει.

    Το πρώτο είναι τα ποδήλατα να είναι ηλεκτρικά. Η ανηφόρα ήταν ανέκαθεν το
    επιχείρημα εναντίον του ποδηλάτου στην Αθήνα. Το ηλεκτρικό ποδήλατο το
    ακυρώνει: κάνει τη μετακίνηση άνετη ανεξαρτήτως τοπογραφίας, κατάλληλη για τη
    μετάβαση στη δουλειά χωρίς να φτάνεις κατάκοπος, και προσβάσιμη σε όλους
    ανεξαρτήτως φυσικής κατάστασης.

    Το δεύτερο είναι τα ποδήλατα να είναι πολλά. Ένα από τα βασικά πλεονεκτήματα
    του αυτοκινήτου είναι η επιλογή της αυθόρμητης μετακίνησης: το παίρνεις από
    όπου κι αν βρίσκεσαι, όποτε το αποφασίσεις. Για να ανταγωνιστεί το κοινόχρηστο
    ποδήλατο αυτή την ελευθερία κίνησης, πρέπει να υπάρχουν πολλά ποδήλατα σε κάθε
    γειτονιά – όχι σποραδικά σημεία στο κέντρο.

    Αυτό σημαίνει ότι το πρόγραμμα είναι εμπροσθοβαρές: απαιτεί να επενδύσεις στην
    υποδομή πριν δεις τη ζήτηση. Η λογική είναι ότι η προσφορά θα δημιουργήσει τη
    ζήτηση. Διαφορετικά, αν κάνουμε περιορισμένες, πιλοτικές εφαρμογές όπου το
    δίκτυο είναι αραιό και η εύρεση ποδηλάτου απαιτεί προσπάθεια, οι κάτοικοι δεν
    θα αλλάξουν συνήθειες και το σύστημα θα παραμείνει αναξιοποίητο καθώς δεν θα
    είναι χρηστικό.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Τι νόημα έχει να μιλάμε για ποδήλατα σε μια πόλη χωρίς ποδηλατόδρομους;"
    a: >
      Αυτός είναι ο κλασικός «κότα ή αυγό» προβληματισμός. Η απάντηση που δίνει η
      εμπειρία από άλλες πόλεις είναι ότι η φορά της αλληλεπίδρασης έχει σημασία:
      η χρήση ποδηλάτου δημιουργεί ζήτηση και πολιτική πίεση για ποδηλατόδρομους –
      υποδομή που, όσο η χρήση παραμένει χαμηλή, δεν γίνεται ποτέ πολιτική
      προτεραιότητα. Η Αθήνα δεν χρειάζεται να έχει τέλειες υποδομές πριν ξεκινήσει
      να στηρίζει το ποδήλατο – χρειάζεται να ξεκινήσει. Παράλληλα, δρόμοι με
      χαμηλή ταχύτητα και ήπια κυκλοφορία, όπως αυτοί που προτείνονται να
      πεζοδρομούνται στο πλαίσιο της πρότασης 1, είναι ήδη πιο φιλικοί για ποδήλατο
      χωρίς να απαιτούν αποκλειστική υποδομή ποδηλατόδρομου. Αξίζει επίσης να
      σημειωθεί το παράδειγμα του ηλεκτρικού πατινιού: πολλοί άνθρωποι ξεκίνησαν να
      το χρησιμοποιούν καθημερινά στην Αθήνα χωρίς ειδικές λωρίδες, χωρίς σήμανση,
      χωρίς καμία υποδομή σχεδιασμένη γι' αυτό – απλώς και μόνο επειδή υπήρξε
      προσφορά και ανάγκη για μια εναλλακτική λύση μετακίνησης. Και το ποδήλατο, ως
      πιο σταθερό και προβλέψιμο μέσο, έχει κάθε λόγο να τα πάει καλύτερα.

  - q: "Γιατί κοινόχρηστα και όχι ιδιωτικά ποδήλατα;"
    a: >
      Πρώτον, για να αγοράσεις ποδήλατο χρειάζεσαι κεφάλαιο αλλά κυρίως μια
      συνειδητή απόφαση να ενταχθεί το ποδήλατο στη ζωή σου. Αυτό είναι μεγάλο
      εμπόδιο για κάποιον που δεν έχει ήδη ποδηλατική συνήθεια. Και δεύτερον, αν
      πας κάπου με το δικό σου ποδήλατο, είσαι δεσμευμένος να το παρκάρεις, να το
      προσέχεις, να οργανώσεις τη διαδρομή σου γύρω από αυτό. Το κοινόχρηστο δίνει
      μια διαφορετική ελευθερία κινήσεων που ταιριάζει περισσότερο σε ένα μη
      μυημένο κοινό. Το κοινόχρηστο ποδήλατο προσφέρεται λοιπόν καλύτερα ως σημείο
      εκκίνησης για μια πόλη που θέλει να εισαγάγει το ποδήλατο στην
      καθημερινότητά της – και φυσικά, όσο η συνήθεια χτίζεται, σταδιακά θα
      μπορούμε να συζητήσουμε και την ιδιωτική κτήση. [Έρευνα σε πόλεις χαμηλής
      ποδηλατικής κουλτούρας](https://pmc.ncbi.nlm.nih.gov/articles/PMC9537040/)^1
      διαπίστωσε ότι χρήστες κοινόχρηστων ποδηλάτων όχι μόνο άρχισαν να ποδηλατούν
      χάρη στο σύστημα αλλά κατέληξαν να αγοράσουν και δικό τους ποδήλατο.

  - q: "Γιατί όχι κοινόχρηστα πατίνια που ήδη έχει η πόλη;"
    a: >
      Η Lime επέστρεψε στην Αθήνα το 2024 μετά από τετραετή απουσία, αλλά μόνο με
      πατίνια. Η Dott εγκαινίασε [300 πατίνια τον Μάρτιο
      2025](https://www.ertnews.gr/eidiseis/neoi-kanonismoi-gia-tin-kykloforia-ilektrikon-patinion-vazei-o-dimos-athinaion-poia-metra-eksetazei/)^2.
      Σήμερα, πάνω από 4.000 ηλεκτρικά πατίνια κυκλοφορούν στο κέντρο – και μηδέν
      κοινόχρηστα ποδήλατα. Αλλά το ποδήλατο – και ιδίως το ηλεκτρικό –
      απευθύνεται σε πολύ ευρύτερο κοινό και σε πολύ ευρύτερη γκάμα χρήσεων.
      Πληρεί, δηλαδή, περισσότερες προϋποθέσεις για να γίνει ένα πραγματικό μαζικό
      μέσο. Πρώτον, το ποδήλατο είναι πιο ασφαλές. Για παράδειγμα, [μελέτη στο
      Ελσίνκι](https://pmc.ncbi.nlm.nih.gov/articles/PMC12307889/)^3 που ανέλυσε
      περιστατικά επειγόντων για δύο χρόνια διαπίστωσε ότι το πατίνι συνεπάγεται
      περίπου 3,6 φορές υψηλότερο κίνδυνο ατυχήματος σε σχέση με το ποδήλατο.
      Δεύτερον, το ποδήλατο επιτρέπει τη μεταφορά για κάτι ψώνια μια τσάντα ή
      ψώνια πολύ πιο εύκολα σε σχέση με ένα πατίνι, καθιστώντας το πιο λειτουργικό
      στην καθημερινότητα. Τρίτον, το ποδήλατο προσφέρει μεγαλύτερη αίσθηση
      οικειότητας αλλά κυρίως, σταθερότητα. Ο αναβάτης του ποδηλάτου κάθεται με
      χαμηλό κέντρο βάρους, με το σώμα να συνδέεται με το όχημα μέσω σέλας,
      τιμονιού και πεντάλ. Στο πατίνι, ο αναβάτης στέκεται σε μια μικρή πλατφόρμα
      που απαιτεί συνεχείς μικρές διορθώσεις ισορροπίας και είναι πολύ λιγότερο
      ανεκτικό σε ανωμαλίες του εδάφους.

  - q: "Είναι βιώσιμο το ποδήλατο σε μια πόλη με τόση ζέστη;"
    a: >
      Η Αθήνα είναι πράγματι μια ζεστή πόλη και αυτό θέτει ένα εύλογο ερώτημα για
      τη χρηστικότητα του συστήματος τους καλοκαιρινούς μήνες. Το παράδειγμα της
      Βαρκελώνης είναι ενδιαφέρον: τα δεδομένα του δικτύου εκεί όντως δείχνουν
      [μειωμένη χρήση τους μήνες Ιούλιο και
      Αύγουστο](https://www.elgaronline.com/edcollchap/book/9781789900477/book-part-9781789900477-25.xml)^4.
      Και όμως, το Bicing έχει ξεπεράσει τα 100 εκατομμύρια διαδρομές από το 2019,
      καθιστώντας το ένα από τα πιο επιτυχημένα συστήματα κοινόχρηστων ποδηλάτων
      στην Ευρώπη. Η Αθήνα όμως έτσι και αλλιώς απολαμβάνει 8-10 μήνες ιδανικού
      καιρού για ποδηλασία· ακόμα και με μειωμένη μεσημεριανή χρήση τους δύο
      θερινούς μήνες, η ετήσια χρηστικότητα του συστήματος παραμένει υψηλή.

  - q: "Είναι χρήσιμο ένα σύστημα ποδηλάτων που σταματά στα όρια του Δήμου Αθηναίων;"
    a: >
      Εάν ο στόχος είναι το ποδήλατο να χρησιμοποιείται για καθημερινές
      μετακινήσεις, πρέπει να έχουμε κατά νου ότι πολλές από αυτές ξεκινούν ή
      τελειώνουν έξω από τα διοικητικά όρια του Δήμου. Ένα σύστημα που περιορίζεται
      εντός του Δήμου αφήνει εκτός το μεγαλύτερο μέρος της μητροπολιτικής περιοχής
      της Αθήνας. Αλλά από κάπου πρέπει να ξεκινήσουμε. Η επιλογή που υποστηρίζεται
      εδώ είναι να επενδύσουμε πρώτα στην πυκνότητα εντός του αστικού πυρήνα, και
      στη συνέχεια το σύστημα να ανοίγεται σταδιακά σαν ομόκεντρος κύκλος προς τα
      προάστια. Αυτή είναι ακριβώς η λογική που ακολούθησε επιτυχημένα το
      [Ελσίνκι](https://www.sciencedirect.com/science/article/pii/S2590198225003525)^5:
      ξεκίνησε από τον αστικό πυρήνα με ισχυρή σύνδεση στους κόμβους δημόσιας
      συγκοινωνίας, και επεκτάθηκε σταδιακά προς τα προάστια.

  - q: "Δεν θα γίνουν τα ποδήλατα αντικείμενο βανδαλισμού;"
    a: >
      Όντως, υπάρχει τέτοιος κίνδυνος. Η RideMovi αποχώρησε από την Αθήνα λόγω
      εκτεταμένων βανδαλισμών στα ηλεκτρικά ποδήλατά της. Στο Παρίσι, το 80% του
      αρχικού στόλου Vélib' αντικαταστάθηκε μέσα σε δύο χρόνια. Η
      [βιβλιογραφία](https://pmc.ncbi.nlm.nih.gov/articles/PMC9066899/)^6 φαίνεται
      να δείχνει ότι τα docking systems, όπου τα ποδήλατα πρέπει να σταθμεύονται
      συγκεντρωμένα σε συγκεκριμένα σημεία, παρουσιάζουν σημαντικά χαμηλότερα
      ποσοστά βανδαλισμού σε σχέση με τα free-floating ποδήλατα που αφήνονται
      οπουδήποτε στην πόλη (όπως είχε προβλέψει η RideMovi). Όποιο μοντέλο
      χρηματοδότησης κι αν επιλέγει – δημοτική διαχείριση, σύμβαση υπηρεσίας με
      ιδιώτη ανάδοχο ή σύμβαση παραχώρησης σε ιδιώτη – το πλαίσιο πρέπει να
      περιλαμβάνει αντιβανδαλιστικό σχεδιασμό (όπως GPS tracking), ρήτρες ταχείας
      αντικατάστασης και ρεαλιστικό προϋπολογισμό ανανέωσης στόλου.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Περισσότερη ασφάλεια στον δρόμο για όλους
    body: >
      Ένα εύλογο ερώτημα είναι αν περισσότεροι ποδηλάτες στους δρόμους οδηγούν και
      σε περισσότερους τραυματισμούς. Τα δεδομένα δείχνουν το αντίθετο. Σε [μελέτη
      που συνέκρινε αμερικανικές
      πόλεις](https://www.sciencedirect.com/science/article/pii/S2950105924000019)^7
      με υψηλή ποδηλατική κίνηση με αντίστοιχες πόλεις χωρίς, οι πόλεις με λίγους
      ποδηλάτες είχαν 61,4% περισσότερους συνολικούς θανάτους στην κυκλοφορία και
      40% περισσότερους θανάτους πεζών – ενώ ο αριθμός των θανάτων ποδηλατών ήταν
      ο ίδιος και στις δύο ομάδες. Η ερμηνεία είναι ότι η παρουσία ποδηλατών στον
      δρόμο αλλάζει τη συμπεριφορά των οδηγών. Όταν ένας οδηγός γνωρίζει ότι μπορεί
      να συναντήσει ποδηλάτη οποιαδήποτε στιγμή, οδηγεί διαφορετικά: πιο αργά, πιο
      προσεκτικά, με μεγαλύτερη επίγνωση ότι ο δρόμος δεν ανήκει αποκλειστικά,
      καθιστώντας τον δρόμο ασφαλέστερο για τους ίδιους τους οδηγούς, τους
      ποδηλάτες αλλά και τους πεζούς.

  - title: Καλύτερη ποιότητα αέρα
    body: >
      Κάθε διαδρομή με ποδήλατο που αντικαθιστά μια διαδρομή με αυτοκίνητο έχει
      άμεσο αντίκτυπο στην ποιότητα του αέρα. [Μελέτη του συστήματος Bicing στη
      Βαρκελώνη](https://www.tandfonline.com/doi/full/10.1080/23800127.2018.1494347)^8
      εκτίμησε ότι το σύστημα μείωσε τις εκπομπές CO₂ κατά πάνω από 9.000 τόνους
      ετησίως.
    callouts:
      - |
        Στην Αθήνα, πάνω από το 70% των ρύπων διοξειδίου του αζώτου προέρχονται
        [από τα
        οχήματα](https://www.kathimerini.gr/society/1059674/ta-ochimata-eythynontai-gia-to-70-ton-rypon-oxeidioy-toy-azotoy-stin-athina/)^9,
        σχεδόν διπλάσιο από τον μέσο όρο 30 μεγάλων ευρωπαϊκών πόλεων στο 40%, ενώ
        σε κάποιες πόλεις όπως η Λισαβόνα το ποσοστό είναι μόλις 20%.

  - title: Οικονομικά οφέλη για τις γειτονιές
    body: >
      Αρκετές μελέτες διαπιστώνουν ότι, παρόλο που οι οδηγοί αυτοκινήτων ξοδεύουν
      περισσότερα ανά μοναδική επίσκεψη σε καταστήματα λιανικού εμπορίου, οι
      ποδηλάτες ξοδεύουν περισσότερα ανά μήνα συνολικά. Ο πιο ήρεμος ρυθμός της
      μετακίνησης και η ευκολία στάθμευσης τους επιτρέπουν να επισκέπτονται
      καταστήματα πιο συχνά. Στο Πόρτλαντ, για παράδειγμα, όσοι έφταναν σε εμπορική
      περιοχή με ποδήλατο ξόδευαν [κατά 25%
      περισσότερο](https://icic.org/blog/in-reporting-biking/)^10 ανά μήνα σε σχέση
      με όσους έφταναν με αυτοκίνητο.

  - title: Λιγότερη κυκλοφοριακή συμφόρηση
    body: >
      Μελέτη στην Ουάσινγκτον D.C. διαπίστωσε ότι η παρουσία σταθμού κοινόχρηστων
      ποδηλάτων σε μια γειτονιά μειώνει την κυκλοφοριακή συμφόρηση [κατά έως
      4%](https://www.rff.org/publications/journal-articles/bicycle-infrastructure-and-traffic-congestion-evidence-from-dcs-capital-bikeshare/)^11,
      με το αποτέλεσμα να είναι πιο έντονο σε περιοχές υψηλής συμφόρησης. Η μείωση
      δεν οφείλεται μόνο στην άμεση μείωση της κίνησης από την αντικατάσταση του
      αυτοκινήτου αλλά και στη μειωμένη κυκλοφορία οχημάτων που ψάχνουν θέση
      στάθμευσης.

  - title: Ελκυστική εναλλακτική στη χρήση αυτοκινήτου, όχι απλά τιμωρητικά μέτρα
    body: >
      Κάποιες από τις προτάσεις του Plan A – π.χ. για την πιο υψηλή τιμολόγηση
      στάθμευσης, πεζοδρομήσεις και πιο αυστηρή εφαρμογή της απαγόρευσης στάθμευσης
      – λειτουργούν αποτρεπτικά για τη χρήση του αυτοκινήτου στην πόλη, με στόχο η
      πόλη να γίνει λιγότερο εξαρτημένη από το αυτοκίνητο. Αλλά αυτή η κατεύθυνση
      έχει νόημα μόνο αν συνοδεύεται από ελκυστικές εναλλακτικές. Ένα πυκνό δίκτυο
      κοινόχρηστων ηλεκτρικών ποδηλάτων προσφέρει ακριβώς αυτό για τις μικρές και
      τις μεσαίες καθημερινές μετακινήσεις μέσα στον αστικό ιστό.

  - title: Μια πιο άμεση σχέση με την πόλη
    body: >
      Η μετακίνηση με το αυτοκίνητο ή με ΜΜΜ μάς μεταφέρει από σημείο Α σε σημείο Β
      με μικρή επαφή με το τι βρίσκεται ενδιάμεσα. [Έρευνα στον χώρο του αστικού
      σχεδιασμού](https://pubmed.ncbi.nlm.nih.gov/21816732/)^12 έχει διαπιστώσει
      ότι ο πιο ήπιος ρυθμός του ποδηλάτου επιτρέπει στον ποδηλάτη να βιώσει την
      πόλη διαφορετικά, κάνοντας ορατές πτυχές της αστικής ζωής που μέσα από το
      παράθυρο ενός οχήματος μένουν δυσδιάκριτες, ενισχύοντας την αίσθηση του
      ανήκειν στην πόλη.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Εύρεση βέλτιστης οικονομικής ροής
    body: >
      Να αξιολογηθούν τα διαθέσιμα μοντέλα ανάπτυξης ενός τέτοιου δικτύου. Το πρώτο
      είναι αμιγώς δημοτική διαχείριση, όπου ο δήμος αναλαμβάνει κόστος, κυριότητα
      και λειτουργία. Το δεύτερο είναι σύμβαση υπηρεσίας (Ν. 4412/2016), όπου ο
      δήμος αναθέτει σε ιδιώτη ανάδοχο την κατασκευή και λειτουργία αλλά διατηρεί
      την κυριότητα και καταβάλλει αμοιβή. Το τρίτο είναι σύμβαση παραχώρησης (Ν.
      4413/2016), όπου ο ιδιώτης αναλαμβάνει τον πλήρη λειτουργικό κίνδυνο και
      χρηματοδοτείται από έσοδα χρηστών και διαφήμιση, με μηδενική ή ελάχιστη
      δημοτική δαπάνη. Και στα τρία μοντέλα, ο αρμόδιος φορέας είναι ο Δήμος
      Αθηναίων. Τα κοινόχρηστα ποδήλατα δεν εμπίπτουν στην αρμοδιότητα του ΟΑΣΑ.
      Ένα μοντέλο που αξίζει ιδιαίτερης μελέτης είναι αυτό των [Santander
      Cycles](https://www.santander.co.uk/about-santander/media-centre/press-releases/santander-renews-sponsorship-of-londons-cycle-hire)^13
      στο Λονδίνο. Το σύστημα λειτουργεί από το 2010 και χρηματοδοτείται μέσω
      εταιρικής χορηγίας: η Santander καταβάλλει περίπου 6,25 εκ. λίρες ετησίως στη
      δημοτική υπηρεσία μεταφορών του Λονδίνου, αποκτώντας δικαιώματα ονομασίας και
      branding σε ολόκληρο τον στόλο και τους σταθμούς. Το σύστημα διαθέτει σήμερα
      10.000 συμβατικά ποδήλατα, πάνω από 2.000 ηλεκτρικά ποδήλατα και 800 docking
      stations, ενώ η Santander ανανέωσε τη χορηγία της έως το 2032. Το μοντέλο
      αυτό έχει ενδιαφέρον και για την Αθήνα: θα άξιζε να διερευνηθεί αν κάποιος
      εταιρικός χορηγός θα ενδιαφερόταν να δώσει το όνομά του και να χρηματοδοτήσει
      μια τόσο σημαντική υποδομή.

  - title: Χαρτογράφηση σημείων εφαρμογής
    body: >
      Να χαρτογραφηθούν οι περιοχές υψηλής ζήτησης – κόμβοι ΜΜΜ, πυκνοκατοικημένες
      γειτονιές, πόλοι εργασίας και εκπαίδευσης. Αυτή η χαρτογράφηση θα τροφοδοτήσει
      και μια κρίσιμη απόφαση σχεδιασμού που δεν μπορεί να παρθεί αφηρημένα: docking
      stations με σταθερά σημεία παραλαβής και επιστροφής, ή free-floating ποδήλατα
      με geofencing – δηλαδή ζώνες επιτρεπόμενης επιστροφής, και οικονομική
      επιβάρυνση για παρκάρισμα εκτός σημείου/ζώνης. Το ποιο μοντέλο ταιριάζει
      καλύτερα εξαρτάται από τη διαθεσιμότητα δημόσιου χώρου σε κάθε περιοχή – και
      σε μια πόλη όπου αυτός ο χώρος είναι ήδη υπό πίεση, η απάντηση μπορεί να
      διαφέρει από γειτονιά σε γειτονιά.

