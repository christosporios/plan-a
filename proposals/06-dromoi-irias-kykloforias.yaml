number: 6
slug: dromoi-irias-kykloforias
theme: mobility
title: Δρόμοι που σε αναγκάζουν να πας αργά
one_line: >
  Τα 30 km/h σε κάθε αστικό μονόδρομο ισχύουν ήδη — αλλά ένα όριο χωρίς φυσικό
  εμπόδιο δύσκολα τηρείται. Φρεσκοβαμμένες και υπερυψωμένες διαβάσεις και
  σαμαράκια κάνουν τη συμμόρφωση αυτόματη: παρεμβάσεις χαμηλού κόστους και
  μεγάλης ορατότητας, ιδανικές και για εταιρική κοινωνική ευθύνη.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Από τον Ιανουάριο 2026, ισχύει όριο 30 km/h σε κάθε μονόδρομο αστικής
    περιοχής – ένα σημαντικό βήμα, γιατί η Αθήνα είναι μια επικίνδυνη πόλη για
    τους πεζούς και τους οδηγούς της. Αλλά ένα όριο ταχύτητας χωρίς φυσικό
    εμπόδιο είναι πολύ λιγότερο πιθανό να τηρηθεί. Αυτό που χρειάζεται είναι
    φυσικές υποδομές: φρεσκοβαμμένες διαβάσεις, υπερυψωμένες διαβάσεις και
    σαμαράκια. Πρόκειται για δράσεις χαμηλού κόστους και μεγάλης ορατότητας,
    ιδανικές για δράσεις εταιρικής κοινωνικής ευθύνης και ο δήμος έχει κάθε
    λόγο να τις προωθεί ενεργά ως τέτοιες.

# ── ΑΠΟ ΤΟ POL.IS ───────────────────────────────────────────────────────────
polis:
  - statement: "Η Αθήνα πρέπει να εφαρμόσει ζώνες χαμηλής ταχύτητας (π.χ. 30km/h) σε κατοικημένες περιοχές."
    statement_id: 18
    overall: { agree: 81, disagree: 5, pass: 12, count: 609 }
    groups:
      - { label: A, agree: 65, disagree: 13, pass: 20, count: 79 }
      - { label: B, agree: 86, disagree: 6, pass: 6, count: 92 }
      - { label: C, agree: 83, disagree: 3, pass: 13, count: 438 }

# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΕΥΚΟΛΗ ΜΕΤΑΚΙΝΗΣΗ» ──────────────────────────────
contribution:
  body: |
    Η Αθήνα είναι μια ιδιαίτερα επικίνδυνη πόλη για όσους κινούνται εντός της.

    ::: callout
    Το 2025, η Ελλάδα πέτυχε τη [δεύτερη μεγαλύτερη μείωση θανατηφόρων τροχαίων ατυχημάτων](https://www.iefimerida.gr/kosmos/meiosi-sta-thanatifora-trohaia-ellada-stoiheia-ee)^1 μεταξύ των κρατών-μελών της Ευρωπαϊκής Ένωσης. Ωστόσο, η οδική ασφάλεια παραμένει πρόκληση για την Ελλάδα, με τη χώρα να βρίσκεται στην 6η θέση από το τέλος στην ΕΕ σε θανάτους από τροχαία ανά εκατομμύριο κατοίκων. Πανελλαδικά, η Αττική συγκεντρώνει το [υψηλότερο ποσοστό](https://www.statistics.gr/documents/20181/e78575bb-3484-111f-8182-b9e8908a2b1e)^2 τροχαίων ατυχημάτων και θανατηφόρων τροχαίων ατυχημάτων ενώ το 15% των ατυχημάτων παρασέρνει και κάποιον πεζό.
    :::

    Από τον Ιανουάριο 2026, ισχύει όριο 30 km/h σε κάθε μονόδρομο αστικής
    περιοχής (Ν.5209/2025). Αλλά ένα όριο ταχύτητας χωρίς φυσικό εμπόδιο
    παραμένει σε μεγάλο βαθμό λιγότερο πιθανό να εφαρμοστή. Και η σημερινή
    συμμόρφωση και επιβολή κανόνων δεν αφήνουν πολλά περιθώρια αισιοδοξίας.

    ::: callout
    Στην Ελλάδα, μόλις [το 55,8% των οχημάτων](https://www.nrso.ntua.gr/geyannis/wp-content/uploads/geyannis-pc503-1.pdf)^3 τηρεί τα όρια ταχύτητας στις πόλεις.
    :::

    Συγκεκριμένες φυσικές υποδομές θα μπορούσαν να κάνουν τη συμμόρφωση με τη
    μείωση ταχύτητας πιο πιθανή - κάτι που αποτελεί πρότυπο σε σχεδόν κάθε άλλη
    ευρωπαϊκή πρωτεύουσα.

    ::: callout
    Η Ελλάδα είναι μία από τις δύο μόνο χώρες στην ΕΕ με [μερικές μόνο προδιαγραφές σχεδιασμού για υποδομές ασφάλειας πεζών και ποδηλατών](https://road-safety.transport.ec.europa.eu/system/files/2023-02/erso-country-overview-2023-greece_0.pdf)^4 – 25 από τις 27 χώρες ΕΕ διαθέτουν πλήρεις τέτοιες προδιαγραφές
    :::

    Προτείνεται η ανάπτυξη τριών ειδών παρεμβάσεων.

    **Φρεσκοβαμμένες διαβάσεις:** Η πιο γρήγορη και φτηνή παρέμβαση. Σύμφωνα με
    την Ομοσπονδιακή Υπηρεσία Οδικής Ασφάλειας των ΗΠΑ, οι διαβάσεις υψηλής
    ορατότητας μειώνουν τα ατυχήματα πεζών [έως και 48%](https://trec.pdx.edu/sites/default/files/Peter%20Eun%20FHWA%20STEP.pdf)^6. Μελέτη στο Σαν Φρανσίσκο που αξιολόγησε τον αντίκτυπο φρεσκοβαμμένων κίτρινων διαβάσεων υψηλής ορατότητας κοντά σε σχολεία βρήκε μείωση ατυχημάτων πεζών [κατά 37%](https://cmfclearinghouse.fhwa.dot.gov/study_detail.php?stid=172)^7. Αυτό το απλό μέτρο είναι πολύ σημαντικό στην Αθήνα όπου η οι διαβάσεις είναι ανύπαρκτες ενώ η πλειοψηφία όσων υπάρχουν είναι πλέον αόρατες.

    ::: callout
    Στο 86,6% των δρόμων της Αθήνας [δεν υπάρχουν διαβάσεις](https://www.kathimerini.gr/society/563240344/ligo-na-afairetheis-i-zoi-soy-einai-ston-megisto-kindyno/)^5 ενώ μόνο μία στις 10 διαβάσεις έχει φωτεινή σήμανση.
    :::

    **Υπερυψωμένες διαβάσεις**: Κάνουν τις διαβάσεις ακόμη πιο ορατές και άρα
    πιο πιθανό να γίνουν σεβαστές από τους οδηγούς αλλά και να χρησιμοποιηθούν
    από τους πεζούς. Γιατί η ανύψωση της διάβασης στο επίπεδο του πεζοδρομίου
    σημαίνει ο πεζός δεν χρειάζεται πλέον να κατεβεί από το πεζοδρόμιο για να
    περάσει και σε μια πόλη όπου οι πεζοί έχουν μάθει να υποχωρούν αντανακλαστικά
    στην κυκλοφορία, αυτή η μικρή αλλαγή κάνει τη διεκδίκηση της διάβασης να
    βγαίνει πιο φυσικά. [Μελέτη στο Καίμπριτζ της Μασαχουσέτης](https://www.sciencedirect.com/science/article/abs/pii/S136984781630153X)^8 διαπίστωσε ότι μετά την τοποθέτηση υπερυψωμένης διάβασης, πάνω από το 50% των οδηγών παραχωρούσε προτεραιότητα στους πεζούς, έναντι λιγότερο από 20% πριν. [Μετα-ανάλυση μελετών](https://pubmed.ncbi.nlm.nih.gov/30472529/)^9 από Δανία, Νορβηγία, Αγγλία και Πακιστάν έδειξε ότι οι υπερυψωμένες διαβάσεις συσχετίζονται με μείωση των ατυχημάτων με τραυματισμό κατά 65% και των ατυχημάτων με πεζούς κατά 42%.

    **Σαμαράκια:** Εκτός από τα σημεία των διαβάσεων, χρειάζεται έλεγχος
    ταχύτητας και στο ευρύτερο οδικό δίκτυο. [Μελέτη που ανέλυσε 404 οδούς με σαμαράκια](https://www.sciencedirect.com/science/article/abs/pii/S2214140516303760)^10 σε περίοδο 11 ετών στον Καναδά βρήκε συνολική μείωση ατυχημάτων με πεζούς κατά 22%, με τη μείωση να φτάνει το 44% για ατυχήματα που αφορούν παιδιά. [Μελέτη στη Νότια Κορέα](https://pubmed.ncbi.nlm.nih.gov/33334495/)^11 κατέγραψε μείωση ταχύτητας 18–24% και σε ακτίνα 30 μέτρων γύρω από κάθε σαμαράκι.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Δεν θα εκνευριστούν οι οδηγοί;"
    a: |
      Η πρόταση δεν εισάγει κανέναν νέο κανόνα – απλώς καθιστά τη συμμόρφωση με
      τους υφιστάμενους κανόνες λιγότερο προαιρετική. Για τους νομοταγείς
      οδηγούς, δεν αλλάζει κάτι ιδιαίτερο. Άλλωστε, η δημόσια υποστήριξη θα ήταν
      ισχυρότερη απ' ό,τι μάλλον εκτιμάται.

      ::: callout
      Σύμφωνα με [πανευρωπαϊκή έρευνα στάσεων οδηγών](https://www.esranet.eu/en/publications/esra3-publications/#main_reports)^12, το 54,5% των Ελλήνων δηλώνει ότι υποστηρίζει τα 30 km/h σε αστικές περιοχές, τρίτο υψηλότερο ποσοστό στην ΕΕ, υπολειπόμενο μόνο σε σχέση με Ισπανία και Σουηδία.
      :::

  - q: "Δεν θα αυξηθεί η κυκλοφοριακή συμφόρηση;"
    a: >
      Η συμφόρηση στην Αθήνα δεν οφείλεται στο ότι τα αυτοκίνητα κινούνται αργά
      αλλά στο ότι είναι πολλά. Να επαναλάβουμε ότι η πρόταση δεν εισάγει κανέναν
      νέο κανόνα – απλώς καθιστά τη συμμόρφωση με τους υφιστάμενους κανόνες
      λιγότερο προαιρετική. Εάν κάποιοι οδηγοί πήγαιναν γρηγορότερα, παρανόμως,
      αυτή η συμπεριφορά δεν χρήζει διατήρησης

  - q: "Μήπως αυτές οι παρεμβάσεις είναι πολύ ήπιες και πρέπει μόνο να επενδύουμε σε καλύτερη αστυνόμευση;"
    a: >
      Η καλύτερη αστυνόμευση είναι επίσης επιθυμητή – και τα δύο μαζί είναι
      προφανώς καλύτερα από το καθένα μόνο του. Αλλά οι παρεμβάσεις που
      περιγράφουμε λειτουργούν 24 ώρες, 354 μέρες, χωρίς κόστος προσωπικού, και
      με μετρήσιμο αντίκτυπο. Είναι παρεμβάσεις που μπορούν να υλοποιηθούν
      γρήγορα, με χαμηλό κόστος και μετρήσιμο αποτέλεσμα – ακριβώς τα
      χαρακτηριστικά που ψάχνουμε για τις προτάσεις του Plan A.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Περισσότερη εμπορική δραστηριότητα στις γειτονιές
    body: >
      [Σε μελέτη σε διάφορα σημεία στη Νέα Υόρκη](https://nyc.streetsblog.org/2013/12/20/dot-bennett-midland-study-economic-impact-retail-sales-bike-lanes-plazas-sbs)^13,
      σε εμπορικές γειτονιές που εντάχθηκαν φυσικά εμπόδια για την ασφάλεια των
      πεζών, ο τζίρος των τοπικών καταστημάτων αυξήθηκε σημαντικά μέσα σε 3
      χρόνια, κατά 20-71%, παντού ξεπερνώντας την αύξηση που παρατηρήθηκε σε
      γειτονικά σημεία όπου δεν έγιναν αντίστοιχες παρεμβάσεις. Η ερμηνεία είναι
      ότι ο πεζός που αισθάνεται ασφαλής περπατά περισσότερο – και σταματά
      περισσότερο στα μαγαζιά.

  - title: Καλύτερη ποιότητα αέρα
    body: >
      Οχήματα που οδηγούνται σε σταθερά 30 km/h (κάτι που διαφυλάσσεται από την
      ύπαρξη σαμαρακίων) παράγουν σημαντικά λιγότερους ρύπους από αυτά που
      αλλάζουν συνεχώς μεταξύ πιο γρήγορων και πιο αργών ταχυτήτων. Στο Μπιλμπάο
      της Ισπανίας, για παράδειγμα, έναν χρόνο μετά την εφαρμογή δρόμων ήπιας
      κυκλοφορίας με όριο 30 km/h, τα επίπεδα διοξειδίου του αζώτου μειώθηκαν
      [κατά 11,4%](https://www.mdpi.com/2071-1050/16/11/4382)^14.

  - title: Περισσότερη ασφάλεια και ανεξαρτησία για τα παιδιά
    body: >
      Ένας από τους λόγους που όλο και λιγότερες οικογένειες αφήνουν τα παιδιά
      να κινηθούν μόνα τους στη γειτονιά – να πάνε σχολείο, να επιστρέψουν σπίτι,
      να κάνουν μια μικρή δουλειά – είναι η απουσία των υποδομών που θα έκαναν
      αυτή την κίνηση ασφαλή. Όταν αυτές υπάρχουν, η απόφαση να αφήσεις το παιδί
      να διανύσει μόνο του λίγα μέτρα γίνεται ασφαλέστερη.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - category: mapping
    body: >
      Να εντοπιστούν τα σημεία που πληρούν τρία κριτήρια ταυτόχρονα για εφαρμογή
      των παρεμβάσεων: ιστορικό ατυχημάτων, εγγύτητα με σχολεία, νοσοκομεία και
      κόμβους ΜΜΜ, και υψηλός κυκλοφοριακός φόρτος πεζών. Βάσει αυτής της
      χαρτογράφησης, να εκπονηθεί μελέτη εφαρμογής που καθορίζει τον τύπο
      παρέμβασης που χρειάζεται κάθε σημείο, μια ιεράρχηση προτεραιότητας, το
      κόστος και θα βοηθούσε και ο εκτιμώμενος αντίκτυπος.

  - category: financial-flow
    body: >
      Ο Δήμος έχει αρμοδιότητα για εξουσιοδοτεί τέτοιου είδους παρεμβάσεις. Αλλά
      αναφορικά με τους απαιτούμενους πόρους, μπορεί να σχεδιαστεί ένα
      τυποποιημένο πλαίσιο χορηγίας για αυτές και να προωθηθεί ενεργά από τον
      Δήμο ως ευκαιρία εταιρικής κοινωνικής ευθύνης. Πρόκειται για παρεμβάσεις
      χαμηλού κόστους και υψηλής ορατότητας – ακριβώς τα χαρακτηριστικά που
      κάνουν μια δράση ελκυστική για εταιρική χορηγία.

