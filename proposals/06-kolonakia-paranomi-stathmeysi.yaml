number: 6
slug: kolonakia-paranomi-stathmeysi
theme: mobility
title: "Κολωνάκια παντού: η παράνομη στάθμευση γίνεται αδύνατη"
one_line: >
  3.000 σταθερά κολωνάκια σε ράμπες ΑμΕΑ, γωνίες διασταυρώσεων και κρίσιμα
  πεζοδρόμια. Όπου η παράβαση γίνεται φυσικά αδύνατη, δεν χρειάζεται κλήση —
  ένα ζεύγος κολωνακίων λειτουργεί 24 ώρες, χωρίς κόστος προσωπικού, για
  δύο δεκαετίες.

problem:
  body: |
    Το 2024, η Δημοτική Αστυνομία εξέδωσε 471.785 κλήσεις ΚΟΚ και εισέπραξε
    €23,6 εκατ. Η παράνομη στάθμευση στην Αθήνα δεν είναι εξαίρεση αλλά ο
    κανόνας, με περισσότερο από το 50% των αυτοκινήτων να παρκάρουν παράνομα.

    Σε στοχευμένο 12ήμερο έλεγχο στο κέντρο (Ιανουάριος 2025), καταγράφηκαν
    5.270 παραβάσεις. Η κατανομή δείχνει ότι η στάθμευση γίνεται παντού εκτός
    θέσεων στάθμευσης: 2.119 οχήματα πάνω σε πεζοδρόμια (44%), 583 σε γωνίες
    διασταυρώσεων, 217 σε διαβάσεις πεζών, 209 σε πεζόδρομους, 147 σε ράμπες
    ΑμΕΑ, 100 σε διπλή σειρά.^1

    Ένας δημοτικός αστυνόμος καλύπτει μία βάρδια σε έναν δρόμο. Η κλήση
    φτάνει στον οδηγό μετά από εβδομάδες ή μήνες. Στο μεταξύ, ο επόμενος
    οδηγός παρκάρει στο ίδιο σημείο.

    Οι συνέπειες δεν είναι μόνο κυκλοφοριακές. Η παράνομη στάθμευση
    δημιουργεί συστηματικά προβλήματα προσβασιμότητας: στο πρώτο τετράμηνο
    του 2024, καταγράφηκαν 1.853 παραβάσεις σε ράμπες ΑμΕΑ και οδηγούς
    τυφλών. Το πρόστιμο είναι ήδη αυστηρό: €200 + αφαίρεση πινακίδων 60
    ημερών + 9 μονάδες. Η στάθμευση σε γωνίες μπλοκάρει την ορατότητα πεζών
    και οδηγών — ιδίως παιδιών. Η στάθμευση σε διαβάσεις αναγκάζει τον πεζό
    να βγει στο οδόστρωμα. Κάθε μια από αυτές τις παραβάσεις είναι δυνητικά
    θανατηφόρα και καμία κλήση δεν μπορεί να τη μετριάσει αναδρομικά.

proposal:
  body: |
    Μαζική εγκατάσταση σταθερών κολωνακίων σε τρεις κατηγορίες σημείων, με
    αποτέλεσμα η παράβαση να γίνει φυσικά αδύνατη:

    **1. Ράμπες ΑμΕΑ (1.600 κολωνάκια).** Δύο ατσάλινα κολωνάκια ανά ράμπα,
    σε όλες τις ~800 ράμπες του δήμου. Κόστος: €150–600 ανά κολωνάκι.
    Εγκατάσταση: ~30 λεπτά ανά σημείο (βιδωτή βάση σε σκυρόδεμα ή
    πλακόστρωτο).

    **2. Γωνίες διασταυρώσεων (600 κολωνάκια).** Σε 300 διασταυρώσεις
    υψηλού κινδύνου, 2 κολωνάκια ανά γωνία για αποτροπή στάθμευσης σε
    σημεία που μπλοκάρουν ορατότητα πεζών. Επιλογή σημείων βάσει ιστορικού
    ατυχημάτων και παραβάσεων.

    **3. Κρίσιμα πεζοδρόμια και πεζόδρομοι (800 κολωνάκια).** Εισόδους
    πεζοδρόμων, στάσεις ΜΜΜ, σημεία όπου οχήματα ανεβαίνουν συστηματικά
    στο πεζοδρόμιο. Τα κολωνάκια τοποθετούνται στην ακμή του πεζοδρομίου,
    σε απόσταση 1,5 μ. μεταξύ τους, αφήνοντας πάντα ελάχιστο 1,50 μ.
    ελεύθερο πέρασμα.

    Σύνολο: **3.000 κολωνάκια σε 3 χρόνια**.

    Ένα ζεύγος κολωνακίων κόστους €300–1.200 προστατεύει μια ράμπα ΑμΕΑ για
    15–25 χρόνια. Αυτό ισοδυναμεί με ~€0,05 ανά ημέρα προστασίας. Για
    σύγκριση: ένας δημοτικός αστυνόμος κοστίζει €18.000–25.000/έτος και
    καλύπτει μία βάρδια σε έναν δρόμο. Ένα σύστημα κάμερας ταχύτητας
    κοστίζει €30.000–80.000 εγκατάσταση + €5.000–10.000/χρόνο. Ένα ζεύγος
    κολωνακίων λειτουργεί αυτόνομα, χωρίς κόστος λειτουργίας για δύο
    δεκαετίες.

implementation:
  body: |
    Η νομική βάση είναι πλήρης. Ο νέος ΚΟΚ (Ν.5209/2025, Άρθρα 38–41)
    απαγορεύει ρητά τη στάθμευση σε ράμπες ΑμΕΑ, πεζοδρόμια, διαβάσεις
    πεζών, γωνίες. Τα κολωνάκια απλώς υλοποιούν φυσικά αυτή την απαγόρευση.
    Ο Ν.4067/2012 (Άρθρο 26) επιβάλλει προσβασιμότητα χωρίς εμπόδια σε
    κοινόχρηστους χώρους — η μη προστασία ραμπών αποτελεί de facto παράβαση.

    Τα ετήσια έσοδα μόνο από κλήσεις ράμπας ΑμΕΑ (€200 × εκτιμώμενα ~5.000
    κλήσεις/έτος) ξεπερνούν το €1 εκατ. Δηλαδή, τα κολωνάκια θα μπορούσαν
    να χρηματοδοτηθούν αποκλειστικά από τα έσοδα των παραβάσεων που θα
    εξαλείψουν.

limitations:
  - q: "Αισθητική: χιλιάδες μεταλλικά κολωνάκια μπορεί να υποβαθμίσουν οπτικά τον αστικό χώρο."
    a: >
      Υπάρχουν σχεδιαστικά πρότυπα που ενσωματώνουν κολωνάκια στο αστικό
      τοπίο χωρίς οπτική υποβάθμιση. Στις τουριστικές και εμπορικές ζώνες
      (Πλάκα, Θησείο, Κολωνάκι), μπορούν να χρησιμοποιηθούν διακοσμητικά
      κολωνάκια από χυτοσίδηρο ή ανοξείδωτο ατσάλι. Σε κατοικημένες
      γειτονιές, το τυπικό ατσάλινο κολωνάκι με αντανακλαστική ταινία
      είναι λειτουργικό και αόρατο μετά τις πρώτες ημέρες.

  - q: "Βανδαλισμός: κολωνάκια μπορεί να καταστραφούν ή να αφαιρεθούν."
    a: >
      Τα βιδωτά κολωνάκια απαιτούν ειδικό εργαλείο για αφαίρεση. Ο ετήσιος
      ρυθμός αντικατάστασης εκτιμάται στο 2–3%. Αυτό καλύπτεται από τον
      προϋπολογισμό συντήρησης.

  - q: "Μπλοκάρουν νόμιμη πρόσβαση: κολωνάκια μπορεί να δυσκολέψουν φόρτωση/εκφόρτωση ή πρόσβαση ασθενοφόρων."
    a: >
      Τα κολωνάκια σε ράμπες ΑμΕΑ δεν εμποδίζουν καμία νόμιμη χρήση — η
      στάθμευση σε ράμπα είναι πάντα παράνομη. Στα πεζοδρόμια, η
      τοποθέτηση γίνεται αφήνοντας ελεύθερη πρόσβαση φόρτωσης σε
      καθορισμένα σημεία. Σε πεζόδρομους, μπορούν να χρησιμοποιηθούν
      ανασυρόμενα κολωνάκια (€600–2.000/τεμ.) για εξουσιοδοτημένη πρόσβαση.


