number: 6
slug: yiothesia-pezodromion
theme: mobility
title: Υιοθέτηση πεζοδρομίων
one_line: >
  Στην Αθήνα, προϋπολογίζονται τεράστια ποσά για την αναβάθμιση πεζοδρομίων
  αλλά η αίσθηση πραγματικής βελτίωσης παραμένει απούσα. Το νομικό πλαίσιο
  επιτρέπει ήδη σε πολίτες να αναλαμβάνουν την αποκατάσταση ενός πεζοδρομίου
  αλλά με δικούς τους πόρους. Η πρόταση είναι ο Δήμος να δίνει voucher σε
  πολίτες που εντοπίζουν και καταγγέλλουν προβληματικά πεζοδρόμια, αναθέτοντάς
  τους το project management της επισκευής, χωρίς όμως να βάλουν ούτε ευρώ από
  την τσέπη τους. Άλλωστε κανείς δεν έχει μεγαλύτερο κίνητρο να δει τη δουλειά
  να γίνεται σωστά και γρήγορα από αυτόν που περπατά εκεί κάθε μέρα.

problem:
  body: |
    Η κατάσταση των πεζοδρομίων της πόλης είναι προβληματική.

    Υπάρχει πλούσια ερευνητική βιβλιογραφία που τεκμηριώνει τις επιπτώσεις της
    κακής ποιότητας πεζοδρομίων στις πόλεις. Τα προβλήματα εντάσσονται σε
    τέσσερις βασικές κατηγορίες:

    1. Έρευνες καταδεικνύουν ότι η έλλειψη ή η ανεπάρκεια υποδομών για πεζούς
    (πεζοδρόμια, διαβάσεις, νησίδες) αυξάνει σημαντικά τον κίνδυνο τραυματισμού
    ή θανάτου πεζών. Σε έρευνα στην πόλη Πόντιακ του Μίσιγκαν, όπου έχουν
    διαπιστωθεί ιδιαίτερα προβληματικές συνθήκες στο δίκτυο πεζοδρομίων, η
    αναλογία θανατηφόρων ατυχημάτων που αφορούσαν πεζούς (45,8%) ήταν σχεδόν
    τριπλάσια από τον μέσο όρο της πολιτείας (16,5%).^1 Και μία από τις κύριες
    αιτίες φαίνεται να είναι ότι η κακή κατάσταση των πεζοδρομίων οδηγεί τους
    πεζούς να περπατούν στο οδόστρωμα, βάζοντας σε μεγαλύτερο κίνδυνο τη ζωή
    τους.

    2. Η κακή ποιότητα πεζοδρομίων αποτρέπει επίσης τους κατοίκους από το να
    περπατούν, μειώνοντας τη σωματική δραστηριότητα στην πόλη. Έρευνα στην
    κομητεία Μοντγκόμερι του Μέριλαντ διαπίστωσε ότι οι κάτοικοι που ζούσαν σε
    περιοχές με καλύτερη κατάσταση πεζοδρομίων πραγματοποιούσαν σχεδόν διπλάσιες
    (1,85 φορές) εβδομαδιαίες μετακινήσεις με τα πόδια σε σχέση με αυτούς που
    ζούσαν σε περιοχές με κακής ποιότητας πεζοδρόμια.^2 Αυτό έχει άμεσες
    συνέπειες για τη δημόσια υγεία: παγκοσμίως, η σωματική αδράνεια εκτιμάται
    ότι οδηγεί σε 13,4 εκ. χρόνια ζωής με αναπηρία από ασθένειες όπως
    καρδιοπάθειες, διαβήτης τύπου 2, εγκεφαλικό επεισόδιο, καρκίνος του μαστού
    και καρκίνος του παχέος εντέρου.^3

    3. Οι επιπτώσεις αυτές είναι ιδιαίτερα έντονες για ευάλωτες ομάδες. Μελέτη
    στο Σικάγο διαπίστωσε ότι ηλικιωμένοι με κινητικές δυσκολίες είχαν
    τετραπλάσιες πιθανότητες να αναφέρουν σοβαρή δυσκολία περπατήματος όταν
    κατοικούσαν σε γειτονιά με δρόμους σε κακή κατάσταση, σε σύγκριση με
    αυτούς που ζούσαν σε γειτονιές με καλές συνθήκες.^4 Ανώμαλα πεζοδρόμια,
    ανεπαρκείς ράμπες και κακοσχεδιασμένες διαβάσεις περιορίζουν δυσανάλογα
    την κινητικότητα ατόμων με οπτικές και άλλες αναπηρίες, επηρεάζοντας τόσο
    την ασφάλειά τους όσο και την ανεξαρτησία τους στην πόλη.

    4. Και πρέπει να θυμόμαστε ότι ένας τραυματισμός που προκαλείται από κακές
    υποδομές μπορεί να οδηγήσει σε μακροχρόνιες επιπλοκές υγείας που πέρα από
    την ταλαιπωρία του ατόμου, επιβαρύνουν και το σύστημα υγείας εν γένει.
    Αξίζει να σημειωθεί ότι θα είχε μεγάλο ενδιαφέρον μια έρευνα που να
    απομονώνει το κόστος που επιφέρει η κακή ποιότητα των ελληνικών
    πεζοδρομίων στο εθνικό σύστημα υγείας.
  callouts:
    - |
      1.915 χιλιόμετρα υπολογίζεται ότι είναι η έκταση του χώρου στον οποίο
      υπάρχει (ή θα έπρεπε να υπάρχει) πεζοδρόμιο στην Αθήνα.

      Μόλις το 14% θεωρείται ότι είναι σε καλή κατάσταση ενώ το 82% θεωρείται
      ότι είναι σε μέτρια ή κακή κατάσταση.

      Βάσει των προδιαγραφών που θέτει η νομοθεσία, το ελάχιστο πλάτος των
      πεζοδρομίων θα έπρεπε να είναι 2,1 μέτρα (ώστε να χωρούν τουλάχιστον δύο
      άτομα). Το 70% των πεζοδρομίων, όμως, είναι εκτός αυτών των προδιαγραφών
      ενώ το 41% έχει πλάτος μικρότερο του ενός μέτρου. Το 5% των δρόμων δεν
      έχει καν πεζοδρόμιο.

      Η προσβασιμότητα είναι επίσης περιορισμένη. Στο 90% των πεζοδρομίων δεν
      υπάρχει η απαραίτητη υποδομή για την όδευση των τυφλών.

      Πηγή: Walkable Athens - Ψηφιακό Παρατηρητήριο, 2026

proposal:
  body: |
    Ανατρέχοντας κανείς στην ειδησεογραφία, θα βρει πολλές ανακοινώσεις
    φιλόδοξων προγραμμάτων αναβάθμισης πεζοδρομίων, πολλών εκατομμυρίων ευρώ.
    Στην Αθήνα, για παράδειγμα, ο Δήμος Αθηναίων ξεκίνησε από το 2021 το
    μεγαλύτερο πρόγραμμα ανακατασκευής πεζοδρομίων από την εποχή των Ολυμπιακών
    Αγώνων, με προϋπολογισμό 24 εκατομμυρίων ευρώ και στόχο 410 πεζοδρόμια σε
    όλες τις δημοτικές κοινότητες.^5 Ωστόσο, το αντίκρισμα αυτών των έργων δεν
    είναι ορατό: οι κάτοικοι δεν φαίνεται να αναγνωρίζουν κάποια σαφή βελτίωση
    στην κατάσταση των πεζοδρομίων και αυτό δεν μπορεί παρά να οφείλεται στο
    ότι αυτά τα έργα δεν κατάφεραν να αναβαθμίσουν αισθητά την καθημερινή
    εμπειρία στην πόλη.

    Το πρόβλημα των πεζοδρομίων στην Αθήνα είναι τόσο διάχυτο — αφορά δεκάδες
    χιλιάδες τετραγωνικά μέτρα, εκατοντάδες δρόμους, πολλές διαφορετικές
    γειτονιές — που ένα πρόγραμμα γενικής αποκατάστασης κινδυνεύει να χαθεί
    στην κλίμακα του προβλήματος.

    Η πρότασή μας κινείται σε διαφορετική λογική: αντί ο Δήμος να κατανέμει
    μεγάλα κονδύλια με κεντρικό σχεδιασμό, προσπαθώντας να καλύψει όσο
    περισσότερο έδαφος μπορεί, η ιδέα είναι να ανατραπεί η κατεύθυνση της
    διαδικασίας. Οι κάτοικοι αναλαμβάνουν να εντοπίσουν το πρόβλημα, να το
    τεκμηριώσουν και να διεκδικήσουν τη λύση του. Ο Δήμος χρηματοδοτεί. Ο
    κάτοικος που έχει μπει στη διαδικασία να αναδείξει ένα πρόβλημα που τον
    αφορά προσωπικά, θα το παρακολουθήσει καλύτερα και θα διεκδικήσει τη λύση
    του με έναν ζήλο που κανένας κεντρικός σχεδιαστής δεν μπορεί να
    υποκαταστήσει. Ο κάτοικος αναλαμβάνει δηλαδή το project management της
    επισκευής.

implementation:
  body: |
    Ο Δήμος Αθηναίων ήδη διαθέτει ψηφιακή υπηρεσία με τίτλο «Χορήγηση άδειας
    επισκευής πεζοδρομίων», μέσω της οποίας κάθε κάτοικος μπορεί να υποβάλει
    αίτηση στη Διεύθυνση Τεχνικών Υπηρεσιών και να προχωρήσει σε κατασκευή ή
    ανακατασκευή του πεζοδρομίου έξω από την ιδιοκτησία του, με δικό του
    κόστος, τηρώντας τις προδιαγραφές του Δήμου. Η διαδικασία είναι αρκετά
    απλή αλλά στην πράξη, η δυνατότητα αυτή ενεργοποιείται σπάνια: το κόστος
    της κατασκευής παραμένει ολοκληρωτικά στον κάτοικο, κι αυτό αποτελεί
    ουσιαστικό αντικίνητρο.

    Η πρόταση επιδιώκει να άρει ακριβώς αυτό το εμπόδιο. Ο κάτοικος υποβάλλει
    αίτηση, τεκμηριώνει το πρόβλημα — με φωτογραφίες, περιγραφή και εντοπισμό
    στο χάρτη — και λαμβάνει χρηματοδότηση σε μορφή voucher που καλύπτει το
    κόστος της επισκευής. Το voucher εξαργυρώνεται αποκλειστικά μέσω αναδόχων
    από ένα αναγνωρισμένο δίκτυο επαγγελματιών που έχουν δεσμευτεί εκ των
    προτέρων σε συγκεκριμένες τιμές ανά τετραγωνικό μέτρο και είδος εργασίας.
    Στο δίκτυο αυτό μπορούν να συμμετέχουν: πολιτικοί μηχανικοί και εργολάβοι
    δημοσίων έργων (για ανακατασκευές μεγαλύτερης κλίμακας), τοπογράφοι
    μηχανικοί (για αποτύπωση και πιστοποίηση των εργασιών), καθώς και
    εξειδικευμένοι τεχνίτες οδοστρωμάτων (για επισκευές μικρότερης έκτασης).

limitations:
  - q: "«Ο πολίτης κάνει τη δουλειά του κράτους»: Ένας εύλογος προβληματισμός είναι ότι η πρόταση αυτή μετακυλίει στον πολίτη μια ευθύνη που ανήκει στον Δήμο. Αυτό σε κάποιο βαθμό ισχύει."
    a: >
      Ωστόσο, η κεντρική παρέμβαση με τεράστιους προϋπολογισμούς έχει αποδειχθεί
      στην πράξη ανεπαρκής: τα χρήματα δαπανώνται, αλλά η αίσθηση ότι η πόλη
      αλλάζει δεν έρχεται. Σε αυτό το πλαίσιο, αξίζει να δοκιμαστεί ένα πιο
      ενεργό μοντέλο συμμετοχής για να αξιοποιηθεί η τοπική γνώση και ο
      προσωπικός ζήλος που η κεντρική διοίκηση αδυνατεί να αναπαράγει.

  - q: "«Μήπως τα voucher ανεβάσουν τις τιμές;»"
    a: >
      Αυτός ο φόβος αντιμετωπίζεται με προκαθορισμένο τιμοκατάλογο: οι ανάδοχοι
      που εντάσσονται στο μητρώο δεσμεύονται εκ των προτέρων σε συγκεκριμένες
      τιμές ανά τετραγωνικό μέτρο και ανά κατηγορία εργασίας. Το voucher
      καλύπτει αυτές τις τιμές και μόνο αυτές, δεν υπάρχει περιθώριο για
      αυθαίρετη χρέωση.

  - q: "Διασφάλιση ανοιχτού ανταγωνισμού."
    a: >
      Για να αποφευχθεί η συγκέντρωση των έργων σε «ημέτερους», η ένταξη στο
      μητρώο αναδόχων θα γίνεται μέσω ανοιχτής πρόσκλησης με σαφείς και
      αντικειμενικούς όρους, όπως επαγγελματική κατάρτιση, ασφαλιστική και
      φορολογική ενημερότητα, αποδοχή του τιμοκαταλόγου. Οποιοσδήποτε πληροί
      τις προϋποθέσεις μπορεί να συμμετάσχει. Το σύστημα είναι ανοιχτό.

  - q: "Κι αν ο κάτοικος δεν κάνει την εργασία;"
    a: >
      Το κονδύλι από τον Δήμο αποδεσμεύεται μόνο όταν η εργασία δρομολογηθεί και
      πιστοποιηθεί από τον Δήμο. Αν ο κάτοικος τελικά δεν προχωρήσει, δεν
      συμβαίνει τίποτα, δεν υπάρχει πρόστιμο ούτε κυρώσεις, ώστε η διαδικασία
      να παραμένει ελκυστική και χωρίς ρίσκο για εκείνον.

  - q: "Διασφάλιση αντικειμενικής αξιολόγησης αιτημάτων."
    a: >
      Για να μην υπάρχει ευνοϊκή μεταχείριση στην έγκριση αιτημάτων, η
      χρηματοδότηση δεν θα λειτουργεί ως διακριτική απόφαση αλλά ως αυτόματο
      δικαίωμα: εφόσον ένα αίτημα πληροί συγκεκριμένες, αντικειμενικά ελέγξιμες
      προϋποθέσεις — τεκμηριωμένη φθορά, εντοπισμός στο χάρτη, πλήρη
      δικαιολογητικά — εγκρίνεται αυτόματα. Δεν θα υπάρχει επιτροπή που
      «αποφασίζει» ποιος παίρνει voucher και ποιος όχι. Αυτή η λογική ενέχει
      έναν δημοσιονομικό κίνδυνο: αν η ζήτηση αποδειχθεί μεγαλύτερη από τον
      αρχικό εκτιμώμενο προϋπολογισμό — και δεδομένης της κλίμακας του
      προβλήματος στην Αθήνα, αυτό δεν είναι απίθανο — το πρόγραμμα κινδυνεύει
      να εξαντλήσει γρήγορα τους διαθέσιμους πόρους ή και να τους υπερβεί. Μια
      αντιμετώπιση αυτού του προβλήματος είναι να λειτουργεί η χρηματοδότηση σε
      δόσεις: ο Δήμος διαθέτει ένα αρχικό κονδύλι ως πιλότο, παρατηρεί τη
      ζήτηση, και τροποποιεί τους όρους ανάλογα με το τι αποκαλύπτει η πρώτη
      φάση.


