# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΕΥΧΑΡΙΣΤΟΣ ΔΗΜΟΣΙΟΣ ΧΩΡΟΣ» ──────────────────────
contribution:
  body: |
    Υπάρχει η διάχυτη αίσθηση ότι η Αθήνα δεν έχει αρκετό πράσινο. Τα στοιχεία
    αποτυπώνουν μια πιο μικτή εικόνα: χώροι πρασίνου υπάρχουν αλλά η κατανομή
    τους είναι ανομοιόμορφη, με αποτέλεσμα η καθημερινή σχέση των κατοίκων με
    το πράσινο να μην είναι ιδιαίτερα ανεπτυγμένη.

    Η [μέση έκταση πρασίνου που αναλογεί σε κάθε
    κάτοικο](https://www.mdpi.com/2073-445X/14/12/2362)^1 είναι χαμηλή – η Αθήνα
    έρχεται τέταρτη από το τέλος ανάμεσα σε 26 ευρωπαϊκές πρωτεύουσες. Ο [μέσος
    χρόνος πρόσβασης που χρειάζονται οι κάτοικοι της Αθήνας για να φτάσουν σε
    χώρο πρασίνου](https://www.mdpi.com/2073-445X/14/12/2362)^1 είναι πάνω από
    τον ευρωπαϊκό μέσο όρο – ερχόμαστε 19οι ανάμεσα σε 26 ευρωπαϊκές
    πρωτεύουσες.

    Το ότι αυτή η εικόνα δεν είναι ικανοποιητική για τον μέσο κάτοικο, το
    επιβεβαιώνει και μια πρόσφατη [μελέτη που αξιολόγησε την εφαρμογή του κανόνα
    «3-30-300» σε 862 ευρωπαϊκές
    πόλεις](https://www.nature.com/articles/s41467-026-71523-8)^2. Σύμφωνα με
    τον κανόνα, κάθε σπίτι θα πρέπει να βλέπει τουλάχιστον 3 δέντρα, το 30% της
    γειτονιάς να καλύπτεται από κόμες δέντρων και να υπάρχει πάρκο σε απόσταση
    έως 300 μέτρων για κάθε κάτοικο. Στην Αθήνα μόλις περίπου το 3% των κατοίκων
    ζει υπό συνθήκες που ικανοποιούν και τα τρία αυτά κριτήρια ταυτόχρονα,
    σημειώνοντας σημαντική απόσταση από τον ευρωπαϊκό μέσο όρο, ο οποίος
    ανέρχεται στο 13,5%.

    Η ανομοιογενής κατανομή του αστικού πρασίνου, και κατ’ επέκταση η άνιση
    πρόσβαση σε αυτό από τους κατοίκους, συνιστά κρίσιμο ζήτημα, πρωτίστως διότι
    η βλάστηση συνδέεται άμεσα με τη θερμική άνεση του περιβάλλοντος χώρου: οι
    πράσινες γειτονιές παρουσιάζουν σημαντικά χαμηλότερες θερμοκρασίες, γεγονός
    που καθορίζει σε μεγάλο βαθμό την ποιότητα του δημόσιου χώρου που βιώνει
    καθημερινά ο κάθε κάτοικος.

    Η επιστήμη για τη δροσιστική αξία του πρασίνου είναι σαφής. Στη νότια
    Ευρώπη, δεντροφυτεμένες περιοχές παρουσιάζουν θερμοκρασία επιφανείας [έως 4°C
    χαμηλότερη](https://www.nature.com/articles/s41467-021-26768-w)^3 σε σχέση με
    μη δεντροφυτεμένες περιοχές του αστικού ιστού. Και αυτό είναι πολύ σημαντικό
    για την Αθήνα, η οποία είναι ιδιαίτερα ευάλωτη σε υψηλές θερμοκρασίες.
  callouts:
    - |
      Η Αθήνα τα πηγαίνει εξαιρετικά καλά ως προς το [ποσοστό κάλυψης της πόλης
      από πράσινους χώρους](https://www.eea.europa.eu/en/analysis/maps-and-charts/percentage-of-total-green-infrastructure)^4,
      ξεπερνώντας κατά πολύ τον μέσο όρο άλλων πόλεων,
      συμπεριλαμβανομένων και πόλεων που συνειρμικά σκεφτόμαστε σαν ιδιαίτερα
      πράσινες όπως το Άμστερνταμ, το Βερολίνο και η Βιέννη, υπολειπόμενη μόνο
      σε σχέση με τη Στοκχόλμη.

      Ωστόσο, τα ποσοστά της πόλης που καλύπτονται από πράσινες υποδομές και
      δέντρα είναι εξαιρετικά χαμηλά, με την Αθήνα να σκοράρει 2η και 5η από το
      τέλος αντίστοιχα, σε σύγκριση με 38 πόλεις της Ευρώπης.

      Αυτό συμβαίνει επειδή η πόλη διαθέτει μεγάλους, απομονωμένους «πνεύμονες»
      πρασίνου – όπως ο Λυκαβηττός ή το Πεδίον του Άρεως – που ανεβάζουν
      σημαντικά τα στατιστικά για τους χώρους πρασίνου, την ίδια στιγμή που ο
      υπόλοιπος αστικός ιστός στερείται δέντρων στους δρόμους και στις γειτονιές,
      αλλά και σύγχρονων πράσινων υποδομών – όπως φυτεμένα δώματα, βιοκλιματικούς
      διαδρόμους ή πράσινες προσόψεις – που σε άλλες ευρωπαϊκές πόλεις αυξάνουν
      τα αντίστοιχα ποσοστά και δημιουργούν μια πιο ισορροπημένη εικόνα.
    - |
      Στην Αθήνα, οι μέσες θερινές θερμοκρασίες αναμένεται να αυξηθούν κατά 2°C
      έως το 2050 και κατά 4°C έως το 2100.
    - |
      Η Αθήνα είναι μια πόλη εκτεθειμένη στη ζέστη. Είναι η [πιο θερμή πρωτεύουσα
      της ηπειρωτικής Ευρώπης](https://thedocs.worldbank.org/en/doc/9e5105a293323cddf54df62da2e9e862-0070012022/original/D-Athens-Heat-Case.pdf)^5.
      Μελέτη του 2018 που ανέλυσε [571 ευρωπαϊκές
      πόλεις](https://iopscience.iop.org/article/10.1088/1748-9326/aaaad3)^6
      κατέταξε την Αθήνα ως τη πόλη που θα πληγεί περισσότερο από καύσωνες, ενώ
      [έκθεση της Moody's](https://thedocs.worldbank.org/en/doc/9e5105a293323cddf54df62da2e9e862-0070012022/original/D-Athens-Heat-Case.pdf)^5
      που αξιολογούσε τους πιστωτικούς κινδύνους από την κλιματική αλλαγή για 30
      ευρωπαϊκές πόλεις τοποθετούσε την Αθήνα ως την πιο ευάλωτη ως προς την
      έκθεση σε υψηλές θερμοκρασίες.
    - |
      Το φαινόμενο της «αστικής θερμικής νησίδας» περιγράφει την τάση των
      πυκνοδομημένων αστικών περιοχών να διατηρούν υψηλότερες θερμοκρασίες σε
      σχέση με τις γύρω περιοχές, κυρίως λόγω της απορρόφησης θερμότητας από την
      άσφαλτο, της έλλειψης πρασίνου και της θερμότητας που παράγουν τα οχήματα
      και τα κλιματιστικά. Το φαινόμενο αυτό είναι ιδιαίτερα [έντονο στην
      Αθήνα](https://www.sciencedirect.com/science/article/abs/pii/S1352231013001726)^7:
      η Αθήνα παρουσιάζει θερμοκρασίες υψηλότερες κατά πάνω από 4°C σε σχέση με
      τις μη αστικές περιοχές γύρω της κατά τη διάρκεια της νύχτας.
  body_after: |
    Η βιβλιογραφία συγκλίνει στο ότι η βέλτιστη στρατηγική για αστική θερμική
    ανθεκτικότητα δεν είναι ούτε μόνο μεγάλα πάρκα ούτε μόνο μικρά, αλλά ο
    συνδυασμός τους. Και ο λόγος είναι ότι η ψυκτική επίδραση ενός αστικού
    πάρκου στο περιβάλλον του εκτείνεται συνήθως σε ακτίνα [600-1.000
    μέτρων](https://www.frontiersin.org/journals/earth-science/articles/10.3389/feart.2023.1133901/full)^8
    από τα όριά του. Ένα μεγάλο πάρκο ψύχει, λοιπόν, αποτελεσματικά μια ζώνη γύρω
    του αλλά οι γειτονιές έξω από αυτή την ακτίνα παραμένουν εκτεθειμένες,
    ανεξαρτήτως του μεγέθους του πάρκου. Επιπλέον, η [σχέση μεταξύ εμβαδού πάρκου
    και ψυκτικής απόδοσης δεν είναι
    γραμμική](https://www.nature.com/articles/s41598-024-67277-2)^9 – πέρα από
    ένα όριο μεγέθους, η επιπλέον αύξηση εμβαδού δεν αποφέρει ανάλογο ψυκτικό
    όφελος.

    Μικρότερα πάρκα, διάσπαρτα στην πόλη, είναι, λοιπόν, απαραίτητα για να
    επεκτείνουν τη γεωγραφική εμβέλεια του ψυκτικού αντικτύπου στις γειτονιές
    που βρίσκονται εκτός της άμεσης ακτίνας των μεγάλων κόμβων πρασίνου στην
    πόλη. Και παράλληλα να καταστήσουν την πρόσβαση σε αυτά πιο ισότιμη,
    διασφαλίζοντας ότι περισσότεροι κάτοικοι απολαμβάνουν τα οφέλη του αστικού
    πρασίνου σε εύλογη απόσταση από την κατοικία τους.

    Ο Δήμος Αθηναίων έχει στην αρμοδιότητά του πάνω από 400 σχολεία – δημοτικά,
    γυμνάσια, λύκεια – με αυλές που παραμένουν κλειστές και αναξιοποίητες για
    πολλές ώρες την ημέρα, κάθε Σαββατοκύριακο και για τρεις μήνες το καλοκαίρι.
    Πρόκειται για ένα σύνολο δημόσιας γης που υποχρησιμοποιείται ενώ η πόλη
    στερείται χώρων πρασίνου. Τα προαύλια των σχολείων – ήδη γεωγραφικά
    διασκορπισμένα ανά συνοικία – μπορούν να μετατραπούν σε δίκτυο τέτοιων
    πάρκων, ανοιχτών στο κοινό εκτός σχολικού ωραρίου. Κάποια προαύλια
    χρειάζονται παρεμβάσεις για να διαδραματίσουν έναν τέτοιο ρόλο – π.χ.
    αντικατάσταση ασφάλτου με διαπερατές επιφάνειες, φύτευση δέντρων και θάμνων,
    προσθήκη παγκακιών και σκίαστρων. Κάποια άλλα προαύλια έχουν ήδη δέντρα,
    σκιά, ανοιχτούς χώρους και χρειάζονται μόνο να επανασυστηθούν ως πάρκα στη
    γειτονιά. Σε κάθε περίπτωση, πρέπει να υπογραμμίσουμε ότι το κόστος για την
    αξιοποίηση ενός προαύλιου ως πάρκου γειτονιάς είναι αρκετά φθηνότερο από την
    απόκτηση νέου αστικού χώρου και την κατασκευή νέου πάρκου από μηδενική βάση.

    Σε αυτό το πνεύμα, ενδιαφέρον έχει το παράδειγμα της Νέας Υόρκης, όπου
    εκατοντάδες σχολικά προαύλια έχουν ανακαινιστεί και ανοίξει στο κοινό κατά
    τις μη σχολικές ώρες μέσω του προγράμματος [«Schoolyards to
    Playgrounds»](https://www.nycgovparks.org/greening/schoolyards)^10, με στόχο
    να βρίσκεται το 85% των κατοίκων σε απόσταση 10 λεπτών με τα πόδια από
    κάποιον πράσινο χώρο έως το 2030.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Ποιος αναλαμβάνει τη συντήρηση και την καθαριότητα;"
    a: >
      Ένα προαύλιο ανοιχτό στο κοινό σημαίνει περισσότερη φθορά, περισσότερα
      σκουπίδια και τακτική ανάγκη για πότισμα, κλάδεμα και επισκευές εξοπλισμού.
      Αυτό το κόστος πρέπει να προϋπολογιστεί ρητά – και σίγουρα να μην ανατεθεί
      στα ήδη υποχρηματοδοτημένα σχολεία. Ένα μοντέλο μπορεί να συνδυάζει
      δημοτική χρηματοδότηση για τη βασική συντήρηση με τη δυνατότητα «υιοθεσίας»
      κάθε προαύλιου από επιχειρήσεις – ένα μοντέλο που ο Δήμος Αθηναίων είχε ήδη
      ξεκινήσει να εφαρμόζει για δημόσιες υποδομές και δημόσιους χώρους της πόλης
      μέσω του προγράμματος [«Adopt your city»](https://adoptathens.gr/en/)^11,
      το οποίο θα μπορούσε να επανενεργοποιηθεί και να προωθηθεί ενεργά. Συμπληρωματικά, σύλλογοι γονέων
      ή ομάδες γειτόνων μπορούν να συμμετέχουν στη φροντίδα των αυλών (στη λογική
      neighborhood stewardship) με αντάλλαγμα προτεραιότητα χρήσης για
      εκδηλώσεις. Το μοντέλο του κοινοτικού κήπου είναι ανοίκειο στην Αθήνα –
      αλλά μπορούμε να το δοκιμάσουμε, να δούμε αν λειτουργεί, ιδανικά σε έναν
      χώρο που η κοινότητα ήδη έχει σύνδεση όπως είναι το σχολείο. Θα πρέπει
      επίσης να επικοινωνηθεί ότι το κτίριο όχι μόνο δεν θα υποστεί μεγαλύτερη
      φθορά – αντιθέτως, η ένταξη στο πρόγραμμα θα συνοδεύεται από αναβαθμίσεις
      που το σχολείο δεν θα μπορούσε να χρηματοδοτήσει μόνο του.

  - q: "Μήπως αυξηθούν τα φαινόμενα βανδαλισμού στα σχολικά κτίρια;"
    a: >
      Το κλείσιμο ενός χώρου δεν προστατεύει απαραίτητα: ένας χώρος που παραμένει
      ανενεργός για ώρες μπορεί να είναι πιο ευάλωτος από έναν χώρο όπου υπάρχει
      συνεχής ανθρώπινη παρουσία. Αυτό υποστηρίζει και η κλασική ανάλυση της Jane
      Jacobs για την ασφάλεια στις πόλεις, βάσει του «eyes on the street» και της
      ανεπίσημης επιτήρησης που παρέχουν οι επισκέπτες ενός χώρου σε αυτόν.

  - q: "Ποιος φέρει ευθύνη σε περίπτωση ατυχήματος;"
    a: >
      Πρέπει να είναι σαφές ότι το προσωπικό και η διοίκηση ενός σχολείου δεν θα
      επωμιστούν καμία επιπλέον ευθύνη. Όταν το προαύλιο ανοίγει στο κοινό, η
      αστική ευθύνη για ατυχήματα αφορά τον Δήμο, όπως ακριβώς ισχύει και σε κάθε
      άλλο δημόσιο πάρκο της πόλης. Το εργαλείο που έχει λειτουργήσει αλλού για να
      τυποποιηθεί αυτή η σχέση είναι η [«Συμφωνία Κοινής Χρήσης» (Joint Use
      Agreement)](https://www.tpl.org/media-room/opening-schoolyards-public-during-non-school-hours-could-alleviate-problem-park-access)^12
      μεταξύ σχολείου και δήμου: ένα επίσημο έγγραφο που ορίζει ποιος
      ευθύνεται για τι, ώστε όλες οι πλευρές να ξέρουν με σαφήνεια τον ρόλο τους.

  - q: "Τι γίνεται με σχολικές δραστηριότητες εκτός ωραρίου;"
    a: >
      Το σχολείο έχει πάντα προτεραιότητα. Εκδηλώσεις, αθλητικές δραστηριότητες,
      σύλλογοι γονέων, θεατρικές παραστάσεις – όποτε το σχολείο χρειάζεται το
      προαύλιο, ο χώρος πρέπει να είναι διαθέσιμος. Η δημόσια χρήση δεν
      ανταγωνίζεται τη χρήση από τη σχολική κοινότητα. Αυτή η σειρά προτεραιότητας
      πρέπει να αποτυπωθεί ρητά και στη Συμφωνία Κοινής Χρήσης που αναφέρουμε
      παραπάνω, ώστε η σχολική κοινότητα να μην αισθάνεται σε τίποτε μειονεκτικά.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Οφέλη για τη σωματική υγεία
    body: >
      Ο Παγκόσμιος Οργανισμός Υγείας αναφέρει ότι [οι κάτοικοι που έχουν πρόσβαση
      σε χώρο πρασίνου σε απόσταση περίπου 300 μέτρων από την κατοικία
      τους](https://iris.who.int/server/api/core/bitstreams/74006ead-650d-4fca-815a-f1ff53c1eea1/content)^13
      έχουν σημαντικά περισσότερες πιθανότητες να πληρούν τις συστάσεις για
      σωματική
      δραστηριότητα και εμφανίζουν χαμηλότερη συχνότητα καρδιαγγειακών νοσημάτων,
      παχυσαρκίας και διαταραχών που σχετίζονται με το άγχος. Επιπλέον, όσοι ζουν
      σε πιο «πράσινες» γειτονιές μπορεί να έχουν κατά 20-30% μεγαλύτερη
      πιθανότητα να συμμετέχουν σε τακτική μέτρια σωματική δραστηριότητα σε
      σύγκριση με όσους κατοικούν σε περιοχές με λιγότερο πράσινο.

  - title: Οφέλη για την ψυχική υγεία
    body: >
      Η επαφή με το πράσινο βοηθά επίσης στην ψυχική υγεία. [Στην
      Ουαλία](https://evidence.nihr.ac.uk/alert/local-green-spaces-are-linked-with-better-mental-health/)^14,
      για παράδειγμα, διαπίστωσαν ότι κάθε αύξηση κατά 10% στην πρόσβαση σε
      πράσινους (και υδάτινους) χώρους συνδέεται με μείωση 7% στον κίνδυνο άγχους
      και κατάθλιψης.

  - title: Περισσότερα οφέλη για την υγεία στις πιο ευάλωτες ομάδες
    body: >
      Μια μελέτη με περισσότερους από 250.000 κατοίκους στην Ολλανδία διαπιστώνει
      ότι αύξηση κατά 10% του τοπικού πρασίνου συνδέεται με [σημαντικά χαμηλότερη
      συχνότητα εμφάνισης διαφόρων χρόνιων
      παθήσεων](https://jech.bmj.com/content/60/7/587)^15 και δη, μεταξύ παιδιών,
      ηλικιωμένων και ατόμων χαμηλότερου εισοδήματος.

  - title: Ενίσχυση του οικοσυστήματος
    body: >
      Οι αστικοί πράσινοι χώροι δρουν ως κρίσιμα καταφύγια βιοποικιλότητας. Οι
      πιο μικροί χώροι πρασίνου που βρίσκονται διάσπαρτοι μέσα στην πόλη επιτελούν
      και έναν ακόμη ρόλο: λειτουργούν ως [πράσινοι
      διάδρομοι](https://www.sciencedirect.com/science/article/pii/S1618866726002554)^16
      για τη μετακίνηση των ειδών και τη διασύνδεση των οικοσυστημάτων,
      μειώνοντας τον κίνδυνο
      εξαφάνισης των ειδών και ενισχύοντας την ανθεκτικότητα των οικοσυστημάτων
      σε περιβαλλοντικές αλλαγές.

  - title: Πιο ζωντανές γειτονιές
    body: >
      Ένα σχολείο που ανοίγει τις πύλες του εκτός ωραρίου ως μικρό πάρκο δεν
      προσφέρει μόνο πράσινο αλλά και έναν τόπο συνάντησης, όπου μπορούν να
      προκύψουν καθημερινές, αναπάντεχες επαφές που συνιστούν τον κοινωνικό ιστό
      μιας γειτονιάς, καλλιεργώντας δεσμούς μεταξύ των κατοίκων και ενισχύοντας
      την κοινωνική συνοχή. Στον Δήμο Αθηναίων υπάρχει ήδη ένα σχετικό προηγούμενο
      που αποδεικνύει ότι αυτή η λογική δεν είναι ξένη: το πρόγραμμα «Ανοιχτά
      Σχολεία» που κρατά σχολικά κτίρια ανοιχτά τα απογεύματα και τα
      Σαββατοκύριακα ως χώρους συνάντησης κατοίκων με δωρεάν δράσεις πολιτισμού,
      εκπαίδευσης και άθλησης.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Χαρτογράφηση σημείων εφαρμογής
    body: >
      Να καταγραφούν τα προαύλια όλων των σχολείων και να αξιολογηθούν ως προς
      δύο βασικές διαστάσεις: την ετοιμότητά τους να λειτουργήσουν ως πάρκα
      γειτονιάς – πόσο πράσινο υπάρχει ήδη, τι υποδομές χρειάζονται – και την εν
      δυνάμει αποτελεσματικότητά τους, δηλαδή πόσους κατοίκους θα εξυπηρετήσουν
      και πόσο σημαντικό κενό πράσινου καλύπτουν στη γειτονιά τους. Από αυτή τη
      χαρτογράφηση προκύπτει μια λίστα προτεραιοποίησης: πρώτα τα προαύλια που
      χρειάζονται ελάχιστη παρέμβαση και βρίσκονται σε περιοχές με τη μεγαλύτερη
      έλλειψη πράσινου – εκεί το όφελος είναι μέγιστο και το κόστος ελάχιστο.
      Ακολουθούν όσα απαιτούν μεγαλύτερες παρεμβάσεις αλλά εξυπηρετούν
      πυκνοκατοικημένες συνοικίες χωρίς κανέναν εναλλακτικό πράσινο χώρο, κ.ό.κ.

  - title: Κοστολόγηση
    body: >
      Βάσει της παραπάνω χαρτογράφησης, τα προαύλια μπορούν να κατηγοριοποιηθούν
      ανά ομάδες κόστους. Η κατηγοριοποίηση αυτή επιτρέπει στον Δήμο να σχεδιάσει
      έναν πιλότο. Παράλληλα, αξίζει να εξεταστεί η δυνατότητα εταιρικής
      υποστήριξης μέσω προγραμμάτων εταιρικής κοινωνικής ευθύνης.

