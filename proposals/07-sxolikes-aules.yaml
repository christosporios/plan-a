number: 7
slug: sxolikes-aules
theme: public-space
title: Πάρκα γειτονιάς στα σχολικά προαύλια
one_line: >
  Η πόλη δεν χρειάζεται μόνο μεγάλα πάρκα αλλά και μικρούς χώρους πρασίνου στις
  γειτονιές. Τα σχολικά προαύλια υπάρχουν ήδη παντού: ανοίγοντάς τα στο κοινό
  εκτός σχολικού ωραρίου, με πρόβλεψη ώστε το σχολείο να έχει πάντα τον χώρο
  του, δημιουργούμε δεκάδες πάρκα γειτονιάς χωρίς ούτε ένα τετραγωνικό μέτρο
  νέας γης.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Η πόλη δεν χρειάζεται μόνο μεγάλα πάρκα – χρειάζεται και μικρούς χώρους
    πρασίνου που να εξυπηρετούν τις πιο άμεσες ανάγκες μιας γειτονιάς. Σε μια
    πυκνοδομημένη πόλη όπως η Αθήνα, το να δημιουργήσεις τέτοιους χώρους εκ
    νέου είναι εξαιρετικά δύσκολο. Τα σχολικά προαύλια όμως υπάρχουν ήδη,
    κατανεμημένα σε όλες τις γειτονιές. Με στοχευμένες παρεμβάσεις, ανοίγοντάς
    τα στο κοινό εκτός σχολικών ωρών και με τις κατάλληλες προβλέψεις ώστε το
    σχολείο να έχει πάντα τον χώρο που χρειάζεται, μπορούν να δημιουργηθούν
    δεκάδες μικρά πάρκα γειτονιάς χωρίς να χρειαστεί να βρεθεί ούτε ένα
    τετραγωνικό μέτρο νέας γης.

# ── ΑΠΟ ΤΟ POL.IS ───────────────────────────────────────────────────────────
