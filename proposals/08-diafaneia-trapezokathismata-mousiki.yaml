number: 8
slug: diafaneia-trapezokathismata-mousiki
theme: public-space
title: Διαφάνεια για τα τραπεζοκαθίσματα και τη μουσική κάθε επιχείρησης
one_line: >
  Συχνά οι επιχειρήσεις της πόλης καταλαμβάνουν τον δημόσιο χώρο με
  τραπεζοκαθίσματα ή επιβαρύνουν τη γειτονιά με πολύ δυνατή μουσική. Ένα κύριο
  πρόβλημα σε αυτό είναι η αδιαφάνεια: ο κάτοικος δεν ξέρει αν αυτό που βιώνει
  είναι νόμιμο ή παράνομο, κι έτσι νιώθει παραιτημένος. Η πρόταση είναι κάθε
  επιχείρηση να αναρτά σε εμφανές σημείο πινακίδα με το επιτρεπόμενο ωράριο
  μουσικής, και αν έχει άδεια για τραπεζοκαθίσματα να υπάρχει διαγράμμιση στο
  πεζοδρόμιο. Έτσι ο κάτοικος θα ξέρει αμέσως αν η επιχείρηση παραβαίνει τους
  κανόνες – και άρα πρέπει να την καταγγείλει – ή αν ο Δήμος έδωσε άδεια που
  θεωρεί αδικαιολόγητη και πρέπει να αμφισβητήσει. Η διαφάνεια δεν λύνει μόνη
  της το πρόβλημα, αλλά εξοπλίζει τον πολίτη με την απαραίτητη πληροφορία για
  να διεκδικήσει τη λύση.

proposal:
  body: |
    Συχνά οι επιχειρήσεις της πόλης καταλαμβάνουν τον δημόσιο χώρο με τραπεζοκαθίσματα ή επιβαρύνουν τη γειτονιά με πολύ δυνατή μουσική. Ένα κύριο πρόβλημα σε αυτό είναι η αδιαφάνεια: ο κάτοικος δεν ξέρει αν αυτό που βιώνει είναι νόμιμο ή παράνομο, κι έτσι παραιτείται από την προσπάθεια βελτίωσης της καθημερινότητάς τους. Η πρόταση είναι κάθε επιχείρηση να αναρτά σε εμφανές σημείο πινακίδα με το επιτρεπόμενο ωράριο μουσικής, και αν έχει άδεια για τραπεζοκαθίσματα να υπάρχει διαγράμμιση στο πεζοδρόμιο. Έτσι ο κάτοικος θα ξέρει αμέσως αν η επιχείρηση παραβαίνει τους κανόνες – και άρα πρέπει να την καταγγείλει – ή αν ο Δήμος έδωσε άδεια που θεωρεί αδικαιολόγητη και πρέπει να αμφισβητήσει. Η διαφάνεια δεν λύνει μόνη της το πρόβλημα, αλλά εξοπλίζει τον πολίτη με την απαραίτητη πληροφορία για να διεκδικήσει τη λύση.

contribution:
  body: |
    Η Αθήνα είναι μια ζωντανή πόλη με έντονη δραστηριότητα εστίασης, συμπεριλαμβανομένων των βραδινών ωρών. Αυτό αποτελεί κομμάτι της ταυτότητάς της και σημαντικό παράγοντα του οικονομικού της μοντέλου – αλλά χωρίς ρύθμιση, γίνεται πηγή συστηματικής υποβάθμισης της ποιότητας ζωής στις γειτονιές.

    Συγκεκριμένα, δύο προβλήματα προκύπτουν και αλληλοτροφοδοτούνται. Πρώτον, η κατάληψη δημόσιου χώρου: τραπεζοκαθίσματα επιχειρήσεων υπερβαίνουν συστηματικά τα νόμιμα όρια.

    ::: callout
    Το [Ελεγκτικό Συνέδριο](https://www.elsyn.gr/sites/default/files/Checks/%CE%95%CE%9A%CE%98%CE%95%CE%A3%CE%97%20%CE%95%CE%9B%CE%95%CE%93%CE%A7%CE%9F%CE%A5%205%20%CE%A4%CE%A1%CE%91%CE%A0%CE%95%CE%96%CE%9F%CE%9A%CE%91%CE%98%CE%99%CE%A3%CE%9C%CE%91%CE%A4%CE%91.pdf)^1 αναφέρει ότι, σε 14 ελληνικούς δήμους συμπεριλαμβανομένου του Δήμου Αθηναίων, το 50% των καταστημάτων με [τραπεζοκαθίσματα](https://www.lifo.gr/tags/trapezokathismata)^2 δεν διαθέτει καθόλου άδεια από τους δήμους, ενώ ένα επιπλέον 27% υπερβαίνει τα όρια της άδειας που έχει λάβει, καταλαμβάνοντας μεγαλύτερο χώρο, με το συνολικό ποσοστό παραβατικότητας να ανέρχεται στο 77%.
    :::

    Δεύτερον, υψηλά επίπεδα θορύβου τόσο εξαιτίας της μουσική όσο και της γενικότερης κίνησης από χώρους εστίασης και ψυχαγωγίας.

    Για τα τραπεζοκαθίσματα, το Δημοτικό Συμβούλιο θέτει με κανονιστική απόφαση το γενικό πλαίσιο – ποιοι χώροι παραχωρούνται, υπό ποιες προϋποθέσεις (ελεύθερη διέλευση πεζών, πρόσβαση ΑμΑ, απαγόρευση μόνιμων κατασκευών και εξωτερικών ηχείων στον παραχωρούμενο χώρο). Κάθε μεμονωμένη άδεια εκδίδεται από την αρμόδια υπηρεσία του Δήμου, μετά από γνωμάτευση της Αστυνομίας ή της Δημοτικής Αστυνομίας για ό,τι αφορά την πρόσβαση στους δρόμους.

    Για τη χρήση μουσικής, κάθε κατάστημα δηλώνει απλώς ότι θα χρησιμοποιεί μουσική, χωρίς να απαιτείται άδεια από κανένα όργανο. Το Δημοτικό Συμβούλιο, ωστόσο, διατηρεί την αρμοδιότητα έκδοσης τοπικής κανονιστικής απόφασης που ορίζει τα γενικά ωράρια λειτουργίας μουσικής για όλα τα καταστήματα του Δήμου, λαμβάνοντας υπόψη τις χρήσεις γης, τις τοπικές συνθήκες και την προστασία από την ηχορύπανση – με εισήγηση της Δημοτικής Επιτροπής. Στον Δήμο Αθηναίων τα ισχύοντα γενικά ανώτατα όρια είναι 01:00 για Κυριακή έως Πέμπτη και 03:00 για Παρασκευή, Σάββατο και αργίες. Η παράταση ωραρίου πέρα από αυτά τα όρια απαιτεί ειδική άδεια. Αρμόδιο όργανο για τη χορήγησή της είναι το Συμβούλιο της Δημοτικής Κοινότητας εντός των ορίων της οποίας βρίσκεται η επιχείρηση· εάν αποφασίσει θετικά, εκδίδεται διαπιστωτική πράξη Δημάρχου με ετήσια ισχύ. Να σημειωθεί επίσης ότι το Συμβούλιο της Δημοτικής Κοινότητας μπορεί, με αιτιολογημένη απόφαση, να ορίσει ωράριο παράτασης μικρότερο από το γενικό ανώτατο – δηλαδή να διαφοροποιήσει τους όρους κατά γειτονιά ή κατά κατάστημα. Η άδεια παράτασης δεν χορηγείται όταν υπάρχουν περισσότερες από δύο βεβαιωμένες παραβάσεις ηχορύπανσης ή υπέρβασης ωραρίου εντός έτους.

    Υπάρχει, λοιπόν, ήδη ένα ρυθμιστικό πλαίσιο που, επί της αρχής, διασφαλίζει ότι οι επιχειρήσεις εστίασης και διασκέδασης στην Αθήνα λειτουργούν με συγκεκριμένους όρους ως τα τραπεζοκαθίσματα σε κοινόχρηστους χώρους και τη μουσική. Στην πράξη όμως, ο πολίτης δεν μπορεί εύκολα να γνωρίζει τι ισχύει για κάθε επιχείρηση. Αυτό σημαίνει ότι όταν η ποιότητα ζωής του υποβαθμίζεται – από τραπεζοκαθίσματα που μπλοκάρουν το πεζοδρόμιο ή από μουσική που φτάνει στο υπνοδωμάτιό του – δεν μπορεί να γνωρίζει αν αυτό που βιώνει οφείλεται σε άδεια που παραβιάζεται ή σε άδεια που εκδόθηκε με ελλιπείς όρους. Πρόκειται για διάκριση με πρακτικές συνέπειες: στη μία περίπτωση ο πολίτης έχει λόγο να καταγγείλει μια παράβαση· στην άλλη, το πρόβλημα βρίσκεται στην ίδια την αδειοδότηση. Χωρίς πρόσβαση στα στοιχεία της άδειας, η διάκριση αυτή είναι αδύνατη και αυτή η άγνοια συχνά οδηγεί τους πολίτες σε ισοπεδωτικές λογικές είτε ότι "όλες οι άδειες έχουν εκδοθεί στη λάθος βάση" είτε ότι "όλοι παραβιάζουν τις άδειές τους" όπου το συμπέρασμα είναι ίδιο: νιώθουν ότι δεν αξίζει να κάνουν κάτι, γιατί το πρόβλημα είναι εντελώς διάχυτο.

    Ένας τρόπος να αντιμετωπιστεί αυτό είναι να καταστεί η πληροφορία ορατή: κάθε επιχείρηση να αναρτά σε εμφανές σημείο τις ώρες που επιτρέπεται να παίζει μουσική, και όταν έχει λάβει άδεια να χρησιμοποιεί δημόσιο χώρο, να υπάρχει διαγράμμιση στο έδαφος που ορίζει τα νόμιμα όρια της χρήσης. Και στις δύο περιπτώσεις, η πληροφορία γίνεται αντικειμενικά ελέγξιμη από τον πολίτη. Αν η διαγράμμιση ξεπερνιέται, έχει λόγο να καταγγείλει παράβαση. Αν η διαγράμμιση δείχνει όρους που του φαίνονται εξαρχής προβληματικοί, έχει λόγο να αμφισβητήσει την ίδια την αδειοδότηση.

    Παράλληλα, αυτού του είδους τα μέτρα που επιφέρουν ορατότητα στο τι πρέπει να κάνει μια επιχείρηση, ασκούν και περισσότερη πίεση στην επιχείρηση να κινείται εντός των ορίων του νόμου. Ο επιχειρηματίας που σκέφτεται να υπερβεί τα όρια ξέρει πλέον ότι δεν χρειάζεται να έρθει ελεγκτής για να γίνει αντιληπτός και αυτό μπορεί να τον κάνει να σκεφτεί δύο φορές πριν απλώσει τραπέζια παραπάνω από όσο του επιτρέπεται.

limitations:
  - q: Ποιος επαληθεύει ότι η πινακίδα και η διαγράμμιση αντιστοιχούν στην πραγματική άδεια;
    a: |
      Η ορατότητα της πληροφορίας αξίζει κάτι μόνο αν η πληροφορία είναι αξιόπιστη. Αν κάθε επιχείρηση αναρτά ό,τι θέλει ή διαγραμμίζει ό,τι της εξυπηρετεί, το μέτρο αντί να αποκαλύπτει παραβάσεις, τις καλύπτει νομιμοφανώς. Γι’αυτό θα βοηθούσε μαζί με τη φυσική επισήμανση να υπάρχει και ένα QR code όπου ο πολίτης θα μπορεί να συγκρίνει όσα βλέπει με όσα προβλέπονται στην άδεια και να τα επαληθεύει εύκολα και γρήγορα.
  - q: Πώς συνδέεται η καταγγελία του πολίτη με συγκεκριμένη απόκριση;
    a: |
      Το μέτρο καλλιεργεί τη λογοδοσία του επιχειρηματία και εξοπλίζει τον πολίτη με πληροφορία για να διεκδικήσει καλύτερες συνθήκες, αλλά αυτά από μόνα τους δεν φτάνουν για να αντιμετωπιστεί το πρόβλημα, όταν υπάρχει παράβαση. Αυτό φάνηκε και από την [εφαρμογή του MyCoast](https://www.kathimerini.gr/society/563720968/elegktiko-synedrio-kena-stoys-elegchoys-gia-tis-paralies-afanta-ta-drones/)^3 που μέσα στο 2024, ο κρατικός μηχανισμός κατάφερε να ολοκληρώσει τον έλεγχο μόλις στο ένα τρίτο των καταγγελιών ενώ οι μισές περιπτώσεις δεν ελέγχθηκαν καν. Για να είναι ακόμη πιο αποτελεσματικό το μέτρο, το ιδανικό θα ήταν να να συνδυαστεί με υποχρεωτική απόκριση σε σύντομο χρόνο και δημόσια καταχώρηση αποτελέσματος ως προς το τι διαπιστώθηκε κατά τον έλεγχο και τι επιβλήθηκε ως κύρωση.
  - q: Πώς αντιμετωπίζεται ο κίνδυνος η διαφάνεια να λειτουργήσει ανισότιμα ανά γειτονιά;
    a: |
      Το μέτρο στηρίζεται σε μεγάλο βαθμό στην ενεργοποίηση του πολίτη – στο να παρατηρήσει, να συγκρίνει με την πινακίδα ή τη διαγράμμιση, και να καταγγείλει. Αυτό όμως μπορεί να σημαίνει ότι η αποτελεσματικότητά του θα είναι άνιση: σε γειτονιές με οργανωμένους συλλόγους κατοίκων, υψηλή εκπαίδευση και εξοικείωση με διοικητικές διαδικασίες, ο μηχανισμός θα λειτουργήσει καλά. Σε γειτονιές με λιγότερο οργανωμένες κοινότητες, ο μηχανισμός δεν θα είναι το ίδιο αποτελεσματικός. Το αποτέλεσμα είναι ότι η διαφάνεια μπορεί να λειτουργήσει ως ενίσχυση υφιστάμενων ανισοτήτων στην προστασία του δημόσιου χώρου. Η αντιμετώπιση απαιτεί συμπληρωματικά εργαλεία: συστηματικούς δειγματοληπτικούς ελέγχους από τον Δήμο ανεξαρτήτως καταγγελιών, και ενεργητική πληροφόρηση των κατοίκων για το τι σημαίνει η πινακίδα και πώς χρησιμοποιείται, ώστε η διαφάνεια να μην είναι ουσιαστικά προνόμιο των ήδη ενημερωμένων.

      Ένα κίνητρο ώστε περισσότεροι πολίτες να καταγγέλουν παραβάσεις θα ήταν ο πολίτης που αποκαλύπτει παράβαση να λαμβάνει μέρος του προστίμου. Το πιο χαρακτηριστικό παράδειγμα είναι [ένα πρόγραμμα στη Νέα Υόρκη](https://www.nyc.gov/site/dep/environment/idling-citizens-air-complaint-program.page)^4 που κινητροδοτεί κατοίκους να επαγγελματικά οχήματα (π.χ. φορτηγά) που μένουν με τη μηχανή ανοιχτή, σταθμευμένα μέσα στην πόλη. Πρέπει να υποβάλουν βίντεο που αποδεικνύει ότι το όχημα παρέμεινε αδρανές αλλά με τον κινητήρα ανοιχτό πάνω από 3 λεπτά και η ανταμοιβή είναι το 25% του προστίμου, δηλαδή περίπου $87. Οι παραβάσεις που καταγράφηκαν [αυξήθηκαν κατά 35%](https://www.cnbc.com/2022/03/31/make-87point50-in-3-minutes-by-reporting-idling-trucks-in-new-york-city.html)^5 μέσα σε τρία χρόνια – και τα έσοδα για τον Δήμο από τα πρόστιμα έχουν αυξηθεί σημαντικά.  Το μοντέλο έχει σημαντικά προβλήματα, και αξίζει να σταθμιστεί προσεκτικά. Το 85% των καταγγελιών προήλθε [από μόλις 20 άτομα](https://www.vinwarden.com/blog/nyc-anti-idling-crackdown-public-health-vs-operations)^6, με τους πιο ενεργούς να κερδίζουν εξαψήφια ποσά ετησίως – μετατρέποντας ένα εργαλείο πολιτικής συμμετοχής σε μοχλό απόκτησης εισοδήματος. Οι εκπρόσωποι του κλάδου των μεταφορών κατήγγειλαν επίσης ότι πολίτες παραμόνευαν έξω από αποθήκες και ακολουθούσαν οχήματα, δημιουργώντας ένα κλίμα καχυποψίας και εχθρότητας – ακριβώς το αντίθετο από ό,τι επιδιώκει ένα μέτρο που στοχεύει στη βελτίωση της ποιότητας ζωής σε μια γειτονιά.

benefits:
  - title: Περισσότερη εμπιστοσύνη στη δημόσια διοίκηση
    body: |
      Ένα από τα βαθύτερα προβλήματα που καλείται να αντιμετωπίσει το μέτρο είναι η αίσθηση παραίτησης: ο πολίτης που δεν γνωρίζει αν αυτό που βιώνει είναι παράβαση ή νόμιμη κατάσταση, καταλήγει να μην κάνει τίποτα. Ο πολίτης που γνωρίζει τι ισχύει, γνωρίζει και πότε έχει λόγο να διεκδικήσει. Και αυτό, σωρευτικά, ανακτά κάτι σημαντικό: την πεποίθηση ότι οι κανόνες μπορούν να εφαρμοστούν και ότι αξίζει να προσπαθήσει κανείς.
  - title: Πιο υγιής ανταγωνισμός μεταξύ επιχειρήσεων
    body: |
      Η αδιαφάνεια και η ατιμωρησία δεν επιβαρύνουν μόνο τους κατοίκους – επιβαρύνουν και τις ίδιες τις επιχειρήσεις που λειτουργούν νόμιμα. Αυτή τη στιγμή, ο επιχειρηματίας που τηρεί τα όρια της άδειάς του – δηλαδή που έχει λιγότερα τραπέζια, πιο χαμηλή μουσική, νωρίτερη διακοπή της μουσικής – ανταγωνίζεται έναν δίπλα που παραβαίνει τους κανόνες χωρίς ιδιαίτερες συνέπειες. Η ορατότητα των αδειών αλλάζει αυτή τη δυναμική: η συμμόρφωση παύει να είναι μειονέκτημα – και μπορεί να γίνει ακόμα συγκριτικό πλεονέκτημα. Ο πελάτης που γνωρίζει ότι μια επιχείρηση λειτουργεί εντός των ορίων της, έχει λόγο να την προτιμά έναντι μιας που παραβαίνει και αυτό δημιουργεί ένα θετικό κίνητρο συμμόρφωσης, πέρα από τον φόβο της κύρωσης.
  - title: Περισσότερη λογοδοσία στην αδειοδότηση
    body: |
      Όταν κάθε άδεια είναι δημόσια και ψηφιακά προσβάσιμη, ο δήμος δεν είναι πλέον ο μόνος που γνωρίζει τι έχει εκχωρήσει – το γνωρίζει και ο πολίτης. Αυτό αλλάζει τη δυναμική της αδειοδότησης: ο δήμος πλέον ξέρει ότι αυτή η απόφαση είναι ορατή και ελέγξιμη από κατοίκους, συλλόγους, μέσα μαζικής ενημέρωσης, αυξάνοντας την πολιτική πίεση για προσεκτική χορήγηση αδειών.

next_steps:
  - category: digital
    body: |
      Προϋπόθεση για την υλοποίηση του μέτρου είναι η πληροφορία που υπάρχει ήδη στα αρχεία του Δήμου να γίνει προσβάσιμη σε δομημένη, αναγνώσιμη μορφή. Συγκεκριμένα, για κάθε επιχείρηση χρειάζεται να είναι ψηφιακά διαθέσιμα δύο στοιχεία: τα όρια της άδειας τραπεζοκαθισμάτων – δηλαδή ο επιτρεπόμενος χώρος και οι όροι χρήσης του – και το ωράριο μουσικής που ισχύει για την επιχείρηση. Το κρίσιμο εδώ δεν είναι μόνο η ψηφιοποίηση, αλλά η μορφή: ο πολίτης που σκανάρει το QR code δεν πρέπει να βρίσκεται μπροστά σε ένα σκαναρισμένο PDF με ακατανόητη γλώσσα και κακή ανάλυση. Πρέπει να βλέπει αμέσως δύο-τρεις σαφείς πληροφορίες – π.χ. «επιτρεπόμενος χώρος: 12 τ.μ.» και «μουσική έως 01:00», με δυνατότητα να πλοηγηθεί στο πλήρες έγγραφο της άδειας μόνο αν το επιθυμεί.
  - category: financial-flow
    body: |
      Περισσότεροι έλεγχοι έχουν κόστος, και αξίζει να εκτιμηθεί αν μπορούν να αυτοχρηματοδοτηθούν από τα πρόστιμα που θα επιβάλλονται. Αυτό απαιτεί να απαντηθούν συγκεκριμένα ερωτήματα: πόσες παραβάσεις εκτιμάται ότι υπάρχουν, πόσες από αυτές μπορούν ρεαλιστικά να ελεγχθούν, και τι ύψος προστίμων χρειάζεται για να καλυφθεί το κόστος των ελεγκτών. Παράλληλα, αξίζει να διερευνηθεί το ενδεχόμενο ένα μέρος των προστίμων να επιστρέφει ως κίνητρο στον πολίτη που κατήγγειλε – με βάση την εμπειρία από άλλες πόλεις και τις παθογένειες που έχουν καταγραφεί.

