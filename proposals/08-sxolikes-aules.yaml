number: 8
slug: sxolikes-aules
theme: public-space
title: Σχολικές αυλές ως δίκτυο πάρκων γειτονιάς
one_line: >
  Πάνω από 400 σχολικές αυλές του Δήμου Αθηναίων παραμένουν κλειστές και
  αναξιοποίητες για το μεγαλύτερο μέρος του χρόνου. Μπορούν να μετατραπούν σε
  δίκτυο πάρκων τσέπης, ανοιχτών στο κοινό εκτός σχολικού ωραρίου, ώστε η
  πόλη με τα χαμηλότερα επίπεδα πρασίνου στην Ευρώπη να αποκτήσει νέους
  χώρους πρασίνου και αναψυχής σε κάθε γειτονιά.

problem:
  body: |
    Ο Δήμος Αθηναίων έχει από τα χαμηλότερα επίπεδα πρασίνου ανά κάτοικο στην
    Ευρώπη.

    Η έλλειψη πρασίνου δεν είναι αισθητικό ζήτημα. Είναι πρόβλημα δημόσιας
    υγείας, κλιματικής προσαρμογής και κοινωνικής ισότητας.

    Η Αθήνα είναι μια πόλη εκτεθειμένη στη ζέστη. Είναι η πιο θερμή πρωτεύουσα
    της ηπειρωτικής Ευρώπης.^1 Μελέτη του 2018 του Newcastle University ανέλυσε
    571 ευρωπαϊκές πόλεις και κατέταξε την Αθήνα ως τη πόλη που θα πληγεί
    περισσότερο από καύσωνες^2 ενώ έκθεση της Moody's που αξιολογούσε τους
    πιστωτικούς κινδύνους από την κλιματική αλλαγή για 30 ευρωπαϊκές πόλεις, η
    Αθήνα είχε την υψηλότερη θέση ως προς την έκθεση σε υψηλές θερμοκρασίες.^3

    Το φαινόμενο της «αστικής θερμικής νησίδας» περιγράφει την τάση των
    πυκνοδομημένων αστικών περιοχών να διατηρούν υψηλότερες θερμοκρασίες σε
    σχέση με τις γύρω περιοχές, κυρίως λόγω της απορρόφησης θερμότητας από την
    άσφαλτο, της έλλειψης πρασίνου και της θερμότητας που παράγουν τα οχήματα
    και τα κλιματιστικά. Το φαινόμενο αυτό είναι ιδιαίτερα έντονο στην Αθήνα: η
    Αθήνα παρουσιάζει θερμοκρασίες υψηλότερες κατά πάνω από 4°C σε σχέση με τις
    μη αστικές περιοχές γύρω της κατά τη διάρκεια της νύχτας.^4
  callouts:
    - |
      Σε κάθε κάτοικο της Αθήνας αντιστοιχούν μόλις 0,96 τετραγωνικά μέτρα
      πρασίνου. Το Παρίσι έχει 8,54 τ.μ., η Ρώμη και το Λονδίνο 9, η Ζυρίχη 10,
      το Βερολίνο 13, η Βαρσοβία 18, η Βιέννη 20, και το Άμστερνταμ 27 — η
      Αθήνα υπολείπεται με διαφορά από άλλες ευρωπαϊκές πρωτεύουσες.
    - |
      Στην Αθήνα, οι μέσες θερινές θερμοκρασίες αναμένεται να αυξηθούν κατά 2°C
      έως το 2050 και κατά 4°C έως το 2100.

      Η επιστήμη για την αξία του πρασίνου είναι σαφής. Σε ανάλυση 293
      ευρωπαϊκών πόλεων, δεντροφυτευμένες περιοχές παρουσιάζουν θερμοκρασία
      επιφανείας έως 4°C χαμηλότερη από το αστικό ιστό στη Νότια Ευρώπη — και
      μάλιστα τα δέντρα εμφανίζουν ψυκτική ικανότητα 2 έως 4 φορές μεγαλύτερη
      από πράσινους χώρους χωρίς δέντρα. Κάθε αύξηση κατά 10% στη φυτοκάλυψη
      μειώνει τη θερμοκρασία επιφανείας κατά 0,6-1,2°C.
    - |
      Στη Βαρκελώνη, οι προσομοιώσεις του Δήμου έδειξαν ότι το πρόγραμμα
      superblock μπορεί να οδηγήσει σε μείωση της θερμοκρασίας κατά 1,2°C τις
      ζεστές ημέρες.

proposal:
  body: |
    Η βιβλιογραφία συγκλίνει στο ότι η βέλτιστη στρατηγική για αστική θερμική
    ανθεκτικότητα δεν είναι ούτε μόνο μεγάλα πάρκα ούτε μόνο μικρά, αλλά ο
    συνδυασμός τους. Και ο λόγος είναι ότι η ψυκτική επίδραση ενός αστικού
    πάρκου στο περιβάλλον του εκτείνεται συνήθως σε ακτίνα 600-1.000 μέτρων από
    τα όριά του. Ένα μεγάλο πάρκο ψύχει, λοιπόν, αποτελεσματικά μια ζώνη γύρω
    του αλλά οι γειτονιές έξω από αυτή την ακτίνα παραμένουν εκτεθειμένες,
    ανεξαρτήτως του μεγέθους του πάρκου. Επιπλέον, η σχέση μεταξύ εμβαδού
    πάρκου και ψυκτικής απόδοσης δεν είναι γραμμική — πέρα από ένα κατώφλι
    μεγέθους, η επιπλέον αύξηση εμβαδού δεν αποφέρει ανάλογο ψυκτικό όφελος.
    Τα πάρκα τσέπης είναι, λοιπόν, απαραίτητα για να επεκτείνουν τη γεωγραφική
    εμβέλεια του ψυκτικού αντίκτυπου στις γειτονιές που βρίσκονται εκτός της
    άμεσης ακτίνας των μεγάλων κόμβων πρασίνου στην πόλη.

    Οι αυλές των σχολείων — ήδη γεωγραφικά διασκορπισμένες ανά συνοικία —
    μπορούν να μετατραπούν σε δίκτυο πάρκων τσέπης, ανοιχτών στο κοινό εκτός
    σχολικού ωραρίου. Η παρέμβαση δεν είναι ομοιόμορφη: κάποιες αυλές
    χρειάζονται φυσική αναβάθμιση — αντικατάσταση ασφάλτου με διαπερατές
    επιφάνειες, φύτευση δέντρων και θάμνων, προσθήκη παγκακιών και σκίαστρων.
    Κάποιες άλλες έχουν ήδη τις προδιαγραφές — δέντρα, σκιά, ανοιχτός χώρος —
    και χρειάζονται μόνο να επανασυστηθούν ως πάρκα τσέπης της γειτονιάς.

implementation:
  body: |
    Ο Δήμος Αθηναίων έχει στην αρμοδιότητά του πάνω από 400 σχολεία — δημοτικά,
    γυμνάσια, λύκεια — με αυλές που παραμένουν κλειστές και αναξιοποίητες για
    πολλές ώρες την ημέρα, κάθε Σαββατοκύριακο και για τρεις μήνες το
    καλοκαίρι. Πρόκειται για ένα σύνολο δημόσιας γης που υποχρησιμοποιείται
    ενώ η πόλη στερείται χώρων πρασίνου.

    Το πρώτο βήμα είναι η καταγραφή όλων των αυλών ως προς την ετοιμότητά τους
    να λειτουργήσουν ως πάρκα τσέπης — αλλά και την εν δυνάμει
    αποτελεσματικότητά τους. Βάσει αυτής της ανάλυσης, θα προκύψουν δύο
    κατηγορίες: αυλές που είναι ήδη έτοιμες να λειτουργήσουν ως πάρκα τσέπης
    με ελάχιστη ή καμία φυσική παρέμβαση, και αυλές που χρειάζονται αναβάθμιση
    πριν ανοίξουν στο κοινό. Η πρώτη φάση υλοποίησης μπορεί να εστιάσει σε 30
    αυλές με υπάρχον πράσινο και σε 10 αυλές που χρήζουν αναβάθμισης.

    Και πρέπει να υπογραμμίσουμε ότι το κόστος για την αξιοποίηση μιας
    σχολικής αυλής ως πάρκου γειτονιάς είναι αρκετά φθηνότερο από την απόκτηση
    νέου αστικού χώρου και την κατασκευή νέου πάρκου από μηδενική βάση.

limitations:
  - q: "Συντήρηση: Όταν το σχολείο είναι κλειστό, δεν προβλέπεται καθαρισμός ή συντήρηση των υποδομών του — με αποτέλεσμα οι αυλές-πάρκα τσέπης να κινδυνεύουν να υποστούν αμέλεια που θα υπονομεύσει τη λειτουργία τους."
    a: >
      Οι αυλές-πάρκα τσέπης μπορούν να ενταχθούν στην αρμοδιότητα των συνεργείων
      καθαριότητας και συντήρησης πρασίνου του Δήμου, ακριβώς όπως τα υπόλοιπα
      δημοτικά πάρκα. Συμπληρωματικά, σύλλογοι γονέων ή ομάδες γειτόνων μπορούν
      να συμμετέχουν στη φροντίδα των αυλών (στη λογική neighborhood stewardship)
      με αντάλλαγμα προτεραιότητα χρήσης για εκδηλώσεις. Το μοντέλο του
      κοινοτικού κήπου είναι ανοίκειο στην Αθήνα — αλλά μπορούμε να το
      δοκιμάσουμε, να δούμε αν λειτουργεί, ιδανικά σε έναν χώρο που η κοινότητα
      ήδη έχει σύνδεση όπως είναι το σχολείο.


