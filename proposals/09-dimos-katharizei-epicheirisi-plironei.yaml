number: 9
slug: dimos-katharizei-epicheirisi-plironei
theme: public-space
title: Ο δήμος καθαρίζει, η επιχείρηση πληρώνει
one_line: >
  Ο δήμος μπορεί να προσφέρει υπηρεσίες καθαρισμού επί πληρωμή για τον δημόσιο
  χώρο που καταλαμβάνει κάθε επιχείρηση αλλά και τον δημόσιο χώρο περιμετρικά
  αυτού. Για την επιχείρηση που επιλέγει να συμμετάσχει, το όφελος δεν είναι
  μόνο ένα καθαρό πεζοδρόμιο αλλά και η καλή σχέση με τους γείτονες μέσα από
  τη συμβολή στην καλή εικόνα της γειτονιάς.

proposal:
  body: |
    Ο δήμος να μπορεί να προσφέρει υπηρεσίες καθαρισμού επί πληρωμή για τον δημόσιο χώρο που καταλαμβάνει κάθε επιχείρηση αλλά και τον δημόσιο χώρο περιμετρικά αυτού. Για την επιχείρηση που επιλέγει να συμμετάσχει, το όφελος δεν είναι μόνο ένα καθαρό πεζοδρόμιο αλλά και η καλή σχέση με τους γείτονες μέσα από τη συμβολή στην καλή εικόνα της γειτονιάς.

contribution:
  body: |
    Η ελλιπής καθαριότητα της Αθήνας είναι ένα ζήτημα που επανέρχεται επίμονα στον δημόσιο διάλογο για την ποιότητα του δημόσιου χώρου της πόλης.

    ::: callout
    [Ανάμεσα σε 83 ευρωπαϊκές πόλεις](https://ec.europa.eu/regional_policy/sources/work/qol2020/quality_life_european_cities_en.pdf)^1, οι κάτοικοι της Αθήνας είναι οι 5οι λιγότερο ευχαριστημένοι με την καθαριότητα της πόλης του – χειρότερα από εμάς τα πηγαίνει μόνο η Μπρατισλάβα, η Σόφια, το Βελιγράδι και το Βουκουρέστι.
    :::

    Η πιο αυτονόητη απάντηση στο πρόβλημα είναι και η πιο δύσκολη από άποψη πόρων: χρειάζονται περισσότερα συνεργεία και μεγαλύτερη συχνότητα καθαρισμού. Αυτές οι παρεμβάσεις είναι αναγκαίες – αλλά εκτός του πεδίου του Plan A που δεν είναι να προτείνει την εντατικοποίηση των αντικαταστήσει τις βασικές δημοτικές υπηρεσίες αλλά να τις ενισχύσει με πιο καινοτόμες προσεγγίσεις.

    Ο δήμος θα μπορούσε, λοιπόν, να δημιουργήσει μια εξειδικευμένη, επί πληρωμή υπηρεσία καθαρισμού του δημόσιου χώρου που καταλαμβάνει κάθε επιχείρηση αλλά και υποχρεωτικά, μιας ζώνης περιμετρικά αυτού, με συνεργεία που θα προσλάβει επιπρόσθετα, αποκλειστικά για την υπηρεσία αυτή, χωρίς να επιβαρύνει τα τακτικά συνεργεία. Η υπηρεσία αυτή καλύπτει ένα κενό που υπάρχει στην αγορά: ενώ οι επιχειρήσεις έχουν πρόσβαση σε ιδιωτικά συνεργεία καθαρισμού εσωτερικών χώρων, ο εξωτερικός δημόσιος χώρος δεν είναι εύκολα διαχειρίσιμος από αυτά λόγω των ιδιαίτερων αναγκών του. Και το αποτέλεσμα ωφελεί και την ίδια την επιχείρηση, που αποκτά ένα πιο ελκυστικό περιβάλλον για τους πελάτες της, αλλά και τη γειτονιά στο σύνολό της. Παράλληλα, η επιχείρηση που επιλέγει το δημοτικό συνεργείο δεν κερδίζει μόνο ένα καθαρό πεζοδρόμιο – στέλνει και ένα μήνυμα ότι νοιάζεται για τη γειτονιά και κάνει πράγματα για να τη φροντίσει.

    Το μοντέλο αυτό εμπνέεται από μια καθιερωμένη πρακτική που έχει αποδώσει σε πολλές πόλεις του κόσμου: τα Business Improvement Districts (BIDs). Πρόκειται για ειδικές ζώνες στις οποίες οι επιχειρήσεις ψηφίζουν να χρηματοδοτήσουν από κοινού συμπληρωματικές υπηρεσίες πέρα από αυτές που παρέχει ο δήμος. Στην [Ανατολική Αγγλία](https://www.easternpowerhouse.uk/post/how-are-business-improvement-districts-working-in-the-east-of-england)^2, όπου εφαρμόζονται τέτοια μοντέλα, οι επιχειρήσεις αναλαμβάνουν υπηρεσίες όπως καθαρισμός πεζοδρομίων, απομάκρυνση γκράφιτι, φυτεύσεις στον δημόσιο χώρο, αναβάθμιση φωτισμού, “πρεσβευτές” των γειτονιών για να καθοδηγούν τους επισκέπτες, πολιτιστικά έργα στον δημόσιο χώρο κτλ. Και υπήρχαν και μετρήσιμα αποτελέσματα. Κατά μέσο όρο, τα καλά οργανωμένα BIDs αναφέρουν αύξηση επισκεψιμότητας 5-10% σε σχέση με γειτονικές περιοχές. Πολλά BIDs καταφέρνουν μείωση της εγκληματικότητας κατά 10-15% στα πρώτα τρία χρόνια λειτουργίας τους. Ενώ έρευνες δείχνουν σταθερά ότι το 70-80% των επιχειρήσεων που συνεισφέρουν θεωρούν ότι το BID αποδίδει αξία, επικαλούμενες καλύτερη επικοινωνία με τις αρχές και πιο ικανοποιητικές υπηρεσίες.

    Η πρόταση που περιγράφεται εδώ υιοθετεί τον πυρήνα αυτής της λογικής με έναν πιο ήπιο και προσαρμοσμένο στην ελληνική πραγματικότητα τρόπο: η συμμετοχή είναι προαιρετική, η διαχείριση και η απασχόληση παραμένουν στον Δήμο, και δεν απαιτείται η σύσταση κανενός νέου φορέα. Εφόσον το μοντέλο αποδώσει, μπορεί να αποτελέσει τη βάση για μια πιο φιλόδοξη εξέλιξη προς την κατεύθυνση των BIDs – με θεσμοθετημένη συμμετοχή επιχειρήσεων και διευρυμένο πεδίο δράσης.

limitations:
  - q: Πώς θα αποφευχθεί η σύγχυση με τις τακτικές δημοτικές υπηρεσίες καθαριότητας;
    a: |
      Είναι κρίσιμο να είναι σαφές – τόσο στις επιχειρήσεις όσο και στους κατοίκους – ότι η υπηρεσία αυτή είναι συμπληρωματική και όχι υποκατάστατο των τακτικών συνεργείων. Ο κίνδυνος είναι διπλός: αφενός να δημιουργηθεί η εντύπωση ότι ο Δήμος αποσύρεται από τις βασικές υποχρεώσεις του, αφετέρου να αντιμετωπιστεί η υπηρεσία ως «φόρος» για κάτι που θα έπρεπε να γίνεται ούτως ή άλλως. Η επικοινωνία της πρότασης πρέπει να τονίζει εξαρχής τον προαιρετικό και επιπρόσθετο χαρακτήρα της – και τα τακτικά συνεργεία να συνεχίσουν να λειτουργούν με την κανονική τους συχνότητα στις ίδιες περιοχές.
  - q: Πώς θα εξασφαλιστεί η συμμετοχή αρκετών επιχειρήσεων ώστε η υπηρεσία να είναι βιώσιμη;
    a: |
      Η βιωσιμότητα της υπηρεσίας εξαρτάται από κρίσιμη μάζα συμμετοχής, ειδικά σε επίπεδο γειτονιάς – ένα καθαρό πεζοδρόμιο ανά τετράγωνο δεν αλλάζει την εικόνα της περιοχής. Για τον λόγο αυτό, η εκκίνηση της υπηρεσίας σε πιλοτικό στάδιο σε συγκεκριμένες εμπορικές οδούς με υψηλή πυκνότητα επιχειρήσεων αυξάνει τις πιθανότητες επιτυχίας και επιτρέπει τη μέτρηση αποτελεσμάτων πριν από οποιαδήποτε επέκταση. Παράλληλα, η ορατότητα της υπηρεσίας – π.χ. μέσω σήμανσης που αναγνωρίζει τις συμμετέχουσες επιχειρήσεις – μπορεί να λειτουργήσει ως κίνητρο για τις υπόλοιπες.

benefits:
  - title: Ενίσχυση της εικόνας υπεύθυνων επιχειρήσεων
    body: |
      Η συμμετοχή στην υπηρεσία αποτελεί έκφραση εταιρικής υπευθυνότητας. Σε μια εποχή που οι καταναλωτές αξιολογούν όλο και περισσότερο τη συμπεριφορά των επιχειρήσεων απέναντι στο περιβάλλον τους, η επιλογή αυτή μπορεί να αποτελέσει ένα ουσιαστικό διαφοροποιητικό στοιχείο στη σωστή κατεύθυνση.
  - title: Καλλιέργεια κουλτούρας συλλογικής φροντίδας
    body: |
      Όταν οι επιχειρήσεις αρχίζουν να επενδύουν στον δημόσιο χώρο γύρω τους, αυτό δημιουργεί έναν άτυπο κανόνα της γειτονιάς που μπορεί να επηρεάσει και τη συμπεριφορά των κατοίκων.

next_steps:
  - category: pricing
    body: |
      Να σχεδιαστεί ένα μοντέλο τιμολόγησης που να λαμβάνει υπόψη δύο παραμέτρους: το μέτωπο της επιχείρησης στον δημόσιο χώρο και την περίμετρο που επιλέγει να καλυφθεί πέραν του άμεσου χώρου της. Το μοντέλο θα πρέπει να είναι διαβαθμισμένο με τρόπο που να κάνει ελκυστική την επιλογή μεγαλύτερης περιμέτρου, δηλαδή το κόστος ανά τετραγωνικό μέτρο να μειώνεται όσο μεγαλώνει η επιλεγμένη ζώνη.
  - category: legal
    body: |
      Nα διερευνηθούν μερικά βασικά ερωτήματα: υπάρχει νομική βάση για να χρεώνει ο Δήμος επιχειρήσεις για καθαρισμό δημόσιου χώρου, ο οποίος τεχνικά είναι ούτως ή άλλως δημόσιος; Πώς διαμορφώνεται η συμβατική σχέση μεταξύ Δήμου και επιχείρησης, και ποια είναι η ευθύνη του Δήμου αν η υπηρεσία δεν αποδοθεί όπως συμφωνήθηκε; Και πρακτικά, πώς οργανώνεται η παροχή, από ποια διεύθυνση, με ποια διαδικασία ανάθεσης εργασίας, με ποια έκδοση παραστατικών; Αν η απάντηση σε αυτά τα ερωτήματα αποδειχθεί πολύπλοκη ή χρονοβόρα, αξίζει να διερευνηθεί μια εναλλακτική: η κάλυψη αυτής της ανάγκης από μια impact-driven εταιρεία καθαρισμού, η οποία θα αναλάμβανε την παροχή της υπηρεσίας απευθείας στις επιχειρήσεις. Στην περίπτωση αυτή, το κίνητρο για την κάλυψη ευρύτερης περιμέτρου θα μπορούσε να ενσωματωθεί στο ίδιο το επιχειρηματικό μοντέλο – για παράδειγμα, με χαμηλότερο κόστος ανά τετραγωνικό για μεγαλύτερες ζώνες, ή με δυνατότητα κοινής συνδρομής γειτονικών επιχειρήσεων που μοιράζονται τον ίδιο χώρο.

