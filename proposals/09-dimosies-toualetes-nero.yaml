number: 9
slug: dimosies-toualetes-nero
theme: public-space
title: Cool δημόσιες τουαλέτες και σταθμοί πόσιμου νερού
one_line: >
  Πενήντα δημόσιες τουαλέτες και 200 σταθμοί πόσιμου νερού εγκαθίστανται σε
  ολόκληρο τον Δήμο, με μηδενικό κόστος μέσω μοντέλου εταιρικής παραχώρησης και
  διαχείρισης — με ιδιαίτερη αισθητική ταυτότητα και ανοιχτό αρχιτεκτονικό
  διαγωνισμό.

problem:
  body: |
    Η Αθήνα είναι μια πόλη που ζει πολύ έξω. Και παρόλα αυτά, ο δημόσιος χώρος
    αδυνατεί να εξυπηρετήσει δύο από τις πιο βασικές ανθρώπινες ανάγκες.

    Πρώτον, την πρόσβαση σε τουαλέτα. Αυτό αποτρέπει τους ανθρώπους από το να
    χρησιμοποιούν τον δημόσιο χώρο με άνεση. Οι ηλικιωμένοι αποφεύγουν τη
    μεγάλη βόλτα. Οι γονείς με μικρά παιδιά αναγκάζονται να καταφύγουν σε καφέ
    που δεν επισκέπτονται. Οι άστεγοι δεν έχουν καμία επιλογή.

    Δεύτερον, την πρόσβαση σε πόσιμο νερό. Ο Δήμος Αθηναίων διαθέτει ελάχιστους
    σταθμούς ελεύθερης πλήρωσης μπουκαλιών. Δεν θα πρέπει να μας προξενεί
    εντύπωση ότι η Ελλάδα κατατάσσεται στους υψηλότερους καταναλωτές
    εμφιαλωμένου νερού στην Ευρώπη καθώς οι Αθηναίοι αναγκάζονται να αγοράζουν
    εκατοντάδες χιλιάδες πλαστικά μπουκάλια κάθε χρόνο για ένα πόρο που ήδη
    πληρώνουν μέσω του δημοτικού λογαριασμού τους.

proposal:
  body: |
    Θα μπορούσαμε να εγκαταστήσουμε 50 δημόσιες τουαλέτες και 200 σταθμούς
    πόσιμου νερού σε ολόκληρο τον Δήμο, με μηδενικό κόστος για τον Δήμο μέσω
    μοντέλου εταιρικής παραχώρησης και διαχείρισης.

    Ο ανάδοχος θα υποχρεούται να διοργανώσει ανοιχτό αρχιτεκτονικό/design
    διαγωνισμό για το εξωτερικό περίβλημα των μονάδων, εμπλέκοντας φοιτητές
    ή/και νέους επαγγελματίες. Με αυτόν τον τρόπο, οι μονάδες θα αποκτούν
    ιδιαίτερη, ενδιαφέρουσα αισθητική ταυτότητα προκειμένου να γίνουν με τον
    καιρό, αναγνωρίσιμο κομμάτι της αστικής ταυτότητας. Ο ανάδοχος θα
    αναλαμβάνει επίσης τον καθημερινό καθαρισμό και τη συντήρηση όλων των
    μονάδων. Έτσι, διασφαλίζεται και η καλή λειτουργία των μονάδων καθώς π.χ.
    μια βρώμικη ή χαλασμένη τουαλέτα βλάπτει το brand του αναδόχου — ο
    ανάδοχος έχει ίδιο συμφέρον να κρατάει τις μονάδες άψογες.

implementation:
  body: |
    Η νομική βάση υπάρχει. Ο Δήμος προκηρύσσει διαγωνισμό σύμβασης παραχώρησης
    υπηρεσιών (Ν. 4413/2016): ο ανάδοχος αναλαμβάνει με δικά του κεφάλαια να
    εγκαταστήσει, λειτουργήσει και συντηρήσει τις μονάδες για τη διάρκεια της
    σύμβασης. Το αντάλλαγμά του δεν είναι χρήματα από τον Δήμο, αλλά το
    δικαίωμα εταιρικής παρουσίας: το λογότυπό του εμφανίζεται σε σταθερό,
    διακριτικό σημείο κάθε μονάδας. Αυτή η παρουσία δεν εμπίπτει αυτόματα στο
    πλαίσιο της υπαίθριας διαφήμισης (Ν. 2946/2001) — για να είναι νόμιμη
    χρειάζεται είτε να χαρακτηριστεί ως «επιγραφή» (αναγνωριστική ένδειξη
    εκείνου που παρέχει το έργο), είτε, ασφαλέστερα, η απόφαση Δημοτικού
    Συμβουλίου που εγκρίνει τη σύμβαση να ορίζει ρητά τις μονάδες ως χώρους
    επιτρεπόμενης εταιρικής παρουσίας και να καθορίζει τις προδιαγραφές
    (μέγεθος, θέση, τύπος). Αυτό είναι τυπική πρακτική και δεν αποτελεί
    εμπόδιο — απαιτεί απλώς να προβλεφθεί ρητά στα τεύχη του διαγωνισμού. Η
    χρήση διατηρείται δωρεάν για τον πολίτη — αυτό κατοχυρώνεται ως
    αναλλοίωτος όρος της σύμβασης. Επίσης υποχρεωτική ρήτρα: ο ανάδοχος
    διοργανώνει σχεδιαστικό διαγωνισμό για το εξωτερικό περίβλημα σε
    συνεργασία με ΑΕΙ (ΕΜΠ, ΑΣΚΤ) ή άλλους φορείς που θα εξειδικευτούν εντός 6
    μηνών από την υπογραφή.

limitations:
  - q: "Βανδαλισμός: Υποδομές στον δημόσιο χώρο είναι ευάλωτες σε παραβατικές συμπεριφορές."
    a: >
      Το μοντέλο παραχώρησης δίνει στον ανάδοχο ισχυρό κίνητρο συντήρησης: μια
      αλλοιωμένη τουαλέτα μειώνει την αξία της διαφήμισής του. Παράλληλα, η
      σύμβαση με τον Δήμο μπορεί να περιλαμβάνει ρήτρα ταχείας επισκευής.

  - q: "Αισθητική ένταξη: Ορισμένες μονάδες μπορεί να θεωρηθεί ότι θα υποβαθμίσουν οπτικά κάποιες περιοχές."
    a: >
      Η εναρμόνιση με την αισθητική ταυτότητα της γειτονιάς μπορεί να είναι
      κομμάτι του σχεδιαστικού διαγωνισμού.

  - q: "Κατάληψη δημόσιου χώρου: Κάθε μονάδα καταλαμβάνει χώρο — σε ήδη στενά πεζοδρόμια ήδη, αυτό μπορεί να δημιουργεί προβλήματα στους περαστικούς."
    a: >
      Η προτεραιότητα χωροθέτησης μπορεί να είναι σε πλατείες, πάρκα και
      πλατύτερα πεζοδρόμια.


