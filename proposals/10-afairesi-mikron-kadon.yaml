number: 10
slug: afairesi-mikron-kadon
theme: public-space
title: Αφαίρεση μικρών κάδων από τουριστικές περιοχές
one_line: >
  Η Αθήνα δέχεται εκατομμύρια τουρίστες που επιβαρύνουν τις υποδομές της χωρίς
  να συμβάλλουν στη συντήρησή τους. Ένα χαρακτηριστικό παράδειγμα είναι οι
  μικροί κάδοι σκουπιδιών στις περιοχές που είναι δημοφιλείς με τους
  επισκέπτες: υπερχειλίζουν τόσο γρήγορα που τα συνεργεία του δήμου δεν
  προλαβαίνουν να καθαρίσουν, ενώ η εικόνα παραμέλησης που δημιουργείται κάνει
  τον επόμενο να πετάξει το σκουπίδι του με πολύ μεγαλύτερη ευκολία. Αυτοί οι
  κάδοι εξυπηρετούν κυρίως επισκέπτες, όχι κατοίκους, και η αφαίρεσή τους
  βελτιώνει την καθαριότητα της πόλης, υποχρεώνοντας τον καθένα να κρατήσει το
  σκουπίδι του και να το πετάξει σε σημείο με λιγότερη πίεση στις υποδομές.

proposal:
  body: |
    Η Αθήνα δέχεται εκατομμύρια τουρίστες που επιβαρύνουν τις υποδομές της χωρίς να συμβάλλουν στη συντήρησή τους. Ένα χαρακτηριστικό παράδειγμα είναι οι μικροί κάδοι σκουπιδιών στις περιοχές που είναι δημοφιλείς με τους επισκέπτες: υπερχειλίζουν τόσο γρήγορα που τα συνεργεία του δήμου δεν προλαβαίνουν να καθαρίσουν, ενώ η εικόνα παραμέλησης που δημιουργείται κάνει τον επόμενο να πετάξει το σκουπίδι του με πολύ μεγαλύτερη ευκολία. Αυτοί οι κάδοι εξυπηρετούν κυρίως επισκέπτες, όχι κατοίκους, και η αφαίρεσή τους βελτιώνει την καθαριότητα της πόλης, υποχρεώνοντας τον καθένα να κρατήσει το σκουπίδι του και να το πετάξει σε σημείο με λιγότερη πίεση στις υποδομές.

contribution:
  body: |
    Η Αθήνα βρίσκεται σε τροχιά σημαντικής τουριστικής ανάπτυξης.

    ::: callout
    Η Αθήνα υποδέχθηκε σχεδόν [8 εκατομμύρια ξένους επισκέπτες](https://www.tovima.com/travel/athens-sets-tourism-record-with-nearly-8-million-visitors-in-2024/)^1 το 2024 – ρεκόρ που αντιπροσωπεύει αύξηση 12% σε σχέση με το 2023 και 24% σε σχέση με τα προ-πανδημίας επίπεδα, το 2019. Και ένας αριθμός πάνω από διπλάσιος των κατοίκων της πόλης.
    :::

    Οι τουριστικές ροές δεν κατανέμονται ομοιόμορφα στον αστικό ιστό.

    ::: callout
    [Πρόσφατη μελέτη του Δήμου Αθηναίων](https://www.cityofathens.gr/deltio-typoy/dimos-athinaion-ta-apotelesmata-tis-me/)^2 διαπιστώνει χωρικές υπερ-συγκεντρώσεις τουριστών σε συγκεκριμένες κορεσμένες γειτονιές του κέντρου της πόλης (Εμπορικό κέντρο, Μοναστηράκι – Πλάκα, Ψυρρή – Κουμουνδούρου, Μακρυγιάννη).
    :::

    Κρίσιμο χαρακτηριστικό που διαφοροποιεί την Αθήνα από νησιωτικούς προορισμούς είναι η ισοκατανομή των τουριστών καθ' όλη τη διάρκεια του έτους. Αυτή η χρονική διασπορά σημαίνει ότι η πίεση στις υποδομές είναι συνεχής. Στις ζώνες υπερ-συγκέντρωσης, παρατηρείται ιδιαίτερα αυξημένη πίεση. Ιδιαίτερα σοβαρή είναι η επίπτωση στη διαχείριση απορριμμάτων

    ::: callout
    Από το 2021 έως το 2023 παρατηρήθηκε [αύξηση του συνολικού όγκου απορριμμάτω](https://www.cityofathens.gr/deltio-typoy/dimos-athinaion-ta-apotelesmata-tis-me/)^2ν την τουριστική και μη τουριστική περίοδο, σε ποσοστά 2,6% και 6,3% αντίστοιχα. Τη μεγαλύτερη πίεση από τον τουρισμό υφίστανται η 1η, 2η και 3η δημοτική κοινότητα, ενώ στην 1η δημοτική κοινότητα περισσότερο από το 50% της συνολικής παραγωγής απορριμμάτων προέρχεται διαχρονικά από τους επισκέπτες.
    :::

    Κι αυτό σε μια πόλη όπου όπως είδαμε και σε [προηγούμενη πρόταση](/9-dimos-katharizei-epicheirisi-plironei), η ελλιπής καθαριότητα επανέρχεται επίμονα στον δημόσιο διάλογο για την ποιότητα του δημόσιου χώρου της πόλης.

    ::: callout
    [Ανάμεσα σε 83 ευρωπαϊκές πόλεις](https://ec.europa.eu/regional_policy/sources/work/qol2020/quality_life_european_cities_en.pdf)^3, οι κάτοικοι της Αθήνας είναι οι 5οι λιγότερο ευχαριστημένοι με την καθαριότητα της πόλης του – χειρότερα από εμάς τα πηγαίνει μόνο η Μπρατισλάβα, η Σόφια, το Βελιγράδι και το Βουκουρέστι.
    :::

    Η αυξημένη παραγωγή απορριμμάτων στις τουριστικές γειτονιές δεν αφορά μόνο τους μεγάλους κάδους οικιακής συλλογής. Αφορά εξίσου τους μικρούς κάδους δρόμου που βρίσκονται στις διαδρομές των περιπατητών.

    Αυτοί οι κάδοι έχουν προβλεφθεί για έναν «κανονικό» ρυθμό πόλης. Όταν η περιοχή δέχεται πάρα πολλούς επισκέπτες την ημέρα, οι οποίοι μάλιστα παράγουν και περισσότερα απορρίμματα – [ο μέσος τουρίστας παράγει διπλάσια απορρίμματα σε σχέση με έναν μόνο κάτοικο](https://zerowasteeurope.eu/2022/09/working-towards-zero-waste-in-touristic-destinations/)^4 – οι κάδοι γεμίζουν πολύ γρήγορα, με αποτέλεσμα τα συνεργεία καθαριότητας να μην έχουν τη δυνατότητα να ανταποκρίνονται.

    Και το πρόβλημα που δημιουργείται ως προς την καθαριότητα του δημόσιου χώρου είναι διττό. Από τη μια πλευρά, η πόλη αρχίζει και φαίνεται πιο βρώμικη καθώς οι κάδοι υπερχειλίζουν. Από την άλλη πλευρά, όταν οι άνθρωποι αντιλαμβάνονται ορατές ενδείξεις παραμέλησης στο περιβάλλον τους, συμπεραίνουν ότι μια λιγότερο προσεκτική συμπεριφορα είναι ανεκτή και άρα, ο περαστικός που θα δει έναν ξεχειλισμένο κάδο πιο εύκολα μπορεί να πετάξει το σκουπίδι του κάτω λίγα μέτρα παρακάτω. Αυτό συνάδει με τη θεωρία των «σπασμένων παραθύρων»: ότι ορατές ενδείξεις αταξίας σε μια πόλη – όπως σκουπίδια ή γκράφιτι – νομιμοποιούν μη αποδεκτές συμπεριφοράς: όταν οι άνθρωποι αντιλαμβάνονται παραβάσεις κανόνων στο περιβάλλον τους, συμπεραίνουν ότι η παράβαση είναι αποδεκτή και τείνουν να παραβαίνουν και οι ίδιοι.

    Μία – ίσως αναπάντεχη αλλά – αποτελεσματική λύσει σε αυτό το πρόβλημα είναι η αφαίρεση των μικρών κάδων δρόμου από τις ζώνες υπερ-συγκέντρωσης τουριστών. Η λογική είναι ότι αν αφαιρεθεί ένας κάδος που υπερχειλίζει και γίνεται σημείο έλξης σκουπιδιών, αφαιρείται και το «σήμα αταξίας» που αυτός εκπέμπει. Ο επισκέπτης που δεν βρίσκει κάδο κρατά το απόρριμμά του και η πόλη παραμένει καθαρή. Η λογική είναι ότι  σκουπίδι που κρατά κανείς στο χέρι ή βάζει στην τσάντα δεν καταλήγει στο έδαφος – καταλήγει στον επόμενο κάδο. Αυτό που καταλήγει στο έδαφος είναι το σκουπίδι που πετιέται επειδή ο κάδος μπροστά σου είναι ήδη γεμάτος και «όλοι το κάνουν».

    Πρόκειται για προσέγγιση που έχει ήδη δοκιμαστεί σε άλλες πόλεις. Παραδοσιακά, αυτή η πρακτική είναι συνδεδεμένη με την Ιαπωνία που κατατάσσεται σταθερά στην κορυφή των παγκόσμιων δεικτών καθαριότητας, και αυτό συμβαίνει παρά τον (ή ίσως χάρη στον;) ελάχιστο αριθμό δημόσιων κάδων. Ωστόσο, οι πολιτιστικές διαφορές μεταξύ Ελλάδας και Ιαπωνίας γύρω από θέματα καθαριότητας είναι αρκετά μεγάλες οπότε η σύγκριση δεν είναι ιδιαίτερα βοηθητική. Αναμένουμε τα αποτελέσματα εφαρμογή από το [Άμστερνταμ](https://www.inkl.com/news/amsterdam-s-answer-to-its-rubbish-crisis-remove-some-of-the-litter-bins)^5, όπου μείωσαν σημαντικά τον αριθμό των κάδων τον Σεπτέμβριο του 2025 και ήδη παρατηρούνται ενθαρρυντικά σημάδια.

limitations:
  - q: Τι γίνεται με τους κατοίκους της περιοχής; Δεν πλήττονται κι αυτοί από την αφαίρεση κάδων από τη γειτονιά τους;
    a: |
      Σίγουρα επηρεάζονται αλλά υπάρχουν τρεις παράγοντες που αιτιολογούν αυτήν την αλλαγή στην καθημερινότητα. Πρώτον, οι μικροί κάδοι «δρόμου» που αφαιρούνται εξυπηρετούν κατά κύριο λόγο τον περαστικό τουρίστα, ο οποίος ρυπαίνει και περισσότερο, ενώ ο μόνιμος κάτοικος συνεχίζει να εξυπηρετείται για τα οικιακά του απορρίμματα στον κάδο της γειτονιάς του. Δεύτερον, η λογική είναι ότι ο κάτοικος κερδίζει κάτι: η γειτονιά του είναι λιγότερο βρώμικη, επειδή έχει αφαιρεθεί το σημείο που λειτουργούσε ως «μαγνήτης» σκουπιδιών. Επίσης, λιγότεροι κάδοι σημαίνουν λιγότερος φόρτος για το προσωπικό του δήμου και άρα περισσότερος χρόνος να επενδυθεί σε υπηρεσίες που αφορούν τους ίδιους τους κατοίκους.
  - q: Τι ακριβώς λες στον τουρίστα που ψάχνει κάδο και που μπορεί να μην έχει ενημερωθεί σχετικά; Αν δεν επικοινωνηθεί σωστά, η παρέμβαση μπορεί να γίνει αντιληπτή ως αδιαφορία.
    a: |
      Ο Δήμος Αθηναίων έχει ήδη εγκαταστήσει «έξυπνους» ψηφιακούς κάδους με αισθητήρες πληρότητας σε αρκετά σημεία του κέντρου. Αυτοί οι κάδοι έχουν γνωστές, σταθερές τοποθεσίες που μπορούν να καταχωριστούν ως κατηγορία στο Google Maps, ακριβώς όπως εμφανίζονται τουαλέτες, σταθμοί φόρτισης οχημάτων ή ΑΤΜ. Ο επισκέπτης που ψάχνει κάδο μπορεί να κάνει αυτό που κάνει για οτιδήποτε άλλο σε μια ξένη πόλη: ανοίγει το χάρτη του. Αν η πληροφορία είναι εκεί, το πρόβλημα λύνεται χωρίς καμία επαφή με φυσική σήμανση. Η απουσία κάδου έτσι δεν ερμηνεύεται ως αδιαφορία αλλά ως πολιτική επιλογή που η πόλη επεξηγεί και υποστηρίζει ψηφιακά.

benefits:
  - title: Πιο υπεύθυνα καταστήματα εστίασης
    body: |
      Σήμερα ο μικρός κάδος του Δήμου λειτουργεί ουσιαστικά ως επιδότηση στις επιχειρήσεις take-away της περιοχής: το κατάστημα πουλάει τον καφέ, εισπράττει την αξία του, και το κόστος αποκομιδής της συσκευασίας – μαζί με όλες τις εξωτερικότητες όταν ο κάδος υπερχειλίζει – μετακυλίεται στον Δήμο, δηλαδή στον κάτοικο. Η αφαίρεση των κάδων διορθώνει αυτή τη στρέβλωση. Οι επιχειρήσεις που παράγουν τη συσκευασιακή ροή καλούνται να αναλάβουν το αντίστοιχο μερίδιο ευθύνης: να διατηρούν εμφανή κάδο στην είσοδό τους, προσβάσιμο και στον περαστικό, και να φροντίζουν οι ίδιες για την τακτική αποκομιδή των αποβλήτων που η δραστηριότητά τους γεννά.

next_steps:
  - category: mapping
    body: |
      Να οριστούν τα σημεία στα οποία κρίνεται χρήσιμο να αφαιρεθούν οι κάδοι. Χρήσιμη βάση μπορεί να αποτελέσει [η μελέτη του Δήμου Αθηναίων](https://www.cityofathens.gr/deltio-typoy/dimos-athinaion-ta-apotelesmata-tis-me/)^2 για τη φέρουσα ικανότητα και τον τουρισμό καθώς αποτυπώνει με χωρική ακρίβεια τις «κορεσμένες» και «υπερ-κορεσμένες» γειτονιές, χρησιμοποιώντας μετρήσιμους δείκτες όπως ποσοστό παραγωγής αποβλήτων από επισκέπτες, πυκνότητα τουριστικής κίνησης ανά τετραγωνικό μέτρο, αριθμό βραχυχρόνιων μισθώσεων και κατανάλωση πόρων.
  - category: digital
    body: |
      Να χαρτογραφηθούν και να αναρτηθούν ψηφιακά στο Google Maps οι κάδοι που μετά την αφαίρεση των μικρών κάδων, θα λειτουργούν ως τα κύρια σημεία απόρριψης σκουπιδιών για επισκέπτες.

