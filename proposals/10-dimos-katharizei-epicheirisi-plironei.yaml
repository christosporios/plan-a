title: Ο δήμος καθαρίζει, η επιχείρηση πληρώνει
one_line: >
  Ο δήμος μπορεί να προσφέρει υπηρεσίες καθαρισμού επί πληρωμή για τον δημόσιο
  χώρο που καταλαμβάνει κάθε επιχείρηση αλλά και τον δημόσιο χώρο περιμετρικά
  αυτού. Για την επιχείρηση που επιλέγει να συμμετάσχει, το όφελος δεν είναι
  μόνο ένα καθαρό πεζοδρόμιο αλλά και η καλή σχέση με τους γείτονες μέσα από
  τη συμβολή στην καλή εικόνα της γειτονιάς.
