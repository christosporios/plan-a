number: 10
slug: tautotita-ergotaxio
theme: public-space
title: "«Ταυτότητα» σε κάθε εργοτάξιο"
one_line: >
  Κάθε εργοτάξιο, δημόσιο ή ιδιωτικό, που είναι ορατό από τον δημόσιο χώρο
  φέρει τυποποιημένη ταυτότητα: τι κατασκευάζεται, ποιος το εκτελεί, πότε
  ολοκληρώνεται, πώς υποβάλλεται παράπονο.

problem:
  body: |
    Στην Αθήνα υπάρχει η αίσθηση ότι η πόλη είναι ένα απέραντο εργοτάξιο. Έργα
    σε δρόμους, πεζοδρόμια, κτίρια και άλλες υποδομές ξεκινούν χωρίς
    προειδοποίηση, καθιστούν κομμάτια της πόλης απροσπέλαστα χωρίς καμία
    αντιστάθμιση, υλοποιούνται για άγνωστα διαστήματα και κάποια στιγμή κλείνουν
    — πάλι χωρίς ειδοποίηση. Ο πολίτης δεν γνωρίζει τι κατασκευάζεται, ποιος το
    κάνει, πότε τελειώνει, ούτε πού να απευθυνθεί αν έχει ερώτηση ή παράπονο.

    Αυτή η αδιαφάνεια έχει συνέπειες πέρα από την καθημερινή ταλαιπωρία. Ένα
    εργοτάξιο χωρίς ταυτότητα δεν γίνεται αντιληπτό ως σημείο αλλαγής αλλά ως
    σημείο παρακμής. Ο πολίτης που δεν διαθέτει κανένα εργαλείο να κατανοήσει
    τι γίνεται γύρω του αποξενώνεται από την πόλη — και η αποξένωση αυτή
    μετατρέπεται σε διάχυτη δυσαρέσκεια απέναντι στο Δήμο, ακόμα και όταν τα
    έργα είναι αναγκαία και εκτελούνται σωστά.

proposal:
  body: |
    Κάθε εργοτάξιο, δημόσιο ή ιδιωτικό, το οποίο είναι ορατό από τον δημόσιο
    χώρο θα πρέπει να φέρει τυποποιημένη ταυτότητα με το τι κατασκευάζεται ή
    επισκευάζεται, ποιος το εκτελεί, πότε αναμένεται να ολοκληρωθεί, στοιχεία
    επικοινωνίας επαφής για ερωτήσεις και παράπονα.

    Η ημερομηνία ολοκλήρωσης είναι το κρισιμότερο στοιχείο. Δεν αρκεί να
    αναγράφεται μία φορά και να ξεχαστεί: κάθε παράταση πέρα από την
    αναγραφόμενη ημερομηνία υποχρεώνει τον εκτελεστή να ενημερώσει την πινακίδα
    εντός συγκεκριμένης προθεσμίας. Μια πινακίδα με ληγμένη ημερομηνία είναι
    χειρότερη από καμία: επιβεβαιώνει ακριβώς το αίσθημα που θέλουμε να
    αντιστρέψουμε.

    Για τα δημοτικά έργα ειδικά, η πληροφορία της πινακίδας θα μπορεί να
    αναπαράγεται και ψηφιακά: κάθε εργοτάξιο καταχωρείται σε δημόσιο χάρτη στη
    σελίδα του Δήμου, με ενημερωμένο χρονοδιάγραμμα και δυνατότητα υποβολής
    παραπόνου. Η πινακίδα φέρει QR code που οδηγεί απευθείας στην καταχώρηση
    του συγκεκριμένου έργου — ώστε ο πολίτης που στέκεται μπροστά στο εργοτάξιο
    να έχει πρόσβαση σε όλη την πληροφορία άμεσα.

    Για τα δημοτικά έργα ισχύει επιπλέον μία δεύτερη υποχρέωση: η ύπαρξη
    περίφραξης. Σήμερα η περίφραξη εργοταξίου είναι σπάνια ή ανύπαρκτη
    ενισχύοντας την αίσθηση αταξίας. Και όπου υπάρχει, είναι συνήθως ένας
    γκρίζος μεταλλικός τοίχος που δεν δίνει τίποτα πίσω στον δημόσιο χώρο. Η
    περίφραξη — και δη, η κάλυψη με οπτικό υλικό, φωτογραφικό ή εικαστικό, που
    αναφέρεται είτε στο ίδιο το έργο (η μελλοντική εικόνα του χώρου, τα σχέδια)
    είτε στη γειτονιά (ιστορικές φωτογραφίες, έργα καλλιτεχνών της κοινότητας),
    για έργα που δεσμεύουν δημόσιο χώρο πέρα από ένα συγκεκριμένο χρονικό όριο
    κάποιων ημερών — αποτελεί μια μικρή αποζημίωση για τον χώρο που προσωρινά
    χάνεται.

implementation:
  body: |
    Ο Δήμος έχει σαφή αρμοδιότητα στο αντικείμενο της πρότασης. Κάθε εργοτάξιο
    που επηρεάζει τον δημόσιο χώρο απαιτεί άδεια εκσκαφής ή οικοδομική άδεια
    που εκδίδεται ή θεωρείται από τον Δήμο. Αυτή η άδεια μπορεί να
    περιλαμβάνει ως ρητό όρο την υποχρέωση τοποθέτησης πινακίδας και
    περίφραξης — χωρίς νομοθετική αλλαγή, μόνο με τροποποίηση των όρων
    αδειοδότησης. Ισχύει τόσο για δημοτικά έργα όσο και για έργα τρίτων:
    ΔΕΔΔΗΕ, ΕΥΔΑΠ, ιδιώτες.

limitations:
  - q: "Επιφανειακότητα: αν τα έργα συνεχίσουν να καθυστερούν και να δημιουργούν ταλαιπωρία, μια πινακίδα και λίγη τέχνη στην περίφραξη μπορεί να φαίνονται ως καλλωπισμός του προβλήματος παρά ως λύση."
    a: >
      Η πρόταση δεν επιλύει το πρόβλημα των καθυστερήσεων — αυτό είναι
      διαφορετικό και βαθύτερο ζήτημα. Επιλύει το πρόβλημα της αδιαφάνειας και
      της αισθητικής υποβάθμισης που συνοδεύει κάθε έργο. Η διαφάνεια δεν
      εξαλείφει τη δυσαρέσκεια — αλλά την κάνει παραγωγική: ο πολίτης που
      γνωρίζει τι γίνεται, ποιος ευθύνεται και πότε έπρεπε να έχει τελειώσει
      μπορεί να διεκδικήσει, να καταγγείλει, να πιέσει. Η πληροφορία
      μετατρέπει την αόριστη αγανάκτηση που φέρνει παραίτηση σε συγκεκριμένο
      αίτημα.


