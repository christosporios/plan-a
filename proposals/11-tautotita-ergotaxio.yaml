# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΕΥΧΑΡΙΣΤΟΣ ΔΗΜΟΣΙΟΣ ΧΩΡΟΣ» ──────────────────────
contribution:
  body: |
    Στην Αθήνα υπάρχει η αίσθηση ότι η πόλη είναι ένα απέραντο εργοτάξιο. Έργα
    σε δρόμους, πεζοδρόμια, κτίρια και υποδομές ξεκινούν χωρίς προειδοποίηση,
    καθιστούν κομμάτια της πόλης απροσπέλαστα χωρίς καμία αντιστάθμιση,
    υλοποιούνται για άγνωστα διαστήματα και κάποια στιγμή κλείνουν — πάλι χωρίς
    ειδοποίηση. Ο πολίτης δεν γνωρίζει τι κατασκευάζεται, ποιος το κάνει, πότε
    τελειώνει, ούτε πού να απευθυνθεί αν έχει ερώτηση ή παράπονο.

    Αυτή η αδιαφάνεια έχει συνέπειες πέρα από την καθημερινή ταλαιπωρία. Ένα
    εργοτάξιο χωρίς ταυτότητα δεν γίνεται αντιληπτό ως σημείο αλλαγής αλλά ως
    σημείο παρακμής. Ο δημόσιος χώρος γίνεται ευχάριστος όχι μόνο όταν είναι
    όμορφος, αλλά και όταν είναι κατανοητός: όταν ο κάτοικος αναγνωρίζει τι
    συμβαίνει γύρω του και αισθάνεται ότι η πόλη του οφείλει μια εξήγηση. Μια
    ταυτότητα σε κάθε εργοτάξιο μετατρέπει το σημείο διατάραξης σε σημείο
    διαφάνειας — και μειώνει τη διάχυτη δυσαρέσκεια απέναντι στον δήμο, ακόμα και
    όταν τα έργα είναι αναγκαία και εκτελούνται σωστά.
  callouts:
    - |
      Η αρχή δεν είναι ξένη: σε άλλες χώρες η σήμανση του εργοταξίου είναι
      θεσμική υποχρέωση. Στο Ηνωμένο Βασίλειο, οι [κανονισμοί Construction
      (Design and Management) 2015](https://www.hse.gov.uk/construction/cdm/2015/index.htm)^1
      απαιτούν για τα έργα που υπερβαίνουν συγκεκριμένα όρια μια πινακίδα
      ειδοποίησης (έντυπο F10) με το όνομα και τα στοιχεία επικοινωνίας του
      υπεύθυνου εργολάβου, αναρτημένη ώστε να είναι ορατή.
  body_after: |
    Ο δήμος έχει σαφή αρμοδιότητα και έτοιμα εργαλεία. Κάθε εργοτάξιο που
    επηρεάζει τον δημόσιο χώρο απαιτεί άδεια τομής/εκσκαφής ή οικοδομική άδεια
    που εκδίδεται ή θεωρείται από τον δήμο· η άδεια μπορεί να περιλαμβάνει ως
    ρητό όρο την υποχρέωση τοποθέτησης πινακίδας και περίφραξης — χωρίς
    νομοθετική αλλαγή, μόνο με τροποποίηση των όρων αδειοδότησης. Ισχύει τόσο για
    δημοτικά έργα όσο και για έργα τρίτων: ΔΕΔΔΗΕ, ΕΥΔΑΠ, ιδιώτες.

    Η ψηφιακή υποδομή υπάρχει ήδη. Ο Δήμος Αθηναίων λειτουργεί το [Πληροφοριακό
    Σύστημα Αδειών Τομής ή Εκσκαφής Κοινόχρηστων
    Χώρων](https://tomes.cityofathens.gr/map)^2, έναν δημόσιο διαδραστικό χάρτη
    όπου καταγράφονται οι άδειες και η πορεία των εργασιών και όπου ο πολίτης
    μπορεί ήδη να υποβάλει καταγγελία για κακοτεχνίες. Η πινακίδα κάθε δημοτικού
    έργου μπορεί να φέρει QR code που οδηγεί απευθείας στην καταχώρηση του
    συγκεκριμένου έργου — ώστε ο πολίτης που στέκεται μπροστά στο εργοτάξιο να
    έχει πρόσβαση σε όλη την πληροφορία άμεσα, αξιοποιώντας μια πλατφόρμα που ήδη
    υπάρχει.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Αν τα έργα συνεχίσουν να καθυστερούν και να δημιουργούν ταλαιπωρία, μια πινακίδα και λίγη τέχνη στην περίφραξη δεν είναι απλώς καλλωπισμός του προβλήματος;"
    a: >
      Η πρόταση δεν επιλύει το πρόβλημα των καθυστερήσεων — αυτό είναι
      διαφορετικό και βαθύτερο ζήτημα. Επιλύει το πρόβλημα της αδιαφάνειας και
      της αισθητικής υποβάθμισης που συνοδεύει κάθε έργο. Η διαφάνεια δεν
      εξαλείφει τη δυσαρέσκεια — αλλά την κάνει παραγωγική: ο πολίτης που γνωρίζει
      τι γίνεται, ποιος ευθύνεται και πότε έπρεπε να έχει τελειώσει μπορεί να
      διεκδικήσει, να καταγγείλει, να πιέσει. Η πληροφορία μετατρέπει την αόριστη
      αγανάκτηση που φέρνει παραίτηση σε συγκεκριμένο αίτημα.

  - q: "Δεν είναι περιττό άλλο ένα ψηφιακό σύστημα που δεν θα κοιτάξει κανείς;"
    a: >
      Δεν προτείνεται νέο σύστημα: το [μητρώο αδειών τομής και
      εκσκαφής](https://tomes.cityofathens.gr/map)^2 του Δήμου Αθηναίων υπάρχει
      ήδη και δέχεται καταγγελίες πολιτών. Η πρόταση απλώς το κάνει ορατό στον
      δρόμο μέσω της πινακίδας και του QR code. Άλλωστε, η ανησυχία ότι «τα
      ανοιχτά δεδομένα δεν τα κοιτάει κανείς» απορρίπτεται από τους ίδιους τους
      συμμετέχοντες στη διαβούλευση: μόλις το 9% συμφωνεί με αυτή τη θέση. Το
      ζητούμενο δεν είναι ένας πίνακας δεδομένων για ειδικούς, αλλά μια
      κατανοητή πληροφορία ακριβώς εκεί που ο πολίτης τη χρειάζεται — μπροστά στο
      ίδιο το εργοτάξιο.

  - q: "Δεν επιβαρύνει υπερβολικά τους ιδιώτες και τις εταιρείες κοινής ωφέλειας;"
    a: >
      Η υποχρέωση της πινακίδας είναι ελάχιστου κόστους και επιβάλλεται ήδη σε
      άλλες χώρες ως αυτονόητο μέρος της αδειοδότησης, όπως στους [κανονισμούς CDM
      2015](https://www.hse.gov.uk/construction/cdm/2015/index.htm)^1 του Ηνωμένου
      Βασιλείου. Η βαρύτερη υποχρέωση — η καλλιτεχνική περίφραξη — προτείνεται
      μόνο για τα δημοτικά έργα, ώστε ο δήμος να δώσει πρώτος το παράδειγμα και να
      μην μετακυλίσει δυσανάλογο κόστος σε τρίτους.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Λογοδοσία και ιχνηλασιμότητα της ευθύνης
    body: >
      Όταν κάθε εργοτάξιο φέρει όνομα εκτελεστή και ημερομηνία ολοκλήρωσης,
      παύει να είναι ανώνυμο. Η ευθύνη για μια καθυστέρηση ή μια κακοτεχνία
      αποκτά διεύθυνση. Αυτό λειτουργεί προληπτικά: ο εκτελεστής που ξέρει ότι το
      όνομά του είναι ορατό στον δρόμο έχει κίνητρο να τηρήσει το χρονοδιάγραμμα
      και τις προδιαγραφές.

  - title: Ομορφότερος δημόσιος χώρος κατά τη διάρκεια του έργου
    body: |
      Η καλλιτεχνική περίφραξη μετατρέπει τον πιο άσχημο χρόνο ενός χώρου —
      αυτόν της κατασκευής — σε ευκαιρία προβολής τέχνης και ιστορίας της
      γειτονιάς.
    callouts:
      - |
        Το Σίδνεϊ έκανε από το 2016 [υποχρεωτική την κάλυψη των εργοταξιακών
        περιφράξεων σε δημόσιο χώρο με καλλιτεχνικό
        υλικό](https://worldcitiescultureforum.com/city-project/sydney-creative-hoardings/)^3.
        Έως το 2025, πάνω από 320 εργοτάξια έχουν φιλοξενήσει έργα 30 σύγχρονων
        καλλιτεχνών· το πρόγραμμα ανέφερε επίσης μειωμένα γκράφιτι στις
        περιφράξεις που είχαν καλυφθεί.

        Πηγή: World Cities Culture Forum, Sydney Creative Hoardings

  - title: Λιγότερη βανδαλισμένη και εγκαταλελειμμένη εικόνα
    body: >
      Μια περιφραγμένη, καλυμμένη με εικαστικό υλικό επιφάνεια αποθαρρύνει το
      παράνομο αφισοκόλλημα και τα γκράφιτι, και σηματοδοτεί ότι ο χώρος είναι
      υπό φροντίδα — όχι εγκαταλελειμμένος. Η εικόνα της τάξης τροφοδοτεί την
      αίσθηση ασφάλειας και φροντίδας στη γειτονιά.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Τυποποίηση της πινακίδας και σύνδεση με το μητρώο
    body: >
      Να σχεδιαστεί ένα ενιαίο πρότυπο πινακίδας (τι, ποιος, πότε, επικοινωνία)
      και να οριστεί ως ρητός όρος στις άδειες τομής/εκσκαφής και στις
      οικοδομικές άδειες. Κάθε πινακίδα δημοτικού έργου να φέρει QR code που
      παραπέμπει στην καταχώρηση του έργου στο υπάρχον [σύστημα αδειών τομής και
      εκσκαφής](https://tomes.cityofathens.gr/map)^2, με ορισμό προθεσμίας
      ενημέρωσης σε κάθε παράταση.

  - title: Πρόγραμμα καλλιτεχνικής περίφραξης δημοτικών έργων
    body: >
      Να θεσπιστεί όριο διάρκειας/χωρικής δέσμευσης πάνω από το οποίο η περίφραξη
      δημοτικού έργου καλύπτεται υποχρεωτικά με εικαστικό ή φωτογραφικό υλικό. Να
      εξεταστεί, κατά το πρότυπο του Σίδνεϊ, η δημιουργία ενός αποθέματος έργων
      από καλλιτέχνες της πόλης που διατίθενται στους εκτελεστές, ώστε να
      διασφαλίζεται ποιότητα και να στηρίζεται η τοπική καλλιτεχνική κοινότητα.

