number: 11
slug: tautotita-ergotaxio
theme: public-space
title: Ταυτότητα σε κάθε εργοτάξιο
one_line: >
  Κάθε εργοτάξιο ορατό από τον δημόσιο χώρο να φέρει τυποποιημένη ταυτότητα: τι
  γίνεται, ποιος το εκτελεί, πότε τελειώνει και πού απευθύνεσαι — και τα δημοτικά
  έργα να περιφράσσονται με όμορφο οπτικό υλικό.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Στην Αθήνα, υπάρχει η αίσθηση ότι η πόλη είναι ένα απέραντο εργοτάξιο. Ο
    πολίτης που δεν διαθέτει κανένα εργαλείο να κατανοήσει τι γίνεται γύρω του
    αποξενώνεται από την πόλη – και η αποξένωση αυτή μετατρέπεται σε διάχυτη
    δυσαρέσκεια απέναντι στον δήμο, ακόμα και όταν τα έργα είναι αναγκαία και
    εκτελούνται σωστά. Προκειμένου να αρθεί αυτή η αίσθηση, προτείνεται κάθε
    εργοτάξιο, δημόσιο ή ιδιωτικό, το οποίο είναι ορατό από τον δημόσιο χώρο να
    πρέπει να φέρει τυποποιημένη ταυτότητα με το τι κατασκευάζεται ή
    επισκευάζεται, ποιος το εκτελεί, πότε αναμένεται να ολοκληρωθεί καθώς και
    στοιχεία επικοινωνίας επαφής για ερωτήσεις και παράπονα. Για τα δημοτικά έργα
    να υπάρχει και επιπλέον υποχρέωση για ύπαρξη περίφραξης με όμορφο οπτικό
    υλικό, ως μια συμβολική αποζημίωση για τον χώρο που προσωρινά χάνεται.

