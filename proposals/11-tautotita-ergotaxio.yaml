number: 11
slug: tautotita-ergotaxio
theme: public-space
title: Ταυτότητα σε κάθε εργοτάξιο
one_line: >
  Κάθε εργοτάξιο ορατό από τον δημόσιο χώρο να φέρει τυποποιημένη ταυτότητα: τι
  γίνεται, ποιος το εκτελεί, πότε τελειώνει και πού απευθύνεσαι — και τα δημοτικά
  έργα να περιφράσσονται με όμορφο οπτικό υλικό.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Κάθε εργοτάξιο, δημόσιο ή ιδιωτικό, που είναι ορατό από τον δημόσιο χώρο να
    φέρει τυποποιημένη ταυτότητα: τι κατασκευάζεται ή επισκευάζεται, ποιος το
    εκτελεί, πότε αναμένεται να ολοκληρωθεί και στοιχεία επικοινωνίας για
    ερωτήσεις και παράπονα.

    Η ημερομηνία ολοκλήρωσης είναι το κρισιμότερο στοιχείο. Δεν αρκεί να
    αναγραφεί μία φορά και να ξεχαστεί: κάθε παράταση πέρα από την αναγραφόμενη
    ημερομηνία υποχρεώνει τον εκτελεστή να ενημερώσει την πινακίδα εντός
    συγκεκριμένης προθεσμίας. Μια πινακίδα με ληγμένη ημερομηνία είναι χειρότερη
    από καμία: επιβεβαιώνει ακριβώς το αίσθημα που θέλουμε να αντιστρέψουμε.

    Για τα δημοτικά έργα ισχύει επιπλέον μία δεύτερη υποχρέωση: η περίφραξη με
    όμορφο οπτικό υλικό — φωτογραφικό ή εικαστικό — που αναφέρεται είτε στο ίδιο
    το έργο (η μελλοντική εικόνα του χώρου, τα σχέδια) είτε στη γειτονιά
    (ιστορικές φωτογραφίες, έργα καλλιτεχνών της κοινότητας). Σήμερα η περίφραξη
    εργοταξίου είναι σπάνια ή, όπου υπάρχει, ένας γκρίζος μεταλλικός τοίχος που
    δεν δίνει τίποτα πίσω στον δημόσιο χώρο. Η καλυμμένη περίφραξη είναι μια
    μικρή, συμβολική αποζημίωση για τον χώρο που προσωρινά χάνεται.

