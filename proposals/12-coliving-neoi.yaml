# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΠΡΟΣΙΤΗ ΚΑΤΟΙΚΙΑ & ΠΟΙΟΤΙΚΑ ΚΤΙΡΙΑ» ─────────────
contribution:
  body: |
    Τα στεγαστικά έξοδα αντιπροσωπεύουν περίπου το 36% του διαθέσιμου εισοδήματος
    των ελληνικών νοικοκυριών. Στην ΕΕ, οι πολίτες δίνουν κατά μέσο όρο το 1/5
    του διαθέσιμου εισοδήματός τους για τα στεγαστικά έξοδα. Αλλά οι Έλληνες
    πάνω από το 1/3. Η Ελλάδα έχει μακράν το υψηλότερο ποσοστό πολιτών που
    επιβαρύνονται δυσανάλογα από το στεγαστικό κόστος (29%). Δηλαδή, σχεδόν 1
    στα 3 νοικοκυριά. Ο αντίστοιχος ευρωπαϊκός μέσος όρος εκτιμάται στο 10%.
    Δηλαδή, μόλις σχεδόν 1 στους 10.

    Η βιβλιογραφία τεκμηριώνει ότι η αβεβαιότητα για τα στεγαστικά έξοδα αυξάνει
    τον κίνδυνο εμφάνισης διαταραχής ψυχικής υγείας και διαταραχής ύπνου — με
    αυξημένα ποσοστά για τους ενοικιαστές, τους νέους και τα νοικοκυριά με
    παιδιά. Η υψηλή στεγαστική επιβάρυνση συνδέεται επίσης με αυξημένο κίνδυνο
    παχυσαρκίας και υπέρτασης.^1 Παράλληλα, η κρίση έχει δημογραφικές συνέπειες:
    η αύξηση των τιμών στέγης συσχετίζεται με μείωση των γεννήσεων και
    καθυστέρηση δημιουργίας οικογένειας.^2 Τέλος, έχει και οικονομικές
    επιπτώσεις: η δυσκολία στέγασης σε πόλεις υψηλής παραγωγικότητας περιορίζει
    την κινητικότητα των εργαζομένων, υπονομεύει την καινοτομία και μειώνει την
    πιθανότητα ανάληψης επιχειρηματικής δραστηριότητας.^3

    Μία από τις κύριες αιτίες της στεγαστικής κρίσης είναι η εκρηκτική αύξηση
    των μονομελών νοικοκυριών. Όσο περισσότεροι άνθρωποι ζουν μόνοι τους, τόσο
    αυξάνεται η ζήτηση για σπίτια του ενός υπνοδωματίου — ιδιαίτερα στις
    κεντρικές γειτονιές, όπου οι τιμές έχουν εκτοξευτεί. Αυτό στοιχειοθετείται
    από τα ίδια τα δημογραφικά δεδομένα: μεταξύ του 2011 και του 2021, παρόλο
    που ο συνολικός πληθυσμός μειώθηκε από 10,8 εκ. σε 10,48 εκ., ο αριθμός των
    νοικοκυριών αυξήθηκε κατά περίπου 200.000 χάρη στην αύξηση των μονομελών
    νοικοκυριών κατά περίπου 400.000.
  callouts:
    - |
      **Στεγαστική κρίση = αυξημένο ρίσκο για τη δημόσια υγεία**

      - ΗΠΑ: 1% αύξηση στο μέσο εισόδημα που δαπανάται για στεγαστικά έξοδα σε
        επίπεδο κομητείας = 37% αύξηση ρίσκου εμφάνισης παχυσαρκίας, με αυξημένα
        ποσοστά για τα παιδιά (Gu et al, 2023)
      - Χονγκ Κονγκ: Ουσιαστική αύξηση στην επιφάνεια του σπιτιού = 9,1% μείωση
        ρίσκου υπέρτασης (Sarcar et al, 2021)
      - Ηνωμένο Βασίλειο, 2009–2019: Αβεβαιότητα για τα στεγαστικά έξοδα = 2,5%
        αύξηση στον κίνδυνο εμφάνισης διαταραχής ψυχικής υγείας και 2% αύξηση
        στον κίνδυνο διαταραχής ύπνου, με αυξημένα ποσοστά για τους ενοικιαστές,
        τους νέους και τα νοικοκυριά με παιδιά (Mason et al, 2024)
    - |
      **Στεγαστική κρίση = πρόβλημα για τη δημογραφική δυναμική**

      - Αγγλία: 10% αύξηση στις τιμές των σπιτιών = μείωση στις γεννήσεις κατά
        1,3% εν γένει και κατά 4,9% για τους ενοικιαστές (Aksoy, 2016)
      - Βρετανία, 1996–2014: Αύξηση στεγαστικού κόστους = 157.000 λιγότερες
        γεννήσεις (Sabisky, 2018)
      - ΗΠΑ, 2010–2020: Αύξηση στεγαστικού κόστους = 7% μείωση του αριθμού των
        νέων οικογενειών (Couillard, 2025)
    - |
      **Στεγαστική κρίση = μείωση οικονομικής ανάπτυξης**

      - Λιγότεροι πόροι για αποταμίευση, κατανάλωση ή επενδύσεις σε άλλους
        τομείς (ΟΟΣΑ, 2020)
      - Πιο δύσκολη η κινητικότητα των εργαζομένων εκεί που πραγματικά
        χρειάζονται:
        - ΗΠΑ, 1964–2009: μειούμενο στεγαστικό απόθεμα σε πόλεις υψηλής
          παραγωγικότητας = 36% μείωση της συνολικής οικονομικής ανάπτυξης
          εξαιτίας της έλλειψης πρόσβασης από εργαζόμενους (Hsieh and Moretti,
          2019)
        - Ηνωμένο Βασίλειο, 1996–2016: 33% μείωση νέων 25–34 ετών που αλλάζουν
          δουλειά και σπίτι μέσα σε έναν χρόνο (Judge, 2019)
      - Υπονομεύεται η καινοτομία — π.χ. Κίνα: για κάθε 1% αύξηση στις τιμές των
        σπιτιών μιας περιοχής, μείωση της συμβολής αυτής της περιοχής στην
        καινοτομία κατά 0,25% (Li et al, 2023)
        - ΗΠΑ: 1% αύξηση στον λόγο τιμών σπιτιών προς μισθούς = 0,15% μείωση
          στην παραγωγικότητα σε περιφερειακό επίπεδο (NERA, 2024)
        - Αγγλία: Μικρή (κατά 1 standard deviation) αύξηση στον δείκτη
          επιβάρυνσης από στεγαστικό δάνειο = 10–12% μείωση της πιθανότητας
          ανάληψης επιχειρηματικής δραστηριότητας (Bracke et al, 2015)
  body_after: |
    Το co-living απαντά ακριβώς σε αυτή τη ζήτηση. Αντί κάθε μονομελές
    νοικοκυριό να ανταγωνίζεται για ένα ξεχωριστό μικρό διαμέρισμα στο κέντρο,
    μοιράζεται μια καλά εξοπλισμένη κατοικία διατηρώντας τον δικό του ιδιωτικό
    χώρο. Έτσι αποσυμπιέζεται η ζήτηση για τα ακριβότερα μικρά διαμερίσματα και
    προσφέρεται μια προσιτή και ποιοτική εναλλακτική σε μια κεντρική τοποθεσία.

    Στην περίπτωση δημοτικών χώρων, η υλοποίηση θα στηρίζεται στη δημοτική
    περιουσία — και, αν υπάρξει συνεργασία με άλλους δημόσιους φορείς, και στην
    ευρύτερη δημόσια περιουσία. Το απόθεμα αυτό δεν είναι αμελητέο: κτίρια που
    σήμερα υπολειτουργούν ή παραμένουν κλειστά θα μπορούσαν να αποκτήσουν νέα
    χρήση χωρίς να αλλάξει η κυριότητά τους. Ο Δήμος έχει αρμοδιότητα τόσο στη
    διαχείριση της δημοτικής περιουσίας όσο και στην προώθηση πολιτικών
    κοινωνικής συνοχής και στέγασης — και όσοι δυσκολεύονται να σταθούν στην
    αγορά κατοικίας εμπίπτουν σαφώς σε αυτή την κατηγορία. Παράλληλα, ο Δήμος
    μπορεί να ενθαρρύνει και ιδιωτικές πρωτοβουλίες co-living, διαμορφώνοντας ένα
    σαφές πλαίσιο για την ανάπτυξή τους.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Γιατί να μην μένω μόνος μου;"
    a: >
      Στην ελληνική αντίληψη, η συγκατοίκηση έχει συνειρμούς οικονομικής
      ανάγκης και όχι επιλογής — και το ζητούμενο για πολλούς είναι, κατά
      κανόνα, η ανεξάρτητη κατοικία, όχι η κοινή ζωή με αγνώστους. Το co-living
      είναι για πολλούς συνειδητή επιλογή και όχι αναγκαστική λύση — και αυτό
      δεν είναι αυθαίρετο: σε δεκάδες ευρωπαϊκές πόλεις, το co-living επιλέγεται
      από ανθρώπους που θα μπορούσαν να ανταπεξέλθουν σε ατομικό διαμέρισμα,
      επειδή προσφέρει την αίσθηση της κοινότητας, την ευελιξία, τις υποδομές
      και την κεντρική τοποθεσία που ένα τυπικό μικρό διαμέρισμα δεν μπορεί να
      προσφέρει.

  - q: "Γιατί co-living και όχι περισσότερα ατομικά διαμερίσματα;"
    a: >
      Η ραγδαία αύξηση των μονομελών νοικοκυριών σημαίνει ότι, αν επιδιώξουμε να
      δώσουμε σε καθένα ένα ξεχωριστό μικρό διαμέρισμα στο κέντρο, η ζήτηση θα
      παραμείνει ανικανοποίητη και οι τιμές θα συνεχίσουν να ανεβαίνουν. Το
      co-living καλύπτει την ίδια ανάγκη — ιδιωτικός χώρος σε κεντρική τοποθεσία
      — με πολύ μικρότερη επιφάνεια ανά άτομο και μοιρασμένο κόστος. Δεν
      υποκαθιστά την ατομική κατοικία για όσους τη θέλουν και μπορούν να την
      αποκτήσουν· προσθέτει μια ποιοτική, προσιτή επιλογή για τη μεγάλη ομάδα
      των μονοπρόσωπων νοικοκυριών που σήμερα πιέζει δυσανάλογα την αγορά. Οι
      νέοι 18–35 ετών είναι μια ομάδα όπου η ανάγκη είναι ιδιαίτερα οξεία —
      εισοδήματα στο χαμηλότερο σημείο της καριέρας τους, απουσία ιστορικού
      ενοικίασης, συχνά απουσία εγγυητή — αλλά δεν είναι η μόνη.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Αποσυμπίεση της αγοράς μικρών διαμερισμάτων
    body: >
      Κάθε μονομελές νοικοκυριό που επιλέγει co-living είναι ένα λιγότερο μικρό
      διαμέρισμα υπό διεκδίκηση στις κεντρικές γειτονιές. Έτσι μειώνεται η πίεση
      ακριβώς στο τμήμα της αγοράς όπου οι τιμές έχουν εκτοξευτεί, προς όφελος
      και όσων εξακολουθούν να αναζητούν αυτόνομη κατοικία.

  - title: Λιγότερη μοναξιά, καλύτερη δημόσια υγεία
    body: >
      Σε μια εποχή που η μοναξιά στις πόλεις αναγνωρίζεται ολοένα και
      περισσότερο ως ζήτημα δημόσιας υγείας, το co-living δίνει στους κατοίκους
      μια κοινότητα και κοινές δραστηριότητες. Δεδομένου ότι η ίδια η στεγαστική
      αβεβαιότητα συνδέεται με αυξημένο κίνδυνο διαταραχών ψυχικής υγείας και
      ύπνου,^1 το όφελος είναι διπλό.

  - title: Νέα χρήση για ανενεργό δημόσιο απόθεμα
    body: >
      Δημοτικά κτίρια που σήμερα υπολειτουργούν ή παραμένουν κλειστά μπορούν να
      αποκτήσουν νέα ζωή ως co-living χώροι, χωρίς να αλλάξει η κυριότητά τους
      και χωρίς να χρειαστεί απόκτηση νέων ακινήτων.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Αποτύπωση διαθέσιμου αποθέματος
    body: >
      Το πρώτο βήμα είναι η συστηματική αποτύπωση της δημοτικής (και, με
      συνεργασίες, της ευρύτερης δημόσιας) περιουσίας ως προς την καταλληλότητά
      της για κατοίκηση — χωρίς αυτήν δεν μπορεί να σχεδιαστεί τίποτα.

  - title: Μοντέλο διαχείρισης και πλαίσιο για ιδιωτικές πρωτοβουλίες
    body: >
      Η διαχείριση των δημοτικών κτιρίων μπορεί να γίνει μέσω δημοτικής
      επιχείρησης ή μέσω σύμπραξης με κοινωνικές επιχειρήσεις και μη
      κερδοσκοπικούς οργανισμούς με εμπειρία στη διαχείριση οικιστικών χώρων —
      χωρίς να μεταβιβαστεί η κυριότητα. Παράλληλα, να διαμορφωθεί ένα σαφές
      πλαίσιο που να ενθαρρύνει και ιδιωτικές πρωτοβουλίες co-living στο κέντρο.

