# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΠΡΟΣΙΤΗ ΚΑΤΟΙΚΙΑ & ΑΝΑΒΑΘΜΙΣΜΕΝΑ ΚΤΙΡΙΑ» ────────
contribution:
  body: |
    Τα στεγαστικά έξοδα αντιπροσωπεύουν περίπου [το 36% του διαθέσιμου εισοδήματος των ελληνικών νοικοκυριών](https://ec.europa.eu/eurostat/%20databrowser/view/ILC_%20MDED01/default/bar?lang=en)^1. Στην ΕΕ, οι πολίτες δίνουν κατά μέσο όρο το 1/5 του διαθέσιμου εισοδήματός τους για τα στεγαστικά έξοδα. Αλλά οι Έλληνες πάνω από το 1/3. Η Ελλάδα έχει επίσης μακράν το [υψηλότερο ποσοστό πολιτών που επιβαρύνονται δυσανάλογα από το στεγαστικό κόστος](https://ec.europa.eu/eurostat/%20databrowser/view/ILC_%20LVHO07D__custom_4842828/%20default/table?lang=en)^2 – σχεδόν 1 στα 3 νοικοκυριά. Ο αντίστοιχος ευρωπαϊκός μέσος όρος εκτιμάται στο 1 στους 10.

    Μία από τις κύριες αιτίες της στεγαστικής κρίσης είναι η πολύ αυξημένη ζήτηση για σπίτια του ενός υπνοδωματίου, ιδιαίτερα από τους νεότερους. Αυτό στοιχειοθετείται από τη ραγδαία [αύξηση των μονομελών νοικοκυριών:](https://www.statistics.gr/el/statistics/-/publication/SAM05/2021)^3 μεταξύ του 2011 και του 2021, παρόλο που ο συνολικός πληθυσμός αυξήθηκε από 10,8 εκ. σε 10,48 εκ., ο αριθμός των νοικοκυριών αυξήθηκε κατά περίπου 200.000 χάρη στην αύξηση των μονομελών νοικοκυριών κατά περίπου 400.000.

    Υποδομές co-living απαντούν ακριβώς σε αυτή τη ζήτηση. Αντί κάθε μονομελές νοικοκυριό να ανταγωνίζεται για ένα ξεχωριστό μικρό διαμέρισμα στο κέντρο, μοιράζεται μια καλά εξοπλισμένη κατοικία διατηρώντας τον δικό του ιδιωτικό χώρο. Έτσι αποσυμπιέζεται η ζήτηση για τα ακριβότερα μικρά διαμερίσματα και προσφέρεται μια προσιτή και ποιοτική εναλλακτική σε μια κεντρική τοποθεσία. Το μοντέλο co-living δεν είναι απλή συγκατοίκηση. Σε μια τυπική συγκατοίκηση, δεν υπάρχουν υποδομές που να υποστηρίζουν την κοινή ζωή. Στο co-living, ο κάθε κάτοικος έχει ιδιωτικό χώρο (υπνοδωμάτιο ή και μπάνιο), ενώ μοιράζεται κουζίνα, σαλόνι και πιθανώς και άλλες υποδομές όπως χώρους εργασίας, γυμναστήριο, χώρους πρασίνου κτλ.

    Τέτοιες υποδομές μπορούν να αναπτυχθούν από τον ίδιο τον δήμο ή την πολιτεία. Σε αυτήν την περίπτωση, η υλοποίηση θα στηρίζεται στη δημόσια περιουσία. Το απόθεμα αυτό δεν είναι αμελητέο: κτίρια που σήμερα υπολειτουργούν ή παραμένουν κλειστά θα μπορούσαν να αποκτήσουν νέα χρήση χωρίς να αλλάξει η κυριότητά τους. Και η διαχείριση των υποδομών μπορεί να γίνει μέσω σύμπραξης με φορέα που έχει εμπειρία στη διαχείριση οικιστικών χώρων – χωρίς να μεταβιβαστεί η κυριότητα των ακινήτων. Παράλληλα, ο Δήμος μπορεί να ενθαρρύνει και ιδιωτικές πρωτοβουλίες co-living, διαμορφώνοντας ένα σαφές πλαίσιο για την ανάπτυξή τους.

    Εάν η λειτουργία τέτοιων υποδομών συντονιστεί από τον δήμο, θα μπορούσε να ακολουθεί και μια μη κερδοσκοπική λογική – τα ενοίκια θα μπορούσαν να είναι συνδεδεμένα με το εισόδημα των ενδιαφερόμενων ενοικιαστών, για παράδειγμα, ως ποσοστό του μηνιαίου εισοδήματος, με ανώτατο και κατώτατο όριο. Η διάρκεια παραμονής θα μπορούσε επίσης να έχει ανώτατο όριο, ώστε οι θέσεις να εναλλάσσονται και ο χώρος να εξυπηρετεί διαρκώς νέους κατοίκους που βρίσκονται στη φάση που το χρειάζονται περισσότερο.

    Στη Γαλλία λειτουργεί ένα ευρύ δίκτυο κοινωνικών co-living για νέους εργαζόμενους, φοιτητές και ασκούμενους, διαχειριζόμενο από μη κερδοσκοπικούς φορείς υπό δημόσια εποπτεία. Αλλά πρέπει να έχουμε κατά νου, ότι το Παρίσι, μπροστά στην εκτόξευση του ιδιωτικού coliving – με πολύ μικρά δωμάτια να νοικιάζονται για πολύ υψηλές τιμές, υιοθέτησε το 2025 πολιτική [«zéro coliving»](https://lab.imedd.org/en/oi-epangelmaties-oikodespotes-anevazoun-tis-times-ton-airbnb-stin-athina/)^4, απαγορεύοντας κάθε νέο ιδιωτικό έργο αυτού του τύπου.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Γιατί co-living και όχι περισσότερα ατομικά διαμερίσματα;"
    a: |
      Στην ελληνική αντίληψη, η συγκατοίκηση έχει συνειρμούς οικονομικής ανάγκης και όχι επιλογής – και το ζητούμενο για πολλούς είναι, κατά κανόνα, η ανεξάρτητη κατοικία. Το co-living και το ατομικό διαμέρισμα πρέπει να νοούνται ως διαφορετικές επιλογές με διαφορετικά πλεονεκτήματα και μειονεκτήματα, που εξυπηρετούν διαφορετικές προτιμήσεις. Το co-living είναι για πολλούς συνειδητή επιλογή και όχι αναγκαστική λύση: σε δεκάδες ευρωπαϊκές πόλεις, το co-living επιλέγεται από ανθρώπους που θα μπορούσαν να ανταπεξέλθουν σε ατομικό διαμέρισμα αλλά το προτιμούν επειδή προσφέρει την αίσθηση της κοινότητας, την ευελιξία του πότε μπορούν να φύγουν, πιο άνετες υποδομές υποδομές και την κεντρική τοποθεσία που ένα τυπικό μικρό διαμέρισμα δεν μπορεί να προσφέρει.

  - q: "Η στεγαστική ασφάλεια οδηγεί και σε δημογραφική δυναμική. Το co-living πώς συνεισφέρει σε αυτό;"
    a: |
      Όντως, αποτυπώνεται ότι η στεγαστική κρίση μειώνει τη δημογραφική δυναμική. Στην Αγγλία, αύξηση στις τιμές των σπιτιών κατά 10% [μείωσε τις γεννήσεις](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2846173)^5 κατά 1,3% εν γένει και κατά 4,9% για τους ενοικιαστές. [Σε έρευνα στη Βρετανία](https://www.adamsmith.org/research/children-of-when-why-housing-is-the-solution-to-britains-fertility-crisis)^6, μεταξύ του 1995 και του 2014, παρατηρήθηκε ότι η αύξηση του στεγαστικού κόστους οδήγησε σε 157.000 λιγότερες γεννήσεις. Στις ΗΠΑ, [μελέτη μεταξύ 2010 και 2020](https://ti.org/pdfs/BuildBabyBuild.pdf)^7 έδειξε ότι η αύξηση του στεγαστικού κόστους οδήγησε σε μείωση μείωση του αριθμού των νέων οικογενειών κατά 7%. Το co-living δεν προσφέρει από μόνο του ένα περιβάλλον κατάλληλο για οικογένεια. Η συμβολή του στη δημογραφική δυναμική είναι έμμεση: βοηθά τους νεότερους να βάλουν τη ζωή τους σε πλαίσιο νωρίτερα. Ένας νέος που μπορεί να ζήσει αυτόνομα, με λογικό κόστος, σε κεντρική τοποθεσία, δεν καθυστερεί την έξοδο από την οικογενειακή εστία και άρα, το σενάριο του να κάνει τη δική του οικογένεια και να μεταβεί σε ένα σπίτι κατάλληλο για αυτό γίνεται πιο χειροπιαστό.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Περισσότερη στεγαστική ασφάλεια, καλύτερη υγεία
    body: |
      Η απουσία ποιοτικών στεγαστικών λύσεων υπονομεύει την υγεία. Στις ΗΠΑ, φάνηκε ότι [1% αύξηση στο μέσο εισόδημα που δαπανάται για στεγαστικά έξοδα](https://pubmed.ncbi.nlm.nih.gov/37221492/)^8 οδηγεί σε 37% αύξηση ρίσκου εμφάνισης παχυσαρκίας κατά 37%. Στο Ηνωμένο Βασίλειο, [μελέτη μεταξύ του 2009 και του 2019](https://pubmed.ncbi.nlm.nih.gov/38749252/)^9, έδειξε ότι αβεβαιότητα για τα στεγαστικά έξοδα οδηγεί σε αύξηση στον κίνδυνο εμφάνισης διαταραχής ψυχικής υγείας κατά 2,5% και αύξηση στον κίνδυνο διαταραχής ύπνου κατά 2%, με αυξημένα ποσοστά για τους ενοικιαστές και τους νέους.

  - title: Περισσότερη στεγαστική ασφάλεια, περισσότερη οικονομική ανάπτυξη
    body: |
      Όταν κάποιος δίνει ένα δυσανάλογα μεγάλο ποσό για στεγαστικά έξοδα, του μένουν [λιγότεροι πόροι](https://www.oecd.org/en/publications/housing-and-inclusive-growth_6ef36f4b-en.html)^10 για αποταμίευση, κατανάλωση ή επενδύσεις σε άλλους τομείς. Γίνεται επίσης πιο δύσκολη η κινητικότητα των εργαζομένων εκεί που πραγματικά χρειάζονται. Στις ΗΠΑ, για την περίοδο 1964-2009, το μειωμένο στεγαστικό απόθεμα σε πόλεις υψηλής παραγωγικότητας οδήγησε σε [μείωση της συνολικής οικονομικής ανάπτυξης](https://www.aeaweb.org/articles?id=10.1257/mac.20170388)^11 κατά 36% εξαιτίας της έλλειψης πρόσβασης από εργαζόμενους – κάτι που πρέπει να απασχολεί και την Αθήνα. Στο Ηνωμένο Βασίλειο, για την περίοδο 1996-2016, οι [νέοι 25-34 ετών που άλλαξαν δουλειά και σπίτι μέσα σε έναν χρόνο](https://www.resolutionfoundation.org/publications/moving-matters-housing-costs-and-labour-market-mobility/)^12 μειώθηκαν κατά 33%, δείχνοντας μια λιγότερο κινητική και δυναμική εικόνα. Παράλληλα, τα υψηλά στεγαστικά κόστη υπονομεύουν την καινοτομία – στην Κίνα, για κάθε αύξηση στις τιμές των σπιτιών μιας περιοχής κατά 1%, παρατηρήθηκε [μείωση της συμβολής αυτής της περιοχής σε καινοτομία](https://www.sciencedirect.com/user/error/ATN-13?errorContext=arp-9b008301-8934-4811-98e6-58c1586251bc)^13 κατά 0,25% – αλλά και την παραγωγικότητα – στο Λονδίνο, [αύξηση στον λόγο τιμών σπιτιών προς μισθούς](https://www.london.gov.uk/sites/default/files/2024-11/240927%20GLA%20Housing%20Productivity%20-%20Report%20FINAL.pdf)^14 κατά 1% φάνηκε να οδηγεί σε 0,15% μείωση στην παραγωγικότητα σε περιφερειακό επίπεδο κατά 0,15%.

  - title: Λιγότερη μοναξιά
    body: |
      Σε μια εποχή που η μοναξιά στις πόλεις αναγνωρίζεται ολοένα και περισσότερο ως ζήτημα δημόσιας υγείας – το 2023 ο Παγκόσμιος Οργανισμός Υγείας ανακήρυξε τη [μοναξιά παγκόσμιο ζήτημα δημόσιας υγείας](https://www.who.int/news-room/commentaries/detail/loneliness-and-isolation-the-hidden-threat-to-global-health-we-can-no-longer-ignore)^15 – το co-living δίνει στους κατοίκους μια κοινότητα και κοινές δραστηριότητες. Περίπου [1 στους 8 Ευρωπαίους αισθάνεται συχνά μοναξιά](https://joint-research-centre.ec.europa.eu/projects-and-activities/survey-methods-and-analysis-centre/loneliness/loneliness-prevalence-eu_en)^16, με την Ελλάδα να κατατάσσεται μεταξύ των τεσσάρων χωρών με τα υψηλότερα ποσοστά αυτοαναφερόμενης μοναξιάς στην ΕΕ, κάτι που καθιστά το ζήτημα ιδιαίτερα επίκαιρο για τον εγχώριο δημόσιο διάλογο.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - category: legal
    body: |
      Να οριστεί με σαφήνεια τι είναι νομικά ένας χώρος co-living: πώς κατηγοριοποιείται η χρήση του ακινήτου, πώς αντιμετωπίζονται οι κοινόχρηστοι χώροι ως προς την ιδιοκτησία και τη διαχείρισή τους, ποιο συμβατικό πλαίσιο διέπει τη σχέση κατοίκου και φορέα διαχείρισης, και πώς εντάσσεται στο σύστημα ελέγχου ενοικίων και αδειοδότησης.

  - category: financial-flow
    body: |
      Να διερευνηθούν τα διαφορετικά χρηματοδοτικά μοντέλα που μπορεί να ακολουθήσει μια co-living επιλογή καθώς η επιλογή μοντέλου καθορίζει τόσο τη βιωσιμότητα όσο και τον κοινωνικό χαρακτήρα της υποδομής. Χρειάζεται να εξεταστούν συστηματικά οι διαθέσιμες επιλογές: πλήρως δημοτικό μοντέλο με αξιοποίηση υπάρχουσας δημόσιας περιουσίας, σύμπραξη δημόσιου-ιδιωτικού τομέα όπου ο δήμος παρέχει το ακίνητο και ιδιώτης αναλαμβάνει τη διαχείριση, πλαισιωμένο ιδιωτικό μοντέλο με κανονιστικές δεσμεύσεις ως αντάλλαγμα για αδειοδοτικές διευκολύνσεις ή και ένα πιο ελεύθερο ιδιωτικό μοντέλο.

