number: 12
slug: coliving-neoi
theme: housing
title: Η συγκατοίκηση ως ελκυστική λύση

one_line: >
  Μία από τις κύριες αιτίες της στεγαστικής κρίσης είναι η εκρηκτική αύξηση
  των μονομελών νοικοκυριών, πιέζοντας ιδιαίτερα την αγορά των μικρών
  διαμερισμάτων στις κεντρικές γειτονιές, όπου οι τιμές έχουν εκτοξευτεί. Η
  πρόταση είναι να αναπτυχθεί co-living στο κέντρο της Αθήνας, είτε δημοτικό
  είτε ιδιωτικό, που να προσφέρει μοντέρνες, καλά εξοπλισμένες κοινόχρηστες
  υποδομές με ιδιωτικό δωμάτιο και μπάνιο.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Μία από τις κύριες αιτίες της στεγαστικής κρίσης είναι η αύξηση των
    μονομελών νοικοκυριών, πιέζοντας ιδιαίτερα την αγορά των μικρών διαμερισμάτων
    στις κεντρικές γειτονιές, όπου οι τιμές έχουν εκτοξευτεί. Η πρόταση είναι να
    αναπτυχθούν co-living υποδομές στο κέντρο της Αθήνας, είτε δημοτικές είτε
    ιδιωτικές, που να προσφέρουν την επιλογή σε άτομα να μένουν στο δικό τους
    δωμάτιο, με το δικό του μπάνιο, έχοντας όμως πρόσβαση σε καλά εξοπλισμένα
    σπίτια, με υψηλού επιπέδου κοινόχρηστες παροχές.

# ── ΑΠΟ ΤΟ POL.IS ───────────────────────────────────────────────────────────
