number: 12
slug: coliving-neoi
theme: housing
title: Η συγκατοίκηση ως ελκυστική λύση

one_line: >
  Μία από τις κύριες αιτίες της στεγαστικής κρίσης είναι η εκρηκτική αύξηση
  των μονομελών νοικοκυριών, πιέζοντας ιδιαίτερα την αγορά των μικρών
  διαμερισμάτων στις κεντρικές γειτονιές, όπου οι τιμές έχουν εκτοξευτεί. Η
  πρόταση είναι να αναπτυχθεί co-living στο κέντρο της Αθήνας, είτε δημοτικό
  είτε ιδιωτικό, που να προσφέρει μοντέρνες, καλά εξοπλισμένες κοινόχρηστες
  υποδομές με ιδιωτικό δωμάτιο και μπάνιο.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Ο Δήμος θα μπορούσε να υποστηρίξει τη δημιουργία co-living χώρων στο κέντρο
    της Αθήνας — είτε δημοτικών είτε ιδιωτικών — που να απευθύνονται στα
    μονομελή νοικοκυριά, την ομάδα που πιέζει περισσότερο τη ζήτηση για μικρά
    διαμερίσματα. Ο κάθε κάτοικος έχει το δικό του δωμάτιο με το δικό του μπάνιο
    και μοιράζεται μια καλά εξοπλισμένη κατοικία με υψηλού επιπέδου κοινόχρηστες
    παροχές. Οι νέοι 18–35 ετών παραμένουν μια βασική υποομάδα, αλλά η λύση δεν
    αφορά μόνο αυτούς: αφορά κάθε άτομο που ζει μόνο του και αναζητά προσιτή,
    ποιοτική και κεντρική κατοικία.

    Στην περίπτωση δημοτικών χώρων, τα ενοίκια θα μπορούσαν να είναι συνδεδεμένα
    με το εισόδημα των ενδιαφερόμενων ενοικιαστών — για παράδειγμα, ως ποσοστό
    του μηνιαίου εισοδήματος, με ανώτατο και κατώτατο όριο, ώστε ο χώρος να είναι
    προσιτός ακόμα και σε νοικοκυριά με χαμηλό εισόδημα. Η είσοδος θα γίνεται με
    διαφανή κριτήρια — εισόδημα, τόπος εργασίας ή σπουδών στον Δήμο Αθηναίων —
    χωρίς εγγυητή. Η διάρκεια παραμονής θα μπορούσε να έχει ανώτατο όριο, ώστε οι
    θέσεις να εναλλάσσονται και ο χώρος να εξυπηρετεί διαρκώς κατοίκους που
    βρίσκονται στη φάση που το χρειάζονται περισσότερο.
  callouts:
    - |
      Το μοντέλο co-living δεν είναι απλή συγκατοίκηση. Σε μια τυπική
      συγκατοίκηση, δεν υπάρχουν υποδομές που να υποστηρίζουν την κοινή ζωή.
      Στο co-living, ο κάθε κάτοικος έχει ιδιωτικό χώρο (δικό του δωμάτιο και
      δικό του μπάνιο), ενώ μοιράζεται κουζίνα, σαλόνι και πιθανώς και άλλες
      υποδομές όπως χώρους εργασίας, γυμναστήριο, χώρους πρασίνου κτλ. Αντί ο
      κάθε κάτοικος να πληρώνει ακριβά για να αποκτήσει μόνος του όλες τις
      λειτουργίες μιας κατοικίας, τις μοιράζεται — και μειώνεται το κόστος χωρίς
      να θυσιάζει την ιδιωτικότητα ή την ποιότητα της κατοικίας του.

      Αυτό που προσθέτει το co-living πέρα από την οικονομία κλίμακας είναι η
      κοινότητα: κάτοικοι που επιλέγουν συνειδητά έναν κοινό τρόπο ζωής, με
      κοινές δραστηριότητες. Σε μια εποχή που η μοναξιά στις πόλεις
      αναγνωρίζεται όλο και περισσότερο ως ζήτημα δημόσιας υγείας, αυτή η
      διάσταση δεν είναι δευτερεύουσα.

