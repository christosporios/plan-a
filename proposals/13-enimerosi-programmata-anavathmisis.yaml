number: 13
slug: enimerosi-programmata-anavathmisis
theme: housing
title: Εξατομικευμένη ενημέρωση για προγράμματα αναβάθμισης σπιτιών/κτιρίων
one_line: >
  Σημαντικοί δημόσιοι πόροι διατίθενται για την ανακαίνιση και αναβάθμιση
  κατοικιών και κτιρίων, συχνά με πολύ ευνοϊκούς όρους — όμως οι περισσότεροι
  ιδιοκτήτες δεν ξέρουν ότι υπάρχουν. Κάθε ιδιοκτήτης θα μπορούσε να λαμβάνει
  εξατομικευμένη ειδοποίηση στο κινητό του όταν το σπίτι ή το κτίριό του πληροί
  τα κριτήρια κάποιου προγράμματος.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Το κράτος ήδη γνωρίζει πολλά για κάθε ακίνητο: τη χρονολογία κατασκευής, τα
    τετραγωνικά, τον ενεργειακό βαθμό από το Πιστοποιητικό Ενεργειακής Απόδοσης,
    το αν είναι κύρια κατοικία ή κλειστό, τα στοιχεία του ιδιοκτήτη. Τα ίδια
    στοιχεία είναι ακριβώς αυτά που καθορίζουν αν ένα ακίνητο είναι επιλέξιμο για
    προγράμματα όπως το «Εξοικονομώ», το «Ανακαινίζω–Ενοικιάζω» ή το «Σπίτι μου».

    Αντί ο ιδιοκτήτης να ανακαλύπτει τυχαία ένα πρόγραμμα και μετά να ψάχνει αν
    τον αφορά, η σχέση μπορεί να αντιστραφεί: το κράτος, που ήδη κρατάει τα
    δεδομένα, να ειδοποιεί τον ιδιοκτήτη — στο κινητό του, μέσα από το gov.gr —
    όταν το συγκεκριμένο ακίνητό του πληροί τα κριτήρια ενός ενεργού
    προγράμματος. Η ειδοποίηση δεν είναι διαφήμιση· είναι μια προσωποποιημένη
    εκτίμηση: «το διαμέρισμά σου πιθανότατα δικαιούται Χ, με εκτιμώμενη
    επιδότηση Υ — δες αν σε συμφέρει».

