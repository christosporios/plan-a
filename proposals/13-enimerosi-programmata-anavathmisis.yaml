number: 13
slug: enimerosi-programmata-anavathmisis
theme: housing
title: Εξατομικευμένη ενημέρωση για προγράμματα αναβάθμισης σπιτιών/κτιρίων
one_line: >
  Σημαντικοί δημόσιοι πόροι διατίθενται για την ανακαίνιση και αναβάθμιση
  κατοικιών και κτιρίων, συχνά με πολύ ευνοϊκούς όρους — όμως οι περισσότεροι
  ιδιοκτήτες δεν ξέρουν ότι υπάρχουν. Κάθε ιδιοκτήτης θα μπορούσε να λαμβάνει
  εξατομικευμένη ειδοποίηση στο κινητό του όταν το σπίτι ή το κτίριό του πληροί
  τα κριτήρια κάποιου προγράμματος.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Σημαντικοί πόροι προϋπολογίζονται για προγράμματα ανακαίνισης και αναβάθμισης
    κατοικιών και κτιρίων συχνά με πολύ ευνοϊκούς όρους για τους δικαιούχους. Το
    πρόβλημα είναι ότι οι περισσότεροι ιδιοκτήτες δεν γνωρίζουν ότι υπάρχουν
    τέτοια προγράμματα, και ακόμη και αν τα μαθαίνουν, είτε δεν είναι σίγουροι αν
    αφορούν το δικό τους σπίτι ή κτίριο είτε έχουν μια επιφυλακτικότητα για το
    εάν όντως τους συμφέρει. Κάθε ιδιοκτήτης θα μπορούσε να λαμβάνει
    εξατομικευμένη ειδοποίηση στο κινητό του όταν το σπίτι ή το κτίριό του πληροί
    τα κριτήρια κάποιου προγράμματος, ώστε να μπορεί να ζυγίσει πιο εύκολα και
    γρήγορα αν τον συμφέρει και να προχωρήσει ανάλογα.

