# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΠΡΟΣΙΤΗ ΚΑΤΟΙΚΙΑ & ΠΟΙΟΤΙΚΑ ΚΤΙΡΙΑ» ─────────────
contribution:
  body: |
    Το πρόβλημα δεν είναι κυρίως η έλλειψη χρημάτων· είναι ότι τα χρήματα δεν
    βρίσκουν τους ανθρώπους. Υπάρχουν τρία διαδοχικά εμπόδια ανάμεσα στον ιδιοκτήτη
    και στην αναβάθμιση του σπιτιού του:

    1. **Άγνοια:** Οι περισσότεροι ιδιοκτήτες απλώς δεν γνωρίζουν ότι υπάρχει
    ενεργό πρόγραμμα που θα μπορούσε να τους αφορά. Η ενημέρωση γίνεται σήμερα με
    γενικές ανακοινώσεις και διαφημίσεις, που χάνονται μέσα στον θόρυβο και δεν
    απευθύνονται σε κανέναν προσωπικά.
    2. **Αβεβαιότητα επιλεξιμότητας:** Ακόμη κι όσοι μαθαίνουν για ένα πρόγραμμα,
    δεν είναι σίγουροι αν το δικό τους ακίνητο πληροί τα κριτήρια — εισοδηματικά
    όρια, ενεργειακή κατηγορία, παλαιότητα, χρήση. Το να το διαπιστώσει κανείς
    απαιτεί χρόνο, μηχανικό και διάβασμα όρων· οι περισσότεροι τα παρατούν.
    3. **Επιφυλακτικότητα:** Ακόμη κι όταν είναι επιλέξιμοι, πολλοί δεν είναι
    βέβαιοι αν τους συμφέρει — πόση είναι η πραγματική επιδότηση, πόσα θα βάλουν
    από την τσέπη τους, σε πόσο χρόνο αποσβένεται.
  callouts:
    - |
      Στη διαβούλευση, το ότι «τα κρατικά προγράμματα επιδότησης ενεργειακής
      αναβάθμισης δεν είναι αποτελεσματικά» συγκέντρωσε εξαιρετικά υψηλό ποσοστό
      αβεβαιότητας (pass), δείχνοντας ότι πολλοί κάτοικοι ούτε καν ξέρουν πώς
      αποδίδουν αυτά τα προγράμματα — ένα σύμπτωμα ακριβώς του χάσματος
      ενημέρωσης.

      Πηγή: Διαβούλευση Plan A (Pol.is), δήλωση #48
  body_after: |
    Η εξατομικευμένη ειδοποίηση χτυπάει και τα τρία εμπόδια ταυτόχρονα. Επειδή το
    κράτος κάνει το πρώτο βήμα και μιλάει για το συγκεκριμένο ακίνητο, λύνει την
    άγνοια· επειδή το μήνυμα στέλνεται μόνο όταν τα κριτήρια ήδη πληρούνται, λύνει
    την αβεβαιότητα επιλεξιμότητας· κι επειδή συνοδεύεται από μια πρόχειρη
    εκτίμηση κόστους–οφέλους, βοηθάει τον ιδιοκτήτη να ζυγίσει αν τον συμφέρει.

    Αυτό συμβάλλει άμεσα στον στόχο της προσιτής κατοικίας και των ποιοτικών
    κτιρίων: όσο περισσότεροι ιδιοκτήτες αξιοποιούν προγράμματα που ήδη
    υπάρχουν και πληρώνονται από δημόσιο χρήμα, τόσο περισσότερα σπίτια
    αναβαθμίζονται ενεργειακά, λιγότερα μένουν κλειστά και αναξιοποίητα, και τόσο
    καλύτερα αποδίδει ο προϋπολογισμός που έχει ήδη δεσμευτεί. Όπως φάνηκε και στη
    διαβούλευση, η πόλη προτιμά τα κίνητρα από τις ποινές — και ένα κίνητρο που
    δεν φτάνει στον δικαιούχο είναι σαν να μην υπάρχει.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Δεν θίγει την ιδιωτικότητα να διασταυρώνει το κράτος δεδομένα για το σπίτι μου και να μου στέλνει μηνύματα;"
    a: >
      Τα δεδομένα που χρειάζονται (παλαιότητα, τετραγωνικά, ενεργειακή κατηγορία,
      ιδιοκτησία) τα κρατάει ήδη το κράτος και ο ιδιοκτήτης τα βλέπει στο gov.gr.
      Δεν δημιουργείται νέα συλλογή δεδομένων· αλλάζει μόνο η χρήση τους, ώστε να
      ενημερώνεται ο ίδιος ο δικαιούχος. Η λειτουργία πρέπει να είναι ρητά
      opt-in — ο πολίτης ενεργοποιεί τις ειδοποιήσεις και μπορεί να τις
      απενεργοποιήσει ανά πάσα στιγμή — και να περιορίζεται αυστηρά στα δικά του
      ακίνητα, χωρίς να διαβιβάζονται στοιχεία σε τρίτους ή εργολάβους.

  - q: "Τι γίνεται αν τα δεδομένα είναι λάθος και ειδοποιηθώ για πρόγραμμα που τελικά δεν δικαιούμαι;"
    a: >
      Η ειδοποίηση πρέπει να είναι σαφώς διατυπωμένη ως _ένδειξη_ και όχι ως
      εγγύηση: «το ακίνητό σου πιθανότατα πληροί τα κριτήρια — επιβεβαίωσε με
      μια αίτηση». Έτσι, ακόμη κι αν κάποιο στοιχείο είναι ανακριβές, το κόστος
      είναι μια αίτηση που δεν προχωράει, όχι μια χαμένη ευκαιρία. Παράλληλα, η
      ίδια διαδικασία βοηθάει τον πολίτη να εντοπίσει και να διορθώσει λανθασμένα
      στοιχεία του ακινήτου του.

  - q: "Ποιος φτιάχνει και συντηρεί έναν τέτοιο μηχανισμό;"
    a: >
      Το εργαλείο εδράζεται στις υποδομές που ήδη υπάρχουν: στο gov.gr και στα
      μητρώα ακινήτων και ενεργειακών πιστοποιητικών. Η λογική της επιλεξιμότητας
      κάθε προγράμματος ορίζεται ήδη από τον φορέα που το τρέχει· εδώ απλώς
      κωδικοποιείται ώστε να τρέχει αυτόματα πάνω στα δεδομένα. Ο δήμος δεν
      χρειάζεται να χτίσει νέο μητρώο — μπορεί να λειτουργήσει ως πιλότος και ως
      πιεστικός εισηγητής προς την κεντρική διοίκηση για τη διασύνδεση των
      συστημάτων.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Καλύτερη απόδοση δημόσιου χρήματος
    body: >
      Όταν ένα πρόγραμμα προϋπολογίζεται αλλά απορροφάται ελλιπώς επειδή οι
      δικαιούχοι δεν το γνωρίζουν, ο δημόσιος πόρος μένει αναξιοποίητος. Μια
      στοχευμένη ειδοποίηση που φτάνει ακριβώς σε όσους πληρούν τα κριτήρια
      αυξάνει την απορρόφηση χωρίς να χρειάζεται περισσότερο χρήμα — απλώς το
      ίδιο χρήμα πιάνει τόπο.

  - title: Λιγότερα κλειστά και υποβαθμισμένα ακίνητα
    body: >
      Πολλά παλιά διαμερίσματα μένουν κλειστά ή σε κακή κατάσταση επειδή η
      αναβάθμιση φαντάζει ακριβή και περίπλοκη. Φέρνοντας στον ιδιοκτήτη ένα
      συγκεκριμένο, εφικτό μονοπάτι — με επιδότηση που τον αφορά — αυξάνεται η
      πιθανότητα να αναβαθμιστεί και να ξαναμπεί το ακίνητο σε χρήση, κάτι που
      η ίδια η πόλη ζήτησε προτιμώντας τα κίνητρα από τις ποινές.

  - title: Εμπιστοσύνη στη σχέση πολίτη–κράτους
    body: >
      Ένα κράτος που σε ειδοποιεί προληπτικά για κάτι που σε ωφελεί, αντί να
      περιμένει να το ανακαλύψεις μόνος σου, αλλάζει την εμπειρία του πολίτη.
      Η ίδια υποδομή ειδοποιήσεων μπορεί αργότερα να επεκταθεί και σε άλλες
      παροχές για τις οποίες ο πολίτης είναι επιλέξιμος αλλά τις αγνοεί.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Χαρτογράφηση προγραμμάτων και δεδομένων
    body: >
      Να καταγραφούν τα ενεργά προγράμματα αναβάθμισης κατοικιών (π.χ.
      «Εξοικονομώ», «Ανακαινίζω–Ενοικιάζω», «Σπίτι μου») και τα ακριβή κριτήρια
      επιλεξιμότητας του καθενός, και να αντιστοιχιστούν με τα πεδία δεδομένων
      που ήδη υπάρχουν στα μητρώα και στο gov.gr. Σκοπός είναι να φανεί ποια
      κριτήρια μπορούν να ελεγχθούν αυτόματα και ποια χρειάζονται δήλωση του
      πολίτη.

  - title: Πιλότος με opt-in ειδοποιήσεις σε μια γειτονιά
    body: >
      Να τρέξει πιλοτικά η εξατομικευμένη ειδοποίηση σε μια περιοχή του δήμου,
      με ρητή συγκατάθεση των ιδιοκτητών και σαφή διατύπωση ένδειξης (όχι
      εγγύησης). Να μετρηθεί πόσοι ανοίγουν την ειδοποίηση, πόσοι κάνουν αίτηση
      και πόσοι ολοκληρώνουν την αναβάθμιση, ώστε να αξιολογηθεί η
      αποτελεσματικότητα πριν την επέκταση.

