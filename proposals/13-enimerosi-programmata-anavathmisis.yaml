# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΠΡΟΣΙΤΗ ΚΑΤΟΙΚΙΑ & ΑΝΑΒΑΘΜΙΣΜΕΝΑ ΚΤΙΡΙΑ» ──────────
contribution:
  body: |
    Πολλά από τα κτίρια της πόλης είναι σε κακή κατάσταση, κάτι που οφείλεται σε
    μεγάλο βαθμό στο γερασμένο κτιριακό απόθεμα.

    ::: callout
    Το 57% των κτιρίων της Αττικής έχει χτιστεί [πριν από τουλάχιστον 45 χρόνια](https://www.statistics.gr/2021-buildings-census)^1.

    Στην Ελλάδα, δύο στις τρεις κατοικίες κατατάσσονται στις χαμηλότερες ενεργειακές κατηγορίες Ε-Η.

    Μόλις μία στις δέκα κατοικίες πλησιάζει τα σύγχρονα πρότυπα ενεργειακής απόδοσης (κλάσεις Α+, Α, Β+, Β).
    :::

    Σημαντικοί δημόσιοι πόροι διατίθενται για την ανακαίνιση και αναβάθμιση
    κατοικιών και κτιρίων στην πόλη, συχνά με πολύ ευνοϊκούς όρους που θα
    βελτίωναν σημαντικά την ποιότητα ζωής στα κτίρια αλλά και την παρουσία τους
    στον δημόσιο χώρο με σχετικά μικρό κόστος.

    Το πρόβλημα δεν είναι κυρίως η έλλειψη χρημάτων αλλά ότι τα χρήματα δεν
    βρίσκουν τους ανθρώπους που τα χρειάζονται. Υπάρχουν τρία διαδοχικά εμπόδια
    ανάμεσα στον ιδιοκτήτη και στην αναβάθμιση του σπιτιού του. Πρώτον, η άγνοια.
    Οι περισσότεροι ιδιοκτήτες απλώς δεν γνωρίζουν ότι υπάρχει ενεργό πρόγραμμα
    που θα μπορούσε να τους αφορά. Η ενημέρωση γίνεται σήμερα με γενικές
    ανακοινώσεις και διαφημίσεις, που χάνονται μέσα στον θόρυβο και δεν
    απευθύνονται σε κανέναν προσωπικά. Δεύτερον, η αβεβαιότητα της επιλεξιμότητας.
    Ακόμη κι όσοι μαθαίνουν για ένα πρόγραμμα, δεν είναι σίγουροι αν το δικό τους
    ακίνητο πληροί τα κριτήρια – εισοδηματικά όρια, ενεργειακή κατηγορία,
    παλαιότητα, χρήση. Το να το διαπιστώσει κανείς απαιτεί χρόνο, και οι
    περισσότεροι τα παρατούν. Και τρίτον, η επιφυλακτικότητα. Ακόμη κι όταν είναι
    επιλέξιμοι, πολλοί δεν είναι βέβαιοι αν τους συμφέρει – πόση είναι η πραγματική
    επιδότηση, πόσα θα βάλουν από την τσέπη τους, σε πόσο χρόνο αποσβένεται.

    Το κράτος ήδη γνωρίζει πολλά για κάθε ακίνητο, όπως τη χρονολογία κατασκευής,
    τα τετραγωνικά, τον ενεργειακό βαθμό από το Πιστοποιητικό Ενεργειακής
    Απόδοσης, αλλά και τα στοιχεία του ιδιοκτήτη. Αυτή η πληροφορία συγκεντρώνεται
    ακόμη πιο αποτελεσματικά μέσω του Μητρώου Ιδιοκτησίας και Διαχείρισης Ακινήτων
    που αναμένεται να τεθεί σε λειτουργία από την ΑΑΔΕ. Αυτά ακριβώς τα στοιχεία
    είναι που καθορίζουν αν ένα ακίνητο είναι επιλέξιμο για προγράμματα όπως το
    [«Εξοικονομώ»](https://exoikonomo2025.gov.gr/)^2 ή το
    [«Ανακαινίζω–Ενοικιάζω»](https://stegasi.gov.gr/programs/anakainizo-noikiazo/)^3.

    Αντί, λοιπόν, ο ιδιοκτήτης να ανακαλύπτει τυχαία ένα πρόγραμμα και μετά να
    ψάχνει αν τον αφορά, η σχέση μπορεί να αντιστραφεί: το κράτος, που ήδη κρατάει
    τα δεδομένα, να ειδοποιεί τον ιδιοκτήτη, στο κινητό του, όταν το ακίνητό του
    πληροί τα κριτήρια ενός ενεργού προγράμματος. Και αυτή η ειδοποίηση μπορεί να
    αφορά τόσο το μεμονωμένο διαμέρισμα, που μπορεί να πληροί κριτήρια ενός
    προγράμματος με βάση τα δικά του χαρακτηριστικά αλλά και το κτίριο εντός του
    οποίου στεγάζεται. Στη δεύτερη περίπτωση, ο ιδιοκτήτης θα χρειαστεί να
    συνεννοηθεί με τους υπόλοιπους συνιδιοκτήτες και να προκύψει κοινή απόφαση.

    Αυτή η εξατομικευμένη ειδοποίηση χτυπάει και τα τρία εμπόδια που αναφέραμε
    παραπάνω. Επειδή το κράτος κάνει το πρώτο βήμα και μιλάει για το συγκεκριμένο
    ακίνητο, λύνει την άγνοια· επειδή το μήνυμα στέλνεται μόνο όταν τα κριτήρια
    ήδη πληρούνται, λύνει την αβεβαιότητα επιλεξιμότητας· κι επειδή μπορεί να
    συνοδεύεται από μια πρόχειρη εκτίμηση κόστους–οφέλους, βοηθάει τον ιδιοκτήτη
    να ζυγίσει αν τον συμφέρει.

    Έμπνευση μπορεί να αντληθεί από την [Εσθονία](https://oecd-opsi.org/innovations/proactive-family-benefits/)^4
    που εφαρμόζει ένα ανάλογο μοντέλο αλλά για κοινωνικά επιδόματα. Από το 2019,
    οι νέοι γονείς στην Εσθονία δεν χρειάζεται να κάνουν αίτηση για οικογενειακά
    επιδόματα: το σύστημα ελέγχει αυτόματα το Εθνικό Μητρώο Πληθυσμού για νέες
    γεννήσεις, αντλεί τα στοιχεία των γονέων, και ζητά από την Εφορία τα
    εισοδηματικά τους δεδομένα, ώστε να τους στείλει απευθείας εξατομικευμένη
    πρόταση επιδόματος, χωρίς να χρειαστεί να συμπληρώσουν ούτε μία φόρμα. Πρόκειται
    για ένα βήμα παραπέρα από αυτό που προτείνουμε εδώ: εκεί το κράτος δεν
    ειδοποιεί απλώς τον πολίτη αλλά του δίνει απευθείας αυτό που δικαιούται. Η
    διαφορά βέβαια είναι ότι στα κοινωνικά επιδόματα δεν χρειάζεται να πληρώσεις
    κάτι όπως στα προγράμματα επιδότησης κτιριακής αναβάθμισης και άρα, η λογική
    της αυτόματης παροχής λειτουργεί.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Δεν θίγει την ιδιωτικότητα να διασταυρώνει το κράτος δεδομένα για το σπίτι μου και να μου στέλνει μηνύματα;"
    a: >
      Τα δεδομένα που χρειάζονται (παλαιότητα, τετραγωνικά, ενεργειακή κατηγορία,
      ιδιοκτησία) τα κρατάει ήδη το κράτος. Δεν δημιουργείται νέα συλλογή
      δεδομένων· αλλάζει μόνο η χρήση τους, ώστε να ενημερώνεται ο ίδιος ο
      δικαιούχος ενός προγράμματος. Πρέπει να διερευνηθεί η συμμόρφωση με το
      πλαίσιο GDPR.

  - q: "Αν η αίτηση απαιτεί βαριά γραφειοκρατία, η ειδοποίηση απλώς οδηγεί νωρίτερα σε αποθάρρυνση. Πώς αντιμετωπίζεται αυτό;"
    a: >
      Μια ειδοποίηση που οδηγεί σε δεκαπέντε δικαιολογητικά και τρεις επισκέψεις
      σε υπηρεσίες δεν λύνει το πρόβλημα. Αυτό σημαίνει ότι η πρόταση αυτή δεν
      μπορεί να εξεταστεί αποκομμένη από την ευρύτερη απλοποίηση των διαδικασιών
      υποβολής αιτήσεων των ίδιων των προγραμμάτων. Η ειδοποίηση και η απλοποίηση
      είναι δύο πλευρές του ίδιου νομίσματος: η πρώτη χωρίς τη δεύτερη απογοητεύει,
      η δεύτερη χωρίς την πρώτη παραμένει αόρατη.

  - q: "Για παρεμβάσεις σε ολόκληρο το κτίριο, το κύριο εμπόδιο δεν είναι η πληροφόρηση αλλά η συναπόφαση – πώς πείθεις τους συνιδιοκτήτες να συμφωνήσουν;"
    a: >
      Η ειδοποίηση σε επίπεδο κτιρίου απευθύνεται σε κάθε ιδιοκτήτη ξεχωριστά,
      αλλά η απόφαση απαιτεί συναίνεση, η οποία προφανώς δεν μπορεί να εξασφαλιστεί
      με κάποια τεχνολογική λύσει. Ωστόσο η ειδοποίηση έχει και εδώ μια
      χρησιμότητα: φέρνει το θέμα στο τραπέζι. Ένας ιδιοκτήτης που γνωρίζει ότι
      υπάρχει ενεργό πρόγραμμα και ότι το κτίριό του πληροί τα κριτήρια έχει
      κίνητρο να το θέσει στη γενική συνέλευση και να ξεκινήσει τη συζήτηση.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Καλύτερη απόδοση δημόσιου χρήματος
    body: >
      Όταν ένα πρόγραμμα προϋπολογίζεται αλλά απορροφάται ελλιπώς επειδή οι
      δικαιούχοι δεν το γνωρίζουν, ο δημόσιος πόρος μένει αναξιοποίητος. Μια
      στοχευμένη ειδοποίηση που φτάνει ακριβώς σε όσους πληρούν τα κριτήρια
      αυξάνει την απορρόφηση χωρίς να χρειάζονται περισσότεροι πόροι.

  - title: Εμπιστοσύνη στη σχέση πολίτη-κράτους
    body: >
      Ένα κράτος που σε ειδοποιεί για κάτι που σε ωφελεί, αντί να περιμένει να το
      ανακαλύψεις μόνος σου, αλλάζει την εμπειρία του πολίτη. Πολλά χρηματοδοτικά
      προγράμματα συνοδεύονται από την υποψία ότι η πληροφορία δεν διαχέεται
      ισότιμα, ότι κάποιοι το μαθαίνουν νωρίτερα, άλλοι αργότερα, και ότι πίσω από
      αυτή την ασυμμετρία κρύβεται αδιαφάνεια. Ένα σύστημα που στέλνει αυτόματα
      εξατομικευμένη ειδοποίηση σε κάθε δικαιούχο, βάσει αντικειμενικών δεδομένων
      και όχι γνωριμιών, αποκλείει αυτήν την καχυποψία.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - category: legal
    body: >
      Η διασταύρωση δεδομένων από διαφορετικά μητρώα και η αποστολή
      εξατομικευμένων ειδοποιήσεων πρέπει να είναι συμβατές με το πλαίσιο GDPR και
      την ελληνική νομοθεσία για την προστασία προσωπικών δεδομένων.

  - category: digital
    body: >
      Το ιδανικό αποτέλεσμα είναι μια ενιαία υποδομή που συνδέει όλα τα ενεργά
      προγράμματα ανεξαρτήτως ποιος τα τρέχει – κεντρικό κράτος, δήμος,
      περιφέρεια. Για τον ιδιοκτήτη η τυπική διάκριση αρμοδιοτήτων δεν έχει καμία
      πρακτική σημασία: αυτό που χρειάζεται είναι ένα μήνυμα που να του λέει «το
      σπίτι σου πληροί κριτήρια για τα εξής προγράμματα».

