number: 13
slug: isogeia
theme: housing
title: Ζωντανεύοντας τα ισόγεια της πόλης
one_line: >
  Ο Δήμος γίνεται ενεργός μεσάζων ανάμεσα σε ιδιοκτήτες κενών ισογείων και
  επιχειρήσεις που ψάχνουν χώρο — με δημόσιο μητρώο, ομάδα matchmaking,
  κίνητρα ενεργοποίησης και απλοποίηση αδειοδότησης για προσωρινές χρήσεις.

problem:
  body: |
    Σχεδόν κάθε οικοδομικό τετράγωνο στον Δήμο Αθηναίων έχει ισόγεια εμπορικής
    χρήσης στεγάζοντας διάφορες επιχειρήσεις – φούρνους, καφενεία, εστιατόρια,
    ιατρεία, γραφεία, κτλ. Κατοικία, εμπόριο, υπηρεσίες και κοινωνική ζωή
    συνυπάρχουν στον ίδιο δρόμο, και συχνά στην ίδια πολυκατοικία, ακριβώς
    επειδή το ισόγειο παραμένει ανοιχτό σε διαφορετικές χρήσεις. Όταν το
    (εμπορικό) ισόγειο μένει αδρανές, χάνεται ο κρίκος που συνδέει τους
    ανθρώπους με τη γειτονιά τους.

    Ωστόσο, το ποσοστό κενών εμπορικών ισογείων στο κέντρο της Αθήνας είναι
    πολύ υψηλό. Αν και δεν υπάρχει συστηματική καταγραφή, εκτιμάται σε 28–34%.
    Παράλληλα, δεν είναι μόνο τα κενά ισόγεια που αποτελούν πρόβλημα – είναι και
    τα ισόγεια με χρήσεις-φάντασμα όπως αποθήκες διανομής ή σημεία συλλογής
    δεμάτων που. Αν και αυτά τα ισόγεια δεν είναι κενά, λειτουργούν στην πράξη
    ως τέτοια για τη ζωντανιά της γειτονιάς.

    Γιατί αυτό είναι πρόβλημα, το δείχνουν τα νούμερα.

    Η ασφάλεια επηρεάζεται άμεσα. Σε μελέτη 24 αμερικανικών πόλεων, κάθε 10%
    αύξηση στα κενά εμπορικά ισόγεια συνδέονταν με αύξηση 3-6% στα εγκλήματα
    κατά ιδιοκτησίας στην ίδια γειτονιά.^1 Ο μηχανισμός είναι απλός: λιγότεροι
    πεζοί σημαίνει λιγότερα «μάτια στον δρόμο», αυτό που η Jane Jacobs
    περιέγραψε ως τον πιο αποτελεσματικό μηχανισμό αστικής ασφάλειας. Η Αθήνα,
    με τα υψηλότερα ποσοστά κενών ισογείων στην Ευρώπη, έχει και τα υψηλότερα
    ποσοστά εγκλημάτων κατά ιδιοκτησίας στην ΕΕ – 6η θέση με 23,8 περιστατικά
    ανά 1.000 κατοίκους.^2

    Η αξία των ακινήτων πλήττεται μετρήσιμα. Κάθε κενό ισόγειο μειώνει την αξία
    των γειτονικών ακινήτων κατά εκτιμώμενο 0,5-1,2% ανά 100 μέτρα.^3 Σε
    γειτονιά όπου το 35% των ισογείων είναι κενά, η συσσωρευτική αρνητική
    επίδραση μπορεί να φτάσει το 8-12% στην αξία των κατοικιών – ζημιά που
    επιβαρύνει δυσανάλογα τους κατοίκους χαμηλότερου εισοδήματος που διαμένουν
    σε αυτές τις γειτονιές.

    Η τοπική οικονομία αποδυναμώνεται. Κάθε κενό ισόγειο αντιπροσωπεύει
    μηδενισμένη επιχειρηματική δραστηριότητα, μηδενισμένες θέσεις εργασίας,
    μηδενισμένα έσοδα για τον Δήμο. Αν 3.000 κενά ισόγεια στο κέντρο
    (συντηρητική εκτίμηση επί συνόλου ~40.000 εμπορικών χώρων) απέδιδαν έστω
    μία θέση εργασίας και €5.000 ετήσια δημοτικά τέλη, η απώλεια ξεπερνά τα
    €15 εκατ. τον χρόνο μόνο σε χαμένα δημοτικά έσοδα, χωρίς να υπολογιστεί
    το κόστος στην τοπική απασχόληση και κατανάλωση.

proposal:
  body: |
    Ο Δήμος δεν μπορεί να αναγκάσει έναν ιδιοκτήτη να νοικιάσει ένα ισόγειο.
    Μπορεί όμως να κάνει κάτι πιο αποτελεσματικό: να γίνει ο ίδιος ενεργός
    μεσάζων – να συνδέει ιδιοκτήτες κενών ισογείων με επιχειρήσεις που σήμερα
    ψάχνουν χώρο, να μειώνει το κόστος και τον κίνδυνο της ενεργοποίησης, και
    να κάνει την απόφαση «ανοίγω ισόγειο» ευκολότερη από ό,τι είναι σήμερα.

    Συγκεκριμένα, ο Δήμος μπορεί να κάνει τέσσερα πράγματα.

    **Πρώτον**, ο Δήμος δημιουργεί Μητρώο Εμπορικών Ισογείων. Δεν πρόκειται
    για αγγελίες που αναρτούν οι ιδιοκτήτες όταν θέλουν να νοικιάσουν. Είναι
    ένας συστηματικός, δημόσιος κατάλογος όλων των εμπορικών ισογείων του
    Δήμου με την κατάστασή τους (ενεργό/κενό), επιτρεπόμενες χρήσεις γης βάσει
    αδειοδότησης, τετραγωνικά, και ιστορικό αδειών λειτουργίας. Δημοσιεύεται
    στη λογική των ανοιχτών δεδομένων – ορατό σε κάθε επιχειρηματία που ψάχνει
    χώρο, κάθε ερευνητή, κάθε δημοτικό σύμβουλο. Για πρώτη φορά, ο Δήμος – και
    η αγορά – θα έχουν εικόνα του τι υπάρχει, πού, και σε ποια κατάσταση.
    Χωρίς αυτή την εικόνα, καμία άλλη παρέμβαση δεν μπορεί να δρομολογηθεί.

    **Δεύτερον**, ο Δήμος ορίζει μια μικρή ομάδα 2-3 ατόμων που διαχειρίζεται
    το μητρώο και λειτουργεί ως ενεργός matchmaker. Από τη μια, επικοινωνεί με
    ιδιοκτήτες ισογείων που εμφανίζονται κενά στο μητρώο, όχι αναμένοντας να
    έρθουν αυτοί, αλλά πηγαίνοντας εκείνοι σε αυτούς. Από την άλλη, διαχειρίζεται
    μια ανοιχτή ψηφιακή πλατφόρμα ζήτησης όπου επιχειρήσεις καταχωρούν τι χώρο
    ψάχνουν: γειτονιά, τετραγωνικά, επιθυμητή χρήση.

    Αυτό διαφέρει ουσιαστικά από τις συμβατικές αγγελίες ακινήτων που δουλεύουν
    με βάση την προσφορά – δημοσιεύουν αυτό που ο ιδιοκτήτης θέλει να
    νοικιάσει. Αλλά ο ιδιοκτήτης που αφήνει το κενό του για χρόνια δεν αναρτά
    αγγελία. Ο Δήμος πηγαίνει σε αυτόν τον ιδιοκτήτη. Παράλληλα, η πλατφόρμα
    ζήτησης αντιστρέφει τη λογική της αγοράς: αντί η επιχείρηση να ψάχνει τυχαία
    σε αγγελίες, δηλώνει ανοιχτά τι χρειάζεται – και ο Δήμος βλέπει και τις δύο
    πλευρές ταυτόχρονα, κάνοντας την αντιστοίχιση που η αγορά από μόνη της δεν
    κάνει.

    Επιπλέον, η υπηρεσία είναι μη κερδοσκοπική – δεν χρεώνει προμήθεια μεσίτη,
    που συνήθως αντιστοιχεί σε 1-2 μηνιαία ενοίκια. Αυτό σημαίνει ότι είναι
    προσβάσιμη σε επιχειρήσεις που ο συμβατικός μεσίτης δεν έχει κίνητρο να
    εξυπηρετήσει: ο νέος επιχειρηματίας με περιορισμένο κεφάλαιο εκκίνησης, η
    μικρή κοινωνική επιχείρηση.

    **Τρίτον**, ο Δήμος εισάγει κίνητρα ενεργοποίησης σε δύο κατευθύνσεις. Για
    τους ιδιοκτήτες: εγγύηση ενοικίου για τους πρώτους 12 μήνες σε περίπτωση
    που ο μισθωτής αθετήσει. Το μεγαλύτερο εμπόδιο που δηλώνουν ιδιοκτήτες
    κενών ισογείων δεν είναι η έλλειψη ενδιαφέροντος αλλά ο φόβος κακού
    μισθωτή – σε έρευνα του Urban Land Institute (2022) σε 8 ευρωπαϊκές πόλεις,
    το 58% των ιδιοκτητών το ανέφερε ως πρωταρχικό εμπόδιο. Ο Δήμος δεν
    χρειάζεται να δεσμεύσει μεγάλα κεφάλαια για να προσφέρει αυτή την εγγύηση
    – αρκεί να λειτουργεί ως εγγυητής έναντι επιχειρήσεων που έχουν ήδη
    αξιολογηθεί μέσω της πλατφόρμας ζήτησης, μειώνοντας δραστικά τον πραγματικό
    κίνδυνο ενεργοποίησης. Για τις επιχειρήσεις: μείωση δημοτικών τελών 50%
    για τα πρώτα 3 χρόνια σε ισόγεια που ενεργοποιούνται μέσω του Μητρώου —
    ιδίως για χρήσεις που το μητρώο αναγνωρίζει ως ελλειμματικές στη γειτονιά
    (φαρμακείο, ιατρείο, αρτοποιείο, ή ό,τι άλλο λείπει από τη συγκεκριμένη
    περιοχή).

    **Τέταρτον**, ο Δήμος εισηγείται την απλοποίηση της αδειοδότησης για
    προσωρινές χρήσεις (meanwhile use) με μίσθωση 3-18 μηνών. Αυτό λύνει ένα
    πρακτικό πρόβλημα που σήμερα αποτρέπει πολλές βιώσιμες επιχειρήσεις από το
    να ξεκινήσουν.

    Η πλήρης διαδικασία αδειοδότησης εμπορικού χώρου στην Ελλάδα απαιτεί σε
    πολλές περιπτώσεις έγκριση πυροπροστασίας, υγειονομική άδεια, βεβαίωση
    χρήσης γης, και ενίοτε μελέτη στατικής επάρκειας. Η διαδικασία είναι
    χρονοβόρα και κοστοβόρα. Για μια μικρή, καινούρια ή/και νεοφυή επιχείρηση
    που θέλει να δοκιμάσει αν η φυσική παρουσία ή μια γειτονιά της ταιριάζει
    πριν δεσμευτεί σε κανονική μίσθωση, αυτό το χρονικό και οικονομικό κόστος
    είναι συχνά αποτρεπτικό. Η προσωρινή κατηγορία meanwhile use κατεβάζει
    αυτό το κόστος στο ελάχιστο: γνωστοποίηση αντί προέγκρισης, χωρίς μελέτες
    για βασικές χρήσεις χαμηλού κινδύνου, με απλή αυτοψία πλήρους ελέγχου. Η
    επιχείρηση δοκιμάζει, η γειτονιά αποκτά ζωή, ο ιδιοκτήτης βλέπει το ισόγειό
    του να λειτουργεί. Και αν δουλέψει, η προσωρινή άδεια γίνεται η αφετηρία
    μιας μακροχρόνιας σχέσης.

implementation:
  body: |
    Το Μητρώο Εμπορικών Ισογείων εντάσσεται στις αρμοδιότητες τήρησης
    δημοτικών μητρώων που προβλέπει ο Ν. 3463/2006 (Δημοτικός Κώδικας). Δεν
    απαιτείται νέος νόμος – απαιτείται απόφαση Δημοτικού Συμβουλίου και
    διοικητική πράξη. Τα δεδομένα αντλούνται από υπάρχουσες πηγές: άδειες
    λειτουργίας που ο Δήμος ήδη εκδίδει και δεδομένα ΑΦΜ επιχειρήσεων από την
    ΑΑΔΕ (με πρωτόκολλο διαλειτουργικότητας).

    Η ομάδα που θα κάνει το matchmaking είναι δημοτική υπηρεσία – ορίζεται με
    απόφαση Δημάρχου στο πλαίσιο του Ν. 3852/2010 που αναθέτει στους Δήμους
    αρμοδιότητες τοπικής οικονομικής ανάπτυξης. Δεν χρειάζεται νέα οργανική
    θέση: μπορεί να λειτουργήσει με υπάρχον προσωπικό ή με σύμβαση έργου.

    Η μείωση δημοτικών τελών για επιχειρήσεις που ενεργοποιούν κενά ισόγεια
    γίνεται με απόφαση Δημοτικού Συμβουλίου, στο πλαίσιο του Ν. 4483/2017 που
    εξουσιοδοτεί ρητά τους Δήμο να θεσπίζουν διαφοροποιημένα τέλη βάσει
    κοινωνικών και οικονομικών κριτηρίων.

    Το μόνο από τα τέσσερα μέτρα που δεν εξαντλείται στις δημοτικές
    αρμοδιότητες είναι η απλοποίηση αδειοδότησης για meanwhile use. Η
    γνωστοποίηση αντί προέγκρισης για νέες κατηγορίες χρήσης απαιτεί
    τροποποίηση του Ν. 4442/2016 – αρμοδιότητα του Υπουργείου Ανάπτυξης, όχι
    του Δήμου. Ο Δήμος μπορεί να εισηγηθεί αυτή την αλλαγή και να τη ζητήσει
    επίσημα, αλλά δεν μπορεί να την επιβάλει μόνος του. Τα τρία πρώτα μέτρα
    όμως δεν εξαρτώνται από αυτήν την αλλαγή – μπορούν να ξεκινήσουν άμεσα.

limitations:
  - q: "Ιδιοκτήτες που δεν θέλουν να νοικιάσουν."
    a: >
      Το πρόβλημα δεν είναι πάντα η έλλειψη ζήτησης – είναι ιδιοκτήτες που δεν
      έχουν οικονομική ανάγκη να νοικιάσουν, που κληρονόμησαν ένα ισόγειο και
      δεν το έχουν ως προτεραιότητα, ή που περιμένουν ενοίκιο που η αγορά δεν
      δικαιολογεί πλέον. Κανένα από τα τέσσερα μέτρα δεν μπορεί να αναγκάσει
      αυτόν τον ιδιοκτήτη. → Αλλά δεν χρειάζεται. Στόχος δεν είναι η μηδενική
      κενότητα αλλά η μείωσή της. Αν το ποσοστό κενών ισογείων μειωθεί, η
      γειτονιά αλλάζει αισθητά: περισσότεροι πεζοί, περισσότερα μάτια στον
      δρόμο, περισσότερες επιλογές για τον κάτοικο. Τα κίνητρα απευθύνονται
      στον ιδιοκτήτη που θέλει να νοικιάσει αλλά διστάζει – και αυτοί είναι
      αρκετοί για να αποτελούν μια κρίσιμη μάζα.

  - q: "Διοικητική ικανότητα."
    a: >
      Ένα μητρώο και μια υπηρεσία matchmaking απαιτούν ανθρώπινο δυναμικό και
      συντονισμό που οι δημοτικές υπηρεσίες δεν έχουν πάντα. → Το μητρώο
      τροφοδοτείται σε μεγάλο βαθμό αυτόματα από υπάρχουσες πηγές – άδειες
      λειτουργίας, δεδομένα ΑΑΔΕ – και όχι από χειροκίνητη καταγραφή. Η ομάδα
      πρέπει να είναι μικρή και ευέλικτη. Το μοντέλο του High Street Task Force
      αξίζει να μελετηθεί ως προς αυτό: η αγγλική εμπειρία τεκμηρίωσε ότι ο
      παράγοντας που έκανε τη διαφορά δεν ήταν το μέγεθος της ομάδας ούτε ο
      προϋπολογισμός, ήταν η εντολή. Οι High Street Advisors δεν κάθονταν σε
      γραφεία αναμένοντας αιτήσεις· είχαν ρητή εξουσιοδότηση να πηγαίνουν οι
      ίδιοι στους ιδιοκτήτες, να χτυπούν πόρτες, να διαπραγματεύονται άμεσα.

  - q: "Κίνδυνος εκτόπισης μικρών από μεγάλους."
    a: >
      Αν τα κίνητρα δεν εξειδικευτούν σωστά, τα ισόγεια μπορεί να
      ενεργοποιηθούν από αλυσίδες και franchise αντί από μικρές τοπικές
      επιχειρήσεις, αναπαράγοντας ακριβώς τον τύπο εμπορίου που δεν δίνει
      χαρακτήρα στη γειτονιά. → Η μείωση δημοτικών τελών δεν είναι οριζόντια –
      ισχύει για χρήσεις που το μητρώο αναγνωρίζει ως ελλειμματικές στη
      συγκεκριμένη γειτονιά. Η λίστα των χρήσεων μπορεί να αναθεωρείται ετησίως
      από το Δημοτικό Συμβούλιο (ή την Κοινότητα) με βάση τα δεδομένα του
      μητρώου.

  - q: "Δημοσιονομικός κίνδυνος για τον Δήμο από το κεφάλαιο που χρειάζεται να δεσμεύσει για να προσφέρει εγγύηση ενοικίου στους ιδιοκτήτες."
    a: >
      Το αποθεματικό εγγύησης δεσμεύεται αλλά θα επιστρέφει στον Δήμο στην
      πλειοψηφία των περιπτώσεων, καθώς οι εγγυήσεις ενεργοποιούνται μόνο σε
      περίπτωση αθέτησης των συμβολαίων. Στο Ρότερνταμ, όπου λειτουργεί
      παρόμοιο πρόγραμμα, το ποσοστό ενεργοποίησης εγγυήσεων δεν ξεπέρασε το
      8% των συμβάσεων – δηλαδή το πραγματικό κόστος για τον Δήμο ήταν πολύ
      μικρότερο του αρχικού δεσμευμένου κεφαλαίου.

good_practices:
  - city: Βαρκελώνη
    period: 2023–σήμερα
    body: >
      Στη Βαρκελώνη, υλοποιήθηκε το πρόγραμμα Intermedia Locals / Amunt
      Persianes – δηλαδή, «Σηκώστε τα ρολά». Η δημοτική εταιρεία Barcelona
      Activa λειτουργεί ως ενεργός matchmaker: εντοπίζει κενά ισόγεια που
      παραμένουν αδρανή για τουλάχιστον 12 μήνες, τα αξιολογεί, και τα συνδέει
      με επιχειρηματίες που ψάχνουν χώρο, με ενοίκιο τουλάχιστον 15% κάτω από
      την αγοραία τιμή. Οι ιδιοκτήτες λαμβάνουν επιδότηση έως €3.000 για
      προσαρμογή του χώρου.

  - city: Αγγλία
    period: 2019–2024
    body: >
      Στην Αγγλία, συστάθηκε το High Street Task Force, ένα εθνικό πρόγραμμα
      που συνεργάστηκε με 150 τοπικές αρχές για την ανάκαμψη εμπορικών δρόμων,
      με συνολική χρηματοδότηση £9 εκατ. Το κεντρικό εύρημα ήταν ότι ακόμα και
      σύντομες, στοχευμένες παρεμβάσεις εμπειρογνωμόνων έδιναν μετρήσιμα
      αποτελέσματα – όταν υπήρχαν τοπικές συμπράξεις. Το πρόγραμμα κατέληξε ότι
      ο κρίσιμος παράγοντας δεν ήταν τα κεφάλαια αλλά η ικανότητα τοπικής
      ηγεσίας να συντονίζει ιδιοκτήτες, επιχειρηματίες και δήμο.

