title: Αξιοποίηση ταρατσών ως χρηματοδοτικός μοχλός για αναβάθμιση πολυκατοικιών
one_line: >
  Οι ταράτσες των αθηναϊκών πολυκατοικιών αποτελούν έναν τεράστιο αναξιοποίητο
  πόρο. Με πρότυπα συμφωνίας και σαφές πλαίσιο διαχείρισης διαφορών, ο Δήμος
  μπορεί να αφήσει την προσφορά να συναντήσει τη ζήτηση, δίνοντας στις
  πολυκατοικίες μια νέα πηγή εσόδων που μπορεί να χρηματοδοτήσει την αναβάθμισή τους.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Ο Δήμος μπορεί να ετοιμάσει πρότυπα συμφωνίας (πρότυπες συμβάσεις) για τις
    πιο συνηθισμένες κατηγορίες χρήσης μιας ταράτσας, καθώς και σαφές, κατανοητό
    υλικό καθοδήγησης για τη διαχείριση των διαφορών που μπορεί να προκύψουν.

    Δεν επιβάλλει καμία χρήση. Απλώς δημιουργεί τις συνθήκες ώστε να συναντηθεί
    η προσφορά με τη ζήτηση, μειώνοντας το κόστος συναλλαγής για όποια
    πολυκατοικία ή ιδιοκτήτη θέλει να αξιοποιήσει την ταράτσα του. Έτσι, η
    ταράτσα μπορεί να γίνει μια νέα πηγή εσόδων – έσοδα που μπορούν να
    χρηματοδοτήσουν την ίδια την αναβάθμιση της πολυκατοικίας.

    Οι δυνητικές χρήσεις ανήκουν σε διαφορετικές κατηγορίες.

    Η πιο προφανής κατηγορία είναι οι εφήμερες χρήσεις – μια εκδήλωση, ένα
    πάρτι, ένα γεύμα με θέα. Πρόκειται για ζήτηση που ήδη υπάρχει στην πόλη,
    αλλά δεν έχει επαρκή προσφορά.

    Δεύτερη κατηγορία είναι οι επιχειρήσεις που αναζητούν χώρο για εταιρικές
    εκδηλώσεις – π.χ. για private events και corporate dinners που χρειάζονται
    κάτι διαφορετικό από μια συμβατική αίθουσα.

    Τρίτη κατηγορία είναι η τοποθέτηση φωτοβολταϊκών: η ταράτσα γίνεται χώρος
    παραγωγής ενέργειας, με άμεσο οικονομικό όφελος για την πολυκατοικία.

    Τέταρτη κατηγορία είναι δράσεις εταιρικής κοινωνικής ευθύνης. Η ταράτσα εδώ
    γίνεται ο χώρος που θα φιλοξενήσει παρεμβάσεις με μετρήσιμο αποτύπωμα:
    πράσινες οροφές, σταθμοί μέτρησης ποιότητας αέρα ή ηχορρύπανσης, μέλισσια.

