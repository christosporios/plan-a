# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΠΡΟΣΙΤΗ ΚΑΤΟΙΚΙΑ & ΠΟΙΟΤΙΚΑ ΚΤΙΡΙΑ» ─────────────
contribution:
  body: |
    Οι ταράτσες της Αθήνας παραμένουν μια αναξιοποίητη υποδομή της πόλης. Δεν
    υπάρχει κάποια καταγραφή τους – δεν έχουμε μια σαφή εικόνα της έκτασής τους,
    της λειτουργικότητάς τους, του ιδιοκτησιακού καθεστώτος τους. Αυτή
    καθαυτή η απουσία δεδομένων είναι ενδεικτική: πρόκειται για χώρους που η
    πόλη δεν έχει σκεφτεί ακόμα σοβαρά. Ανεκδοτολογικά – ή και κοιτώντας την
    πόλη από ψηλά –, έχουμε όλοι την αίσθηση ότι οι ταράτσες των πολυκατοικιών
    μας δεν έχουν ζωή.

    Ο λόγος διαφέρει ανάλογα με το ιδιοκτησιακό καθεστώς. Όταν η ταράτσα ανήκει
    σε έναν ιδιοκτήτη, το εμπόδιο δεν είναι νομικό. Ελλείψει μιας σαφούς και
    ελκυστικής χρήσης, ο ιδιοκτήτης δεν έχει λόγο να δράσει. Όταν η ταράτσα
    είναι κοινόχρηστη, η αξιοποίηση απαιτεί συλλογικό συντονισμό που είναι
    δύσκολος να επιτευχθεί. Και το πρόβλημα αυτό επιτείνεται όταν δεν υπάρχει
    καν μια συγκεκριμένη πρόταση στο τραπέζι, γιατί τότε δεν υπάρχει ούτε το
    κίνητρο για να ξεκινήσει η συζήτηση.

    Το κρίσιμο για τον στόχο της προσιτής κατοικίας και των ποιοτικών κτιρίων
    είναι το εξής: η αξιοποίηση της ταράτσας δεν είναι αυτοσκοπός, αλλά ένας
    χρηματοδοτικός μοχλός. Μια πολυκατοικία που εξασφαλίζει ένα σταθερό ή
    εφάπαξ έσοδο από την ταράτσα της αποκτά πόρους για να χρηματοδοτήσει την
    αναβάθμισή της – από τη μόνωση και την ενεργειακή θωράκιση μέχρι τη
    συντήρηση των κοινόχρηστων. Έτσι, ένας αδρανής χώρος μετατρέπεται σε
    εργαλείο βελτίωσης του ίδιου του κτιρίου.
  body_after: |
    Ο ρόλος του Δήμου είναι να χαμηλώσει το κόστος συναλλαγής, όχι να γίνει
    μεσάζοντας. Δύο εργαλεία αρκούν.

    1. **Πρότυπα συμφωνίας για τις πιο συνηθισμένες κατηγορίες χρήσης:** ένα
    σύνολο από πρότυπες συμβάσεις για εφήμερες εκδηλώσεις, φωτοβολταϊκά,
    εταιρικές εγκαταστάσεις και δράσεις εταιρικής κοινωνικής ευθύνης – ώστε η
    πολυκατοικία να γνωρίζει εκ των προτέρων τι υπογράφει, ποια είναι τα
    δικαιώματά της και ποιες οι υποχρεώσεις της, χωρίς να χρειάζεται να
    σχεδιάσει από το μηδέν τη δική της σύμβαση κάθε φορά. Μέσα από αυτές τις
    πρότυπες συμβάσεις μπορεί επίσης να ενσωματωθεί η αρχή ότι το οικονομικό
    όφελος της χρήσης κοινόχρηστου χώρου διαμοιράζεται και στους κατοίκους.

    2. **Σαφές πλαίσιο για τη διαχείριση διαφορών:** καθοδηγητικό υλικό που
    απαντά ποιος είναι ο αρμόδιος φορέας, ποια η διαδικασία, και μέχρι ποιο
    σημείο φτάνει η ευθύνη του Δήμου.

    Πόλεις στο εξωτερικό έχουν ήδη αντιμετωπίσει τις ταράτσες ως πόρο. Στο
    Ρότερνταμ, τα [Rotterdam Rooftop Days](https://www.metalocus.es/en/news/innovation-rotterdam-rooftop-days-rotterdam-rooftop-catalogue-mvrdv)^1
    χαρτογραφούν και ενεργοποιούν τις στέγες της πόλης για ένα ευρύ φάσμα
    χρήσεων, ενώ το δίκτυο [URBACT καταγράφει ευρωπαϊκές καλές πρακτικές](https://urbact.eu/articles/temporary-use-european-good-practices)^2
    για την προσωρινή χρήση αστικών χώρων που σήμερα μένουν αδρανείς.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Εμπορευματοποίηση του κοινόχρηστου χώρου της πολυκατοικίας."
    a: >
      Η συμμετοχή είναι εθελοντική. Αν οι κάτοικοι δεν θέλουν να αξιοποιήσουν την
      ταράτσα τους, δεν το κάνουν. Αλλά η ίδια η διαδικασία λήψης αυτής της
      απόφασης έχει αξία: μια πολυκατοικία που συζητά τι θέλει να κάνει με την
      ταράτσα της καλλιεργεί μια ικανότητα να κάνει διάλογο και αυτό μπορεί να
      έχει spillover οφέλη και σε άλλες αποφάσεις. Επιπλέον, ακόμα και αν
      αποφασίσουν να μην τη νοικιάσουν, η ύπαρξη έτοιμων προτύπων συμφωνίας τούς
      δείχνει ότι άλλοι αξιοποιούν αυτό που έχουν – και αυτό από μόνο του μπορεί
      να κινητοποιήσει μια πολυκατοικία να αξιοποιήσει την ταράτσα της, κάτι που
      είναι επίσης θεμιτό αποτέλεσμα.

  - q: "Ευθύνη λήψης απόφασης και διαμοιρασμός κόστους/οφέλους."
    a: >
      Η πρόταση δεν αλλάζει το πώς λαμβάνονται οι αποφάσεις εντός μιας συνέλευσης
      πολυκατοικίας: οι ιδιοκτήτες εξακολουθούν να αποφασίζουν. Αξίζει να
      σημειωθεί ότι το ερώτημα της ομοφωνίας – αν δηλαδή απαιτείται συναίνεση
      όλων ή αρκεί πλειοψηφία για την αξιοποίηση κοινόχρηστου χώρου – δεν είναι
      θέμα των προτύπων συμφωνίας. Το ορίζει το καταστατικό της κάθε
      πολυκατοικίας, και τα πρότυπα δεν επιχειρούν να το παρακάμψουν ούτε να
      επιβάλουν κάτι στη μειοψηφία. Αυτό που κάνουν τα πρότυπα είναι να παίρνουν
      μια σαφή θέση στο θέμα των εσόδων: εισάγεται η αρχή ότι το οικονομικό
      όφελος της χρήσης κοινόχρηστου χώρου πρέπει να διαμοιράζεται (και) στους
      κατοίκους. Όταν ιδιοκτήτης και ένοικος συμπίπτουν, το ζήτημα είναι απλό:
      το όφελος πηγαίνει στο ίδιο πρόσωπο που και αποφασίζει και βιώνει τον χώρο.
      Όταν όμως ο ιδιοκτήτης δεν κατοικεί στο διαμέρισμά του, το έσοδο μοιράζεται
      μεταξύ ιδιοκτήτη και ενοίκου. Έτσι, ο ιδιοκτήτης έχει κίνητρο να
      συναινέσει, και ο ένοικος αποζημιώνεται για την οποιαδήποτε όχληση. Τα
      συμφέροντα ευθυγραμμίζονται, χωρίς να χρειαστεί να αλλάξει τίποτα στο
      νομικό καθεστώς της πολυκατοικίας.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Πόροι για την αναβάθμιση των κτιρίων
    body: >
      Το βασικό όφελος είναι ότι η ταράτσα παύει να είναι νεκρός χώρος και
      γίνεται πηγή εσόδων που μπορεί να κατευθυνθεί στη συντήρηση και την
      ενεργειακή αναβάθμιση της ίδιας της πολυκατοικίας – ένα αυτοχρηματοδοτούμενο
      μονοπάτι βελτίωσης που δεν στηρίζεται αποκλειστικά σε δημόσια επιδότηση.

  - title: Περιβαλλοντικό και κλιματικό αποτύπωμα
    body: >
      Όταν η ταράτσα φιλοξενεί φωτοβολταϊκά ή πράσινες οροφές, το όφελος
      ξεπερνά την πολυκατοικία: παράγεται καθαρή ενέργεια, μειώνεται η
      θερμότητα που εκπέμπει η πόλη και βελτιώνεται η ποιότητα του αέρα στη
      γειτονιά.

  - title: Καλλιέργεια συλλογικής λειτουργίας
    body: >
      Η συζήτηση για το τι θα κάνει μια πολυκατοικία με την ταράτσα της είναι
      μια ευκαιρία να ασκηθεί η συνέλευση στη συλλογική λήψη αποφάσεων – μια
      ικανότητα με spillover οφέλη και σε άλλες κοινές αποφάσεις.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Κατάρτιση των πρότυπων συμφωνιών
    body: >
      Να συνταχθούν, με νομική και τεχνική υποστήριξη, οι πρότυπες συμβάσεις για
      τις πιο εμβληματικές κατηγορίες χρήσης – εφήμερες εκδηλώσεις, φωτοβολταϊκά,
      εταιρικές εγκαταστάσεις, δράσεις εταιρικής κοινωνικής ευθύνης – με
      ενσωματωμένη την αρχή του διαμοιρασμού του οφέλους προς τους κατοίκους.

  - title: Οδηγός διαχείρισης διαφορών
    body: >
      Να ετοιμαστεί σαφές, κατανοητό υλικό καθοδήγησης που ορίζει τον αρμόδιο
      φορέα, τη διαδικασία επίλυσης διαφορών και τα όρια της ευθύνης του Δήμου,
      ώστε μια πολυκατοικία να ξέρει εκ των προτέρων πού να απευθυνθεί αν κάτι
      πάει στραβά.

