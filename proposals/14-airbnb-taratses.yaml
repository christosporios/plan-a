number: 14
slug: airbnb-taratses
theme: housing
title: Ένα Airbnb για ταράτσες
one_line: >
  Μια δημοτική πλατφόρμα συνδέει ιδιοκτήτες και πολυκατοικίες με ταράτσα με
  όσους ψάχνουν χώρο για εφήμερες εκδηλώσεις, εταιρικές χρήσεις, φωτοβολταϊκά
  ή πράσινες οροφές — με πρότυπα συμβόλαια και μοίρασμα του οφέλους με τους
  ενοίκους.

problem:
  body: |
    Οι ταράτσες της Αθήνας παραμένουν μια αναξιοποίητη υποδομή της πόλης. Δεν
    υπάρχει κάποια καταγραφή τους – δεν έχουμε μια σαφή εικόνα της έκτασής τους,
    της λειτουργικότητάς τους, του ιδιοκτησιακού καθεστώτος τους. Αυτή
    καθαυτή η απουσία δεδομένων είναι ενδεικτική: πρόκειται για χώρους που η
    πόλη δεν έχει σκεφτεί ακόμα σοβαρά. Ανεκδοτολογικά – ή και κοιτώντας την
    πόλη από ψηλά –, έχουμε όλοι την αίσθηση ότι οι ταράτσες των πολυκατοικιών
    μας δεν έχουν ζωή.

    Ο λόγος διαφέρει ανάλογα με το ιδιοκτησιακό καθεστώς. Όταν η ταράτσα ανήκει
    σε έναν ιδιοκτήτη, το εμπόδιο δεν είναι νομικό. Ελλείψει μιας σαφούς και
    ελκυστικής χρήσης, ο ιδιοκτήτης δεν έχει λόγο να δράσει. Όταν η ταράτσα
    είναι κοινόχρηστη, πρόκειται για κλασικό πρόβλημα tragedy of the commons
    όπου η αξιοποίηση απαιτεί συλλογικό συντονισμό που είναι δύσκολος να
    επιτευχθεί. Και το πρόβλημα αυτό επιτείνεται όταν δεν υπάρχει καν μια
    συγκεκριμένη πρόταση στο τραπέζι, γιατί τότε δεν υπάρχει ούτε το κίνητρο
    για να ξεκινήσει η συζήτηση.

proposal:
  body: |
    Ο Δήμος μπορεί να δημιουργήσει μια πλατφόρμα που να συνδέει όσους έχουν
    και όσους ψάχνουν ταράτσα.

    Η εγγραφή στην πλατφόρμα δίνει στον ιδιοκτήτη ή στην πολυκατοικία κάτι που
    δεν είχε: μια συγκεκριμένη εικόνα του τι είναι δυνατό. Στην περίπτωση
    μεμονωμένης ιδιοκτησίας, αρκεί η απόφαση ενός. Στην περίπτωση κοινόχρηστης
    ταράτσας, η ύπαρξη μιας εν δυνάμει ελκυστικής πρότασης, με σαφές οικονομικό
    όφελος, αποτελεί το κίνητρο που χρειάζεται η συνέλευση για να γίνει και να
    συγκλίνει.

    Οι δυνητικοί χρήστες ανήκουν σε διαφορετικές κατηγορίες.

    Η πιο προφανής κατηγορία είναι οι ιδιώτες που αναζητούν χώρο για εφήμερες
    χρήσεις – μια εκδήλωση, ένα πάρτι, ένα γεύμα με θέα. Πρόκειται για ζήτηση
    που ήδη υπάρχει στην πόλη, αλλά δεν έχει επαρκή προσφορά.

    Δεύτερη κατηγορία είναι οι επιχειρήσεις που αναζητούν χώρο για εταιρικές
    εκδηλώσεις –π.χ. για private events και corporate dinners που χρειάζονται
    κάτι διαφορετικό από μια συμβατική αίθουσα.

    Τρίτη κατηγορία είναι επιχειρήσεις που χρειάζονται αστική παρουσία για
    κάποιο κομμάτι της λειτουργίας τους, χωρίς να χρειάζονται κλειστό
    χώρο/γραφείο. Για παράδειγμα, μια εταιρεία μπορεί να χρειάζεται σημεία
    αποθήκευσης ή ανεφοδιασμού διάσπαρτα μέσα στον αστικό ιστό και άρα, μια
    ταράτσα μπορεί να εξυπηρετεί τις ανάγκες της σε μια συγκεκριμένη περιοχή.

    Τέταρτη κατηγορία είναι επιχειρήσεις που αναζητούν χώρο για δράσεις
    εταιρικής κοινωνικής ευθύνης. Η ταράτσα εδώ γίνεται ο χώρος που θα
    φιλοξενήσει παρεμβάσεις με μετρήσιμο αποτύπωμα: φωτοβολταϊκά πάνελ,
    σταθμοί μέτρησης ποιότητας αέρα ή ηχορρύπανσης, μέλισσια, πράσινες οροφές.

    Με αυτήν την πλατφόρμα, ο Δήμος δεν επιβάλλει καμία χρήση. Απλώς δημιουργεί
    τις συνθήκες για να συναντηθεί η προσφορά με τη ζήτηση – και αφήνει την
    αγορά και την κοινότητα να αποφασίσουν, ώστε η θέληση – όπου υπάρχει – να
    μπορεί πλέον να μετατραπεί σε πράξη.

implementation:
  body: |
    Η υλοποίηση μιας τέτοιας πλατφόρμας δεν είναι τεχνικά απαιτητική. Ένα
    πιθανό μοντέλο υλοποίησης είναι ο Δήμος να προκηρύξει διαγωνισμό για την
    ανάθεση της λειτουργίας της πλατφόρμας σε ιδιώτη ανάδοχο. Χρειάζονται τρία
    πράγματα. Πρώτον, ένα σύστημα πιστοποίησης: όσοι καταχωρούν ταράτσα στην
    πλατφόρμα επαληθεύονται ως προς το ιδιοκτησιακό τους καθεστώς, και όσοι
    αναζητούν χώρο επαληθεύονται ως προς την ταυτότητα και, ανάλογα με τη
    χρήση, ως προς την επαγγελματική τους ιδιότητα. Δεύτερον, ένα σύνολο από
    πρότυπα συμφωνίας για τις πιο εμβληματικές κατηγορίες χρήσης – εφήμερες
    εκδηλώσεις, φωτοβολταϊκά, εταιρικές εγκαταστάσεις – ώστε η πολυκατοικία
    να γνωρίζει εκ των προτέρων τι υπογράφει, ποια είναι τα δικαιώματά της και
    ποιες οι υποχρεώσεις της. Τρίτον, ένα σαφές πλαίσιο για τη διαχείριση
    διαφορών – ποιος είναι ο αρμόδιος φορέας, ποια η διαδικασία, και μέχρι
    ποιο σημείο φτάνει η ευθύνη του Δήμου.

limitations:
  - q: "Εμπορευματοποίηση του κοινόχρηστου χώρου της πολυκατοικίας."
    a: >
      Η συμμετοχή είναι εθελοντική. Αν οι κάτοικοι δεν θέλουν να νοικιάσουν την
      ταράτσα τους, δεν το κάνουν. Αλλά η ίδια η διαδικασία λήψης αυτής της
      απόφασης έχει αξία: μια πολυκατοικία που συζητά τι θέλει να κάνει με την
      ταράτσα της καλλιεργεί μια ικανότητα να κάνει διάλογο και αυτό μπορεί να
      έχει spillover οφέλη και σε άλλες αποφάσεις. Επιπλέον, ακόμα και αν
      αποφασίσουν να μην τη νοικιάσουν, η πλατφόρμα τούς δείχνει ότι άλλοι
      πληρώνουν για αυτό που έχουν – και αυτό από μόνο του μπορεί να
      κινητοποιήσει μια πολυκατοικία να αξιοποιήσει την ταράτσα της, κάτι που
      είναι επίσης θεμιτό αποτέλεσμα.

  - q: "Ευθύνη λήψης απόφασης και διαμοιρασμός κόστους/οφέλους."
    a: >
      Η πρόταση δεν αλλάζει το πώς λαμβάνονται οι αποφάσεις εντός μια συνέλευσης
      πολυκατοικίας: οι ιδιοκτήτες εξακολουθούν να αποφασίζουν. Αξίζει να
      σημειωθεί ότι το ερώτημα της ομοφωνίας – αν δηλαδή απαιτείται συναίνεση
      όλων ή αρκεί πλειοψηφία για την αξιοποίηση κοινόχρηστου χώρου – δεν είναι
      θέμα της πλατφόρμας. Το ορίζει το καταστατικό της κάθε πολυκατοικίας, και
      η πλατφόρμα δεν επιχειρεί να το παρακάμψει ούτε να επιβάλει κάτι στη
      μειοψηφία. Αν μια πολυκατοικία απαιτεί ομοφωνία και κάποιος αντιτίθεται,
      αυτό είναι ήδη πρόβλημα για κάθε άλλη κοινή απόφαση. Αυτό που κάνει η
      πλατφόρμα είναι να παίρνει μια σαφή θέση στο θέμα των εσόδων: μέσα από
      τις πρότυπες συμβάσεις που προδιαγράφει ο Δήμος, εισάγεται η αρχή ότι το
      οικονομικό όφελος της χρήσης κοινόχρηστου χώρου πρέπει να διαμοιράζεται
      (και) στους κατοίκους. Όταν ιδιοκτήτης και ένοικος συμπίπτουν, το ζήτημα
      είναι απλό: το όφελος πηγαίνει στο ίδιο πρόσωπο που και αποφασίζει και
      βιώνει τον χώρο. Όταν όμως ο ιδιοκτήτης δεν κατοικεί στο διαμέρισμά του,
      το έσοδο μοιράζεται 50-50 μεταξύ ιδιοκτήτη και ενοίκου. Έτσι, ο
      ιδιοκτήτης έχει κίνητρο να συναινέσει, και ο ένοικος αποζημιώνεται για
      την οποιαδήποτε όχληση. Τα συμφέροντα ευθυγραμμίζονται, χωρίς να
      χρειαστεί να αλλάξει τίποτα στο νομικό καθεστώς της πολυκατοικίας.

good_practices:
  - city: Ρότερνταμ
    body: >
      Στο Ρότερνταμ, ο δήμος ανέθεσε σε ένα αρχιτεκτονικό γραφείο τη δημιουργία
      ενός καταλόγου 130 πιθανών χρήσεων για ταράτσες – από αθλητικές
      εγκαταστάσεις και αστικές καλλιέργειες μέχρι χώρους κατοικίας και
      ενέργειας.^1 Ο κατάλογος απαντά και σε πρακτικά ερωτήματα: ποιες χρήσεις
      είναι κατάλληλες για ποιους τύπους κτιρίων. Η λογική είναι παρόμοια με
      αυτή της πρότασης: η αδράνεια δεν προκύπτει πάντα από έλλειψη θέλησης,
      αλλά συχνά από έλλειψη πληροφορίας. Η ενεργοποίηση μιας ταράτσας μπορεί
      να ξεκινήσει απλώς από το να μειωθεί η απόσταση μεταξύ του «δεν ξέρω τι
      να κάνω με αυτόν τον χώρο» και μιας συγκεκριμένης, εφικτής πρότασης.

  - city: Βερολίνο (Νόικελν)
    body: >
      Στο Νόικελν, μια από τις πιο πυκνοκατοικημένες συνοικίες του Βερολίνου,
      ένας οργανισμός με δημόσια χρηματοδότηση ανέλαβε τον ρόλο του ενδιάμεσου
      μεταξύ ιδιοκτητών κενών χώρων και ανθρώπων που τους αναζητούσαν.^2 Το
      Coopolis διατηρούσε βάση δεδομένων με τους διαθέσιμους χώρους και τους
      ενδιαφερόμενους χρήστες, οργάνωνε open door events για να φέρει τις δύο
      πλευρές σε επαφή, και λειτουργούσε ως ουδέτερος διαμεσολαβητής, κάτι που
      ήταν κρίσιμο, γιατί και οι δύο πλευρές εμπιστεύονταν έναν φορέα που δεν
      εκπροσωπούσε αποκλειστικά τα συμφέροντα της μίας ή της άλλης πλευράς. Σε
      τρία χρόνια λειτουργίας, δημιουργήθηκαν 150 νέοι χώροι – καφέ, εργαστήρια,
      γκαλερί, μουσικά κλαμπ – σε καταστήματα που μέχρι τότε παρέμεναν αδρανή.
      Αυτή η εμπειρία δείχνει ότι για να ενεργοποιηθούν δυνατότητες που είναι
      άγνωστες στους εμπλεκόμενους φορείς, χρειάζεται κάποιος που να εμπνέει
      εμπιστοσύνη και ανεξαρτησία. Αυτόν ακριβώς τον ρόλο μπορεί να παίξει ο
      Δήμος στην εν λόγω πρόταση.

