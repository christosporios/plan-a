title: Αξιοποίηση ταρατσών ως χρηματοδοτικός μοχλός για αναβάθμιση πολυκατοικιών
one_line: >
  Οι ταράτσες των αθηναϊκών πολυκατοικιών αποτελούν έναν τεράστιο αναξιοποίητο
  πόρο. Με πρότυπα συμφωνίας και σαφές πλαίσιο διαχείρισης διαφορών, ο Δήμος
  μπορεί να αφήσει την προσφορά να συναντήσει τη ζήτηση, δίνοντας στις
  πολυκατοικίες μια νέα πηγή εσόδων που μπορεί να χρηματοδοτήσει την αναβάθμισή τους.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Οι ταράτσες των αθηναϊκών πολυκατοικιών αποτελούν έναν τεράστιο αναξιοποίητο πόρο ως δυνητικοί χώροι για εταιρικές εκδηλώσεις, τοποθέτηση φωτοβολταϊκών, δράσεις εταιρικής κοινωνικής ευθύνης όπως ανάπτυξη πράσινων οροφών και πολλά ακόμα. Ο δήμος θα μπορούσε να ετοιμάσει πρότυπα συμφωνίας για τις πιο συνηθισμένες κατηγορίες χρήσης και σαφές υλικό με οδηγίες για τη διαχείριση διαφορών. Ο δήμος δεν επιβάλλει καμία χρήση αλλά μπορεί να δημιουργήσει τις συνθήκες για να συναντηθεί η προσφορά με τη ζήτηση, αποδίδοντας στις πολυκατοικίες μια νέα πηγή εσόδων που μπορεί να χρηματοδοτήσει την αναβάθμισή τους.

