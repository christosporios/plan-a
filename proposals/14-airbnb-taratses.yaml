# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΠΡΟΣΙΤΗ ΚΑΤΟΙΚΙΑ & ΑΝΑΒΑΘΜΙΣΜΕΝΑ ΚΤΙΡΙΑ» ─────────
contribution:
  body: |
    Τα κτίρια της Αθήνας χρήζουν σε μεγάλο βαθμό αναβαθμίσεων – ενεργειακών, δομικών, αισθητικών. Μια κατεύθυνση που προτείνουμε είναι η καλύτερη σύνδεση των ιδιοκτητών με τα υπάρχοντα προγράμματα χρηματοδότησης , ώστε να αξιοποιούνται πιο αποτελεσματικά οι διαθέσιμοι πόροι. Ωστόσο, ακόμα και με βελτιωμένη πρόσβαση σε επιδοτήσεις, πολλοί ιδιοκτήτες δεν έχουν τη ρευστότητα που απαιτείται για να ξεκινήσουν ή να συμπληρώσουν τη χρηματοδότηση μιας παρέμβασης.

    Η πρόταση για αξιοποίηση των ταρατσών ακολουθεί μια διαφορετική λογική: αντί να αναζητά η πολυκατοικία πόρους από έξω, τους παράγει η ίδια. Η αξιοποίηση της ταράτσας θα μπορούσε να προσφέρει ακριβώς αυτόν τον μηχανισμό.

    Οι ταράτσες της Αθήνας παραμένουν μια αναξιοποίητη υποδομή της πόλης. Δεν υπάρχει κάποια καταγραφή τους – δεν έχουμε μια σαφή εικόνα της έκτασής τους, της λειτουργικότητάς τους, του ιδιοκτησιακού καθεστώτος τους. Αυτή καθαυτή η απουσία δεδομένων είναι ενδεικτική: πρόκειται για χώρους που η πόλη δεν έχει σκεφτεί ακόμα σοβαρά. Ανεκδοτολογικά – ή και κοιτώντας την πόλη από ψηλά –, έχουμε όλοι την αίσθηση ότι οι ταράτσες των πολυκατοικιών μας δεν έχουν ζωή.

    Ο λόγος διαφέρει ανάλογα με το ιδιοκτησιακό καθεστώς. Όταν η ταράτσα ανήκει σε έναν ιδιοκτήτη, το εμπόδιο δεν είναι νομικό. Ελλείψει μιας σαφούς και ελκυστικής χρήσης, ο ιδιοκτήτης δεν έχει λόγο να δράσει. Όταν η ταράτσα είναι κοινόχρηστη, πρόκειται για κλασικό πρόβλημα tragedy of the commons όπου η αξιοποίηση απαιτεί συλλογικό συντονισμό που είναι δύσκολος να επιτευχθεί. Και το πρόβλημα αυτό επιτείνεται όταν δεν υπάρχει καν μια συγκεκριμένη πρόταση στο τραπέζι, γιατί τότε δεν υπάρχει ούτε το κίνητρο για να ξεκινήσει η συζήτηση.

    Ο δήμος μπορεί να ετοιμάσει πρότυπες συμβάσεις για τις πιο συνηθισμένες κατηγορίες χρήσης μιας ταράτσας, καθώς και σαφές, κατανοητό υλικό καθοδήγησης για τη διαχείριση των διαφορών που μπορεί να προκύψουν. Δεν θα επιβάλλει καμία χρήση. Απλώς θα δημιουργήσει τις συνθήκες ώστε να συναντηθεί η προσφορά με τη ζήτηση, μειώνοντας το κόστος συναλλαγής για όποια πολυκατοικία ή ιδιοκτήτη θέλει να αξιοποιήσει την ταράτσα του.

    Οι δυνητικές χρήσεις ανήκουν σε διαφορετικές κατηγορίες. Η πιο προφανής κατηγορία είναι οι εφήμερες χρήσεις – μια εκδήλωση, ένα πάρτι, ένα γεύμα με θέα, για private corporate dinners που χρειάζονται κάτι διαφορετικό από μια συμβατική αίθουσα. Δεύτερη ενδεικτική κατηγορία είναι η τοποθέτηση φωτοβολταϊκών: η ταράτσα γίνεται χώρος παραγωγής ενέργειας, με άμεσο οικονομικό όφελος για την πολυκατοικία. Τρίτη κατηγορία είναι δράσεις εταιρικής κοινωνικής ευθύνης. Η ταράτσα εδώ γίνεται ο χώρος που θα φιλοξενήσει παρεμβάσεις με μετρήσιμο αποτύπωμα: πράσινες οροφές, σταθμοί μέτρησης ποιότητας αέρα ή ηχορρύπανσης, μελίσια.

    Έμπνευση μπορεί να αντληθεί από το Ρότερνταμ, όπου ο δήμος ανέθεσε σε ένα αρχιτεκτονικό γραφείο τη δημιουργία ενός [καταλόγου 130 πιθανών χρήσεων για ταράτσες](https://www.metalocus.es/en/news/innovation-rotterdam-rooftop-days-rotterdam-rooftop-catalogue-mvrdv)^1 – από αθλητικές εγκαταστάσεις και αστικές καλλιέργειες μέχρι χώρους κατοικίας και ενέργειας. Ο κατάλογος απαντά και σε πρακτικά ερωτήματα: ποιες χρήσεις είναι κατάλληλες για ποιους τύπους κτιρίων. Η ενεργοποίηση μιας ταράτσας μπορεί να ξεκινήσει απλώς από το να μειωθεί η απόσταση μεταξύ του «δεν ξέρω τι να κάνω με αυτόν τον χώρο» και μιας συγκεκριμένης, εφικτής πρότασης.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Ποιος εγγυάται ότι τα έσοδα θα πάνε όντως στην αναβάθμιση του κτιρίου και όχι απλώς στους ιδιοκτήτες;"
    a: >
      Κανείς. Η πρόταση δεν επιβάλλει πώς θα διαθέσει μια πολυκατοικία τα έσοδά
      της. Αυτό είναι απόφαση των ίδιων των κατοίκων. Αυτό που κάνει είναι να
      δημιουργεί πόρους που σήμερα δεν υπάρχουν και που θα μπορούσαν να
      προορίζονται για την αναβάθμιση του κτιριακού αποθέματος – το τι θα κάνουν
      με αυτούς οι κάτοικοι, εν τέλει, είναι δικό τους θέμα.

  - q: "Τι γίνεται με την ασφάλεια και την ευθύνη κατά τη διάρκεια χρήσης της ταράτσας από τρίτους;"
    a: >
      Αυτό ρυθμίζεται από τις συμβάσεις, οι οποίες θα πρέπει να προβλέπουν
      υποχρεωτική ασφαλιστική κάλυψη του χρήστη, σαφή οριοθέτηση ευθύνης, και
      ελάχιστα τεχνικά πρότυπα για τη χρήση του χώρου. Αυτά τα πράγματα πρέπει να
      διατυπωθούν με σαφήνεια ώστε και οι πολυκατοικίες να μην φοβούνται να
      προχωρήσουν σε κάποια συνέργεια.

  - q: "Δεν εμπορευματοποιείται έτσι ο κοινόχρηστος χώρος της ταράτσας μιας πολυκατοικίας;"
    a: >
      Η συμμετοχή είναι εθελοντική. Αν οι κάτοικοι δεν θέλουν να νοικιάσουν την
      ταράτσα τους, δεν το κάνουν. Για παράδειγμα, αν έχουν ήδη όμορφες, μη
      εμπορικές χρήσεις για την ταράτσα τους, κανείς δεν τους εξαναγκάζει να τις
      νοικιάσουν. Η πρόταση απευθύνεται κυρίως στις υπόλοιπες ταράτσες, τις
      αδρανείς, δίνοντας μια επιλογή που σήμερα δεν έχουν. Η επικοινωνία αυτής
      της επιλογής μπορεί επίσης να λειτουργήσει ως καθρέφτης: όταν μια
      πολυκατοικία διαπιστώσει ότι άλλοι πληρώνουν για αυτό που έχει, αυτό μπορεί
      να την κινητοποιήσει να αξιοποιήσει την ταράτσα της και με μη εμπορικούς
      τρόπους, αν αυτό προτιμά, κάτι που και αυτό θα λογιζόταν ως επιτυχία του
      εγχειρήματος.

  - q: "Τι γίνεται αν κάποιοι ιδιοκτήτες συμφωνούν και άλλοι όχι; Ποιος αποφασίζει και πώς μοιράζονται τα έσοδα;"
    a: >
      Η πρόταση δεν αλλάζει το πώς λαμβάνονται οι αποφάσεις εντός μια συνέλευσης
      πολυκατοικίας: οι ιδιοκτήτες εξακολουθούν να αποφασίζουν. Αξίζει να
      σημειωθεί ότι το ερώτημα της ομοφωνίας – αν δηλαδή απαιτείται συναίνεση
      όλων ή αρκεί πλειοψηφία για την αξιοποίηση κοινόχρηστου χώρου – δεν είναι
      θέμα της παροχής αυτής της επιλογής. Το ορίζει το καταστατικό της κάθε
      πολυκατοικίας, και η πρακτική αυτή δεν επιχειρεί να το παρακάμψει ούτε να
      επιβάλει κάτι στη μειοψηφία. Αν μια πολυκατοικία απαιτεί ομοφωνία και
      κάποιος αντιτίθεται, αυτό είναι ήδη πρόβλημα για κάθε άλλη κοινή απόφαση.
      Αυτό που πρέπει να συζητηθεί είναι το θέμα των εσόδων: μέσα από τις πρότυπες
      συμβάσεις που προδιαγράφει ο Δήμος, μπορεί να εισάγεται η αρχή ότι το
      οικονομικό όφελος της χρήσης κοινόχρηστου χώρου πρέπει να διαμοιράζεται
      (και) στους κατοίκους. Όταν ιδιοκτήτης και ένοικος συμπίπτουν, το ζήτημα
      είναι απλό: το όφελος πηγαίνει στο ίδιο πρόσωπο που και αποφασίζει και
      βιώνει τον χώρο. Όταν όμως ο ιδιοκτήτης δεν κατοικεί στο διαμέρισμά του, το
      έσοδο μοιράζεται 50-50 μεταξύ ιδιοκτήτη και ενοίκου. Έτσι, ο ιδιοκτήτης
      έχει κίνητρο να συναινέσει, και ο ένοικος αποζημιώνεται για την οποιαδήποτε
      όχληση.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Περιβαλλοντικό και κλιματικό αποτύπωμα
    body: >
      Όταν η ταράτσα φιλοξενεί φωτοβολταϊκά ή πράσινες οροφές, το όφελος ξεπερνά
      την πολυκατοικία: παράγεται καθαρή ενέργεια, μειώνεται η θερμότητα που
      εκπέμπει η πόλη και βελτιώνεται η ποιότητα του αέρα στη γειτονιά.

  - title: Καλλιέργεια συλλογικής λειτουργίας
    body: >
      Η συζήτηση για το τι θα κάνει μια πολυκατοικία με την ταράτσα της είναι μια
      ευκαιρία να καλλιεργηθεί η ικανότητας της συλλογικής λήψης αποφάσεων – μια
      ικανότητα με spillover οφέλη και σε άλλες κοινές αποφάσεις.

  - title: Ενίσχυση της σχέσης ιδιοκτητών-ενοίκων
    body: >
      Σε μια πόλη με υψηλά ποσοστά ενοικίασης και συχνά τεταμένες σχέσεις μεταξύ
      ιδιοκτητών και ενοίκων, ένας μηχανισμός που ευθυγραμμίζει τα συμφέροντά τους
      γύρω από έναν κοινό πόρο μπορεί να λειτουργήσει ως μικρή αλλά ουσιαστική
      γέφυρα εμπιστοσύνης.

  - title: Νέες ευκαιρίες για μικρές επιχειρήσεις και δημιουργική οικονομία
    body: >
      Οι ταράτσες είναι ιδιαίτερα γόνιμες για μικρές δράσεις. Αυτού του είδους η
      χρήση δεν απαιτεί μακροχρόνια μίσθωση και άρα είναι προσβάσιμη σε
      επιχειρήσεις και δημιουργικούς επαγγελματίες που σήμερα αποκλείονται από
      την αγορά εμπορικών χώρων λόγω κόστους και ρίσκου.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - category: legal
    body: >
      Δεν απαιτείται νέα νομοθεσία – το υφιστάμενο πλαίσιο ήδη ρυθμίζει τη χρήση
      κοινόχρηστων χώρων. Αυτό που χρειάζεται είναι να οργανωθεί και να
      επικοινωνηθεί με τρόπο προσβάσιμο από μια κοινή συνέλευση πολυκατοικίας: τι
      επιτρέπεται και τι όχι, ποιος φέρει ευθύνη σε κάθε περίπτωση, πώς λαμβάνεται
      η απόφαση, πώς μοιράζονται τα έσοδα. Και πρότυπες συμβάσεις ανά τύπο χρήσης
      θα μεταφράζουν αυτό το πλαίσιο σε εργαλείο που μπορεί να χρησιμοποιήσει κάθε
      πολυκατοικία χωρίς να χρειαστεί νομική συμβουλή.

  - category: financial-flow
    body: >
      Αξίζει να διερευνηθεί αν έχει νόημα μια πιο ενεργή υπηρεσία matching –
      δημόσια η ιδιωτική – που θα φέρνει ενεργά τις δύο πλευρές σε επαφή. Το
      παράδειγμα του Coopolis [στο Νόικελν του Βερολίνου](https://urbact.eu/articles/temporary-use-european-good-practices)^2
      είναι ενδεικτικό: ένας οργανισμός με δημόσια χρηματοδότηση ανέλαβε τον ρόλο
      του ενδιάμεσου μεταξύ ιδιοκτητών κενών χώρων και ανθρώπων που τους
      αναζητούσαν, διατηρώντας βάση δεδομένων, οργανώνοντας open door events και
      λειτουργώντας ως ουδέτερος διαμεσολαβητής που εμπιστεύονταν και οι δύο
      πλευρές. Σε τρία χρόνια, δημιουργήθηκαν 150 νέοι χώροι σε καταστήματα που
      παρέμεναν αδρανή. Το δίδαγμα είναι ότι για να ενεργοποιηθούν δυνατότητες
      που οι ίδιοι οι εμπλεκόμενοι αγνοούν, καμιά φορά χρειάζεται κάποιος που να
      εμπνέει εμπιστοσύνη και ανεξαρτησία.

