number: 14
slug: coliving-neoi
theme: housing
title: Co-living λύσεις για νέους
one_line: >
  Ο Δήμος μπορεί να υποστηρίξει τη δημιουργία δημοτικών co-living χώρων για
  νέους 18–35 ετών, αξιοποιώντας τη δημοτική περιουσία και ενοίκια συνδεδεμένα
  με το εισόδημα.

problem:
  body: |
    Τα στεγαστικά έξοδα αντιπροσωπεύουν περίπου το 36% του διαθέσιμου εισοδήματος
    των ελληνικών νοικοκυριών. Στην ΕΕ, οι πολίτες δίνουν κατά μέσο όρο το 1/5
    του διαθέσιμου εισοδήματός τους για τα στεγαστικά έξοδα. Αλλά οι Έλληνες
    πάνω από το 1/3. Η Ελλάδα έχει μακράν το υψηλότερο ποσοστό πολιτών που
    επιβαρύνονται δυσανάλογα από το στεγαστικό κόστος (29%). Δηλαδή, σχεδόν 1
    στα 3 νοικοκυριά. Ο αντίστοιχος ευρωπαϊκός μέσος όρος εκτιμάται στο 10%.
    Δηλαδή, μόλις σχεδόν 1 στους 10.

    Η βιβλιογραφία τεκμηριώνει ότι η αβεβαιότητα για τα στεγαστικά έξοδα αυξάνει
    τον κίνδυνο εμφάνισης διαταραχής ψυχικής υγείας και διαταραχής ύπνου — με
    αυξημένα ποσοστά για τους ενοικιαστές, τους νέους και τα νοικοκυριά με
    παιδιά. Η υψηλή στεγαστική επιβάρυνση συνδέεται επίσης με αυξημένο κίνδυνο
    παχυσαρκίας και υπέρτασης.^1 Παράλληλα, η κρίση έχει δημογραφικές συνέπειες:
    η αύξηση των τιμών στέγης συσχετίζεται με μείωση των γεννήσεων και
    καθυστέρηση δημιουργίας οικογένειας.^2 Τέλος, έχει και οικονομικές
    επιπτώσεις: η δυσκολία στέγασης σε πόλεις υψηλής παραγωγικότητας περιορίζει
    την κινητικότητα των εργαζομένων, υπονομεύει την καινοτομία και μειώνει την
    πιθανότητα ανάληψης επιχειρηματικής δραστηριότητας.^3

    Μία από τις κύριες αιτίες της στεγαστικής κρίσης είναι η πολύ αυξημένη
    ζήτηση για σπίτια του ενός υπνοδωματίου, ιδιαίτερα από τους νεότερους. Αυτό
    στοιχειοθετείται από τη ραγδαία αύξηση των μονομελών νοικοκυριών: μεταξύ
    του 2011 και του 2021, παρόλο που ο συνολικός πληθυσμός αυξήθηκε από 10,8
    εκ. σε 10,48 εκ., ο αριθμός των νοικοκυριών αυξήθηκε κατά περίπου 200.000
    χάρη στην αύξηση των μονομελών νοικοκυριών κατά περίπου 400.000.
  callouts:
    - |
      **Στεγαστική κρίση = αυξημένο ρίσκο για τη δημόσια υγεία**

      - ΗΠΑ: 1% αύξηση στο μέσο εισόδημα που δαπανάται για στεγαστικά έξοδα σε
        επίπεδο κομητείας = 37% αύξηση ρίσκου εμφάνισης παχυσαρκίας, με αυξημένα
        ποσοστά για τα παιδιά (Gu et al, 2023)
      - Χονγκ Κονγκ: Ουσιαστική αύξηση στην επιφάνεια του σπιτιού = 9,1% μείωση
        ρίσκου υπέρτασης (Sarcar et al, 2021)
      - Ηνωμένο Βασίλειο, 2009–2019: Αβεβαιότητα για τα στεγαστικά έξοδα = 2,5%
        αύξηση στον κίνδυνο εμφάνισης διαταραχής ψυχικής υγείας και 2% αύξηση
        στον κίνδυνο διαταραχής ύπνου, με αυξημένα ποσοστά για τους ενοικιαστές,
        τους νέους και τα νοικοκυριά με παιδιά (Mason et al, 2024)
    - |
      **Στεγαστική κρίση = πρόβλημα για τη δημογραφική δυναμική**

      - Αγγλία: 10% αύξηση στις τιμές των σπιτιών = μείωση στις γεννήσεις κατά
        1,3% εν γένει και κατά 4,9% για τους ενοικιαστές (Aksoy, 2016)
      - Βρετανία, 1996–2014: Αύξηση στεγαστικού κόστους = 157.000 λιγότερες
        γεννήσεις (Sabisky, 2018)
      - ΗΠΑ, 2010–2020: Αύξηση στεγαστικού κόστους = 7% μείωση του αριθμού των
        νέων οικογενειών (Couillard, 2025)
    - |
      **Στεγαστική κρίση = μείωση οικονομικής ανάπτυξης**

      - Λιγότεροι πόροι για αποταμίευση, κατανάλωση ή επενδύσεις σε άλλους
        τομείς (ΟΟΣΑ, 2020)
      - Πιο δύσκολη η κινητικότητα των εργαζομένων εκεί που πραγματικά
        χρειάζονται:
        - ΗΠΑ, 1964–2009: μειούμενο στεγαστικό απόθεμα σε πόλεις υψηλής
          παραγωγικότητας = 36% μείωση της συνολικής οικονομικής ανάπτυξης
          εξαιτίας της έλλειψης πρόσβασης από εργαζόμενους (Hsieh and Moretti,
          2019)
        - Ηνωμένο Βασίλειο, 1996–2016: 33% μείωση νέων 25–34 ετών που αλλάζουν
          δουλειά και σπίτι μέσα σε έναν χρόνο (Judge, 2019)
      - Υπονομεύεται η καινοτομία — π.χ. Κίνα: για κάθε 1% αύξηση στις τιμές των
        σπιτιών μιας περιοχής, μείωση της συμβολής αυτής της περιοχής στην
        καινοτομία κατά 0,25% (Li et al, 2023)
        - ΗΠΑ: 1% αύξηση στον λόγο τιμών σπιτιών προς μισθούς = 0,15% μείωση
          στην παραγωγικότητα σε περιφερειακό επίπεδο (NERA, 2024)
        - Αγγλία: Μικρή (κατά 1 standard deviation) αύξηση στον δείκτη
          επιβάρυνσης από στεγαστικό δάνειο = 10–12% μείωση της πιθανότητας
          ανάληψης επιχειρηματικής δραστηριότητας (Bracke et al, 2015)

proposal:
  body: |
    Ο Δήμος θα μπορούσε να υποστηρίξει τη δημιουργία δημοτικών co-living χώρων
    για νέους 18–35 ετών.

    Τα ενοίκια θα μπορούσαν να είναι συνδεδεμένα με το εισόδημα των
    ενδιαφερόμενων ενοικιαστών — για παράδειγμα, ως ποσοστό του μηνιαίου
    εισοδήματος, με ανώτατο και κατώτατο όριο, ώστε ο χώρος να είναι προσιτός
    ακόμα και σε νέους με χαμηλό εισόδημα. Η είσοδος θα γίνεται με διαφανή
    κριτήρια — ηλικία, εισόδημα, τόπος εργασίας ή σπουδών στον Δήμο Αθηναίων —
    χωρίς εγγυητή. Η διάρκεια παραμονής θα μπορούσε να έχει ανώτατο όριο, ώστε
    οι θέσεις να εναλλάσσονται και ο χώρος να εξυπηρετεί διαρκώς νέους
    κατοίκους που βρίσκονται στη φάση που το χρειάζονται περισσότερο.
  callouts:
    - |
      Το μοντέλο co-living δεν είναι απλή συγκατοίκηση. Σε μια τυπική
      συγκατοίκηση, δεν υπάρχουν υποδομές που να υποστηρίζουν την κοινή ζωή.
      Στο co-living, ο κάθε κάτοικος έχει ιδιωτικό χώρο (υπνοδωμάτιο ή και
      μπάνιο), ενώ μοιράζεται κουζίνα, σαλόνι και πιθανώς και άλλες υποδομές
      όπως χώρους εργασίας, γυμναστήριο, χώρους πρασίνου κτλ. Αντί ο νέος να
      πληρώνει ακριβά για να αποκτήσει μόνος του όλες τις λειτουργίες μιας
      κατοικίας, τις μοιράζεται — και μειώνεται το κόστος χωρίς να θυσιάζει
      την ιδιωτικότητα ή την ποιότητα της κατοικίας του.

      Αυτό που προσθέτει το co-living πέρα από την οικονομία κλίμακας είναι η
      κοινότητα: κάτοικοι που επιλέγουν συνειδητά έναν κοινό τρόπο ζωής, με
      κοινές δραστηριότητες. Σε μια εποχή που η μοναξιά των νέων στις πόλεις
      αναγνωρίζεται όλο και περισσότερο ως ζήτημα δημόσιας υγείας, αυτή η
      διάσταση δεν είναι δευτερεύουσα.

implementation:
  body: |
    Η υλοποίηση θα στηρίζεται στη δημοτική περιουσία — και, αν υπάρξει
    συνεργασία με άλλους δημόσιους φορείς, και στην ευρύτερη δημόσια περιουσία.
    Το απόθεμα αυτό δεν είναι αμελητέο: κτίρια που σήμερα υπολειτουργούν ή
    παραμένουν κλειστά θα μπορούσαν να αποκτήσουν νέα χρήση χωρίς να αλλάξει η
    κυριότητά τους.

    Ο Δήμος έχει αρμοδιότητα τόσο στη διαχείριση της δημοτικής περιουσίας όσο
    και στην προώθηση πολιτικών κοινωνικής συνοχής και στέγασης ευάλωτων ομάδων
    — και όσοι δυσκολεύονται να σταθούν στην αγορά κατοικίας εμπίπτουν σαφώς σε
    αυτή την κατηγορία.

    Η διαχείριση των κτιρίων μπορεί να γίνει μέσω δημοτικής επιχείρησης ή μέσω
    σύμπραξης με κοινωνικές επιχειρήσεις και μη κερδοσκοπικούς οργανισμούς που
    έχουν εμπειρία στη διαχείριση οικιστικών χώρων — χωρίς να μεταβιβαστεί η
    κυριότητα. Το πρώτο βήμα, πάντως, είναι η συστηματική αποτύπωση της
    διαθέσιμης περιουσίας ως προς την καταλληλότητά της για κατοίκηση — χωρίς
    αυτήν δεν μπορεί να σχεδιαστεί τίποτα.

limitations:
  - q: "Γιατί να μην μένω μόνος μου;"
    a: >
      Στην ελληνική αντίληψη, η συγκατοίκηση έχει συνειρμούς οικονομικής
      ανάγκης και όχι επιλογής — και το ζητούμενο για έναν νέο είναι, κατά
      κανόνα, η ανεξάρτητη κατοικία, όχι η κοινή ζωή με αγνώστους. Το co-living
      είναι για πολλούς συνειδητή επιλογή και όχι ως αναγκαστική λύση — και
      αυτό δεν είναι αυθαίρετο: σε δεκάδες ευρωπαϊκές πόλεις, το co-living
      επιλέγεται από νέους που θα μπορούσαν να ανταπεξέλθουν σε ατομικό
      διαμέρισμα, επειδή προσφέρει την αίσθηση της κοινότητας, την ευελιξία,
      τις υποδομές και την κεντρική τοποθεσία που ένα τυπικό μικρό διαμέρισμα
      δεν μπορεί να προσφέρει.

  - q: "Γιατί μόνο οι νέοι;"
    a: >
      Σε μια πόλη όπου η στεγαστική πίεση δεν αφορά μόνο τους νέους, η εστίαση
      σε μια ηλικιακή ομάδα μπορεί να φαίνεται ως δυσανάλογη προτεραιότητα. Δεν
      υπάρχει ένα μέτρο που να λύνει το στεγαστικό πρόβλημα στο σύνολό του —
      και δεν είναι αυτή η φιλοδοξία εδώ. Οι νέοι 18–35 ετών είναι η ομάδα που
      συνδυάζει υψηλή στεγαστική πίεση με χαμηλή διαπραγματευτική δύναμη στην
      αγορά: εισοδήματα στο χαμηλότερο σημείο της καριέρας τους, απουσία
      ιστορικού ενοικίασης, συχνά απουσία εγγυητή. Ταυτόχρονα, η καθυστέρηση
      αυτονόμησής τους έχει άμεσο οικονομικό αντίκτυπο που επεκτείνεται πέρα
      από το άτομο.


