number: 15
slug: esynelefsi-polykatoikias
theme: housing
title: e-συνέλευση πολυκατοικίας
one_line: >
  Μια ψηφιακή πλατφόρμα στηρίζει την ουσιαστική λειτουργία της συνέλευσης
  πολυκατοικίας — με δημοσιευμένη ατζέντα, δυνατότητα ψηφιακής ψηφοφορίας και
  στοχευμένες ειδοποιήσεις για προγράμματα επιδοτήσεων.

problem:
  body: |
    Η συνέλευση μιας πολυκατοικίας^* είναι ο μόνος χώρος στον οποίο μπορούν
    να λαμβάνονται αποφάσεις για δύο ζητήματα που επηρεάζουν σημαντικά την
    ποιότητα ζωής στην πόλη.

    Πρώτον, για θέματα συντήρησης και επισκευής κοινόχρηστων υποδομών μιας
    πολυκατοικίας – από παρεμβάσεις ενεργειακής αναβάθμισης^** μέχρι εργασίες
    στην πρόσοψη, στην ταράτσα, στον ακάλυπτο κτλ. – καθώς και για την
    αξιοποίηση σχετικών επιδοτήσεων.

    Δεύτερον, για τη ρύθμιση της βραχυχρόνιας μίσθωσης^*** – η συνέλευση μπορεί
    να τροποποιήσει τον κανονισμό της πολυκατοικίας ώστε να απαγορεύει ρητά τη
    βραχυχρόνια μίσθωση ή να ορίζει συγκεκριμένες υποχρεώσεις, π.χ. ρύθμιση
    χρήσης κοινόχρηστων χώρων ή διαφορετικές προβλέψεις κοινοχρήστων.

    Ωστόσο, οι συνελεύσεις της πολυκατοικίας υπολειτουργούν.

    Από τη μια πλευρά, συχνά δεν γίνονται συνελεύσεις. Αν και ο νόμος προβλέπει
    τουλάχιστον μία συνέλευση τον χρόνο, στην πράξη πολλές πολυκατοικίες δεν
    πραγματοποιούν ποτέ. Ο διαχειριστής εκδίδει κοινόχρηστα (ή αναθέτει την
    έκδοση αυτών σε κάποιον πάροχο) και η πολυκατοικία τρέχει στον αυτόματο
    πιλότο, χωρίς να συζητά και αποφασίζει για θέματα που απασχολούν το κτίριο
    και τους κατοίκους του.

    Από την άλλη πλευρά, ακόμα κι αν υπάρχει ενδιαφέρον και γίνονται συζητήσεις,
    συχνά δεν μπορούν να ληφθούν αποφάσεις. Ο νόμος δεν προβλέπει υποχρέωση
    συμμετοχής ούτε κυρώσεις για απουσία. Ταυτόχρονα, η απαρτία απαιτεί 3/4 των
    ιδιοκτητών στην πρώτη σύγκληση, 50%+1 στην επαναληπτική. Αυτά τα νούμερα
    είναι δύσκολο να επιτευχθούν, για δύο λόγους. Πρώτον, πολλοί ιδιοκτήτες δεν
    κατοικούν στα διαμερίσματά τους – τα εκμισθώνουν. Δεύτερον, ένα αυξανόμενο
    μέρος του κτιριακού αποθέματος ανήκει σε επενδυτές – ελληνικά funds,
    εταιρείες διαχείρισης Airbnb, αλλά και ξένοι αγοραστές που μπορεί να μην
    μιλούν ελληνικά και να μην γνωρίζουν καν ότι η πολυκατοικία τους έχει
    συνέλευση.
  callouts:
    - |
      ^*

      Η γενική συνέλευση (ΓΣ) είναι το όργανο διοίκησης μιας πολυκατοικίας, στο
      οποίο αποφασίζουν οι συνιδιοκτήτες – όχι οι κάτοικοι. Ένας ενοικιαστής δεν
      έχει δικαίωμα ψήφου, ακόμα κι αν μένει εκεί για πολλά χρόνια. Ωστόσο, οι
      αποφάσεις επηρεάζουν και δεσμεύουν όλους τους κατοίκους. Σύμφωνα με τον
      νόμο, οι ιδιοκτήτες (ή οι εκπρόσωποί τους) έχουν αριθμό ψήφων ανάλογο προς
      την αξία της περιουσίας τους. Βέβαια, ο νόμος ορίζει ότι οι συνιδιοκτήτες
      μπορούν με ομόφωνη συμφωνία να κανονίσουν τα δικαιώματα ψήφου τους όπως
      θέλουν – δηλαδή μπορούν να συμφωνήσουν ότι θα ισχύει ο κανόνας «μία ψήφος
      ανά διαμέρισμα» ανεξαρτήτως αξίας, ο οποίος είναι και ο πιο διαδεδομένος.
    - |
      ^**

      Στην Ελλάδα, δύο στις τρεις κατοικίες κατατάσσονται στις χαμηλότερες
      ενεργειακές κατηγορίες Ε-Η.

      Μόλις μία στις δέκα κατοικίες πλησιάζει τα σύγχρονα πρότυπα ενεργειακής
      απόδοσης (κλάσεις Α+, Α, Β+, Β).
    - |
      ^***

      Στον Δήμο Αθηναίων, οι εγγραφές ολόκληρων διαμερισμάτων σε πλατφόρμες
      βραχυχρόνιας μίσθωσης αυξήθηκαν κατά 47% μέσα σε τρία χρόνια, μεταξύ 2023
      (9.016 εγγραφές) και 2025 (13.293 εγγραφές).

proposal:
  body: |
    Θα μπορούσε να δημιουργηθεί μια ψηφιακή πλατφόρμα για την υποστήριξη της
    ουσιαστικής λειτουργίας της συνέλευσης της πολυκατοικίας.

    Κάθε διαχειριστής πολυκατοικίας υποχρεούται να καταχωρεί στην πλατφόρμα
    τουλάχιστον τη μία ετήσια συνέλευση που προβλέπει ο νόμος, με δημοσιευμένη
    ατζέντα και δυνατότητα ψηφιακής ψηφοφορίας. Έτσι μειώνονται τα εμπόδια που
    σήμερα καθιστούν τη λήψη αποφάσεων δύσκολη.

    Η διαλειτουργικότητα με το ΜΙΔΑ – το Μητρώο Ιδιοκτησίας και Διαχείρισης
    Ακινήτων που αναμένεται να τεθεί σε λειτουργία από την ΑΑΔΕ – μπορεί να
    επιτρέπει στην πλατφόρμα να αντλεί αυτόματα τα βασικά χαρακτηριστικά κάθε
    κτιρίου. Και με βάση αυτά τα δεδομένα, κάθε πολυκατοικία μπορεί να λαμβάνει
    στοχευμένες ειδοποιήσεις για προγράμματα επιδοτήσεων για τα οποία είναι
    δικαιούχος, χωρίς να χρειαστεί να τα αναζητήσει η ίδια. Η λογική
    αντιστρέφεται: από pull, όπου ο πολίτης πρέπει να ψάξει και να αντιληφθεί
    ότι τον αφορά κάποιο πρόγραμμα, σε push, όπου η πληροφορία φτάνει στη σωστή
    πολυκατοικία τη σωστή στιγμή.

implementation:
  body: |
    Ο Δήμος έχει την αρμοδιότητα να αναπτύξει και να λειτουργεί την πλατφόρμα
    αυτόνομα – η προώθηση της συμμετοχής των πολιτών στη διαχείριση της κοινής
    ιδιοκτησίας εμπίπτει στις αρμοδιότητές του.

    Αυτό που ο Δήμος δεν μπορεί να κάνει μονομερώς είναι να επιβάλει
    υποχρεωτική συμμετοχή στις συμμετοχές. Ωστόσο, η υποχρεωτικότητα δεν είναι
    απαραίτητη προϋπόθεση για να λειτουργήσει η πρόταση βελτιωτικά, για δύο
    λόγους.

    Πρώτον, η ψηφιακή πρόσβαση από μόνη της αυξάνει τη συμμετοχή: ο ιδιοκτήτης
    που κατοικεί αλλού ή ο επενδυτής στο εξωτερικό δεν απουσιάζει ενίοτε από
    κακή πρόθεση αλλά από πρακτική αδυναμία, και αυτή η αδυναμία εκλείπει με
    μια ψηφιακή πλατφόρμα.

    Δεύτερον, υπάρχει ένας έμμεσος μηχανισμός πίεσης που δεν απαιτεί
    νομοθετική αλλαγή: ο κανονισμός κάθε πολυκατοικίας μπορεί να προβλέπει
    ότι ο απών λογίζεται ως συναινών. Ο Δήμος μπορεί να τρέξει καμπάνια
    ενημέρωσης για αυτή τη δυνατότητα. Αν αυτό δρομολογηθεί σε αρκετές
    πολυκατοικίες και η απουσία καταγράφεται ψηφιακά και διαφανώς, η μη
    συμμετοχή αποκτά συνέπειες, χωρίς να χρειάζεται εξωτερική κύρωση.

    Ο Δήμος Αθηναίων διαθέτει 54.490 κτίρια κατοικίας.^1 Αν αυτή η πολιτική (η
    ανάπτυξη και λειτουργία της πλατφόρμας, καθώς και μια καμπάνια ενημέρωσης)
    κοστολογηθεί στα €170.000 και έστω ότι μόνο το 20% χρησιμοποιήσει την
    πλατφόρμα τον πρώτο χρόνο – περίπου 11.000 κτίρια – το κόστος ανά κτίριο
    διαμορφώνεται σε κάτω από €20. Ένα κόστος που αξίζει για μια πολιτική που
    μπορεί να διασφαλίσει ότι δεκάδες ιδιοκτήτες αποκτούν φωνή σε αποφάσεις
    που επηρεάζουν άμεσα την αξία και την ποιότητα ζωής στο κτίριό τους και
    που δεν θα λαμβάνονταν διαφορετικά.

limitations:
  - q: "Ψηφιακός αναλφαβητισμός: Ένα μέρος των ιδιοκτητών – ιδίως μεγαλύτερης ηλικίας – δεν είναι εξοικειωμένο με ψηφιακά εργαλεία."
    a: >
      Η πλατφόρμα δεν αντικαθιστά τη φυσική συνέλευση, τη συμπληρώνει. Η φυσική
      παρουσία παραμένει επιλογή, το ψηφιακό εργαλείο απευθύνεται κυρίως στους
      απόντες.

good_practices:
  - city: Κίεβο
    period: 2021–σήμερα
    body: >
      Η συνέλευση της πολυκατοικίας ως θεσμός δεν είναι ένα μοντέλο που
      συναντάται ευρέως. Στις μεγάλες πολυκατοικίες του εξωτερικού, συναντώνται
      συχνά σωματεία ιδιοκτητών με εκλεγμένο διοικητικό συμβούλιο και άρα, η
      συλλογική λήψη αποφάσεων είναι ενσωματωμένη στη δομή ιδιοκτησίας, όχι κάτι
      που πρέπει να ενεργοποιηθεί κάθε φορά. Έτσι, ακριβώς ανάλογες καλές
      πρακτικές είναι δύσκολο να βρεθούν.

      Στο Κίεβο, ωστόσο, συναντάται ένα ενδιαφέρον παράδειγμα: το Kyiv Digital,
      το οποίο ξεκίνησε τον Ιανουάριο του 2021, πριν τον πόλεμο, ως εφαρμογή
      αστικών υπηρεσιών όπως για την πληρωμή πάρκινγκ ή λογαριασμών. Στην
      εφαρμογή, πλέον, οι κάτοικοι μπορούν να δουν και όλα τα έγγραφα της
      πολυκατοικίας τους ψηφιακά, να λαμβάνουν ειδοποιήσεις για τις συνελεύσεις
      της πολυκατοικίας, να βλέπουν την ατζέντα των συνελεύσεων, να συμμετέχουν
      σε ψηφοφορίες και να βλέπουν τα αποτελέσματα μετά την ολοκλήρωσή τους.
      Θέματα όπως η αλλαγή παρόχου internet, η επισκευή της στέγης ή η αγορά
      γεννήτριας επιλύονται πλέον ψηφιακά, σε λίγα μόνο βήματα, από
      οπουδήποτε και οποτεδήποτε. Τα δεδομένα δείχνουν ότι σχεδόν 500.000
      πολίτες συμμετέχουν σε ψηφοφορίες κάθε μήνα ψηφιακά – και ο αριθμός αυτός
      αυξάνεται συνεχώς.

