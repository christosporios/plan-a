# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «Ζωντανή ταυτότητα» ────────────────────────────
contribution:
  body: |
    Η σημερινή ταξινόμηση των χρήσεων στηρίζεται στο
    [Π.Δ. 59/2018](https://www.e-nomothesia.gr/kat-periballon/skhedia-poleon/proedriko-diatagma-59-2018-phek-114a-29-6-2018.html)^1,
    που διαδέχθηκε το προγενέστερο πλαίσιο του 1987. Το πρόβλημα δεν είναι ότι ο
    νόμος είναι «κακός», αλλά ότι περιγράφει μια πόλη που έχει αλλάξει.
    Χαρακτηριστικό παράδειγμα η βραχυχρόνια μίσθωση: νομικά αντιμετωπίζεται κατ'
    αρχήν ως χρήση κατοικίας και δηλώνεται στο
    [Μητρώο Ακινήτων Βραχυχρόνιας Διαμονής της ΑΑΔΕ](https://www.aade.gr/polites/mitroo-akiniton-brahyhronias-diamonis)^2,
    παρότι λειτουργικά μοιάζει με τουριστικό κατάλυμα. Έτσι, μια ολόκληρη
    πολυκατοικία μπορεί να γίνει «αόρατο ξενοδοχείο» χωρίς να αλλάξει τίποτα στα
    χαρτιά της χρήσης γης.
  callouts:
    - |
      Πάνω από **11.000 διαμερίσματα** στον Δήμο Αθηναίων διατίθενται σε
      πλατφόρμες βραχυχρόνιας μίσθωσης, με τη μεγαλύτερη συγκέντρωση σε
      [Πλάκα, Κουκάκι, Μουσείο, Νέο Κόσμο, Παγκράτι και πλατεία Βάθης](https://wearesolomon.com/mag/focus-area/society/the-concentration-of-airbnb-rentals-in-the-neighborhoods-of-athens/)^3.

      Πηγή: Solomon, βάσει δεδομένων Inside Airbnb
    - |
      Στο κέντρο, το **17,8%** των καταλυμάτων ολόκληρης κατοικίας βρίσκεται στο
      Εμπορικό Τρίγωνο και την Πλάκα, ενώ το **14,2%** των οικοδεσποτών διαθέτει
      [τρία ή περισσότερα ακίνητα](https://lab.imedd.org/en/oi-epangelmaties-oikodespotes-anevazoun-tis-times-ton-airbnb-stin-athina/)^4
      — ένδειξη επαγγελματικής, όχι περιστασιακής, δραστηριότητας.

      Πηγή: iMEdD Lab
    - |
      Η συγκέντρωση οδήγησε σε έκτακτα μέτρα: με τον
      [Ν. 5162/2024](https://www.e-nomothesia.gr/law-news/brakhukhronia-misthose-akineton-parateinetai-i-apagoreysi.html)^5
      παγώνουν οι νέες εγγραφές στο Μητρώο για το **1ο, 2ο και 3ο Δημοτικό
      Διαμέρισμα** της Αθήνας — μέτρο που παρατάθηκε για το 2026.
    - |
      Παράλληλα, οι **σκοτεινές κουζίνες** και τα **σκοτεινά καταστήματα**
      πολλαπλασιάζονται μέσα από τις πλατφόρμες παράδοσης, καταλαμβάνοντας
      ισόγειους χώρους χωρίς να είναι «εστιατόριο» ή «κατάστημα» με βιτρίνα — μια
      κανονιστική γκρίζα ζώνη που δυσκολεύει την εποπτεία.
  charts:
    - title: Συγκέντρωση καταλυμάτων βραχυχρόνιας μίσθωσης στο κέντρο της Αθήνας, 2023
      label: Airbnb
      subtitle: Ποσοστό των καταλυμάτων ολόκληρης κατοικίας ανά περιοχή του κέντρου.
      unit: "%"
      highlight: Κουκάκι
      source: iMEdD Lab / Inside Airbnb
      source_url: https://lab.imedd.org/en/oi-epangelmaties-oikodespotes-anevazoun-tis-times-ton-airbnb-stin-athina/
      year: 2023
      data:
        - { label: "Εμπ. Τρίγωνο & Πλάκα", value: 17.8 }
        - { label: Κουκάκι, value: 9.0 }
        - { label: Νέος Κόσμος, value: 7.8 }
        - { label: "Μουσείο–Εξάρχεια", value: 7.4 }
  body_after: |
    Γιατί έχει σημασία για τη **ζωντανή ταυτότητα**; Επειδή η ταυτότητα μιας
    γειτονιάς δεν είναι μόνο τα κτίριά της, αλλά το μείγμα των ανθρώπων και των
    λειτουργιών της. Η
    [Jane Jacobs](https://en.wikipedia.org/wiki/The_Death_and_Life_of_Great_American_Cities)^6
    έδειξε ήδη από το 1961 ότι η ανάμειξη πρωτευουσών χρήσεων είναι ο βασικός
    «γεννήτορας ποικιλομορφίας» που κρατά τους δρόμους ζωντανούς και ασφαλείς σε
    διαφορετικές ώρες της ημέρας — τα περίφημα «μάτια στον δρόμο». Η ίδια λογική
    διατρέχει και την έννοια της
    [πόλης των 15 λεπτών](https://en.wikipedia.org/wiki/15-minute_city)^7 του
    Carlos Moreno, όπου η εγγύτητα και η ποικιλία χρήσεων είναι προϋπόθεση για
    μια βιώσιμη καθημερινότητα.

    Όταν μια χρήση μονοπωλεί τη γειτονιά —είτε όλα γίνονται Airbnb είτε όλα
    γίνονται σκοτεινές κουζίνες— η ταυτότητα ισοπεδώνεται. Η εμπειρία ευρωπαϊκών
    πόλεων είναι σαφής: στη συνοικία
    [Αλφάμα της Λισαβόνας](https://journals.sagepub.com/doi/abs/10.1177/0042098019883734)^8
    η μετατροπή σε «υπαίθριο ξενοδοχείο» συνοδεύτηκε από εκτόπιση κατοίκων και
    απώλεια του τοπικού εμπορίου. Δεν είναι τυχαίο ότι στη διαβούλευση οι ίδιοι
    οι συμμετέχοντες ζήτησαν να υπάρχει «τοπικό εμπόριο σε κάθε γειτονιά»,
    διαπιστώνοντας ότι «οι περιοχές που έχουν κυρίως τουριστική χρήση νεκρώνουν».
    Επικαιροποιώντας τις κατηγορίες και τα ποσοστά, ο Δήμος και η πολιτεία
    αποκτούν ξανά τα εργαλεία να προστατεύσουν αυτό που κάνει μια γειτονιά να
    είναι γειτονιά.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Μήπως αυτό σημαίνει απαγόρευση των Airbnb ή ζημιά για τους ιδιοκτήτες;"
    a: |
      Όχι. Η πρόταση δεν απαγορεύει χρήσεις· τις κάνει **ορατές και ρυθμίσιμες**.
      Στόχος δεν είναι να εξαφανιστεί η βραχυχρόνια μίσθωση, αλλά να σταματήσει η
      μονοκαλλιέργεια. Ένα σαφές πλαίσιο δίνει και στους ιδιοκτήτες ασφάλεια
      δικαίου: σήμερα η ασάφεια οδηγεί σε αλλεπάλληλες δικαστικές διαμάχες, όπως η
      [ΣτΕ 1905/2025](https://www.taxheaven.gr/news/68842/)^9, που απέκλεισε τον
      αυτόματο χαρακτηρισμό ακινήτου Airbnb ως τουριστικού καταλύματος.
  - q: "Δεν θα μετατραπεί η πόλη σε γραφειοκρατικό λαβύρινθο;"
    a: |
      Η εναλλακτική —να κυνηγάμε φαινόμενα με νόμους-μπαλώματα— είναι πιο
      δαπανηρή. Πόλεις που εκσυγχρόνισαν τις κατηγορίες χρήσεων το έκαναν με
      στοχευμένο τρόπο: στο Παρίσι, μετά από
      [απόφαση του Conseil d'État (Μάρτιος 2023)](https://www.banquedesterritoires.fr/reglementation-des-dark-stores-apres-larret-du-conseil-detat-le-decret-est-enfin-paru)^[10],
      ένα διάταγμα δημιούργησε διακριτή υποκατηγορία για τις σκοτεινές κουζίνες
      και κατέταξε τα σκοτεινά καταστήματα στους αποθηκευτικούς χώρους, δίνοντας
      στους δήμους ένα καθαρό εργαλείο αντί για ad hoc δικαστικές μάχες.
  - q: "Ποιος αποφασίζει τις νέες κατηγορίες και τα ποσοστά;"
    a: |
      Η αρμοδιότητα ανήκει στην πολιτεία μέσω του πλαισίου των πολεοδομικών
      σχεδίων ([Ν. 4759/2020](https://www.e-nomothesia.gr/kat-periballon/skhedia-poleon/nomos-4759-2020-phek-245a-9-12-2020.html)^[11]
      και τα Τοπικά/Ειδικά Πολεοδομικά Σχέδια), αλλά ο Δήμος Αθηναίων μπορεί να
      ηγηθεί με τεκμηρίωση: χαρτογράφηση της πραγματικής κατάστασης και
      διαβούλευση με κατοίκους και επαγγελματίες.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Περισσότερη διαθέσιμη κατοικία
    body: |
      Ξεκαθαρίζοντας πότε η «κατοικία» είναι όντως κατοικία, διευκολύνεται η
      επιστροφή ακινήτων στη μακροχρόνια μίσθωση και ανακουφίζεται η στεγαστική
      πίεση στις κεντρικές γειτονιές.
  - title: Πιο ζωντανοί δρόμοι και ισόγεια
    body: |
      Αναγνωρίζοντας τα σκοτεινά καταστήματα και τις σκοτεινές κουζίνες ως
      διακριτή χρήση, ο σχεδιασμός μπορεί να ενθαρρύνει ενεργά ισόγεια αντί για
      «τυφλές» βιτρίνες.
    callouts:
      - |
        Το Άμστερνταμ περιόρισε τα σκοτεινά καταστήματα στις βιομηχανικές ζώνες
        (Μάιος 2023) μετά από κατακόρυφη
        [αύξηση των παραπόνων κατοίκων](https://www.dutchnews.nl/2023/05/dark-stores-banned-from-residential-areas-in-amsterdam/)^[12].

        Πηγή: DutchNews.nl
  - title: Δικαιότερος ανταγωνισμός & διαφάνεια
    body: |
      Οι παραδοσιακές επιχειρήσεις γειτονιάς ανταγωνίζονται σήμερα χρήσεις που
      δεν υπόκεινται στους ίδιους κανόνες. Ένα σαφές πλαίσιο, όπως οι απαιτήσεις
      «ενεργού ισογείου» που εφαρμόζονται σε πόλεις όπως η
      [Νέα Υόρκη](https://www.nyc.gov/site/planning/zoning/districts-tools/special-purpose-districts-manhattan.page)^[13],
      αποκαθιστά ίσους όρους.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Χαρτογράφηση των πραγματικών χρήσεων ισογείων ανά γειτονιά
    body: |
      Ο Δήμος Αθηναίων να καταγράψει τι πραγματικά λειτουργεί στα ισόγεια κάθε
      γειτονιάς (καταστήματα, εστίαση, σκοτεινές κουζίνες, ντουλάπια παράδοσης,
      κενά), δημιουργώντας μια βάση δεδομένων που θα δείξει πού έχει διαβρωθεί ο
      μικτός χαρακτήρας.
  - title: Πιλοτική επικαιροποίηση κατηγοριών & ποσοστών σε μία περιοχή
    body: |
      Με βάση τη χαρτογράφηση, να συνταχθούν επικαιροποιημένες κατηγορίες
      χρήσεων και αναθεωρημένα ποσοστά για ένα πιλοτικό διαμέρισμα, αξιοποιώντας
      το πλαίσιο των Τοπικών Πολεοδομικών Σχεδίων και διεθνή παραδείγματα όπως η
      [απαγόρευση σκοτεινών καταστημάτων στη Βαρκελώνη (2023)](https://www.pymnts.com/news/delivery/2023/barcelona-bans-dark-stores-in-blow-to-q-commerce/)^[14].

