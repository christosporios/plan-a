title: Σύγχρονες χρήσεις γης
one_line: >
  Οι κατηγορίες χρήσεων γης που ορίζει ο νόμος δεν αντιστοιχούν πλέον στην
  πραγματικότητα: η «κατοικία» περιλαμβάνει σήμερα και Airbnb, το «κατάστημα»
  δεν είναι μόνο μανάβικο ή φούρνος αλλά και box lockers ή shadow kitchens.
  Αυτή η ασυμφωνία σημαίνει ότι τα ποσοστά ανά χρήση γης που ορίζονται στα
  πολεοδομικά σχέδια παύουν να διασφαλίζουν αποτελεσματικά τον μικτό χαρακτήρα
  των γειτονιών. Μια συστηματική ενημέρωση των κατηγοριών, με νέες χρήσεις που
  να αντικατοπτρίζουν τη σύγχρονη πραγματικότητα και επικαιροποιημένα ποσοστά,
  θα έδινε τα εργαλεία να διασφαλιστεί ο χαρακτήρας της πόλης.
