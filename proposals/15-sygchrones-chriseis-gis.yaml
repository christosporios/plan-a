# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «Ζωντανή ταυτότητα» ────────────────────────────
contribution:
  body: |
    Η Αθήνα, στο ίδιο τετράγωνο συνυπήρχαν ο φούρνος με την πολυκατοικία, το
    εργαστήριο με το καφενείο, το φαρμακείο με το σχολείο. Κεντρικό κομμάτι του
    χαρακτήρας της ήταν – και παραμένει σε μεγάλο βαθμό – αυτός ο σύνθετος
    χαρακτήρας, όπου πολλές χρήσεις συνυπάρχουν. Η διατήρηση των «μικτών
    χρήσεων» διασφαλιζόταν νομοθετικά μέσω των κατηγοριών χρήσεων γης και των
    ποσοστώσεών τους, που όριζαν ποιες δραστηριότητες επιτρέπονται σε μια
    γειτονιά και σε ποιον βαθμό.

    Το βασικό πλαίσιο χρήσεων γης στην Ελλάδα χρονολογείται από τη δεκαετία του
    1980 και επικαιροποιήθηκε τελευταία φορά με το Π.Δ. 59/2018. Οι κατηγορίες
    που ορίζει – «αμιγής κατοικία», «γενική κατοικία», «εμπορική χρήση»,
    «τουρισμός-αναψυχή» κ.λπ. – αντικατοπτρίζουν μια πραγματικότητα όπου η
    «κατοικία» σήμαινε αποκλειστικά μόνιμη διαμονή και το «κατάστημα» ήταν ο
    φούρνος ή το μπακάλικο. Αυτές οι κατηγορίες παραμένουν σε ισχύ σήμερα αλλά
    ότι το περιεχόμενό τους έχει αλλάξει στην πράξη, χωρίς αυτό να αναγνωρίζεται
    από τον νόμο. Διατηρούμε τις ίδιες ετικέτες χρήσεων γης, αλλά κάτω από αυτές
    συμβαίνουν πλέον πολύ διαφορετικά πράγματα.

    Η πιο οξεία περίπτωση είναι η βραχυχρόνια μίσθωση. Νομικά, ένα διαμέρισμα
    που ενοικιάζεται μέσω Airbnb καταγράφεται ως «κατοικία» – ακριβώς η ίδια
    κατηγορία με το σπίτι μιας μόνιμης κατοίκου του διπλανού ορόφου. Στην πράξη,
    όμως, οι δύο χρήσεις έχουν διαφορετικές επιπτώσεις στη γειτονιά: η
    βραχυχρόνια μίσθωση δεν τροφοδοτεί τον τοπικό φούρνο με σταθερούς πελάτες,
    δεν φέρνει παιδιά στο σχολείο της γειτονιάς, δεν παράγει τους ανεπίσημους
    δεσμούς που συγκροτούν μια κοινότητα. Και συσσωρευμένη σε κλίμακα, αλλάζει τη
    φυσιογνωμία μιας περιοχής.

    ::: callout
    Στον Δήμο Αθηναίων, οι [εγγραφές ολόκληρων διαμερισμάτων σε πλατφόρμες βραχυχρόνιας μίσθωσης](https://www.newmoney.gr/roh/palmos-oikonomias/oikonomia/vrachichronies-misthosis-i-dinamiki-tou-kladou-stis-top-perioches-tis-athinas/)^1 αυξήθηκαν κατά 47% μέσα σε τρία χρόνια, μεταξύ 2023 (9.016 εγγραφές) και 2025 (13.293 εγγραφές).
    Σε επίπεδο συνολικού αποθέματος κατοικιών, οι [βραχυχρόνιες μισθώσεις](https://www.capital.gr/oikonomia/3934900/ereuna-opa-mikri-eos-anuparkti-i-epidrasi-tou-airbnb-stin-agora-katoikias-stin-ellada/)^2 αντιπροσωπεύουν μόλις 1,1% στην Αθήνα. Η συγκέντρωση όμως είναι εξαιρετικά [άνιση ανά γειτονιά](https://www.mononews.gr/real-estate/aftes-einai-oi-perioches-tis-athinas-me-airbnb-diplasia-apo-tis-katoikies)^3. Σε Κουκάκι-Μακρυγιάννη, με 496 βραχυχρόνιες μισθώσεις έναντι 213 διαθέσιμων κατοικιών, οι βραχυχρόνιες αντιστοιχούν σε περίπου 233% του αποθέματος κατοικίας, είναι δηλαδή υπερδιπλάσιες. Στον Νέο Κόσμο, οι 309 βραχυχρόνιες έναντι 277 κατοικιών μεταφράζονται σε ποσοστό περίπου 112%, ενώ στα Εξάρχεια, οι 280 βραχυχρόνιες σε σχέση με 539 κατοικίες δίνουν ποσοστό περίπου 52%.
    :::

    Δευτερευόντως, η κατηγορία «εμπορική χρήση» έχει διευρυνθεί με τρόπους που ο
    νομοθέτης του Π.Δ. 59/2018 δεν είχε φανταστεί. Ένας ισόγειος χώρος που
    τυπικά λειτουργεί ως «κατάστημα» μπορεί να είναι dark kitchen (σκοτεινή
    κουζίνα αποκλειστικά για delivery, χωρίς καθισμένους πελάτες), dark store
    (μικρο-αποθήκη για delivery), box lockers (αυτόματα ντουλάπια παράδοσης).
    Αυτοί οι χώροι δεν δημιουργούν ένα ζωντανό εμπορικό ισόγειο. Ωστόσο,
    συνεχίζουν να λογίζονται ως απλή «εμπορική χρήση», με αποτέλεσμα να μην
    υπόκεινται σε κανένα ειδικό περιορισμό ή ποσόστωση.

    Για να διατηρηθεί ο πραγματικά μικτός χαρακτήρας των γειτονιών, προτείνονται
    δύο διασυνδεδεμένες κινήσεις.

    Πρώτον, εκσυγχρονισμός των κατηγοριών χρήσεων. Να ανοίξει, δηλαδή, μια
    ουσιαστική συζήτηση για το ποιες χρήσεις έχουμε σήμερα στην πόλη, ποιες από
    αυτές νιώθουμε ότι καλύπτουν κατηγορίες που δεν θα έπρεπε και πώς μπορούν να
    ρυθμιστούν με τους δικούς τους κανόνες. Αυτή η αναθεώρηση εντάσσεται στις
    αρμοδιότητες του Υπουργείου Περιβάλλοντος και Ενέργειας, που είναι υπεύθυνο
    για την έκδοση των προεδρικών διαταγμάτων που ορίζουν τις κατηγορίες χρήσεων
    γης.

    Δεύτερον, αναθεώρηση των ποσοστών ανά χρήση. Τα πολεοδομικά σχέδια ορίζουν
    ποσοστά ανά χρήση για να διασφαλίσουν τον μικτό χαρακτήρα μιας περιοχής. Όταν
    όμως η ταξινόμηση είναι ξεπερασμένη, τα ποσοστά μετρούν λάθος πράγματα: μια
    γειτονιά μπορεί τυπικά να παραμένει εντός των ορίων «κατοικίας», ενώ στην
    πράξη μεγάλο μέρος της έχει μετατραπεί σε τουριστικά καταλύματα. Χρειάζονται
    επικαιροποιημένα ποσοστά, συνδεδεμένα με τις νέες κατηγορίες. Αυτό αφορά τόσο
    το Υπουργείο Περιβάλλοντος για το εθνικό πλαίσιο, όσο και τον Δήμο Αθηναίων
    για την εφαρμογή σε επίπεδο τοπικού πολεοδομικού σχεδίου.

    Η ιδέα δεν είναι πρωτόγνωρη. Άλλες ευρωπαϊκές πόλεις έχουν ήδη κάνει ακριβώς
    αυτό το βήμα – να αναγνωρίσουν νέες χρήσεις ως διακριτές κατηγορίες, ώστε να
    μπορούν να τις ρυθμίσουν. Στη Γαλλία, για παράδειγμα, δικαστική απόφαση του
    2023, έκρινε ότι τα [dark stores](https://www.arthur-loyd-oise.com/actualites/les-dark-stores-la-revolution-des-zones-commerciales-urbaines)^4 ανήκουν στην υποκατηγορία «αποθήκη» του κώδικα πολεοδομίας – και όχι στην «εμπορική χρήση». Ταυτόχρονα, κυβερνητικό διάταγμα της ίδιας ημέρας δημιούργησε νέα υποκατηγορία «κουζίνα αφιερωμένη στην ηλεκτρονική πώληση» για τα dark kitchens, αντί να λογίζονται ως εστιατόρια.

