number: 15
slug: sygchrones-chriseis-gis
theme: identity
title: Σύγχρονες χρήσεις γης
one_line: >
  Οι κατηγορίες χρήσεων γης του νόμου δεν αντιστοιχούν πια στην πραγματικότητα:
  η «κατοικία» περιλαμβάνει σήμερα Airbnb, το «κατάστημα» μπορεί να κρύβει
  αυτόματα ντουλάπια παράδοσης ή σκοτεινές κουζίνες. Επικαιροποιώντας
  κατηγορίες και ποσοστά, αποκτάμε ξανά τα εργαλεία να προστατεύσουμε τον
  μικτό χαρακτήρα των γειτονιών.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Προτείνουμε μια συστηματική επικαιροποίηση του νομικού πλαισίου των χρήσεων
    γης σε δύο επίπεδα, ώστε να αντικατοπτρίζει τη σημερινή πόλη.

    **Πρώτον, εκσυγχρονισμός των κατηγοριών χρήσεων.** Οι κατηγορίες που ορίζει
    το [Π.Δ. 59/2018](https://www.e-nomothesia.gr/kat-periballon/skhedia-poleon/proedriko-diatagma-59-2018-phek-114a-29-6-2018.html)^1
    — «αμιγής κατοικία», «γενική κατοικία», «πολεοδομικό κέντρο», «τουρισμός –
    αναψυχή» κ.λπ. — διαμορφώθηκαν σε μια εποχή που η «κατοικία» σήμαινε μόνιμη
    διαμονή και το «κατάστημα» ήταν ο φούρνος ή το μπακάλικο. Σήμερα η «κατοικία»
    περιλαμβάνει τη βραχυχρόνια μίσθωση τύπου Airbnb, ενώ πίσω από έναν
    «εμπορικό» ισόγειο χώρο μπορεί να λειτουργεί ένα αυτόματο ντουλάπι παράδοσης
    (box locker), μια σκοτεινή κουζίνα (dark/ghost kitchen), ένα σκοτεινό
    κατάστημα (dark store) ή ένας μικρο-κόμβος διανομής τελευταίου χιλιομέτρου.
    Προτείνουμε να αναγνωριστούν ρητά αυτές οι νέες χρήσεις ως διακριτές
    κατηγορίες, με σαφή ορισμό και κανόνες χωροθέτησης.

    **Δεύτερον, αναθεώρηση των ποσοστών ανά χρήση.** Τα πολεοδομικά σχέδια
    ορίζουν ποσοστά (ποσοστώσεις) ανά χρήση για να διασφαλίσουν τον μικτό
    χαρακτήρα μιας περιοχής. Όταν όμως η ταξινόμηση είναι ξεπερασμένη, τα ποσοστά
    αυτά μετρούν λάθος πράγματα: μια γειτονιά μπορεί τυπικά να παραμένει
    «κατοικία» ενώ στην πράξη έχει μετατραπεί σε σύνολο τουριστικών καταλυμάτων.
    Προτείνουμε επικαιροποιημένα ποσοστά, συνδεδεμένα με τις νέες κατηγορίες,
    ώστε ο σχεδιασμός να ξαναποκτήσει την ικανότητα να προστατεύει τη ζωντανή,
    μικτή γειτονιά.

