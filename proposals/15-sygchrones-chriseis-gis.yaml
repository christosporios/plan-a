number: 15
slug: sygchrones-chriseis-gis
theme: identity
title: Σύγχρονες χρήσεις γης
one_line: >
  Οι κατηγορίες χρήσεων γης του νόμου δεν αντιστοιχούν πια στην πραγματικότητα:
  η «κατοικία» περιλαμβάνει σήμερα Airbnb, το «κατάστημα» μπορεί να κρύβει
  αυτόματα ντουλάπια παράδοσης ή σκοτεινές κουζίνες. Επικαιροποιώντας
  κατηγορίες και ποσοστά, αποκτάμε ξανά τα εργαλεία να προστατεύσουμε τον
  μικτό χαρακτήρα των γειτονιών.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Οι κατηγορίες χρήσεων γης που ορίζει ο νόμος δεν αντιστοιχούν πλέον στην
    πραγματικότητα που είχε στο νου του ο νομοθέτης: η «κατοικία» περιλαμβάνει
    σήμερα και Airbnb, το «κατάστημα» δεν είναι μόνο μανάβικο ή φούρνος αλλά και
    box lockers ή shadow kitchens. Αυτές οι νέες εκφάνσεις των υφιστάμενων
    χρήσεων γης σημαίνουν ότι τα ποσοστά ανά χρήση γης που ορίζονται στα
    πολεοδομικά σχέδια παύουν να διασφαλίζουν αποτελεσματικά τον μικτό χαρακτήρα
    των γειτονιών. Μια συστηματική ενημέρωση των κατηγοριών, με νέες χρήσεις που
    να αντικατοπτρίζουν τη σύγχρονη πραγματικότητα και επικαιροποιημένα ποσοστά,
    θα διασφάλιζε τον ξεχωριστό χαρακτήρα της πόλης.

