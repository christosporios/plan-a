# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Οι νέες χρήσεις γης δεν λύνουν πραγματικά το πρόβλημα. Οι δραστηριότητες που αλλοιώνουν τον χαρακτήρα της πόλης θα συνεχίσουν να υπάρχουν."
    a: |
      Η πρόταση δεν στοχεύει στην εξάλειψη καμίας δραστηριότητας. Η βραχυχρόνια
      μίσθωση και τα dark kitchens δεν είναι από τη φύση τους προβληματικές,
      γίνονται προβληματικές όταν συγκεντρώνονται σε κλίμακα που δεν αντιστοιχεί
      στον χαρακτήρα μιας γειτονιάς, και όταν αυτό συμβαίνει χωρίς να ρυθμίζεται.
  - q: "Δεν θα πάρει πάρα πολύ καιρό αυτή η διαδικασία;"
    a: |
      Ναι, θα πάρει – και αυτό είναι αναμενόμενο και θεμιτό. Η αναθεώρηση
      κατηγοριών χρήσεων γης αφορά το πώς ορίζουμε και ρυθμίζουμε την πόλη, και
      χρειάζεται διαβούλευση με δήμους, φορείς και κατοίκους. Δεν είναι
      διαδικασία που πρέπει να γίνει βιαστικά.
  - q: "Δεν κινδυνεύουν όλες οι γειτονιές εξίσου – γιατί να αλλάξουμε το εθνικό πλαίσιο αντί να κάνουμε κάποιο πιο στοχευμένο μέτρο;"
    a: |
      Ακριβώς επειδή το πρόβλημα δεν είναι ομοιόμορφο, χρειάζεται εθνικό πλαίσιο
      που να επιτρέπει τοπική διαφοροποίηση. Χωρίς αναθεώρηση σε εθνικό επίπεδο,
      οι δήμοι δεν έχουν τα νομικά εργαλεία για να κάνουν στοχευμένες επιλογές –
      δεν μπορούν να θεσπίσουν ανώτατα ποσοστά βραχυχρόνιας μίσθωσης ανά γειτονιά
      αν η βραχυχρόνια μίσθωση δεν αναγνωρίζεται καν ως ξεχωριστή κατηγορία. Και
      αντίστροφα: όπου δεν υπάρχει πρόβλημα, οι δήμοι απλώς δεν θα αξιοποιήσουν
      τα νέα εργαλεία. Το εθνικό πλαίσιο ανοίγει τη δυνατότητα, δεν επιβάλλει
      ομοιόμορφη λύση.
  - q: "Έχουμε ήδη νόμους που δεν εφαρμόζονται – πώς θα ελεγχθεί η εφαρμογή;"
    a: |
      Το πρόβλημα της δήλωσης λανθασμένης χρήσης γης υπάρχει ήδη σήμερα και δεν
      λύνεται αυτόματα με νέες κατηγορίες. Το πρόβλημα του ελέγχου των χρήσεων
      γης είναι ευρύτερο από την παρούσα πρόταση και χρειάζεται να εξεταστεί
      ξεχωριστά

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Καλύτερη προστασία των επιχειρήσεων
    body: |
      Μια σαφής κατηγοριοποίηση ωφελεί και τις ίδιες τις επιχειρήσεις: ξέρουν
      ακριβώς σε ποια κατηγορία ανήκουν, τι προδιαγραφές πρέπει να πληρούν και
      πού επιτρέπεται να εγκατασταθούν, χωρίς νομική αβεβαιότητα.
  - title: Ίσοι όροι ανταγωνισμού εντός της πόλης
    body: |
      Κάθε επιχείρηση πρέπει να κρίνεται με βάση αυτό που κάνει στην πράξη – τι
      παράγει, πώς λειτουργεί, ποιον αντίκτυπο έχει – και να υπόκειται στις
      αντίστοιχες προδιαγραφές. Όταν δύο επιχειρήσεις κάνουν ουσιαστικά παρόμοια
      πράγματα αλλά ο νόμος δεν το αναγνωρίζει, η μία επιβαρύνεται με υποχρεώσεις
      που η άλλη αποφεύγει. Το ξεπερασμένο νομικό πλαίσιο μπορεί, λοιπόν, να
      δημιουργεί και αθέμιτο ανταγωνισμό.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - category: legal
    body: |
      Πριν από οποιαδήποτε αναθεώρηση, χρειάζεται να κατανοήσουμε ακριβώς πού και
      πώς οι υφιστάμενες κατηγορίες χρήσεων γης αδυνατούν να περιγράψουν τη
      σύγχρονη πραγματικότητα, ποιες αλλαγές είναι εφικτές εντός του ισχύοντος
      νομικού πλαισίου και ποιες απαιτούν τροποποίηση του Π.Δ., και τι έχουν
      κάνει άλλες χώρες, τι λειτούργησε και υπό ποιες συνθήκες.
  - category: mapping
    body: |
      Παράλληλα, χρειάζεται να κοιτάξουμε την πόλη και να δούμε σε σε ποιες
      γειτονιές υπάρχει ήδη πίεση, ποιες χρήσεις συγκεντρώνονται πού και σε ποια
      κλίμακα. Αυτή η χαρτογράφηση θα διαμορφώσει τα δεδομένα από τα οποία θα
      προκύψουν τα επικαιροποιημένα ποσοστά ανά ζώνη, ώστε να αντικατοπτρίζουν
      την πραγματική κατάσταση κάθε περιοχής.

