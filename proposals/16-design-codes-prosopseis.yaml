number: 16
slug: design-codes-prosopseis
theme: identity
title: Design codes για τις προσόψεις ανά γειτονιά
one_line: >
  Ο Δήμος εκπονεί, σε συνεργασία με το Εθνικό Μετσόβιο Πολυτεχνείο, design codes
  για τις προσόψεις των κτιρίων ανά γειτονιά — ένα ανοιχτό ψηφιακό εργαλείο που
  αναλύει κάθε γειτονιά ως προς χρώμα, υλικά, ανοίγματα, γραμμή γείσου και
  χαρακτήρα ισογείου.

problem:
  body: |
    Η πρόσοψη ενός κτιρίου δεν είναι αμιγώς ιδιωτική υπόθεση καθώς επηρεάζει
    καθημερινά την αίσθηση πολλών ανθρώπων που γίνονται κοινωνοί της αισθητικής
    της, χωρίς να έχουν λόγο στις αποφάσεις του ιδιοκτήτη.

    Το πρόβλημα της ασυνέχειας των προσόψεων στην πόλη έχει δύο διαφορετικά
    πρόσωπα. Το πρώτο είναι οι αυθαίρετες αλλαγές σε υφιστάμενα κτίρια. Κάθε
    χρόνο, σε εκατοντάδες πολυκατοικίες της Αθήνας, κάποιος ιδιοκτήτης
    αποφασίζει να αλλάξει κούφωμα με διαφορετικό χρώμα, να επενδύσει τον
    όροφό του με κεραμίδια ή σκουρόχρωμο αλουμίνιο, να αντικαταστήσει το
    επίχρισμα με πλακάκια εξωτερικού χώρου, να προσθέσει τέντα που ξεφεύγει
    κατά μέτρα από τη γραμμή της πρόσοψης. Το δεύτερο πρόβλημα είναι οι νέες
    κατασκευές που συχνά πάσχουν από παντελή ασυνέχεια με τα κτίρια γύρω
    τους — ολοένα και συχνότερα με μεγάλες γυάλινες και λευκές φιναρισμένες
    επιφάνειες.

    Το υφιστάμενο ρυθμιστικό πλαίσιο είναι αρκετά χαλαρό.

    Για τα υφιστάμενα κτίρια, οι επεμβάσεις στις προσόψεις υπάγονται σε τρεις
    διακριτές κατηγορίες ανάλογα με τη φύση τους.

    Η πρώτη κατηγορία – χρωματισμοί, αντικατάσταση κουφωμάτων στο ίδιο άνοιγμα,
    επισκευές επιχρισμάτων χωρίς ικριώματα – δεν απαιτεί καμία έγκριση. Αρκεί
    έγγραφη ενημέρωση της αρμόδιας Υπηρεσίας Δόμησης του Δήμου 48 ώρες πριν την
    έναρξη των εργασιών. Δεν υποβάλλεται καμία μελέτη, δεν χρειάζεται κανένας
    μηχανικός, δεν ελέγχεται κανένα αισθητικό κριτήριο. Στην πράξη, ακόμα και
    αυτή η υποχρέωση ενημέρωσης παραλείπεται συστηματικά χωρίς συνέπειες.

    Η δεύτερη κατηγορία – εξωτερικός χρωματισμός με ικριώματα, επένδυση όψεων,
    αντικατάσταση υαλοπετασμάτων, τοποθέτηση εξωτερικής θερμομόνωσης – απαιτεί
    Έγκριση Εργασιών Δόμησης Μικρής Κλίμακας (ΕΕΔΜΚ). Αλλά η Έγκριση εκδίδεται
    αυτόματα, αμέσως μετά την ηλεκτρονική υποβολή των δικαιολογητικών. Τα
    απαιτούμενα δικαιολογητικά αφορούν αποκλειστικά τεχνικές παραμέτρους:
    δήλωση μηχανικού για στατική ασφάλεια, τοπογραφικό διάγραμμα, σχέδια όψεων.
    Κανένα από αυτά δεν κρίνει το χρώμα, το υλικό, ή τη συμβατότητα με τον
    χαρακτήρα της εν λόγω οδού.

    Η τρίτη κατηγορία – τροποποίηση ή διάνοιξη νέων ανοιγμάτων στην όψη –
    απαιτεί πλήρη οικοδομική άδεια, με αρχιτεκτονική μελέτη και στατική
    τεκμηρίωση. Εδώ υπάρχει ουσιαστικός έλεγχος, αλλά και αυτός αφορά
    αποκλειστικά τη συμμόρφωση με τον ΝΟΚ (ύψη, αποστάσεις, κάλυψη), όχι την
    αισθητική σχέση με το οδόστρωμα.

    Το κρίσιμο σημείο: σε καμία από τις τρεις κατηγορίες δεν υπάρχει κριτήριο
    αισθητικής ή χρωματικής συμβατότητας. Η αλλαγή χρώματος ενός ορόφου από
    εκρού σε σκούρο ανθρακί, η επένδυση με πλακάκια εξωτερικού χώρου, η
    αντικατάσταση παραδοσιακών επενδεδυμένων ξύλινων κουφωμάτων με αλουμίνιο
    μαύρο ματ – όλα αυτά εγκρίνονται ανεξάρτητα από το τι βρίσκεται τριγύρω.
    Εξαιρέσεις για αυξημένη επιτήρηση υπάρχουν μόνο για διατηρητέα κτίρια ή
    για κτίρια εντός ζωνών με ειδικό πολεοδομικό καθεστώς – δηλαδή για λίγες
    εκατοντάδες κτίρια κυρίως στην Πλάκα και τα Αναφιώτικα, όχι για τις
    κατοικίες του υπόλοιπου Δήμου.

    Για τις νέες κατασκευές, η οικοδομική άδεια εκδίδεται βάσει αρχιτεκτονικής
    μελέτης που ελέγχεται για συμμόρφωση με τον ΝΟΚ: ύψος, συντελεστής
    δόμησης, κάλυψη, αποστάσεις, αριθμός θέσεων στάθμευσης. Η ΥΔΟΜ δεν έχει
    ούτε εντολή ούτε εργαλεία να αξιολογήσει αν ένα νέο κτίριο «ταιριάζει»
    στον δρόμο που θα χτιστεί. Δεν υπάρχουν παράμετροι χρώματος, υλικών, ή
    ύψους γείσου στα κριτήρια ελέγχου της άδειας. Ο αρχιτέκτονας μπορεί να
    επιλέξει οποιαδήποτε πρόσοψη και η άδεια εκδίδεται κανονικά, αρκεί να
    τηρούνται οι τεχνικές παράμετροι του ΝΟΚ – ξανά με εξαιρέσεις για ζώνες
    ιδιαίτερου πολιτιστικού ενδιαφέροντος.

proposal:
  body: |
    Ο Δήμος εκπονεί, σε συνεργασία με Εθνικό Μετσόβιο Πολυτεχνείο, design codes
    για τις προσόψεις των κτιρίων ανά γειτονιά της Αθήνας. Δηλαδή, ένα ανοιχτό
    ψηφιακό εργαλείο που θα αναλύει κάθε γειτονιά ως προς πέντε παραμέτρους:

    1. Χρωματική παλέτα
    2. Υλικά επένδυσης
    3. Τυπολογία ανοιγμάτων
    4. Γραμμή γείσου – δηλαδή, το ύψος στο οποίο τελειώνει η πρόσοψη και
       αρχίζει η στέγη ή το δώμα
    5. Χαρακτήρας ισογείου – δηλαδή, αν το ισόγειο είναι ανοιχτό εμπορικό,
       κλειστό κατοικίας, υπερυψωμένο, ή εσοχή

    Η μεθοδολογία χαρτογράφησης μπορεί να συνδυάζει τρεις τεχνικές: ψηφιακή
    φωτογραμμετρία οδών (συστηματική λήψη φωτογραφιών προσόψεων σε επίπεδο
    οδοτμήματος), ανάλυση ιστορικών αεροφωτογραφιών και αρχειακών στοιχείων
    του ΕΜΠ, και επιτόπια αποτύπωση από φοιτητές αρχιτεκτονικής στο πλαίσιο
    εργαστηριακών μαθημάτων.

    Το αποτέλεσμα για κάθε γειτονιά είναι ένα «πορτρέτο» σε μορφή διαδραστικού
    χάρτη: ο χρήστης επιλέγει έναν δρόμο και βλέπει ποια στοιχεία κυριαρχούν,
    με τεκμηρίωση. Το εργαλείο είναι δημόσιο και ελεύθερα προσβάσιμο – τόσο
    για αρχιτέκτονες που σχεδιάζουν νέο κτίριο, όσο και για ιδιοκτήτες που
    σκέφτονται ανακαίνιση πρόσοψης, και για κατοίκους που θέλουν να
    καταλάβουν τι «ανήκει» στη γειτονιά τους.

    Το design code μπορεί να αποκτά ρόλο σε κάθε διαδικασία που εμπλέκεται η
    ΥΔΟΜ – δηλαδή σε όλες τις νέες κατασκευές και στις ανακαινίσεις που
    απαιτούν έγκριση (επενδύσεις όψεων, χρωματισμοί με ικριώματα, τοποθέτηση
    εξωτερικής θερμομόνωσης). Η λογική είναι απλή: κάθε φορά που ο φάκελος
    περνά από την ΥΔΟΜ, μπορεί να πρέπει συνοδεύεται από ένα τυποποιημένο
    «Φύλλο Συμβατότητας Πρόσοψης», μια σελίδα όπου ο αρχιτέκτονας δηλώνει,
    ανά παράμετρο του design code, αν η πρόσοψη ευθυγραμμίζεται ή αποκλίνει
    από τον χαρακτήρα της οδού και πώς. Δεν θα υπάρχει απαγόρευση βάσει
    ασυμβατότητας: ένας αρχιτέκτονας μπορεί κάλλιστα να σχεδιάσει κτίριο
    εκτός κώδικα, αρκεί να αιτιολογήσει την επιλογή. Αλλά το κίνητρο για
    συμμόρφωση είναι η διοικητική επιτάχυνση: φάκελοι που τεκμηριωμένα
    ευθυγραμμίζονται ≥70% με τον design code μπορεί να αδειοδοτούνται κατά
    προτεραιότητα, κάτι που μπορεί να μεταφράζεται σε πραγματικό οικονομικό
    κίνητρο για κάποιους.

implementation:
  body: |
    Η επιλογή να εστιάσουμε σε συγκεκριμένες ανακαινίσεις και σε νέες
    κατασκευές δεν είναι τυχαία: είναι οι δύο ακριβώς περιπτώσεις όπου
    εμπλέκεται η ΥΔΟΜ και υπάρχει ήδη φάκελος που περνά από δημοτική
    υπηρεσία. Δεν δημιουργούμε νέα σημεία ελέγχου, αξιοποιούμε αυτά που ήδη
    υπάρχουν.

    Το κρίσιμο νομικό ερώτημα είναι: μπορεί να αλλάξει τι δικαιολογητικά ζητά
    η ΥΔΟΜ; Η απάντηση είναι ναι, και με σχετικά απλή διαδικασία. Ο Ν.4495/2017
    (Άρθρο 29) εξουσιοδοτεί ρητά τον αρμόδιο Υπουργό να καθορίζει με Υπουργική
    Απόφαση τα δικαιολογητικά της ΕΕΔΜΚ – και αυτό έχει γίνει ήδη δύο φορές
    (ΥΑ 2018, ΥΑ 2020), προσθέτοντας και αφαιρώντας στοιχεία από τον κατάλογο.
    Η προσθήκη του Φύλλου Συμβατότητας Πρόσοψης στα δικαιολογητικά ΕΕΔΜΚ
    μπορεί να γίνει με τροποποίηση της υφιστάμενης ΥΑ ΥΠΕΝ/ΔΑΟΚΑ/43266/1174/2020.
    Αντίστοιχα, για τις νέες κατασκευές, ο υποχρεωτικός φάκελος οικοδομικής
    άδειας καθορίζεται από ΥΑ του Υπουργείου Ενέργειας – η ενσωμάτωση του
    Φύλλου γίνεται με την ίδια διαδικασία, απαιτώντας μόνο την υπουργική
    βούληση, όχι κοινοβουλευτική ψήφο.

limitations:
  - q: "Επιπλέον γραφειοκρατία: Τα design codes μπορεί να προσλαμβάνονται ως νέο στρώμα αδειοδοτικής πολυπλοκότητας σε μια χώρα που ήδη υποφέρει από αυτήν."
    a: >
      Μπορεί να προβλεφθεί μια πιλοτική φάση, στην οποία η υποβολή του Φύλλο
      Συμβατότητας δεν είναι υποχρεωτική. Όποιος δεν το υποβάλλει
      αδειοδοτείται κανονικά, με τους συνήθεις χρόνους. Όποιος το υποβάλλει
      και είναι συμβατός, επιταχύνεται. Χωρίς να υπάρχει ποινή μη συμμετοχής,
      μόνο απώλεια πλεονεκτήματος. Και αν η ζήτηση για επιτάχυνση αποδειχθεί
      ισχυρή στην πιλοτική φάση, η υποχρεωτική υποβολή του Φύλλου – χωρίς
      υποχρεωτική συμμόρφωση – μπορεί να εισαχθεί σε επόμενη φάση.

  - q: "Αρχιτεκτονική «λογοκρισία»: Μια μερίδα της αρχιτεκτονικής κοινότητας μπορεί να ερμηνεύσει τα design codes ως ελεγκτική παρέμβαση στη δημιουργικότητα."
    a: >
      Η εμπειρία της εφαρμογής των design codes στο εξωτερικό (π.χ.
      Άμστερνταμ, Βαρκελώνη) δείχνει το αντίθετο: σε πόλεις με ισχυρούς
      κώδικες, η αρχιτεκτονική ποιότητα αυξάνεται, ακριβώς επειδή οι
      αρχιτέκτονες έχουν κίνητρο να δείξουν πώς παρεκκλίνουν με νόημα και
      ουσία. Το design code δεν είναι λογοκρισία. Δείχνει τι υπάρχει ήδη στον
      δρόμο και ζητά από τον αρχιτέκτονα να πάρει θέση απέναντί του. Η θέση
      μπορεί να είναι συνέχεια ή ρήξη – και οι δύο είναι εν δυνάμει επιτρεπτές
      επιλογές. Αυτό που δεν είναι πλέον αποδεκτό είναι η αδιαφορία ως προς τι
      υπάρχει γύρω από ένα κτίριο.

  - q: "Παραμετροποίηση της αισθητικής: Κάθε απόπειρα να οριοθετηθεί ο αισθητικός χαρακτήρας μιας γειτονιάς μπορεί να θεωρηθεί ότι ενσωματώνει μια κρυφή αξιολόγηση: ότι κάποια στιγμή στην ιστορία του δρόμου ήταν πιο «αυθεντική» από άλλες, ότι κάποια υλικά «ανήκουν» εκεί και άλλα όχι, ότι η αισθητική του 1965 αξίζει περισσότερο από αυτή του 1995. Αν το design code γίνει αντιληπτό ως μια θεσμοθετημένη άποψη για το τι είναι ωραίο, τότε δικαιολογημένα θα αντιμετωπιστεί με καχυποψία."
    a: >
      Αλλά οι κώδικες δεν κάνουν κάτι τέτοιο: αποτυπώνουν στατιστικά τα
      επικρατέστερα στοιχεία ενός δρόμου, χωρίς να ισχυρίζονται ότι αυτά είναι
      αισθητικά ανώτερα από οτιδήποτε άλλο. Το μόνο που λένε είναι: αυτό
      υπάρχει ήδη εδώ. Αν θέλεις να κάνεις κάτι διαφορετικό, εξήγησε γιατί
      αξίζει. Η ρήξη δεν απαγορεύεται, απλώς δεν θα μπορεί πλέον να λαμβάνει
      χώρα ελαφρά τη καρδία.


