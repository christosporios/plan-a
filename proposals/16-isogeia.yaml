number: 16
slug: isogeia
theme: identity
title: Ζωντανεύοντας τα ισόγεια της πόλης
one_line: >
  Ένας σημαντικός παράγοντας στην ταυτότητα της πόλης ως μια πόλη μικτών
  χρήσεων είναι η εμπορική αξιοποίηση των ισογείων. Το ποσοστό κενών εμπορικών
  ισογείων είναι σήμερα πολύ υψηλό, με δύο κύρια εμπόδια: το υψηλότερο κόστος
  που συχνά απαιτείται για την ενοικίαση ενός ισογείου παρά ενός ορόφου, και η
  επιφυλακτικότητα των ιδιοκτητών απέναντι σε νέους ενοικιαστές. Και στα δύο
  μπορεί να παρέμβει ο Δήμος.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Ένας σημαντικός παράγοντας στην ταυτότητα της πόλης ως μιας πόλης μικτών χρήσεων είναι η εμπορική αξιοποίηση των ισογείων μέσα σε γειτονιές όπου στους ψηλότερους ορόφους κυριαρχούν διαμερίσματα. Το ποσοστό κενών εμπορικών ισογείων είναι σήμερα πολύ υψηλό, με δύο κύρια εμπόδια: το υψηλότερο κόστος που συχνά απαιτείται για την ενοικίαση ενός ισογείου παρά ενός ορόφου, και η επιφυλακτικότητα των ιδιοκτητών απέναντι σε νέους ενοικιαστές. Και στα δύο μπορεί να παρέμβει ο Δήμος – καλύπτοντας την εγγύηση στο ενοίκιο ενός ισογείου ώστε να μειωθεί το αρχικό κόστος για τον ενοικιαστή και λειτουργώντας ο ίδιος ως εγγυητής ώστε να δώσει στον ιδιοκτήτη την ασφάλεια που χρειάζεται για να προχωρήσει στη μίσθωση του ακινήτου του.

