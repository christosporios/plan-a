# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΖΩΝΤΑΝΗ ΤΑΥΤΟΤΗΤΑ» ─────────────────────────────
contribution:
  body: |
    Ένα κύριο χαρακτηριστικό της ταυτότητας της Αθήνας ως πόλης μικτών χρήσεων που είδαμε και αλλού, είναι τα ζωντανά ισόγεια. Σχεδόν κάθε οικοδομικό τετράγωνο στην πόλη έχει ισόγεια εμπορικής χρήσης που στεγάζουν διάφορες επιχειρήσεις – φούρνους, καφενεία, εστιατόρια, ιατρεία, γραφεία, κτλ. Κατοικία, εμπόριο, υπηρεσίες και κοινωνική ζωή συνυπάρχουν στον ίδιο δρόμο, και συχνά στην ίδια πολυκατοικία. Όταν το (εμπορικό) ισόγειο μένει κλειστό, χάνεται ένας από τους κρίκους που συνδέει τους ανθρώπους με τη γειτονιά τους.

    Στην Αθήνα, σήμερα, πολλά ισόγεια καταστήματα είναι κλειστά, υπονομεύοντας αυτόν τον μικτό χαρακτήρα της πόλης.

    ::: callout
    Σχεδόν 1 στα 4 καταστήματα στην Αθήνα παραμένει [κλειστό](https://www.in.gr/2023/10/01/economy/oikonomikes-eidiseis/kleista-tria-sta-deka-katastimata-sto-kentro-tis-athinas/)^1.
    :::

    Ο δήμος δεν μπορεί να αναγκάσει έναν ιδιοκτήτη να νοικιάσει ένα ισόγειο. Μπορεί όμως να αφαιρέσει δύο εμπόδια που σήμερα κρατούν τα ισόγεια κλειστά: το υψηλό αρχικό κόστος για τον ενοικιαστή και την έλλειψη ασφάλειας για τον ιδιοκτήτη. Προτείνονται δύο στοχευμένες, ταυτόχρονες παρεμβάσεις.

    Πρώτον, ο Δήμος καλύπτει την εγγύηση. Η ενοικίαση ενός χώρου απαιτεί αρχική ρευστότητα, κυρίως λόγω της εγγύησης που δεσμεύεται για όλη τη διάρκεια της μίσθωσης. Για μια νέα ή μικρή επιχείρηση με περιορισμένο κεφάλαιο εκκίνησης, αυτό το ποσό είναι συχνά ένα πραγματικό εμπόδιο. Καλύπτοντας την εγγύηση, ο Δήμος μειώνει δραστικά το αρχικό κόστος εισόδου σε έναν χώρο, χωρίς να επιδοτεί το ίδιο το ενοίκιο: το κεφάλαιο παραμένει εγγύηση και επιστρέφει στον Δήμο όταν λήξει ομαλά η μίσθωση. Αν η ρύθμιση αυτή ισχύει αποκλειστικά για ισόγεια, επιχειρήσεις που αναζητούν χώρο θα προτιμήσουν ισόγειο έναντι ορόφου, ακριβώς επειδή εκεί το οικονομικό εμπόδιο εισόδου είναι χαμηλότερο.

    Δεύτερον, ο Δήμος λειτουργεί ο ίδιος ως εγγυητής στη σύμβαση της μίσθωσης. Ένα από τα εμπόδια που δηλώνουν ιδιοκτήτες κενών ακινήτων δεν είναι η έλλειψη ενδιαφέροντος αλλά ο φόβος κακού μισθωτή. Αυτό δεν είναι πρόβλημα αποκλειστικά των ισογείων – αφορά γενικότερα την αγορά ενοικίασης. Εδώ όμως προτείνουμε να δοθεί η εγγύηση του Δήμου στοχευμένα σε ιδιοκτήτες κενών ισογείων, ως επιπλέον κίνητρο για να ανοίξουν έναν χώρο που παραμένει κλειστός. Με τον Δήμο ως εγγυητή, ο ιδιοκτήτης αποκτά την ασφάλεια που χρειάζεται για να προχωρήσει σε μίσθωση με έναν ενοικιαστή που διαφορετικά μπορεί να απέρριπτε.

    Παρόμοιες παρεμβάσεις έχουν ήδη δοκιμαστεί με επιτυχία αλλού. Στην Αγγλία, το [High Streets Task Force](https://www.placemanagement.org/2025/05/15/hope-for-the-high-street-ground-breaking-task-force-sheds-light-on-new-way-forward-for-high-streets/)^2 (2019–2024) συνεργάστηκε με 149 τοπικές αρχές σε πρόγραμμα ανάκαμψης εμπορικών δρόμων, με συνολική χρηματοδότηση £9 εκ. Το βασικό του συμπέρασμα ήταν ότι ο κρίσιμος παράγοντας δεν ήταν τα κεφάλαια, αλλά η ικανότητα της τοπικής ηγεσίας να συντονίζει ιδιοκτήτες, επιχειρηματίες και δήμο – κάτι που αντηχεί άμεσα με τον ρόλο που προτείνουμε για τον δήμο.

    Στη Βαρκελώνη, το πρόγραμμα [Amunt Persianes ](https://ajuntament.barcelona.cat/comerc/ca)^3(«Σηκώστε τα ρολά») στοχεύει στην ενεργοποίηση κενών ισογείων μέσω διαμεσολάβησης μεταξύ ιδιοκτητών και επιχειρηματιών, με στόχο τη σύναψη συμβάσεων υπό ευνοϊκούς όρους και για τα δύο μέρη. Αξίζει να σημειωθεί ότι το πρόγραμμα της Βαρκελώνης είναι σημαντικά πιο ευρύ από την παρούσα πρόταση: προσφέρει άμεση επιδότηση έως €20.000 ανά επιχείρηση, ενώ εδώ προτείνουμε την κάλυψη εγγύησης, χωρίς επιδότηση του ίδιου του ενοικίου ή του εξοπλισμού. Η λογική είναι να αφαιρεθεί το εμπόδιο εισόδου σε ένα ισόγειο με το μικρότερο δυνατό δημοσιονομικό αποτύπωμα.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Πώς επιλέγεται ποια ισόγεια και ποιες επιχειρήσεις μπαίνουν στο πρόγραμμα; Δεν υπάρχει κίνδυνος εκτόπισης μικρών από μεγάλους;"
    a: >
      Θα εξεταστεί αν τα έχει νόημα να μπουν κριτήρια επιλεξιμότητας – όχι
      οριζόντια για όλους, αλλά στοχευμένα: πχ μέγεθος επιχείρησης, αριθμός
      καταστημάτων, τοπική έδρα. Καθώς και το πώς θα μοιάζει η διαδικασία
      αξιολόγησης ώστε το πρόγραμμα να είναι όσο περισσότερο διαφανές γίνεται.

  - q: "Μήπως προκύπτει δημοσιονομικός κίνδυνος από το κεφάλαιο που χρειάζεται να δεσμευτεί για να προσφέρει εγγύηση ενοικίου στους ιδιοκτήτες;"
    a: >
      Το αποθεματικό εγγύησης δεσμεύεται αλλά δεν χάνεται: επιστρέφει στον Δήμο
      στην πλειοψηφία των περιπτώσεων, καθώς οι εγγυήσεις ενεργοποιούνται μόνο σε
      περίπτωση αθέτησης. Στην πράξη, το πραγματικό κόστος για τον Δήμο είναι πολύ
      μικρότερο του αρχικού δεσμευμένου κεφαλαίου.

  - q: "Τι γίνεται αν ο ιδιοκτήτης αρνείται να μισθώσει το ακίνητο ακόμα και με τη δημοτική εγγύηση;"
    a: >
      Η εγγύηση αντιμετωπίζει έναν συγκεκριμένο λόγο άρνησης: τον φόβο κακού
      μισθωτή. Αλλά δεν είναι σίγουρα ο μοναδικός και δεν πρέπει να περιμένουμε
      ότι με αυτό το μέτρο, το 100% των ισογείων θα ενεργοποιηθεί από τη μια μέρα
      στην άλλη.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Πιο ασφαλείς γειτονιές
    body: |
      Ο μηχανισμός είναι απλός: πιο ζωντανά καταστήματα φέρνουν περισσότερους επισκέπτες σε μια περιοχή και άρα, περισσότερο «μάτια στον δρόμο», αυτό που η Jane Jacobs περιέγραψε ως τον πιο αποτελεσματικό μηχανισμό αστικής ασφάλειας. Για παράδειγμα, μελέτη από το Πίτσμπουργκ δείχνει ότι όταν σημαντικά ακίνητα σε γειτονιές παρέμειναν κλειστά, η εγκληματικότητα γύρω τους αυξήθηκε [κατά 19%](https://www.sciencedirect.com/user/error/ATN-13?errorContext=arp-cae5e947-feb8-44a9-8b0c-9749abadb257)^4. Τα ίδια τα ανενεργά [χαρακτηρίζονται](https://www.propertysec.co.uk/post/void-property-crime-prevention)^5 ως «ευάλωτα σε βανδαλισμό, κλοπές και εμπρησμούς», καθώς η έλλειψη χρήσης και εποπτείας τα καθιστά «εύκολο στόχο» για δράστες – για παράδειγμα, περίπου [750.000 κλειστά κτίρια](https://www.wcctv.co.uk/how-many-vacant-properties-are-there-in-the-uk/)^6 στο Ηνωμένο Βασίλειο υποβάλλονται σε βανδαλισμό κάθε χρόνο.

  - title: Μεγαλύτερη οικονομική αξία
    body: |
      Κάθε κενό ισόγειο μειώνει την αξία των γειτονικών ακινήτων. Για παράδειγμα, στην πόλη του [Κλίβελαντ](https://communityprogress.org/blog/how-vacant-abandoned-buildings-affect-community/)^7, οι κατοικίες σε ακτίνα 150 μέτρων από κενά κτίρια κενά, έχασαν κατά μέσο όρο 9,4% της αξίας – απώλεια που μεταφράζεται σε σημαντική μείωση της περιουσίας των ιδιοκτητών. Παρόμοιες μελέτες στη Φιλαδέλφεια και το Κολόμπους έδειξαν ότι η παρουσία ενός και μόνο κενού κτιρίου σε ένα οικοδομικό τετράγωνο μπορεί να μειώσει την αξία των γειτονικών ακινήτων [κατά τουλάχιστον 20%](https://www.lincolninst.edu/app/uploads/legacy-files/pubfiles/empty-house-next-door-full.pdf)^8. Μάλιστα, η σχέση μεταξύ ποσοστού κενών ακινήτων και τιμών πώλησης δεν είναι γραμμική αλλά [γεωμετρική](https://www.lincolninst.edu/app/uploads/legacy-files/pubfiles/empty-house-next-door-full.pdf)^9: ακόμη και μια μικρή αύξηση του ποσοστού αδράνειας αρκεί για να προκαλέσει πολλαπλάσια πτώση στις τιμές.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - category: legal
    body: >
      Να διερευνηθούν διάφορα ερωτήματα όπως το ποια κριτήρια επιλεξιμότητας
      διασφαλίζουν ότι το πρόγραμμα απευθύνεται στις επιχειρήσεις που πρέπει, πώς
      δομείται νομικά η σχέση δήμου–ιδιοκτήτη–επιχείρησης στο μισθωτήριο, ποιοι
      όροι διέπουν την ενεργοποίηση της εγγύησης σε περίπτωση αθέτησης, πώς
      γίνεται η επίλυση τυχόν διαφορών.

  - category: costing
    body: >
      Να αποσαφηνιστεί το πραγματικό κόστος του προγράμματος: σε πόσα ισόγεια
      στοχεύει, ποιο είναι το μέσο εκτιμώμενο ύψος εγγύησης ανά σύμβαση, και άρα
      ποιο εκτιμάται ότι θα είναι το συνολικό δεσμευμένο κεφάλαιο. Παράλληλα,
      χρειάζεται να εκτιμηθεί και η ζήτηση, πόσες επιχειρήσεις αναμένεται να το
      αξιοποιήσουν και ποιο επίπεδο ζήτησης είναι διαχειρίσιμο με τους διαθέσιμους
      πόρους. Αυτό έχει άμεση σχέση με το πόση και τι είδους επικοινωνία θα γίνει –
      για παράδειγμα, αν επιχειρήσεις που αναζητούν χώρο σε πλατφόρμες αγγελιών
      βλέπουν ενημέρωση για το πρόγραμμα, η ζήτηση μπορεί να αυξηθεί γρήγορα. Πριν
      από οποιαδήποτε τέτοια ενέργεια, πρέπει να έχει αποφασιστεί το ανώτατο όριο
      συμμετοχών που μπορεί να απορροφηθεί.

