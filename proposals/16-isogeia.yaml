# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΖΩΝΤΑΝΗ ΤΑΥΤΟΤΗΤΑ» ─────────────────────────────
contribution:
  body: |
    Σχεδόν κάθε οικοδομικό τετράγωνο στον Δήμο Αθηναίων έχει ισόγεια εμπορικής
    χρήσης στεγάζοντας διάφορες επιχειρήσεις – φούρνους, καφενεία, εστιατόρια,
    ιατρεία, γραφεία, κτλ. Κατοικία, εμπόριο, υπηρεσίες και κοινωνική ζωή
    συνυπάρχουν στον ίδιο δρόμο, και συχνά στην ίδια πολυκατοικία, ακριβώς
    επειδή το ισόγειο παραμένει ανοιχτό σε διαφορετικές χρήσεις. Όταν το
    (εμπορικό) ισόγειο μένει αδρανές, χάνεται ο κρίκος που συνδέει τους
    ανθρώπους με τη γειτονιά τους.

    Ωστόσο, το ποσοστό κενών εμπορικών ισογείων στο κέντρο της Αθήνας είναι
    πολύ υψηλό. Αν και δεν υπάρχει συστηματική καταγραφή, εκτιμάται σε 28–34%.
    Παράλληλα, δεν είναι μόνο τα κενά ισόγεια που αποτελούν πρόβλημα – είναι και
    τα ισόγεια με χρήσεις-φάντασμα όπως αποθήκες διανομής ή σημεία συλλογής
    δεμάτων. Αν και αυτά τα ισόγεια δεν είναι κενά, λειτουργούν στην πράξη
    ως τέτοια για τη ζωντανιά της γειτονιάς.
  callouts:
    - |
      **Η ασφάλεια επηρεάζεται άμεσα.** Σε μελέτη 24 αμερικανικών πόλεων, κάθε
      10% αύξηση στα κενά εμπορικά ισόγεια συνδέονταν με αύξηση 3-6% στα
      εγκλήματα κατά ιδιοκτησίας στην ίδια γειτονιά.^1 Ο μηχανισμός είναι απλός:
      λιγότεροι πεζοί σημαίνει λιγότερα «μάτια στον δρόμο», αυτό που η Jane
      Jacobs περιέγραψε ως τον πιο αποτελεσματικό μηχανισμό αστικής ασφάλειας. Η
      Αθήνα, με υψηλά ποσοστά κενών ισογείων, έχει και υψηλά ποσοστά εγκλημάτων
      κατά ιδιοκτησίας στην ΕΕ.^2
    - |
      **Η αξία των ακινήτων πλήττεται μετρήσιμα.** Κάθε κενό ισόγειο μειώνει την
      αξία των γειτονικών ακινήτων κατά εκτιμώμενο 0,5-1,2% ανά 100 μέτρα.^3
      Σε γειτονιά όπου το 35% των ισογείων είναι κενά, η συσσωρευτική αρνητική
      επίδραση μπορεί να φτάσει το 8-12% στην αξία των κατοικιών – ζημιά που
      επιβαρύνει δυσανάλογα τους κατοίκους χαμηλότερου εισοδήματος που διαμένουν
      σε αυτές τις γειτονιές.
  body_after: |
    Η τοπική οικονομία επίσης αποδυναμώνεται: κάθε κενό ισόγειο αντιπροσωπεύει
    μηδενισμένη επιχειρηματική δραστηριότητα, μηδενισμένες θέσεις εργασίας και
    μηδενισμένα έσοδα για τον Δήμο.

    Πίσω από τα υψηλά αυτά ποσοστά κενότητας κρύβονται δύο συγκεκριμένα εμπόδια,
    και η πρόταση παρεμβαίνει ακριβώς σε αυτά.

    Το πρώτο εμπόδιο είναι το **κόστος εισόδου για τον ενοικιαστή**. Η ενοικίαση
    ισογείου απαιτεί συχνά υψηλότερο αρχικό κεφάλαιο από έναν όροφο, με την
    εγγύηση να αποτελεί σημαντικό μέρος του. Καλύπτοντας την εγγύηση, ο Δήμος
    μειώνει το φράγμα που εμποδίζει τη νέα ή μικρή επιχείρηση να ανοίξει – χωρίς
    να επιδοτεί το ενοίκιο και χωρίς μόνιμη δαπάνη, αφού το ποσό επιστρέφεται.

    Το δεύτερο εμπόδιο είναι η **επιφυλακτικότητα του ιδιοκτήτη**. Σε έρευνα του
    Urban Land Institute σε 8 ευρωπαϊκές πόλεις, το 58% των ιδιοκτητών ανέφερε
    τον φόβο κακού μισθωτή ως πρωταρχικό εμπόδιο για να νοικιάσει.^4
    Λειτουργώντας ως εγγυητής, ο Δήμος αναλαμβάνει ακριβώς αυτόν τον
    κίνδυνο που σήμερα κρατά τα ισόγεια κλειστά, δίνοντας στον ιδιοκτήτη την
    ασφάλεια να προχωρήσει. Επειδή και τα δύο εμπόδια λύνονται ταυτόχρονα,
    αυξάνεται ουσιαστικά η πιθανότητα να ενεργοποιηθεί ένα ισόγειο που σήμερα
    μένει κενό – και μαζί του ένα κομμάτι της ζωντανής, μικτής ταυτότητας της
    γειτονιάς.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Ιδιοκτήτες που δεν θέλουν να νοικιάσουν."
    a: >
      Το πρόβλημα δεν είναι πάντα η έλλειψη ζήτησης – είναι ιδιοκτήτες που δεν
      έχουν οικονομική ανάγκη να νοικιάσουν, που κληρονόμησαν ένα ισόγειο και
      δεν το έχουν ως προτεραιότητα, ή που περιμένουν ενοίκιο που η αγορά δεν
      δικαιολογεί πλέον. Καμία από τις δύο παρεμβάσεις δεν μπορεί να αναγκάσει
      αυτόν τον ιδιοκτήτη. Αλλά δεν χρειάζεται. Στόχος δεν είναι η μηδενική
      κενότητα αλλά η μείωσή της. Η κάλυψη της εγγύησης και ο ρόλος του εγγυητή
      απευθύνονται στον ιδιοκτήτη που θέλει να νοικιάσει αλλά διστάζει λόγω
      ρίσκου, και στον ενοικιαστή που θέλει αλλά δεν έχει το αρχικό κεφάλαιο –
      και αυτοί είναι αρκετοί για να αποτελούν μια κρίσιμη μάζα.

  - q: "Δημοσιονομικός κίνδυνος για τον Δήμο από το κεφάλαιο που χρειάζεται να δεσμεύσει."
    a: >
      Τόσο η εγγύηση που καλύπτει ο Δήμος όσο και η εγγυοδοσία προς τον ιδιοκτήτη
      δεσμεύουν κεφάλαιο, αλλά αυτό επιστρέφει στον Δήμο στην πλειοψηφία των
      περιπτώσεων: η εγγύηση εξαργυρώνεται μόνο σε περίπτωση αθέτησης των
      συμβολαίων. Στο Ρότερνταμ, όπου λειτουργεί παρόμοιο πρόγραμμα, το ποσοστό
      ενεργοποίησης εγγυήσεων δεν ξεπέρασε το 8% των συμβάσεων – δηλαδή το
      πραγματικό κόστος για τον Δήμο ήταν πολύ μικρότερο του αρχικού δεσμευμένου
      κεφαλαίου.

  - q: "Κίνδυνος εκτόπισης μικρών από μεγάλους."
    a: >
      Αν η στήριξη δεν στοχεύσει σωστά, τα ισόγεια μπορεί να ενεργοποιηθούν από
      αλυσίδες και franchise αντί από μικρές τοπικές επιχειρήσεις,
      αναπαράγοντας ακριβώς τον τύπο εμπορίου που δεν δίνει χαρακτήρα στη
      γειτονιά. Γι' αυτό η κάλυψη εγγύησης και η εγγυοδοσία στοχεύουν κατά
      προτεραιότητα μικρές, νέες και τοπικές επιχειρήσεις με περιορισμένο
      κεφάλαιο εκκίνησης – ακριβώς όσες δεν έχουν πρόσβαση στα μεγάλα αρχικά
      ποσά που απαιτεί σήμερα ένα ισόγειο.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Πιο ασφαλείς γειτονιές
    body: >
      Κάθε ισόγειο που ενεργοποιείται προσθέτει πεζούς, φως και «μάτια στον
      δρόμο» – τον μηχανισμό αστικής ασφάλειας που περιέγραψε η Jane Jacobs. Σε
      μια πόλη όπου τα υψηλά ποσοστά κενών ισογείων συνδέονται με υψηλά ποσοστά
      εγκλημάτων κατά ιδιοκτησίας, η μείωση της κενότητας αποδίδει άμεσο όφελος
      ασφάλειας στη γειτονιά.

  - title: Στήριξη της μικρής, τοπικής επιχειρηματικότητας
    body: >
      Καλύπτοντας την εγγύηση, ο Δήμος ανοίγει την πρόσβαση σε ισόγεια σε
      επιχειρήσεις που σήμερα αποκλείονται από το αρχικό κόστος: τον νέο
      επιχειρηματία με περιορισμένο κεφάλαιο, τη μικρή κοινωνική επιχείρηση. Έτσι
      ευνοείται η μικρή τοπική επιχείρηση που δίνει χαρακτήρα στη γειτονιά, αντί
      μόνο όσων έχουν ισχυρή κεφαλαιακή βάση.

  - title: Διατήρηση και ανάκτηση αξίας ακινήτων
    body: >
      Καθώς η κενότητα μειώνει μετρήσιμα την αξία των γειτονικών ακινήτων, η
      ενεργοποίηση κενών ισογείων δρα αντίστροφα: σταθεροποιεί και ανακτά αξία
      προς όφελος των κατοίκων, ιδίως στις γειτονιές χαμηλότερου εισοδήματος που
      πλήττονται περισσότερο.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Σχεδιασμός του μηχανισμού εγγύησης και εγγυοδοσίας
    body: >
      Να οριστούν οι όροι των δύο παρεμβάσεων: ποιο ποσοστό της εγγύησης καλύπτει
      ο Δήμος και για πόσο, ποια κριτήρια επιλεξιμότητας ισχύουν για επιχειρήσεις
      (μέγεθος, τύπος χρήσης, εντοπιότητα), και πώς οριοθετείται η ευθύνη του
      Δήμου ως εγγυητή έναντι του ιδιοκτήτη. Να εκτιμηθεί το αναγκαίο αποθεματικό
      με βάση το παράδειγμα του Ρότερνταμ (ενεργοποίηση εγγυήσεων ≤8%).

  - title: Απλός κατάλογος ισογείων και διευκόλυνση προσωρινών χρήσεων
    body: >
      Παράλληλα, να τηρείται ένας απλός κατάλογος των κενών εμπορικών ισογείων –
      αντλώντας από άδειες λειτουργίας που ο Δήμος ήδη εκδίδει – ώστε οι δύο
      παρεμβάσεις να κατευθύνονται εκεί που χρειάζονται. Να εξεταστεί επίσης η
      διευκόλυνση προσωρινών χρήσεων (meanwhile use) με ελαφρύτερη αδειοδότηση,
      ώστε μια επιχείρηση να δοκιμάζει έναν χώρο πριν δεσμευτεί σε μακροχρόνια
      μίσθωση.

