number: 16
slug: isogeia
theme: identity
title: Ζωντανεύοντας τα ισόγεια της πόλης
one_line: >
  Ένας σημαντικός παράγοντας στην ταυτότητα της πόλης ως μια πόλη μικτών
  χρήσεων είναι η εμπορική αξιοποίηση των ισογείων. Το ποσοστό κενών εμπορικών
  ισογείων είναι σήμερα πολύ υψηλό, με δύο κύρια εμπόδια: το υψηλότερο κόστος
  που συχνά απαιτείται για την ενοικίαση ενός ισογείου παρά ενός ορόφου, και η
  επιφυλακτικότητα των ιδιοκτητών απέναντι σε νέους ενοικιαστές. Και στα δύο
  μπορεί να παρέμβει ο Δήμος.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Ο Δήμος δεν μπορεί να αναγκάσει έναν ιδιοκτήτη να νοικιάσει ένα ισόγειο.
    Μπορεί όμως να αφαιρέσει τα δύο εμπόδια που σήμερα κρατούν τα ισόγεια
    κλειστά: το υψηλό αρχικό κόστος για τον ενοικιαστή και την έλλειψη
    ασφάλειας για τον ιδιοκτήτη. Προτείνονται δύο στοχευμένες, ταυτόχρονες
    παρεμβάσεις.

    **Πρώτον, ο Δήμος καλύπτει την εγγύηση.** Η ενοικίαση ενός εμπορικού
    ισογείου απαιτεί συχνά υψηλότερο αρχικό κόστος από έναν όροφο – ενοίκιο
    προκαταβολής συν εγγύηση που δεσμεύεται για όλη τη διάρκεια της μίσθωσης.
    Για μια νέα ή μικρή επιχείρηση με περιορισμένο κεφάλαιο εκκίνησης, αυτό το
    ποσό είναι συχνά το πραγματικό εμπόδιο. Καλύπτοντας την εγγύηση ο Δήμος
    μειώνει δραστικά το αρχικό κόστος εισόδου, χωρίς να επιδοτεί το ίδιο το
    ενοίκιο: το κεφάλαιο παραμένει εγγύηση και επιστρέφει στον Δήμο όταν λήξει
    ομαλά η μίσθωση.

    **Δεύτερον, ο Δήμος λειτουργεί ο ίδιος ως εγγυητής.** Το μεγαλύτερο εμπόδιο
    που δηλώνουν ιδιοκτήτες κενών ισογείων δεν είναι η έλλειψη ενδιαφέροντος
    αλλά ο φόβος κακού μισθωτή. Με τον Δήμο ως εγγυητή έναντι του ιδιοκτήτη, ο
    τελευταίος αποκτά την ασφάλεια που χρειάζεται για να προχωρήσει σε μίσθωση
    με νέο ενοικιαστή που διαφορετικά θα απέρριπτε. Η εγγύηση του Δήμου
    ενεργοποιείται μόνο σε περίπτωση αθέτησης – στις περισσότερες περιπτώσεις
    δεν εξαργυρώνεται ποτέ.

    Οι δύο παρεμβάσεις δρουν στις δύο πλευρές της ίδιας συναλλαγής: η κάλυψη της
    εγγύησης ξεκλειδώνει τον ενοικιαστή, ο ρόλος του εγγυητή ξεκλειδώνει τον
    ιδιοκτήτη. Συμπληρωματικά, ο Δήμος μπορεί να τηρεί έναν απλό κατάλογο των
    κενών εμπορικών ισογείων και να διευκολύνει προσωρινές χρήσεις (meanwhile
    use) με ελαφρύτερη αδειοδότηση, αλλά ο πυρήνας της πρότασης είναι οι δύο
    παρεμβάσεις στο κόστος και στην ασφάλεια.

