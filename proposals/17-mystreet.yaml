number: 17
slug: mystreet
theme: municipality
title: MyStreet 2.0
one_line: >
  Μια αναβαθμισμένη ενιαία πλατφόρμα καταγγελιών για θόρυβο και κατάληψη
  κοινόχρηστου χώρου από επιχειρήσεις: ο πολίτης βλέπει άμεσα τι επιτρέπεται
  και τι όχι, και καταγγέλλει εύκολα αν διαπιστώνει παράβαση.

problem:
  body: |
    Η Αθήνα είναι μια ζωντανή πόλη με έντονη νυχτερινή ζωή και πυκνή
    δραστηριότητα εστίασης. Αυτό αποτελεί κομμάτι της ταυτότητάς της και
    σημαντικό παράγοντα του οικονομικού της μοντέλου — αλλά χωρίς ρύθμιση,
    γίνεται πηγή συστηματικής υποβάθμισης της ποιότητας ζωής στις γειτονιές.

    Συγκεκριμένα, δύο προβλήματα προκύπτουν και αλληλοτροφοδοτούνται. Πρώτον, η
    κατάληψη δημοσίου χώρου: τραπεζοκαθίσματα επιχειρήσεων υπερβαίνουν
    συστηματικά τα νόμιμα όρια. Δεύτερον, υψηλά επίπεδα θορύβου τόσο εξαιτίας
    της μουσικής όσο και της γενικότερης κίνησης από χώρους εστίασης και
    ψυχαγωγίας.

    Για τη χρήση μουσικής, κάθε κατάστημα δηλώνει απλώς ότι θα χρησιμοποιήσει
    μουσική, χωρίς να απαιτείται άδεια από κανένα όργανο. Το Δημοτικό
    Συμβούλιο, ωστόσο, διατηρεί την αρμοδιότητα έκδοσης τοπικής κανονιστικής
    απόφασης που ορίζει τα γενικά ωράρια λειτουργίας μουσικής για όλα τα
    καταστήματα του Δήμου, λαμβάνοντας υπόψη τις χρήσεις γης, τις τοπικές
    συνθήκες και την προστασία από την ηχορύπανση — με εισήγηση της Δημοτικής
    Επιτροπής. Στον Δήμο Αθηναίων τα ισχύοντα γενικά ανώτατα όρια είναι 01:00
    για Κυριακή έως Πέμπτη και 03:00 για Παρασκευή, Σάββατο και αργίες.

    Η παράταση ωραρίου πέρα από αυτά τα όρια απαιτεί ειδική άδεια. Αρμόδιο
    όργανο για τη χορήγησή της είναι το Συμβούλιο της Δημοτικής Κοινότητας
    εντός των ορίων της οποίας βρίσκεται η επιχείρηση· εάν αποφασίσει θετικά,
    εκδίδεται διαπιστωτική πράξη Δημάρχου με ετήσια ισχύ. Να σημειωθεί επίσης
    ότι το Συμβούλιο της Δημοτικής Κοινότητας μπορεί, με αιτιολογημένη απόφαση,
    να ορίσει ωράριο παράτασης *μικρότερο* από το γενικό ανώτατο — δηλαδή να
    διαφοροποιήσει τους όρους κατά γειτονιά ή κατά κατάστημα. Η άδεια
    παράτασης δεν χορηγείται όταν υπάρχουν περισσότερες από δύο βεβαιωμένες
    παραβάσεις ηχορύπανσης ή υπέρβασης ωραρίου εντός έτους.

    Για τα τραπεζοκαθίσματα, η αρμοδιότητα είναι επίσης αποκλειστικά δημοτική.
    Το Δημοτικό Συμβούλιο θέτει με κανονιστική απόφαση το γενικό πλαίσιο —
    ποιοι χώροι παραχωρούνται, υπό ποιες προϋποθέσεις (ελεύθερη διέλευση
    πεζών, πρόσβαση ΑμΑ, απαγόρευση μόνιμων κατασκευών και εξωτερικών ηχείων
    στον παραχωρούμενο χώρο). Κάθε μεμονωμένη άδεια εκδίδεται από την αρμόδια
    υπηρεσία του Δήμου, μετά από γνωμάτευση της Αστυνομίας ή της Δημοτικής
    Αστυνομίας για ό,τι αφορά την πρόσβαση στους δρόμους. Σε περίπτωση
    αυθαίρετης κατάληψης πέρα από την άδεια, ο Δήμος επιβάλλει πρόστιμο και
    απομακρύνει άμεσα τα επιπλέον τραπεζοκαθίσματα· δεύτερη παράβαση εντός
    τριμήνου συνεπάγεται αφαίρεση άδειας χρήσης και τρίμηνη αναστολή
    λειτουργίας. Για τα τραπεζοκαθίσματα, το Συμβούλιο της Δημοτικής
    Κοινότητας δεν έχει αποφασιστική αρμοδιότητα — ούτε στη χορήγηση
    μεμονωμένων αδειών ούτε στη διαμόρφωση του γενικού πλαισίου. Διατηρεί όμως
    γνωμοδοτική αρμοδιότητα.

    Υπάρχει ήδη ένα ρυθμιστικό πλαίσιο που, επί της αρχής, διασφαλίζει ότι οι
    επιχειρήσεις εστίασης και διασκέδασης στην Αθήνα λειτουργούν με
    συγκεκριμένους όρους ως προς τον θόρυβο, τα τραπεζοκαθίσματα σε
    κοινόχρηστους χώρους και τη μουσική. Στην πράξη όμως, ο πολίτης δεν μπορεί
    εύκολα να γνωρίζει τι ισχύει για κάθε επιχείρηση. Δεν ξέρει αν τα
    τραπεζοκαθίσματα μπροστά από ένα καφέ έχουν αδειοδοτημένο εμβαδό που
    ταιριάζει με αυτό που βλέπει, ούτε αν η μουσική που ακούει εκείνη την ώρα
    επιτρέπεται βάσει της άδειας που έχει εκδοθεί. Και αυτό έχει ως συνέπεια
    ότι ο πολίτης δεν ξέρει αν έχει λόγο να διαμαρτυρηθεί. Αν δεν γνωρίζει τι
    επιτρέπεται, δεν μπορεί να κρίνει αν αυτό που βιώνει αποτελεί παράβαση ή
    όχι, και έτσι η δράση γίνεται λιγότερο ελκυστική.

proposal:
  body: |
    Το MyStreet, η πλατφόρμα του Υπουργείου Ψηφιακής Διακυβέρνησης, έχει ήδη
    αρχίσει να καλύπτει μέρος αυτού του κενού καθώς παρουσιάζει στοιχεία όπως
    το εμβαδόν της παραχώρησης κοινόχρηστου χώρου. Αυτό είναι ένα σημαντικό
    πρώτο βήμα, που όμως δεν φτάνει για να μπορέσει κανείς να κρίνει αν αυτό
    που βλέπει μπροστά του συνάδει με αυτό που επιτρέπεται.

    Μια αναβαθμισμένη έκδοση του εργαλείου θα μπορούσε να προσφέρει δύο
    πράγματα. Πρώτον, να επιτρέπει στον χρήστη να ανοίξει την κάμερα, να
    στοχεύσει μια επιχείρηση και να λάβει άμεσα μια εκτίμηση: υπάρχει πιθανή
    παράβαση στα τραπεζοκαθίσματα, δεν υπάρχει, ή το αποτέλεσμα είναι αβέβαιο.
    Σε κάθε περίπτωση, ο πολίτης να μπορεί να προχωρήσει σε καταγγελία — όπως
    ήδη προβλέπεται — αλλά τώρα με βάση καλύτερα δεδομένα και με σαφέστερη
    εικόνα του τι καταγγέλλει. Δεύτερον, να παρουσιάζει με απλό τρόπο ποιες
    ώρες μιας επιχείρησης καλύπτονται από άδεια μουσικής και ποιες όχι, ώστε
    ο πολίτης που ακούει μουσική τα μεσάνυχτα να μπορεί να ελέγξει αμέσως αν
    αυτό επιτρέπεται — και αν όχι, να υποβάλει καταγγελία και για αυτό.

    Ο στόχος είναι μια ενιαία πλατφόρμα καταγγελιών, όσο πιο απλή γίνεται: ο
    πολίτης να μπορεί να βλέπει τι επιτρέπεται — χωρίς να χρειάζεται να
    διαβάσει μεγάλο όγκο πληροφορίας, χωρίς να ψάχνει σε σχέδια που είναι
    ακατανόητα για τον μη ειδικό — και να καταγγέλλει εύκολα αν νιώθει ότι
    υπάρχει παράβαση.

implementation:
  body: |
    Η τεχνική υποδομή υπάρχει ήδη — χρειάζεται καλύτερη διασύνδεση με
    διαφορετικές πηγές πληροφορίας που σήμερα λειτουργούν ανεξάρτητα η μία από
    την άλλη. Ένα χαρακτηριστικό παράδειγμα είναι τα πρακτικά των δημοτικών
    κοινοτήτων, όπου αποφασίζονται παρατάσεις ωραρίου μουσικής για
    συγκεκριμένες περιοχές. Αυτή η διασύνδεση απαιτεί συνεργασία μεταξύ του
    Δήμου Αθήνας, που κατέχει τα δεδομένα αδειοδότησης, και του Υπουργείου
    Ψηφιακής Διακυβέρνησης, που διαχειρίζεται το MyStreet.

limitations:
  - q: "Σύγκρουση με επιχειρηματίες: ο κλάδος εστίασης αντιπροσωπεύει σημαντικό μερίδιο της τοπικής οικονομίας και απασχόλησης."
    a: >
      Η πρόταση δεν στοχεύει σε οριζόντιες απαγορεύσεις αλλά στην εφαρμογή
      κανόνων που ήδη υπάρχουν. Το δημόσιο μητρώο, επιπλέον, προστατεύει και
      τις επιχειρήσεις που συμμορφώνονται καθώς η διαφάνεια δημιουργεί ίσους
      όρους ανταγωνισμού έναντι εκείνων που λειτουργούν εκτός ορίων.

  - q: "Δυσκολία διατήρησης των δεδομένων ενημερωμένων: οι άδειες αλλάζουν, τα ωράρια τροποποιούνται, οι παραχωρήσεις ανανεώνονται — και αν η πλατφόρμα δεν αντικατοπτρίζει την τρέχουσα κατάσταση, ο πολίτης καταγγέλλει με λανθασμένα δεδομένα."
    a: >
      Πέρα από την πλατφόρμα που θα κάνει την πρώτη δουλειά της συγκέντρωσης
      και παρουσίασης της πληροφορίας, μπορεί να χρειαστεί και ένα ακόμη
      κίνητρο για να παραμένουν τα δεδομένα ακριβή. Ένας τρόπος είναι να
      συμβάλουν και οι ίδιες οι επιχειρήσεις μέσα από τη σύνδεση με τη
      φορολογική ενημερότητα: η επιβεβαίωση ότι τα στοιχεία της επιχείρησης
      στην εφαρμογή είναι τα τελευταία σε ισχύ να αποτελεί κριτήριο ή
      προϋπόθεση για την έκδοσή της.

  - q: "Το σύστημα είναι τόσο καλό όσο και οι κανόνες που αποτυπώνει."
    a: >
      Αν η ίδια η άδεια που έχει εκδοθεί είναι προβληματική — αν επιτρέπει
      πράγματα που στην πράξη δημιουργούν πρόβλημα στους κατοίκους — τότε η
      εφαρμογή απλώς επιβεβαιώνει ότι η παράβαση δεν υπάρχει, κι ο πολίτης
      μένει χωρίς στήριξη. Το να ξέρεις ότι κάτι επιτρέπεται δεν σημαίνει ότι
      είναι σωστό που επιτρέπεται. Οι αποφάσεις αδειοδότησης είναι σήμερα σε
      μεγάλο βαθμό μαύρο κουτί — λαμβάνονται χωρίς η πληροφορία να είναι
      εύκολα προσβάσιμη στο ευρύ κοινό. Αυτό δημιουργεί συνθήκες στις οποίες
      οι άδειες μπορεί να εκδίδονται ελαφρά την καρδιά, με μεγαλύτερη ανοχή σε
      ευνοϊκούς όρους, χωρίς να είναι εμφανές το αποτέλεσμα. Όταν όμως η
      πληροφορία γίνει εύκολα προσβάσιμη — όταν ένας πολίτης μπορεί να δει
      ότι μια επιχείρηση έχει άδεια μουσικής μέχρι τις τρεις τα ξημερώματα σε
      αμιγώς κατοικημένη περιοχή, τυχόν οξύμωρα ή δυσανάλογες δυνατότητες
      γίνονται αμέσως ορατές και εύκολα κατανοητές. Αυτό σημαίνει ότι και όσοι
      εκδίδουν τις άδειες θα είναι πιο προσεκτικοί. Η πλατφόρμα, δηλαδή, δεν
      είναι μόνο εργαλείο καταγγελίας για τον πολίτη — είναι και μηχανισμός
      λογοδοσίας για καλύτερη αδειοδότηση από τις αρχές.

  - q: "Ενημέρωση χωρίς επιβολή: μια εφαρμογή και μια ενημερωμένη κοινότητα δεν αρκούν αν η Δημοτική Αστυνομία δεν κάνει συστηματικούς ελέγχους και αν οι καταγγελίες δεν ακολουθούνται από καμία ορατή ενέργεια."
    a: >
      Γιατί ο πολίτης που κατήγγειλε και δεν είδε τίποτα να αλλάξει απλώς
      σταματά να κάνει τον κόπο. Δύο στοιχεία μπορούν να λειτουργήσουν ως
      αντιστάθμισμα. Το πρώτο είναι να έχει κάθε επιχείρηση στην εφαρμογή το
      δικό της δημόσιο ιστορικό: πόσες καταγγελίες έχουν υποβληθεί, πότε, και
      τι ακολούθησε. Το δεύτερο είναι η πρώτη σελίδα της εφαρμογής να
      παρουσιάζει συνολικά στατιστικά: πόσες καταγγελίες έχουν υποβληθεί, σε
      πόσες επιβλήθηκε κύρωση, σε πόσες όχι, πόσες εκκρεμούν. Με αυτόν τον
      τρόπο η αδράνεια γίνεται πολιτικά κοστοβόρα.


