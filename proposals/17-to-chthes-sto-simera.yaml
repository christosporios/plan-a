number: 17
slug: to-chthes-sto-simera
theme: identity
title: Δίκτυο σήμανσης ιστορικής μνήμης της πόλης
one_line: >
  Ένα ενιαίο δίκτυο διακριτικών, δίγλωσσων πινακίδων ιστορικής μνήμης που
  αναδεικνύει σταθμούς ιστορικής, κοινωνικής και πολιτιστικής σημασίας σε όλη
  την πόλη — όχι μόνο στα μεγάλα αρχαία μνημεία.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Η Αθήνα είναι μια από τις πόλεις όπου αρχαία, βυζαντινή, οθωμανική και νεότερη ιστορία συνυπάρχουν στους ίδιους δρόμους, κι όμως η αφήγηση αυτής της πολυσήμαντης ιστορίας στον δημόσιο χώρο απουσιάζει σχεδόν εντελώς, με την αρχαία ιστορία να κυριαρχεί. Η πρόταση είναι ένα ενιαίο δίκτυο σήμανσης ιστορικής μνήμης: διακριτικές, δίγλωσσες πινακίδες με κοινή σχεδιαστική ταυτότητα, που αναδεικνύουν σταθμούς ιστορικής, κοινωνικής και πολιτιστικής σημασίας σε όλη την πόλη. Κάθε πινακίδα να φέρει ένα σύντομο κείμενο που θα εξάπτει το ενδιαφέρον του περαστικού γιατί το πρόβλημα σήμερα δεν είναι η έλλειψη πληροφορίας αλλά η απουσία αφορμής για να την αναζητήσουμε και μια πόλη οφείλει να δίνει τέτοια ερεθίσματα στους ανθρώπους της.

