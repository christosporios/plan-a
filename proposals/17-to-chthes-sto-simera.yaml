number: 17
slug: to-chthes-sto-simera
theme: identity
title: Το χθες στο σήμερα
one_line: >
  Ένα ενιαίο δίκτυο διακριτικών, δίγλωσσων πινακίδων ιστορικής μνήμης που
  αναδεικνύει σταθμούς ιστορικής, κοινωνικής και πολιτιστικής σημασίας σε όλη
  την πόλη — όχι μόνο στα μεγάλα αρχαία μνημεία.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Προτείνουμε τη δημιουργία ενός ενιαίου δικτύου σήμανσης ιστορικής μνήμης
    για την Αθήνα: ένα σύστημα φυσικής σήμανσης στον δημόσιο χώρο, με κοινή
    σχεδιαστική ταυτότητα, δίγλωσσο (ελληνικά και αγγλικά), που θα αναδεικνύει
    σταθμούς ιστορικής, κοινωνικής και πολιτιστικής σημασίας σε όλη την πόλη.

    Το δίκτυο δεν επαναλαμβάνει ό,τι κάνουν ήδη οι επίσημοι αρχαιολογικοί
    χώροι· επικεντρώνεται στα κενά ανάμεσά τους. Περιλαμβάνει τόπους
    ενδιαφέροντος εκτός αρχαιολογικών χώρων, κτίρια με αρχιτεκτονική ή ιστορική
    αξία, σημεία που συνδέονται με γεγονότα, κινήματα ή πρόσωπα — αλλά και
    χώρους λαϊκής μνήμης.

    Κάθε σημείο φέρει σύντομο, περιεκτικό κείμενο — αρκετό για να ιντριγκάρει,
    όχι αρκετό για να κουράσει. Το κείμενο δεν παραπέμπει κάπου αλλού και δεν
    ζητά καμία ενέργεια· αν κάποιος θέλει να μάθει περισσότερα, ξέρει πώς να
    ψάξει. Το προτεινόμενο δίκτυο δεν ανταγωνίζεται τη Wikipedia ή το ChatGPT —
    η προστιθέμενη αξία του είναι ότι σου προσφέρει μια απρόσμενη αφορμή για να
    αναρωτηθείς.

