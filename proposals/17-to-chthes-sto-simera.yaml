# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΖΩΝΤΑΝΗ ΤΑΥΤΟΤΗΤΑ» ─────────────────────────────
contribution:
  body: |
    Η Αθήνα είναι μία από τις ελάχιστες πόλεις στον κόσμο όπου αρχαία,
    βυζαντινή, οθωμανική και νεότερη ιστορία συνυπάρχουν στους ίδιους δρόμους.
    Κατοικημένη [από τα νεολιθικά χρόνια](https://www.britannica.com/place/Athens/History)^1,
    η πόλη διατηρεί ρωμαϊκά, βυζαντινά και οθωμανικά μνημεία πλάι στον νεότερο αστικό
    της ιστό. Κι όμως, η αφήγηση αυτής της πολυσήμαντης ιστορίας στον δημόσιο
    χώρο απουσιάζει σχεδόν εντελώς: τα μνημεία που κυριαρχούν ανήκουν σχεδόν
    αποκλειστικά στην κλασική αρχαιότητα, και ό,τι βρίσκεται έξω από αυτό το
    πλαίσιο παραμένει στο περιθώριο.
  body_after: |
    Μια ζωντανή ταυτότητα δεν είναι ένα μόνο στρώμα του παρελθόντος, αλλά η
    συνύπαρξη πολλών. Όσο περισσότερα στρώματα γίνονται ορατά, τόσο η πόλη
    γίνεται αντιληπτή ως αποτέλεσμα ανθρώπινων διαδρομών που δεν μοιάζουν
    απαραίτητα με τη δική μας — από τη βυζαντινή ιστορία και τους τέσσερις
    αιώνες οθωμανικής παρουσίας μέχρι την προσφυγιά και τη μεταπολεμική
    ανοικοδόμηση. Αυτή η επαφή, όσο έμμεση κι αν είναι, δίνει στους κατοίκους
    περισσότερα σημεία επαφής με περισσότερους ανθρώπους, και έτσι μια πόλη πιο
    ανοιχτή.

    Υπάρχει και ένας δεύτερος λόγος: μια πόλη δεν είναι ωραίο να είναι
    υπερβολικά λεία και προβλέψιμη — πόσο μάλλον όταν κατασκευάζει η ίδια αυτή
    τη λειότητα, επιλέγοντας τι θα δείξει και τι θα αποκρύψει. Υπάρχει αξία στο
    να σε σταματά κάτι που δεν περίμενες, να ανακαλύπτεις περπατώντας ότι ο
    χώρος που πατάς έχει βάθος που δεν φαινόταν. Το σημερινό πρόβλημα δεν είναι
    η έλλειψη πληροφορίας — υπάρχει ήδη παντού — αλλά η απουσία αφορμής για να
    την αναζητήσουμε. Μια πόλη οφείλει να δίνει τέτοια ερεθίσματα, να
    καλλιεργεί φιλοπεριέργεια στους ανθρώπους της.

    Η ιδέα δεν είναι νέα ούτε πειραματική. Το παλαιότερο τέτοιο εγχείρημα στον
    κόσμο, οι [γαλάζιες πλάκες του
    Λονδίνου](https://www.english-heritage.org.uk/visit/blue-plaques/about-blue-plaques/history-of-blue-plaques/)^2,
    λειτουργεί αδιάκοπα από το 1866 και έχει εμπνεύσει αμέτρητα αντίστοιχα
    δίκτυα. Στο Βερολίνο, μια δημόσια βάση καταγράφει [πάνω από 3.800 πινακίδες
    και σήματα μνήμης](https://www.gedenktafeln-in-berlin.de/)^3 διάσπαρτα στον
    αστικό ιστό. Και οι [Stolpersteine](https://www.stolpersteine.eu/en/information/facts-and-figures)^4
    του Gunter Demnig — 116.000 μικρές ορειχάλκινες πλάκες σε πάνω από 1.860
    δήμους και 31 χώρες — έχουν γίνει το μεγαλύτερο αποκεντρωμένο μνημείο στον
    κόσμο, ακριβώς επειδή φέρνουν τη μνήμη στο πεζοδρόμιο της καθημερινότητας.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Κάθε απόφαση για το τι σηματοδοτείται και τι όχι έχει ιδεολογικό πρόσημο. Η επιλογή να αναδειχθεί ένα μνημείο και όχι ένα άλλο, μια περίοδος και όχι μια άλλη, μια κοινότητα και όχι μια άλλη, δεν είναι ποτέ ουδέτερη."
    a: >
      Αυτό δεν είναι λόγος να μην γίνει τίποτα· είναι λόγος να γίνει με
      επίγνωση. Ένα δίκτυο που σχεδιάζεται κεντρικά, από μια ομοιογενή ομάδα
      ειδικών, κινδυνεύει να αναπαράγει τις ίδιες ιεραρχίες που ήδη κυριαρχούν:
      να σηματοδοτεί τη δόξα και να παραλείπει την ήττα, να τιμά τους επιφανείς
      και να αγνοεί τους ανώνυμους. Το αντίδοτο είναι η διεύρυνση της συμμετοχής.
      Το ίδιο το λονδρέζικο σχήμα στηρίζεται εξ ολοκλήρου σε
      [προτάσεις του κοινού](https://www.english-heritage.org.uk/visit/blue-plaques/propose-a-plaque/)^5,
      τις οποίες εξετάζει μια επιτροπή που συνεδριάζει τρεις φορές τον χρόνο.
      Αντίστοιχα, μπορεί να συσταθεί μια επιτροπή με ευρεία και ανομοιογενή
      σύνθεση — ιστορικοί, αρχιτέκτονες, καλλιτέχνες, εκπρόσωποι κοινοτήτων,
      νέοι — και να γίνει ανοιχτή πρόσκληση στους δημότες να προτείνουν τόπους
      και να γράψουν οι ίδιοι τα κείμενα.

  - q: "Η Αθήνα έχει ήδη αρκετή οπτική ρύπανση. Ένα δίκτυο σήμανσης που δεν σέβεται τον χώρο στον οποίο μπαίνει δεν θα τον αναδείξει, θα τον επιβαρύνει."
    a: >
      Γι' αυτό η σχεδιαστική ποιότητα δεν είναι λεπτομέρεια αλλά προϋπόθεση.
      Μπορεί να προβλεφθεί ανοιχτός σχεδιαστικός διαγωνισμός με σαφείς
      προδιαγραφές: διακριτική παρουσία, ενιαία ταυτότητα, υλικά εναρμονισμένα
      με το αστικό τοπίο. Το πρότυπο των γαλάζιων πλακών του Λονδίνου είναι
      ενδεικτικό: η απλότητα είναι αυτή που κάνει κάτι διαχρονικό και σήμα
      κατατεθέν. Η διακριτικότητα του εγχειρήματος είναι, εδώ, μέρος της αξίας
      του.

  - q: "Ποιος αναλαμβάνει την υλοποίηση και τη συντήρηση, ώστε να μην ξεθωριάσει με τον επόμενο εκλογικό κύκλο;"
    a: >
      Η διαχείριση και ανάδειξη του δημόσιου χώρου εμπίπτει άμεσα στις
      αρμοδιότητες του Δήμου Αθηναίων. Για μνημεία και αρχαιολογικούς χώρους
      υπό κρατική εποπτεία απαιτείται συνεργασία με το Υπουργείο Πολιτισμού και
      την αρμόδια Εφορεία Αρχαιοτήτων — κάτι όχι αδύνατο, αλλά που χρειάζεται
      πολιτική βούληση και συντονισμό. Η συμμετοχή μεγάλων πολιτιστικών
      ιδρυμάτων της πόλης μπορεί να αποδειχθεί καθοριστική, ως χρηματοδοτών αλλά
      και ως εγγυητών της ποιότητας και της συνέχειας του εγχειρήματος πέρα από
      εκλογικούς κύκλους.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Μια πόλη που μαθαίνεις περπατώντας
    body: >
      Η μνήμη που μπαίνει στο πεζοδρόμιο φτάνει σε ανθρώπους που δεν θα έμπαιναν
      ποτέ σε μουσείο. Οι Stolpersteine έγιναν το μεγαλύτερο αποκεντρωμένο
      μνημείο στον κόσμο ακριβώς επειδή συναντούν τον περαστικό στην
      καθημερινότητά του, χωρίς εισιτήριο και χωρίς ωράριο. Ένα ανάλογο δίκτυο
      μετατρέπει κάθε διαδρομή της πόλης σε δυνητική αφορμή μάθησης.

  - title: Ανάδειξη της πόλης πέρα από το κέντρο
    body: >
      Επειδή το δίκτυο εστιάζει στα κενά ανάμεσα στα μεγάλα μνημεία, μπορεί να
      φτάσει σε γειτονιές που σήμερα δεν θεωρούνται «τουριστικές» ή «ιστορικές».
      Έτσι η ιστορική αξία απλώνεται σε όλη την πόλη και όχι μόνο στον στενό
      αρχαιολογικό πυρήνα, ενισχύοντας την αίσθηση τόπου και ταυτότητας σε κάθε
      γειτονιά.

  - title: Μια αφήγηση που χωράει πολλούς
    body: >
      Όταν η αφήγηση της πόλης παύει να είναι ένα μόνο στρώμα και γίνεται
      πολυφωνική — βυζαντινή, οθωμανική, προσφυγική, μεταπολεμική — δίνει σε
      περισσότερες κοινότητες σημεία αναγνώρισης στον δημόσιο χώρο. Μια πόλη που
      αφηγείται τον εαυτό της πλήρως είναι μια πόλη πιο ανοιχτή και
      συμπεριληπτική.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Πιλοτικό σε μία δημοτική κοινότητα
    body: >
      Να επιλεγεί μία δημοτική κοινότητα ως πιλότος, με ανοιχτή πρόσκληση προς
      τους κατοίκους να προτείνουν τόπους και να γράψουν οι ίδιοι τα σύντομα
      κείμενα. Ένα μικρό, μετρήσιμο πρώτο κύμα πινακίδων επιτρέπει να
      δοκιμαστούν η σχεδιαστική ταυτότητα, η διαδικασία επιλογής και η αποδοχή
      από τον δημόσιο χώρο, πριν επεκταθεί το δίκτυο σε όλη την πόλη.

  - title: Σχεδιαστικός διαγωνισμός και επιτροπή περιεχομένου
    body: >
      Να προκηρυχθεί ανοιχτός σχεδιαστικός διαγωνισμός για την ενιαία ταυτότητα
      και τις προδιαγραφές υλικών, και παράλληλα να συσταθεί επιτροπή
      περιεχομένου με ευρεία, ανομοιογενή σύνθεση. Η επιτροπή να ορίσει
      διαφανή κριτήρια επιλογής και να διαχειρίζεται τις προτάσεις του κοινού,
      κατά το πρότυπο σχημάτων όπως οι γαλάζιες πλάκες του Λονδίνου.

