# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΑΠΟΤΕΛΕΣΜΑΤΙΚΟΣ ΔΗΜΟΣ» ───────────────────────────
contribution:
  body: |
    Στην Αθήνα, υπάρχει μια διάχυτη εντύπωση ότι η πόλη είναι σε κακή κατάσταση.

    ::: callout
    Στην Αθήνα, μόλις [το 65% των κατοίκων](https://ec.europa.eu/regional_policy/sources/studies/urban/survey2013_en.pdf)^1 δηλώνει ικανοποιημένο με την κατάσταση της πόλης τους, το χαμηλότερο ποσοστό ανάμεσα στις πρωτεύουσες της Ευρωπαϊκής Ένωσης.
    :::

    Τα προβλήματα είναι πολλά και πραγματικά. Αλλά στη συζήτηση για το «γιατί δεν
    βελτιώνεται η πόλη» υπάρχει κάτι που συχνά παραβλέπεται: η ικανότητά μας να
    αντιλαμβανόμαστε την αλλαγή όταν αυτή υπάρχει.

    Όταν μια πόλη βρίσκεται σε χαμηλό σημείο αφετηρίας, η πρόοδος γίνεται αόρατη με
    δύο τρόπους. Πρώτον, οι κάτοικοι έχουν εγκλιματιστεί σε μια εικόνα υποβάθμισης
    – το μάτι δεν καταγράφει βελτίωση εκεί που έχει συνηθίσει να βλέπει πρόβλημα.
    Δεύτερον, όταν το έδαφος που πρέπει να καλυφθεί είναι τεράστιο, ακόμα και
    μετρήσιμη πρόοδος εξαφανίζεται μέσα στον συνολικό όγκο της ανάγκης. Κάτι που
    σημαίνει ότι δεν αρκεί να γίνονται αλλαγές· πρέπει να φαίνονται.

    Εδώ εντοπίζεται η αδυναμία της κυρίαρχης λογικής των παρεμβάσεων στην πόλη:
    πολλές μικρές παρεμβάσεις διάσπαρτες σε όλη την πόλη δεν παράγουν εμφανή
    αποτέλεσμα. Ο προϋπολογισμός διαχέεται, ο αντίκτυπος αμβλύνεται, και η αίσθηση
    ότι «τίποτα δεν αλλάζει» παραμένει. Τα ίδια χρήματα, συγκεντρωμένα σε
    συγκεκριμένες γειτονιές, μπορούν να παράγουν ορατή αλλαγή – και ορατή αλλαγή
    είναι αυτή που μετατοπίζει την αντίληψη.

    Η πρόταση, λοιπόν, είναι να επιλεγούν γειτονιές που σε μετρήσιμους δείκτες –
    πράσινο, ασφάλεια, υποδομές, πρόσβαση σε υπηρεσίες – υστερούν σημαντικά, και να
    εφαρμοστούν εκεί συγκεντρωτικά οι παρεμβάσεις που απαιτούν χωρική εφαρμογή. Η
    πρόταση δεν σημαίνει ότι εγκαταλείπουμε τις άλλες γειτονιές. Σημαίνει ότι
    ξεκινάμε από εκεί που η ανάγκη είναι μεγαλύτερη και ο αντίκτυπος είναι πιο
    πιθανό να γίνει ορατός – ώστε η πόλη να αρχίσει επιτέλους να αισθάνεται ότι
    αλλάζει. Κι αυτό είναι το υπόστρωμα πάνω στο οποίο οι επόμενες παρεμβάσεις – σε
    άλλες γειτονιές, με μεγαλύτερη κλίμακα – βρίσκουν πολύ πιο εύφορο έδαφος.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Δεν είναι άδικο να προτεραιοποιούνται κάποιες γειτονιές έναντι άλλων;"
    a: |
      Η διασπορά παρεμβάσεων «λίγο παντού» είναι που συντηρεί την αδικία,
      αφήνοντας όλους μετρίως αναξιοπαθούντες χωρίς καμία ουσιαστική αλλαγή. Η
      προτεραιοποίηση δεν γίνεται με πολιτικά κριτήρια, αλλά με διαφανείς,
      μετρήσιμους δείκτες υστέρησης. Και ο στόχος είναι οι παρεμβάσεις να φτάσουν
      σταδιακά παντού. Η Γαλλία εφαρμόζει εδώ και δεκαετίες μια παρόμοια λογική
      μέσω της politique de la ville – μιας εθνικής πολιτικής που αναγνωρίζει ρητά
      ότι ορισμένες γειτονιές χρειάζονται συγκεντρωμένη, όχι διάχυτη, δημόσια
      παρέμβαση. Ο επιχειρησιακός της βραχίονας ορίζει με αντικειμενικά κριτήρια
      ποια εδάφη χαρακτηρίζονται «[ζώνες προτεραιότητας](https://www.senat.fr/notice-rapport/2025/r25-616-notice.html)^2»
      και στρέφει εκεί επενδύσεις σε υποδομές, δημόσιο χώρο και κατοικία.
  - q: "Δεν υπάρχει κίνδυνος εξευγενισμού και εκτοπισμού των σημερινών κατοίκων;"
    a: |
      Επιτυχημένες παρεμβάσεις αναβάθμισεις μπορεί να ανεβάσουν τις αξίες ακινήτων
      σε βαθμό που μπορεί μέχρι και να εκτοπίσουν τους κατοίκους που ήδη ζούσαν
      εκεί. Γι’ αυτό και τέτοιες προσπάθειες πρέπει να συνδυαστούν με συγκεκριμένες
      ασφαλιστικές δικλείδες για τους υφιστάμενους κατοίκους. Η
      [Βιέννη](https://www.socialhousingcenter.org/reports-3)^3 αποδεικνύει το πώς
      η ήπια ανάπτυξη δεν σημαίνει αργή, συνδυάζοντας τη φιλοδοξία της αλλαγής με
      την προστασία των κατοίκων. Συγκεκριμένα, η πόλη διατηρεί κυριότητα σε
      σημαντικό κομμάτι γης για μελλοντική ανάπτυξη που θα επιστρέψει πόρους για
      περισσότερες υποδομές για τους κατοίκους, επενδύει σε μονάδες κοινωνικής
      κατοικίας, παρέχει ισχυρή νομική προστασία στους ενοικιαστές μέσω ελέγχου
      ενοικίων και ανοιχτών συμβολαίων μίσθωσης χωρίς ημερομηνία λήξης και
      πραγματοποιεί εκτεταμένες διαβουλεύσεις με τους κατοίκους.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - category: financial-flow
    body: >
      Χρειάζεται να εξεταστεί ένα βιώσιμο μοντέλο χρηματοδότησης για το εγχείρημα.
      Αξίζει να διερευνηθεί ο ρόλος που μπορούν να παίξουν μεγάλα πολιτιστικά
      ιδρύματα της πόλης – ως χρηματοδότες, αλλά και ως εγγυητές της ποιότητας και
      της συνέχειας του εγχειρήματος πέρα από εκλογικούς κύκλους.

