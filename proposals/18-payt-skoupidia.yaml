number: 18
slug: payt-skoupidia
theme: municipality
title: Πληρώνεις όσο πετάς
one_line: >
  Ο Δήμος εισάγει σύστημα PAYT (Pay-As-You-Throw): επίσημες δημοτικές σακούλες
  ενσωματώνουν το κόστος αποκομιδής στην τιμή τους. Όποιος παράγει λιγότερα
  σκουπίδια, πληρώνει λιγότερα.

problem:
  body: |
    Κάθε νοικοκυριό στην Αθήνα πληρώνει τέλη αποκομιδής απορριμμάτων μέσω του
    λογαριασμού ρεύματος. Το ποσό υπολογίζεται με έναν τύπο: τετραγωνικά μέτρα
    ακινήτου × συντελεστή που ορίζει το Δημοτικό Συμβούλιο. Για κατοικίες στην
    Αθήνα, ο συντελεστής για το 2025 είναι ~€1,40/τ.μ./έτος, δηλαδή ένα
    διαμέρισμα 80 τ.μ. πληρώνει €112 τον χρόνο, ανεξαρτήτως αν βγάζει 2 σακούλες
    σκουπίδια την εβδομάδα ή 10.

    Υπάρχει μια μερική διαφοροποίηση: από το 2017, ο Δήμος Αθηναίων εφαρμόζει
    διαφορετικούς συντελεστές ανά κατηγορία επαγγελματικής χρήσης —
    €4,75–6,24/τ.μ./έτος ανάλογα με τον τύπο δραστηριότητας — με τη λογική ότι
    κάποιες επιχειρήσεις «κατά κοινή παραδοχή παράγουν διαφορετική ποσότητα
    απορριμμάτων».

    Η λογική αυτή είναι σωστή — αλλά σταματά στη μέση. Η κατηγοριοποίηση
    βασίζεται σε εκτίμηση του είδους της δραστηριότητας, όχι στην πραγματική
    ποσότητα απορριμμάτων που παράγεται. Ένα εστιατόριο 50 τ.μ. που ανακυκλώνει
    συστηματικά και ένα εστιατόριο 50 τ.μ. που πετά τα πάντα στα σκουπίδια
    πληρώνουν ακριβώς το ίδιο. Και πάνω απ' όλα: κανείς — ούτε κάτοικος, ούτε
    επιχείρηση — δεν έχει κανένα οικονομικό κίνητρο να μειώσει τα σκουπίδια
    που παράγει.
  callouts:
    - |
      Η Αθήνα παράγει 490 κιλά απορριμμάτων ανά κάτοικο ετησίως, 34% πάνω από
      τον μέσο όρο ΕΕ (365 κιλά). Το ποσοστό ανακύκλωσης παραμένει στο 22%,
      έναντι 48% μέσου όρου ΕΕ. Ο Δήμος Αθηναίων δαπανά πάνω από €120 εκ.
      ετησίως για αποκομιδή και διαχείριση απορριμμάτων — χωρίς κανένα
      μηχανισμό που να δίνει κίνητρο για μείωση. Το ίδιο το Υπουργείο
      Εσωτερικών έχει αναγνωρίσει το πρόβλημα: η ισχύουσα νομοθεσία «δεν δίνει
      οικονομικά κίνητρα για τη διαχείριση των απορριμμάτων σύμφωνα με την
      ιεραρχία της βιώσιμης ανάπτυξης».

proposal:
  body: |
    Μπορούμε να εισάγουμε μια μορφή συστήματος PAYT (Pay-As-You-Throw —
    πληρώνεις όσα πετάς) με επίσημες δημοτικές σακούλες: μόνο σακούλες με
    δημοτικό σήμα αποκομίζονται από τα απορριμματοφόρα. Η τιμή της σακούλας
    ενσωματώνει το κόστος αποκομιδής. Όποιος παράγει λιγότερα, πληρώνει
    λιγότερα. Η αλλαγή είναι απλή: από «πληρώνεις βάσει τετραγωνικών ακινήτου»
    σε «πληρώνεις βάσει όγκου».

    Συγκεκριμένα, τέσσερα πράγματα αλλάζουν.

    **Πρώτον**, ο Δήμος παράγει και διανέμει επίσημες σακούλες αποκομιδής σε
    τρία μεγέθη: 10 λίτρα (€0,30), 20 λίτρα (€0,50), 40 λίτρα (€0,90). Οι
    σακούλες πωλούνται σε περίπτερα, σούπερ μάρκετ και δημοτικά σημεία. Φέρουν
    μοναδικό οπτικό σήμα (χρώμα + λογότυπο) που τις καθιστά αμέσως αναγνωρίσιμες
    από τους οδηγούς απορριμματοφόρων.

    **Δεύτερον**, τα δημοτικά τέλη καθαριότητας μειώνονται κατά 70% για όλες τις
    κατοικίες και επιχειρήσεις. Το υπόλοιπο 30% παραμένει ως σταθερό τέλος που
    καλύπτει το fixed κόστος υποδομής (οχήματα, προσωπικό, χώροι διαχείρισης) —
    κόστος που δεν εξαρτάται από τον όγκο.

    **Τρίτον**, για επιχειρήσεις υψηλής παραγωγής απορριμμάτων (εστίαση, σούπερ
    μάρκετ, αγορές) εισάγεται επιλογή από επαγγελματικές σακούλες: μεγαλύτερες
    σακούλες 60 λίτρων (€1,2) και 120 λίτρων (€2,2).

    **Τέταρτον**, η ανακύκλωση παραμένει δωρεάν και ενθαρρύνεται ενεργά. Οι μπλε
    κάδοι ανακύκλωσης δεν απαιτούν επίσημη σακούλα. Το οικονομικό κίνητρο είναι
    άμεσο και απτό: κάθε φιάλη, χαρτόκουτο ή κονσέρβα που πηγαίνει στον μπλε
    κάδο αντί στη σακούλα σκουπιδιών, καθυστερεί τη στιγμή που θα χρειαστείς
    νέα σακούλα.

implementation:
  body: |
    Ο Ν. 25/1975 (άρθρο 1) εξουσιοδοτεί το Δημοτικό Συμβούλιο να ορίζει τους
    συντελεστές ανταποδοτικών τελών με ετήσια απόφαση — συμπεριλαμβανομένης
    της μείωσής τους. Η εισαγωγή δημοτικών σακουλών ως συμπληρωματικό έσοδο
    δεν απαιτεί νομοθετική αλλαγή: εντάσσεται ως «ανταποδοτική υπηρεσία» βάσει
    του ίδιου νόμου. Η υποχρέωση χρήσης επίσημης σακούλας θεσπίζεται με
    κανονιστική απόφαση Δημοτικού Συμβουλίου κατ' άρθρο 79 Ν. 3463/2006, με
    ταυτόχρονη τροποποίηση του Κανονισμού Καθαριότητας του Δήμου.

    Το πρώτο βήμα: μελέτη βαθμονόμησης τιμών σε τρεις πιλοτικές γειτονιές
    (Κυψέλη, Παγκράτι, Κουκάκι) — γειτονιές με διαφορετικό κοινωνικοοικονομικό
    προφίλ, ώστε να μετρηθεί η ελαστικότητα ζήτησης και η επίπτωση σε ευάλωτες
    ομάδες πριν την καθολική εφαρμογή.

    Ακολουθεί πιλοτική φάση 12 μηνών: ο Δήμος μειώνει τα τέλη κατά 70% στις
    τρεις γειτονιές, εισάγει τις επίσημες σακούλες στα σημεία διανομής, και
    ενεργοποιεί τον έλεγχο (οδηγοί απορριμματοφόρων δεν αποκομίζουν μη-επίσημες
    σακούλες). Παράλληλα, μετρώνται: συνολικός όγκος απορριμμάτων, ποσοστό
    ανακύκλωσης, έσοδα σακουλών, παράπονα πολιτών.

    Αν η πιλοτική φάση δείξει μείωση όγκου απορριμμάτων >10%, ποσοστό
    συμμόρφωσης >80% και ουδέτερο ή θετικό ισοζύγιο εσόδων, η εφαρμογή
    επεκτείνεται σε όλα τα δημοτικά διαμερίσματα. Αν αποτύχει σε κάποιον από
    αυτούς τους δείκτες, αναθεωρούνται τιμές ή μηχανισμοί πριν την επέκταση.
  budget:
    period: 1ο έτος λειτουργίας
    items:
      - { label: "Σχεδιασμός & παραγωγή σακουλών — αρχικός στόλος", cost: "€250.000" }
