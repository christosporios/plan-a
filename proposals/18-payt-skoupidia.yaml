limitations:
  - q: "Μα ήδη πληρώνουμε για σακούλες σκουπιδιών — όποιος πετά πολλά ήδη πληρώνει περισσότερο για τη συσκευασία του."
    a: >
      Η διαφορά είναι διπλή. Πρώτον, το κόστος του ρολού από σακούλες είναι
      ασήμαντο ως κίνητρο. Δεύτερον, τα χρήματα δεν πηγαίνουν στον Δήμο αλλά
      στην επιχείρηση, δεν υπάρχει δηλαδή καμία σύνδεση με το πραγματικό
      κόστος αποκομιδής που χρηματοδοτείται από τα δημοτικά τέλη.

  - q: "Παράνομη απόρριψη: Αν η σακούλα κοστίζει περισσότερο, κάποιοι θα αφήνουν σκουπίδια σε κοινόχρηστους χώρους, ή σε λάθος σακούλες."
    a: >
      Αν η επίσημη δημοτική σακούλα είναι ευδιάκριτη, αυτό σημαίνει ότι κάθε
      σακούλα που αφήνεται σε κάδο είναι αμέσως ορατή ως επίσημη ή μη. Ο
      κάτοικος, λοιπόν, που βάζει μη-επίσημη σακούλα στον κοινό κάδο ξέρει
      ότι αυτό φαίνεται. Η κοινωνική πίεση που προκύπτει από αυτή την ορατότητα
      είναι ο κύριος μηχανισμός συμμόρφωσης.

good_practices:
  - city: Φλάνδρα, Βέλγιο
    period: 1995–σήμερα
    body: >
      Η Φλάνδρα στο Βέλγιο εφάρμοσε PAYT με επίσημες σακούλες σε περισσότερους
      από 300 δήμους. Τα απορρίμματα μειώθηκαν κατά 56% μεταξύ 1995 και 2015,
      και το ποσοστό ανακύκλωσης έφτασε το 60% ήδη από το 2000 — πριν το
      αντίστοιχο ευρωπαϊκό στόχο για το 2020. Σήμερα, σχεδόν τα τρία τέταρτα
      των οικιακών απορριμμάτων επαναχρησιμοποιούνται, ανακυκλώνονται ή
      κομποστοποιούνται. Βέβαια, η επιτυχία δεν ήρθε μόνο από την τιμή της
      σακούλας, αλλά από τη συνολική εκπαίδευση και επικοινωνία καθώς και την
      ορατή επανεπένδυση των εξοικονομήσεων σε υπηρεσίες.

  - city: Νότια Κορέα
    period: 1995–σήμερα
    body: >
      Από το 1995, η Νότια Κορέα εισήγαγε το PAYT με υποχρεωτική αγορά ειδικών
      σακουλών για τα σκουπίδια — όσο περισσότερα παράγεις, τόσο περισσότερες
      σακούλες αγοράζεις. Παρά τις αρχικές ανησυχίες για παράνομη απόρριψη, τα
      αποτελέσματα ήταν κυρίαρχα θετικά: 40% μείωση όγκου απορριμμάτων. Η Νότια
      Κορέα επέλεξε διαφανείς σακούλες ακριβώς επειδή η ορατότητα λειτουργεί
      ως κοινωνικός μηχανισμός συμμόρφωσης χωρίς πρόσθετο κόστος enforcement.

  - city: Γκιμαράες, Πορτογαλία
    period: 2016–σήμερα
    body: >
      Στην Γκιμαράες της Πορτογαλίας, με την εισαγωγή PAYT με επίσημες
      σακούλες το 2016, τα αδιαχώριστα απορρίμματα μειώθηκαν 34% και τα
      ανακυκλώσιμα αυξήθηκαν 126% τον πρώτο χρόνο. Το σύστημα αντικατέστησε
      την παλιά χρέωση βάσει κατανάλωσης νερού — ακριβώς όπως η Αθήνα θα
      αντικαταστήσει τη χρέωση βάσει τετραγωνικών.

  - city: Φερράρα, Ιταλία
    body: >
      Η εισαγωγή PAYT στη Φερράρα οδήγησε σε 30% μείωση συνολικής παραγωγής
      απορριμμάτων και 40% αύξηση ανακύκλωσης, με συνολική εξοικονόμηση €3,6
      εκατ. για τον δήμο. Η Ιταλία είναι ιδιαίτερα χρήσιμη σαν παράδειγμα για
      την Αθήνα λόγω του παρόμοιου αστικού ιστού: πυκνοκατοικημένα κέντρα,
      πολυκατοικίες, κοινόχρηστοι κάδοι — και παρόμοια πολιτικά και διοικητικά
      εμπόδια.

