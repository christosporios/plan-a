number: 18
slug: symvaseis-koinonikos-antiktypos
theme: municipality
title: Δημόσιες συμβάσεις υπηρεσιών βάσει αντικτύπου
one_line: >
  Όταν ο Δήμος αναθέτει κοινωνικές υπηρεσίες, ο πάροχος συχνά πληρώνεται για
  ώρες και εισροές, ανεξάρτητα από το αν βελτιώθηκε η ζωή των ωφελουμένων. Ας
  συνδέσουμε μέρος της αμοιβής με μετρήσιμα, επαληθεύσιμα αποτελέσματα.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Προτείνεται η εισαγωγή **συμβάσεων βάσει αποτελεσμάτων** (_payment by
    results_) σε επιλεγμένες συμβάσεις κοινωνικών υπηρεσιών του Δήμου Αθηναίων,
    όπου μέρος της αμοιβής του παρόχου συνδέεται με μετρήσιμα, επαληθεύσιμα
    αποτελέσματα — και όχι μόνο με τις ώρες ή τις εισροές που κατέγραψε.

    Η πιλοτική εφαρμογή προτείνεται σε τρία πεδία υψηλής κοινωνικής ανάγκης που
    πληρούν δύο κριτήρια: μετρήσιμο, επαληθεύσιμο αποτέλεσμα και υπολογίσιμη
    εξοικονόμηση για τον Δήμο αν το αποτέλεσμα επιτευχθεί — για παράδειγμα η
    στέγαση αστέγων, η πρώιμη παιδική παρέμβαση και η επανένταξη νέων εκτός
    αγοράς εργασίας και εκπαίδευσης (NEET, 15–29 ετών).

    Κάθε σύμβαση έχει τριμερή δομή:

    1. **Ο Δήμος ορίζει τους στόχους και τη βαθμίδα πληρωμής** για κάθε επίπεδο
       επίτευξης — ο πάροχος αμείβεται για το τι πέτυχε, όχι για το τι έκανε.
       Αντί για «200 ώρες συμβουλευτικής», ο στόχος γίνεται «30 άτομα σε σταθερή
       στέγη μετά από 12 μήνες». Αντί για «500 γεύματα», ο στόχος γίνεται «20
       παιδιά που αποφεύγουν τον ιδρυματισμό».
    2. **Ο πάροχος αναλαμβάνει το πρόγραμμα** γνωρίζοντας εκ των προτέρων τι θα
       αμειφθεί και για τι.
    3. **Ανεξάρτητος αξιολογητής επαληθεύει τα αποτελέσματα** πριν από
       οποιαδήποτε πληρωμή.

    Για να μη διακινδυνεύει η ρευστότητα και η συνέχεια της υπηρεσίας, η σύμβαση
    προβλέπει ενδιάμεσες πληρωμές σε επαληθεύσιμα στάδια και ένα ελάχιστο κόστος
    λειτουργίας σε περίπτωση που τα ορόσημα δεν επιτευχθούν, ώστε η υπηρεσία να
    μη διακόπτεται εις βάρος των ωφελουμένων.

