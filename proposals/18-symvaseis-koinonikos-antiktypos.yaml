# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ ─────────────────────────────────────────────────
contribution:
  body: |
    Κάθε χρόνο ο Δήμος Αθηναίων αναθέτει πολλές δημόσιες συμβάσεις για κοινωνικές
    υπηρεσίες — από προγράμματα αποκατάστασης αστέγων και πρόνοιας ηλικιωμένων
    έως ενίσχυση παιδιών σε κίνδυνο. Το σημερινό μοντέλο, όμως, πληρώνει κυρίως
    για **εισροές, όχι για αποτελέσματα**: ο πάροχος αμείβεται για ώρες
    υπηρεσίας, παρεχόμενα γεύματα ή αριθμό ωφελουμένων, ανεξάρτητα από το αν η
    κατάστασή τους πράγματι βελτιώθηκε. Ο πάροχος που προσφέρει χιλιάδες ώρες
    φροντίδας χωρίς μακροπρόθεσμο αποτέλεσμα αμείβεται όπως αυτός που πετυχαίνει.
    Δεν υπάρχει κίνητρο για καινοτομία ούτε συνέπεια για την αναποτελεσματικότητα.

    Ένας αποτελεσματικός δήμος δεν είναι αυτός που ξοδεύει περισσότερα, αλλά
    αυτός που γνωρίζει τι πιάνει τόπο. Η σύνδεση της αμοιβής με το αποτέλεσμα
    κάνει αυτή τη γνώση προϋπόθεση της πληρωμής.
  callouts:
    - |
      Η απουσία αποτελεσματικών υπηρεσιών δεν είναι δωρεάν. Στη Φινλανδία, το
      μοντέλο _Housing First_ που στεγάζει πρώτα και υποστηρίζει μετά
      [εξοικονομεί έως και 15.000 ευρώ τον χρόνο ανά πρώην
      άστεγο](https://finland.fi/life-society/how-finlands-housing-first-model-makes-real-progress-against-homelessness/)^1
      σε επείγουσα ιατρική φροντίδα, κοινωνικές υπηρεσίες και δικαιοσύνη — ένα
      κόστος που το σύστημα πληρώνει έτσι κι αλλιώς όταν ένας άνθρωπος μένει χωρίς
      στέγη. Από το 2008 η Φινλανδία είναι η μόνη χώρα της ΕΕ όπου η αστεγία
      μειώνεται, κατά περίπου 30%.

      Πηγή: thisisFINLAND / Φινλανδικό Υπουργείο Περιβάλλοντος
  body_after: |
    Το ζητούμενο είναι να αμείβεται αυτό το επιτυχημένο αποτέλεσμα, όχι απλώς η
    προσπάθεια. Διεθνώς, η μέθοδος έχει δοκιμαστεί: στο πρώτο _Social Impact
    Bond_ του κόσμου, στις φυλακές του Peterborough στο Ηνωμένο Βασίλειο, η
    αμοιβή των φορέων συνδέθηκε με τη μείωση της υποτροπής των αποφυλακισμένων
    και το πρόγραμμα [πέτυχε τον στόχο μείωσης που είχε
    τεθεί](https://www.gov.uk/government/publications/phase-2-report-from-the-payment-by-results-social-impact-bond-pilot-at-hmp-peterborough)^2,
    αποπληρώνοντας τους χρηματοδότες.

    Το θεσμικό πλαίσιο στην Ελλάδα επιτρέπει ήδη τέτοιες συμβάσεις. Ο Ν.
    4412/2016 για τις δημόσιες συμβάσεις προβλέπει ότι η ανάθεση μπορεί να γίνει
    με κριτήριο [τη βέλτιστη σχέση ποιότητας–τιμής και ποιοτικά,
    κοινωνικά ή περιβαλλοντικά
    κριτήρια](https://www.taxheaven.gr/law/4412/2016)^3 (Άρθρο 86), και όχι μόνο
    με τη χαμηλότερη τιμή — η βάση πάνω στην οποία μπορεί να χτιστεί μια σύμβαση
    αποτελεσμάτων. Δεν απαιτείται νέο προσωπικό: η υπάρχουσα Διεύθυνση Κοινωνικής
    Πολιτικής του Δήμου έχει την τεχνογνωσία να ορίσει τους στόχους και να
    συντονίσει την επαλήθευση.

    Κρίσιμη προϋπόθεση είναι τα αποτελέσματα να είναι **απλά και εύκολα
    επαληθεύσιμα** — σταθερή στέγη μετά από 12 μήνες (ναι/όχι), νέος σε
    απασχόληση ή εκπαίδευση (ναι/όχι). Δυσνόητοι δείκτες ανοίγουν παράθυρο σε
    αμφισβήτηση. Η επαλήθευση ανατίθεται σε ανεξάρτητο τεχνικό σύμβουλο που
    επιβεβαιώνει τα αποτελέσματα πριν από κάθε πληρωμή, κάνοντας το σύστημα
    αξιόπιστο και για τις δύο πλευρές.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Δεν θα αποφεύγουν οι πάροχοι το ρίσκο; Το σημερινό μοντέλο τους εγγυάται έσοδα, ενώ το νέο τους εκθέτει στον κίνδυνο να μην πληρωθούν για δουλειά που έκαναν — ειδικά οι μικρότεροι, χωρίς ρευστότητα να απορροφήσουν μια αποτυχία."
    a: >
      Η σύμβαση σχεδιάζεται ώστε να μην τιμωρεί την προσπάθεια. Πρώτον, το
      ανώτατο ύψος αμοιβής σε σύμβαση αποτελεσμάτων πρέπει να είναι ρητά
      υψηλότερο από το αντίστοιχο μιας κλασικής σύμβασης εισροών — ο πάροχος που
      επιτυγχάνει παίρνει περισσότερα, όχι τα ίδια. Δεύτερον, προβλέπονται
      ενδιάμεσες πληρωμές σε επαληθεύσιμα στάδια (π.χ. ο άστεγος μπήκε σε στέγη,
      ακόμη κι αν δεν έχουν συμπληρωθεί οι 12 μήνες), ώστε ο πάροχος να διατηρεί
      ρευστότητα. Τρίτον, η σύμβαση ορίζει ρητά ότι, αν δεν επιτευχθεί ούτε
      ενδιάμεσο ορόσημο, ο πάροχος λαμβάνει ένα ελάχιστο κόστος λειτουργίας —
      αρκετό ώστε να μην καταρρεύσει και να μη διακόψει την υπηρεσία εν μέσω
      προγράμματος, επιβαρύνοντας τους ωφελούμενους.

  - q: "Δεν θα διαλέγουν οι πάροχοι τις «εύκολες» περιπτώσεις; Αν πληρώνεσαι για αποτέλεσμα, έχεις κίνητρο να επιλέγεις όσους έχουν τις περισσότερες πιθανότητες επιτυχίας, αφήνοντας έξω τις δυσκολότερες — αυτές που έχουν τη μεγαλύτερη ανάγκη."
    a: >
      Ο κίνδυνος είναι υπαρκτός και τεκμηριωμένος: στα βρετανικά προγράμματα
      _payment by results_ για ανέργους, μελέτη στο _Journal of Social Policy_
      έδειξε ότι οι πάροχοι [«ξάφριζαν» τις εύκολες περιπτώσεις και «παρκάριζαν»
      τις
      δύσκολες](https://www.cambridge.org/core/journals/journal-of-social-policy/article/creaming-and-parking-in-quasimarketised-welfaretowork-schemes-designed-out-of-or-designed-in-to-the-uk-work-programme/20EC18F95133F0081E0A01E187DA3DC1)^4,
      παρά τις βαθμίδες πληρωμής που υποτίθεται ότι θα το απέτρεπαν. Το μάθημα
      είναι ότι οι βαθμίδες πρέπει να είναι αρκετά χονδρικές για να μην
      τιμωρούν τη δυσκολία: η σύμβαση ορίζει εκ των προτέρων το προφίλ των
      ωφελουμένων και η αποζημίωση κλιμακώνεται **αντίστροφα με την ευκολία** —
      υψηλότερη πληρωμή για επιτυχία με δυσκολότερο προφίλ. Έτσι ο πάροχος έχει
      οικονομικό κίνητρο να πάρει τις δύσκολες περιπτώσεις, όχι να τις αποφύγει.

  - q: "Δεν θα υπάρξει νομική αβεβαιότητα; Αν και ο νόμος επιτρέπει ποιοτικά κριτήρια, δεν υπάρχει τυποποιημένο ελληνικό υπόδειγμα σύμβασης αποτελεσμάτων για κοινωνικές υπηρεσίες."
    a: >
      Η λύση είναι η εκ των προτέρων εμπλοκή νομικού συμβούλου με εμπειρία στις
      δημόσιες συμβάσεις και η διαβούλευση με την ΕΑΔΗΣΥ (Ενιαία Αρχή Δημοσίων
      Συμβάσεων) πριν την προκήρυξη. Η Αρχή έχει ήδη εκδώσει [κατευθυντήρια
      οδηγία για τα κριτήρια ανάθεσης δημοσίων
      συμβάσεων](https://www.roikos.gr/katefthintiria-odhgia-eaadhsy-kritiria-anathesis-dimosiwn-symvasewn/)^5
      (Κ.Ο. 11/2015), και η προηγούμενη διαβούλευση μαζί της μειώνει δραστικά τον
      κίνδυνο μεταγενέστερης αμφισβήτησης από παρόχους ή ελεγκτικά όργανα.

  - q: "Δεν προσθέτουν οι δείκτες απλώς γραφειοκρατία;"
    a: >
      Στη διαβούλευση, η άποψη ότι «οι στόχοι και οι δείκτες απόδοσης απλώς
      προσθέτουν γραφειοκρατία» συγκέντρωσε μόλις 19% συμφωνία έναντι 39%
      διαφωνίας. Το αντίδοτο στη γραφειοκρατία δεν είναι η απουσία μέτρησης αλλά
      η **απλότητα**: ένας ή δύο δείκτες ανά σύμβαση, δυαδικοί και επαληθεύσιμοι,
      αξιολογημένοι μία φορά από ανεξάρτητο φορέα. Αυτό είναι λιγότερη
      γραφειοκρατία από τα σημερινά μηνιαία δελτία ωρών και εισροών, και
      μετράει κάτι που πραγματικά σημαίνει κάτι.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Ο Δήμος μαθαίνει τι πιάνει τόπο
    body: >
      Όταν κάθε σύμβαση συνοδεύεται από ένα μετρήσιμο αποτέλεσμα και μια
      ανεξάρτητη επαλήθευση, ο Δήμος αποκτά για πρώτη φορά συστηματική εικόνα του
      ποιες παρεμβάσεις δουλεύουν και ποιες όχι. Με τον καιρό, αυτό επιτρέπει να
      αναπροσανατολίζονται οι πόροι προς τις αποτελεσματικές υπηρεσίες — μια
      γνώση που σήμερα απλώς δεν παράγεται.

  - title: Πιο δίκαιη πρόσβαση για μικρούς και καινοτόμους φορείς
    body: >
      Όταν κριτήριο γίνεται το αποτέλεσμα κι όχι το μέγεθος του φορέα, ένας
      μικρός οργανισμός με αποτελεσματική μέθοδο μπορεί να ανταγωνιστεί επί ίσοις
      όροις. Με τις ενδιάμεσες πληρωμές και το ελάχιστο κόστος λειτουργίας ως
      δικλείδες ρευστότητας, το μοντέλο ανοίγει χώρο σε καινοτόμες προσεγγίσεις
      αντί να ευνοεί απλώς τους μεγαλύτερους παρόχους.

  - title: Δημόσια λογοδοσία με νόημα
    body: >
      Τα αποτελέσματα κάθε σύμβασης μπορούν να δημοσιεύονται. Η λογοδοσία παύει
      να είναι αφηρημένη υπόσχεση και γίνεται επαληθεύσιμο νούμερο — κάτι που
      στη διαβούλευση συγκέντρωσε ευρεία υποστήριξη, τόσο για τους στόχους του
      2030 όσο και για τη μέτρηση των υπηρεσιών ανά γειτονιά.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Επιλογή του πρώτου πιλοτικού πεδίου
    body: >
      Να επιλεγεί ένα πρώτο πεδίο που πληροί και τα δύο κριτήρια — μετρήσιμο
      αποτέλεσμα και υπολογίσιμη εξοικονόμηση για τον Δήμο — με τη στέγαση
      αστέγων ως ισχυρό υποψήφιο, δεδομένου του τεκμηριωμένου κόστους της
      αστεγίας. Να οριστεί ο δυαδικός δείκτης (π.χ. σταθερή στέγη μετά από 12
      μήνες) και η βαθμίδα πληρωμής που κλιμακώνεται αντίστροφα με την ευκολία
      του προφίλ.

  - title: Σχεδιασμός της σύμβασης με νομική και θεσμική κάλυψη
    body: >
      Να συνταχθεί υπόδειγμα σύμβασης αποτελεσμάτων με νομικό σύμβουλο εξειδικευμένο
      στις δημόσιες συμβάσεις, με προηγούμενη διαβούλευση με την ΕΑΔΗΣΥ και
      πρόβλεψη ανεξάρτητου αξιολογητή, ενδιάμεσων πληρωμών και ελάχιστου κόστους
      λειτουργίας — ώστε το πρώτο πιλοτικό να είναι νομικά ανθεκτικό και να
      αποτελέσει πρότυπο για επόμενες συμβάσεις.

