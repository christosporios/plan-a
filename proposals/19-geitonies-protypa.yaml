number: 19
slug: geitonies-protypa
theme: municipality
title: Γειτονιές πρότυπα
one_line: >
  Αλλαγές γίνονται στην Αθήνα, αλλά συχνά σε τόσο μικρή κλίμακα και τόσο διάσπαρτα
  που ο αντίκτυπός τους χάνεται – και οι κάτοικοι παραμένουν μετρίως ικανοποιημένοι,
  χωρίς να νιώθουν ότι η πόλη τους αλλάζει πραγματικά. Για τις προτάσεις του Plan A
  και ευρύτερα, αντί για πολλές μικρές παρεμβάσεις παντού, μπορούν να επιλεγούν
  συγκεκριμένες γειτονιές που υστερούν ιδιαίτερα σε ποιότητα ζωής βάσει μετρήσιμων
  δεικτών, και να εφαρμοστούν εκεί συγκεντρωτικά οι παρεμβάσεις που απαιτούν χωρική
  εφαρμογή. Έτσι, γειτονιές που σήμερα θεωρούνται δεύτερης κατηγορίας, μετατρέπονται
  σε τόπους πειραματισμού και αστικής αναζωογόνησης, μέρη που οι άνθρωποι θέλουν να
  κατοικούν και να επισκέπτονται. Με την προϋπόθεση ότι αυτή η αλλαγή γίνεται με επίγνωση
  του κινδύνου εξευγενισμού και με μέτρα που διασφαλίζουν ότι ωφελούνται πρώτα οι
  κάτοικοι που είναι ήδη εκεί.

