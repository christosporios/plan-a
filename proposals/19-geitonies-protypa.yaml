number: 19
slug: model-neighborhoods
theme: municipality
title: Γειτονιές πρότυπα
one_line: >
  Αντί για πολλές μικρές, διάσπαρτες παρεμβάσεις με αραιωμένο αντίκτυπο, ο δήμος
  επιλέγει λίγες γειτονιές που υστερούν βάσει μετρήσιμων δεικτών και συγκεντρώνει
  εκεί τις χωρικές παρεμβάσεις — με ρητή πρόνοια κατά του εξευγενισμού, ώστε να
  ωφεληθούν πρώτα οι σημερινοί κάτοικοι.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Αλλαγές γίνονται στην Αθήνα, αλλά συχνά σε τόσο μικρή κλίμακα και τόσο
    διάσπαρτα που ο αντίκτυπός τους χάνεται – και οι κάτοικοι παραμένουν μετρίως
    ικανοποιημένοι, χωρίς να νιώθουν ότι η πόλη τους αλλάζει πραγματικά. Για τις
    προτάσεις του Plan A και ευρύτερα, αντί για πολλές μικρές παρεμβάσεις παντού,
    μπορούν να επιλεγούν συγκεκριμένες γειτονιές που υστερούν ιδιαίτερα σε
    ποιότητα ζωής βάσει μετρήσιμων δεικτών, και να εφαρμοστούν εκεί συγκεντρωτικά
    οι παρεμβάσεις που απαιτούν χωρική εφαρμογή. Έτσι, γειτονιές που σήμερα
    θεωρούνται δεύτερης κατηγορίας, μετατρέπονται σε τόπους πειραματισμού και
    αστικής αναζωογόνησης, μέρη που οι άνθρωποι θέλουν να κατοικούν και να
    επισκέπτονται. Με την προϋπόθεση ότι αυτή η αλλαγή γίνεται με επίγνωση του
    κινδύνου εξευγενισμού και με μέτρα που διασφαλίζουν ότι ωφελούνται πρώτα οι
    κάτοικοι που είναι ήδη εκεί.

    Η λογική είναι απλή: η ορατή, μετρήσιμη βελτίωση χρειάζεται κρίσιμη μάζα. Ένα
    παγκάκι εδώ, ένα δέντρο εκεί, ένα πεζοδρόμιο παραπέρα — διάσπαρτα σε όλη την
    πόλη — δεν αλλάζουν την καθημερινότητα κανενός. Αντίθετα, η συγκέντρωση πολλών
    συντονισμένων παρεμβάσεων (πράσινο, πεζοδρόμηση, καθαριότητα, πολιτισμός,
    δημόσιοι χώροι) στην ίδια γειτονιά παράγει μια αλλαγή που φαίνεται, μετριέται
    και αλλάζει τη φήμη της περιοχής.
  callouts:
    - |
      Η πρόταση δεν είναι «εγκαταλείπουμε τις άλλες γειτονιές». Είναι «ξεκινάμε
      από εκεί που η ανάγκη είναι μεγαλύτερη και ο αντίκτυπος μεγαλύτερος», με
      διαφανή, μετρήσιμα κριτήρια επιλογής και χρονοδιάγραμμα που φτάνει σταδιακά
      παντού.

