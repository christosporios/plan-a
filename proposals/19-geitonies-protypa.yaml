# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΑΠΟΤΕΛΕΣΜΑΤΙΚΟΣ ΔΗΜΟΣ» ───────────────────────────
contribution:
  body: |
    Ένας αποτελεσματικός δήμος δεν μετριέται από το πόσα μικρά έργα ανακοινώνει,
    αλλά από το αν παράγει ορατή, μετρήσιμη αλλαγή για τους κατοίκους. Εδώ η
    διεθνής εμπειρία είναι σαφής: η αξιολόγηση των βρετανικών προγραμμάτων
    αναγέννησης γειτονιάς (area-based initiatives) [προειδοποιεί ότι η διασπορά
    πόρων αραιώνει τον αντίκτυπο](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2602742/)^4
    και ότι χρειάζεται ρεαλισμός για το τι μπορεί να πετύχει μια χωρική πολιτική
    και πώς μετριέται.

    Η συγκέντρωση, αντίθετα, παράγει αποτελέσματα που μετρώνται. Στη Μεδεγίν της
    Κολομβίας, όπου ο δήμος συγκέντρωσε επενδύσεις (τελεφερίκ, βιβλιοθήκες, πάρκα,
    δημόσιοι χώροι) στις πιο υποβαθμισμένες γειτονιές, μια φυσική-πειραματική
    μελέτη βρήκε ότι [η μείωση των ανθρωποκτονιών ήταν 66% μεγαλύτερη στις
    γειτονιές παρέμβασης από ό,τι στις γειτονιές
    ελέγχου](https://academic.oup.com/aje/article-abstract/175/10/1045/89012)^1.
    Στη Βαρκελώνη, το μοντέλο των «υπεροικοδομικών τετραγώνων» (superilles)
    εκτιμήθηκε ότι, αν εφαρμοζόταν πλήρως, θα [απέτρεπε περίπου 667 πρόωρους
    θανάτους τον χρόνο, με ετήσιο οικονομικό όφελος €1,7
    δισ.](https://www.sciencedirect.com/science/article/pii/S0160412019315223)^2
    Στις ΗΠΑ, το πρόγραμμα HOPE VI συνδέθηκε με σημαντικά καλύτερα αποτελέσματα
    για τα παιδιά που μεγάλωσαν σε ανακαινισμένες μονάδες: [16% υψηλότερο εισόδημα
    στα 30 και 17% μεγαλύτερη πιθανότητα φοίτησης σε
    κολέγιο](https://cepr.org/voxeu/columns/creating-high-opportunity-neighbourhoods-evidence-hope-vi-programme)^3.
  callouts:
    - |
      Κρίσιμη μάζα αντί διασποράς: η διεθνής αξιολόγηση δείχνει ότι όταν οι πόροι
      απλώνονται πολύ αραιά, ο αντίκτυπος εξαφανίζεται· όταν συγκεντρώνονται,
      μετριέται.
  body_after: |
    Για την Αθήνα το ζήτημα είναι επείγον: η πόλη έχει [μόλις 0,96 τ.μ. αστικού
    πρασίνου ανά κάτοικο, έναντι σύστασης ΠΟΥ για περίπου 9
    τ.μ.](https://neoskosmos.com/en/2023/07/22/news/all-concrete-no-trees-athens-ill-prepared-for-heatwaves/)^9,
    με έντονη ανισότητα μεταξύ κέντρου και περιφέρειας. Το να επιλέξει ο δήμος
    λίγες γειτονιές που υστερούν και να συγκεντρώσει εκεί παρεμβάσεις είναι
    ακριβώς ο τρόπος να μετατρέψει περιορισμένους πόρους σε ορατό αποτέλεσμα — και
    να το αποδείξει με δείκτες ανά γειτονιά, κάτι που οι συμμετέχοντες στο Plan A
    ζητούν έντονα: στηρίζουν μετρήσιμους στόχους και λογοδοσία, δείκτες
    καθαριότητας ανά γειτονιά, και πιλοτικά έργα πριν τη μονιμοποίηση. Η πρόταση
    «Γειτονιές πρότυπα» είναι ο μηχανισμός που τα ενώνει: επιλογή με δείκτες,
    συγκέντρωση πόρων, μέτρηση αποτελέσματος, και κλιμάκωση ό,τι δουλεύει.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Δεν είναι άδικο να προτεραιοποιούνται κάποιες γειτονιές έναντι άλλων;"
    a: >
      Το αντίθετο ισχύει: η διασπορά «λίγο παντού» είναι που είναι άδικη και
      αναποτελεσματική, γιατί αφήνει όλους μετρίως ικανοποιημένους και κανέναν
      πραγματικά ωφελημένο. Η επιλογή γίνεται με διαφανείς, μετρήσιμους δείκτες
      υστέρησης (πράσινο, καθαριότητα, βαδισιμότητα, δημόσιοι χώροι) ώστε να ξεκινά
      από εκεί που η ανάγκη είναι μεγαλύτερη, με δημόσιο χρονοδιάγραμμα που φτάνει
      σταδιακά παντού — το μοντέλο που ακολούθησε η Γαλλία (politique de la ville /
      ANRU), στοχεύοντας εκατοντάδες από τις πιο μειονεκτικές περιοχές.
  - q: "Δεν υπάρχει κίνδυνος εξευγενισμού (gentrification) και εκτοπισμού των σημερινών κατοίκων;"
    a: |
      Ναι, και είναι υπαρκτός. Η αναβάθμιση δημόσιου χώρου και πρασίνου μπορεί να
      ανεβάσει ενοίκια και να εκτοπίσει χαμηλά εισοδήματα — το φαινόμενο του
      «πράσινου εξευγενισμού», για το οποίο [η εμπειρική έρευνα δείχνει μεικτά
      αλλά υπαρκτά αποτελέσματα](https://journals.sagepub.com/doi/abs/10.1177/0042098019849380)^7.
      Στην Αθήνα το έχουμε ήδη δει: στο Κουκάκι, [οι τιμές πώλησης κατοικιών
      αυξήθηκαν 93% και τα ενοίκια 58,5% από το 2016 στο
      2018](https://news.gtp.gr/2023/03/02/gentrification-of-athens-taking-toll-on-smes-standard-of-living/)^11
      μετά την έκρηξη του Airbnb.

      Γι' αυτό η πρόταση είναι ρητά υπό όρους: συνδυάζεται με αντι-εκτοπιστικά
      εργαλεία αποδεδειγμένης αξίας. Τα [κοινοτικά καταπιστεύματα γης (CLT)
      μειώνουν έως και 70% την πιθανότητα εξευγενισμού μιας
      γειτονιάς](https://journalistsresource.org/economics/displacement-policy-what-works/)^8,
      ενώ η Βιέννη απέδειξε ότι κρατικά καθοδηγούμενη «ήπια ανάπλαση» μπορεί να
      αναβαθμίσει χωρίς ριζικό εκτοπισμό: [αναβάθμισε 2.160 κτίρια με 142.000
      διαμερίσματα](https://www.housing2030.org/project/soft-urban-renewal-in-vienna-austria/)^5,
      και η ανάλυση επιβεβαιώνει ότι το πρόγραμμα [δεν οδηγεί σε ριζικό εκτοπισμό
      κατοίκων](https://www.sciencedirect.com/science/article/abs/pii/S0264275121001165)^6.
  - q: "Δεν είναι ακριβό;"
    a: >
      Ακριβότερο είναι να ξοδεύεις διάσπαρτα χωρίς ορατό αποτέλεσμα. Η συγκέντρωση
      αξιοποιεί οικονομίες κλίμακας και κρίσιμη μάζα, και οι παρεμβάσεις αυτές
      αποδεικνύονται οικονομικά αποδοτικές: το μοντέλο της Βαρκελώνης αποτιμήθηκε
      σε [εξοικονόμηση €1,7 δισ. ετησίως από αποφευχθέντες
      θανάτους](https://www.sciencedirect.com/science/article/pii/S0160412019315223)^2.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Ορατός, μετρήσιμος αντίκτυπος
    body: |
      Η συγκέντρωση παρεμβάσεων παράγει αλλαγή που φαίνεται και μετριέται, σε
      αντίθεση με τη διασπορά που αραιώνει το αποτέλεσμα. Η Μεδεγίν κατέγραψε
      [66% μεγαλύτερη μείωση ανθρωποκτονιών στις γειτονιές
      παρέμβασης](https://academic.oup.com/aje/article-abstract/175/10/1045/89012)^1,
      και η Βαρκελώνη εκτίμησε [μείωση NO2 κατά περίπου 24% και 667 αποφευχθέντες
      θανάτους τον χρόνο](https://www.sciencedirect.com/science/article/pii/S0160412019315223)^2.
    callouts:
      - |
        Δείκτες ανά γειτονιά πριν/μετά: ο μόνος τρόπος να αποδειχθεί στους
        κατοίκους ότι η πόλη αλλάζει πραγματικά.
  - title: Αναζωογόνηση χωρίς εκτοπισμό (αν γίνει σωστά)
    body: |
      Με τα κατάλληλα εργαλεία, η αναβάθμιση ωφελεί πρώτα τους σημερινούς
      κατοίκους. Η Βιέννη [αναβάθμισε 2.160 κτίρια και 142.000 διαμερίσματα
      αποφεύγοντας τον ριζικό
      εκτοπισμό](https://www.housing2030.org/project/soft-urban-renewal-in-vienna-austria/)^5,
      και τα [κοινοτικά καταπιστεύματα γης μειώνουν έως 70% τις πιθανότητες
      εξευγενισμού](https://journalistsresource.org/economics/displacement-policy-what-works/)^8.
  - title: Πειραματισμός και κλιμάκωση
    body: |
      Λίγες γειτονιές-πρότυπα λειτουργούν ως ζωντανά εργαστήρια: δοκιμάζεις,
      μετράς, και κλιμακώνεις ό,τι δουλεύει — ακριβώς το tactical urbanism που
      στηρίζουν οι κάτοικοι. Η Αθήνα διαθέτει ήδη τέτοια εργαλεία, όπως το
      [πρόγραμμα «πάρκων τσέπης»](https://prizes.new-european-bauhaus.eu/application/pocket-parks)^15
      και τη [στρατηγική ανθεκτικότητας «Αθήνα
      2030»](https://resilientcitiesnetwork.org/downloadable_resources/Network/Athens-Resilience-Strategy-English.pdf)^16.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Επιλογή 2-3 γειτονιών με μετρήσιμα κριτήρια
    body: >
      Ο δήμος δημοσιοποιεί έναν σύνθετο δείκτη υστέρησης ποιότητας ζωής
      (πράσινο ανά κάτοικο, καθαριότητα, βαδισιμότητα, δημόσιοι χώροι, πρόσβαση σε
      πολιτισμό) ανά γειτονιά — αξιοποιώντας δεδομένα όπως αυτά του Παρατηρητηρίου
      Βαδισιμότητας — και επιλέγει 2-3 περιοχές με τη μεγαλύτερη υστέρηση για
      συγκεντρωμένη παρέμβαση, με διαφανές χρονοδιάγραμμα.
  - title: Δέσμη παρέμβασης συνδεδεμένη με αντι-εκτοπιστικά μέτρα
    body: >
      Σε κάθε γειτονιά-πρότυπο εφαρμόζεται ταυτόχρονα δέσμη χωρικών παρεμβάσεων ΚΑΙ
      ασπίδα κατά του εξευγενισμού (προστασία ενοικιαστών, διατήρηση προσιτής
      κατοικίας, όρια βραχυχρόνιας μίσθωσης), με δημόσια μέτρηση δεικτών πριν/μετά
      και ετήσια λογοδοσία.

