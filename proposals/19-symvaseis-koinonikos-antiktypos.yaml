number: 19
slug: symvaseis-koinonikos-antiktypos
theme: municipality
title: Δημόσιες συμβάσεις υπηρεσιών βάσει αντικτύπου
one_line: >
  Όταν ο Δήμος αναθέτει κοινωνικές υπηρεσίες, ο πάροχος συχνά πληρώνεται για
  ώρες και εισροές, ανεξάρτητα από το αν βελτιώθηκε η ζωή των ωφελουμένων. Ας
  συνδέσουμε μέρος της αμοιβής με μετρήσιμα, επαληθεύσιμα αποτελέσματα.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Όταν ο δήμος προμηθεύεται υλικά, η σύμβαση είναι σαφής και η πληρωμή γίνεται βάσει της παράδοσης προϊόντων που πληρούν συγκεκριμένες προδιαγραφές. Στις υπηρεσίες – όπως η φιλοζωική μέριμνα, η αντιμετώπιση της αστεγίας, η προώθηση της συμμετοχικής δημοκρατίας – ο πάροχος συχνά πληρώνεται ανεξάρτητα από το αποτέλεσμα που επιφέρει η υπηρεσία του. Η πρόταση είναι ο δήμος να συνάπτει συμβάσεις βάσει αντικτύπου, όπου μέρος της αμοιβής συνδέεται με μετρήσιμα αποτελέσματα – με ενδιάμεσες πληρωμές σε επαληθεύσιμα στάδια ώστε να διατηρείται η ρευστότητα των παρόχων, και με ελάχιστο κόστος λειτουργίας σε περίπτωση αποτυχίας ώστε η υπηρεσία να μην διακόπτεται εις βάρος των ωφελούμενων – διασφαλίζοντας ότι το δημόσιο χρήμα πηγαίνει εκεί που πραγματικά αποδίδει.

