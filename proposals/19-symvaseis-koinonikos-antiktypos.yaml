# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ ─────────────────────────────────────────────────
contribution:
  body: |
    Κάθε χρόνο, ο Δήμος Αθηναίων προκηρύσσει πολλές δημόσιες συμβάσεις για υπηρεσίες όπως προγράμματα απεξάρτησης τοξικομανών, προγράμματα στεγαστικής αποκατάστασης αστέγων, προγράμματα πρόνοιας ηλικιωμένων, υπηρεσίες συμμετοχικής δημοκρατίας. Το σημερινό μοντέλο πληρώνει για εισροές, όχι για αποτελέσματα. Ένας πάροχος κοινωνικών υπηρεσιών λαμβάνει αμοιβή για ώρες υπηρεσίας, παρεχόμενα γεύματα, ή αριθμό ωφελουμένων – ανεξάρτητα από το αν η κατάσταση των ωφελουμένων βελτιώθηκε. Ο πάροχος που παρέχει χιλιάδες ώρες φροντίδας χωρίς μακροπρόθεσμο αποτέλεσμα αμείβεται ακριβώς όπως αυτός που πετυχαίνει αποτελέσματα και άρα, δεν υπάρχει υπάρχει κίνητρο για πραγματική αποτελεσματικότητα.

    Προτείνεται, λοιπόν, η εισαγωγή συμβάσεων βάσει αντικτύπου σε επιλεγμένες συμβάσεις υπηρεσιών του δήμου, όπου μέρος της αμοιβής του παρόχου θα συνδέεται με μετρήσιμα, επαληθεύσιμα αποτελέσματα. Η αμοιβή του παρόχου δεν εξαρτάται από το πόσο παρήγαγε, αλλά από το τι πέτυχε – και αυτό, από μόνο του, δημιουργεί ένα ριζικά διαφορετικό σύστημα κινήτρων.

    Παράλληλα, το μοντέλο διατηρεί δύο κρίσιμες ασφαλιστικές δικλίδες. Πρώτον, ενδιάμεσες πληρωμές σε επαληθεύσιμα στάδια διασφαλίζουν ότι οι πάροχοι – συχνά μικρές ΜΚΟ ή κοινωνικές επιχειρήσεις με περιορισμένα αποθεματικά – δεν αντιμετωπίζουν πρόβλημα ρευστότητας. Η χρηματοδότηση αποδεσμεύεται καθώς η πρόοδος τεκμηριώνεται. Δεύτερον, ένα ελάχιστο κόστος λειτουργίας εξασφαλίζει ότι ακόμα και σε περίπτωση αποτυχίας η υπηρεσία δεν διακόπτεται απότομα, προστατεύοντας τους ωφελούμενους από τις συνέπειες μιας αποτυχίας του παρόχου. Έτσι, κάθε ευρώ που δαπανάται συνδέεται με ένα μετρήσιμο αποτέλεσμα, και κάθε σύμβαση λειτουργεί ως μηχανισμός λογοδοσίας, όχι μόνο για τον πάροχο, αλλά και για τον ίδιο τον δήμο απέναντι στους πολίτες του.

    Διεθνώς, η μέθοδος έχει δοκιμαστεί: στο πρώτο Social Impact Bond του κόσμου, στις φυλακές του Peterborough στο Ηνωμένο Βασίλειο, η αμοιβή των φορέων συνδέθηκε με τη μείωση της υποτροπής των αποφυλακισμένων και το πρόγραμμα [πέτυχε τον στόχο μείωσης που είχε τεθεί](https://www.gov.uk/government/publications/phase-2-report-from-the-payment-by-results-social-impact-bond-pilot-at-hmp-peterborough)^1, αποπληρώνοντας τους χρηματοδότες.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Αυτό το μοντέλο δεν δίνει κίνητρο στους παρόχους να διαλέγουν τις «εύκολες» περιπτώσεις; Αν πληρώνεσαι για αποτέλεσμα, έχεις κίνητρο να επιλέγεις όσους έχουν τις περισσότερες πιθανότητες επιτυχίας, αφήνοντας έξω τις δυσκολότερες περιπτώσεις που συνήθως έχουν και τη μεγαλύτερη ανάγκη."
    a: >
      Ο κίνδυνος είναι υπαρκτός και [τεκμηριωμένος](https://www.cambridge.org/core/journals/journal-of-social-policy/article/creaming-and-parking-in-quasimarketised-welfaretowork-schemes-designed-out-of-or-designed-in-to-the-uk-work-programme/20EC18F95133F0081E0A01E187DA3DC1)^2.
      Η λύση βρίσκεται στη δομή της αποζημίωσης. Η σύμβαση δεν πρέπει απλώς να
      ορίζει έναν γενικό στόχο αλλά και συγκεκριμένα προφίλ στόχων σε βαθμίδες
      δυσκολίας ως προς το πόσο απαιτητική είναι η επιτυχία. Για παράδειγμα, η
      στεγαστική αποκατάσταση ενός αστέγου με ενεργή εξάρτηση και ιστορικό
      ψυχικής νόσου μπορεί να κριθεί ότι ανήκει σε υψηλότερη βαθμίδα συνθετότητας
      από έναν άστεγο που αντιμετωπίζει πρωτίστως οικονομικά προβλήματα. Η
      αποζημίωση θα πρέπει να κλιμακώνεται ώστε η επιτυχία ενός σύνθετου στόχου να
      αμείβεται περισσότερο από την επιτυχία ενός πιο διαχειρίσιμου στόχου (ή και
      πολλών πιο διαχειρίσιμων στόχων). Έτσι, ο πάροχος δεν έχει μόνο λόγο να μην
      αποφύγει τις δύσκολες περιπτώσεις, έχει θετικό οικονομικό κίνητρο να τις
      αναζητήσει.

  - q: "Μήπως αυτοί οι δείκτες προσθέτουν απλώς γραφειοκρατία;"
    a: >
      Η ύπαρξη κανόνων και διαδικασιών δεν είναι εγγενώς προβληματική. Είναι
      προβληματική αν δεν εξυπηρετεί κάποιον χρήσιμο σκοπό. Το πλαίσιο που
      προτείνεται, τουναντίον, επιχειρεί να εκλογικεύσει τις διαδικασίες με
      σαφήνεια: ένας ή δύο δείκτες ανά σύμβαση, εύκολα επαληθεύσιμοι, με
      αξιολόγηση από ανεξάρτητο φορέα.

  - q: "Τι γίνεται αν δεν υπάρχουν αρκετοί πάροχοι που να θέλουν να αναλάβουν το ρίσκο;"
    a: >
      Το μοντέλο μεταφέρει μέρος του χρηματοδοτικού ρίσκου από τον Δήμο στον
      πάροχο. Για μεγάλους παρόχους με ισχυρό ισολογισμό αυτό είναι διαχειρίσιμο
      – για μικρές ΜΚΟ ή νεοσύστατες κοινωνικές επιχειρήσεις, μπορεί να αποτελεί
      ανασταλτικό παράγοντα συμμετοχής, αφήνοντας τον Δήμο με έναν μικρό αριθμό
      μεγάλων παρόχων και λιγότερο ανταγωνισμό. Η αντιμετώπιση είναι διπλή.
      Αφενός, η δομή των ενδιάμεσων πληρωμών που περιγράφεται παραπάνω μειώνει
      σημαντικά την έκθεση στο ρίσκο – ο πάροχος δεν στοιχηματίζει ολόκληρη την
      αμοιβή του στο τελικό αποτέλεσμα. Αφετέρου, ο δήμος μπορεί να παρέχει
      τεχνική υποστήριξη κατά τη φάση εκπόνησης της πρότασης, βοηθώντας
      μικρότερους παρόχους να αποτιμήσουν ρεαλιστικά το ρίσκο που αναλαμβάνουν και
      να σχεδιάσουν τους δείκτες τους. Το ζητούμενο είναι ένα ανταγωνιστικό
      οικοσύστημα παρόχων.

  - q: "Μήπως το μοντέλο δεν λειτουργεί δημοσιονομικά; Αν ο δήμος πληρώνει επιπλέον για δύσκολες περιπτώσεις και εγγυάται ελάχιστη αμοιβή ακόμα και σε αποτυχία, δεν καταλήγει να ξοδεύει περισσότερα από ό,τι με το σημερινό μοντέλο;"
    a: >
      Το σημερινό μοντέλο φαίνεται φθηνότερο γιατί πληρώνει λιγότερα ανά σύμβαση –
      αλλά επαναλαμβάνει τις ίδιες παρεμβάσεις επ' αόριστον, χωρίς να λύνει το
      πρόβλημα. Το προτεινόμενο μοντέλο είναι εμπροσθοβαρές: απαιτεί υψηλότερη
      αμοιβή όταν το αποτέλεσμα επιτυγχάνεται, και κάποιο ελάχιστο κόστος ακόμα
      και όταν δεν επιτυγχάνεται. Ο στόχος, όμως, δεν είναι να μειωθεί η δαπάνη
      ανά σύμβαση – είναι να μειωθεί η ανάγκη επανάληψης της ίδιας σύμβασης. Η
      λογική είναι ότι πληρώνεις περισσότερο μία φορά για να μην χρειαστεί να
      πληρώνεις πολλές φορές.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - category: peer-cities
    body: >
      Ο κίνδυνος εκτοπισμού κατοίκων είναι αρκετά μεγάλος ώστε να μην επιτρέπει
      πειραματισμούς. Γι' αυτό ένα από τα πρώτα πράγματα που πρέπει να γίνουν
      είναι η διερεύνηση στενών επαφών με πόλεις που έχουν ήδη υλοποιήσει
      αντίστοιχα μοντέλα και έχουν αναπτύξει μηχανισμούς που λειτουργούν.

  - category: financial-flow
    body: >
      Παρεμβάσεις αυτής της κλίμακας, για να λειτουργήσουν, πρέπει να είναι
      φιλόδοξες. Ένα οριζόντιο συμπέρασμα που προκύπτει και από άλλες προτάσεις
      είναι ότι ο δήμος πρέπει να γίνει εξωστρεφής: να ανοίξει διάλογο με
      επιχειρήσεις, ιδρύματα, και κάθε δρώντα που έχει λόγο να επενδύσει στην
      αναβάθμιση της πόλης. Η εστίαση σε συγκεκριμένες γειτονιές δημιουργεί ένα
      επιπλέον πλεονέκτημα: είναι πολύ πιο εύκολο να απευθυνθείς σε επιχειρήσεις
      που δραστηριοποιούνται ήδη στη γειτονιά, σε επιχειρηματίες που έχουν
      μεγαλώσει ή ζήσει εκεί, σε ανθρώπους που έχουν προσωπική σχέση με το
      συγκεκριμένο μέρος και λόγο να δουν την αλλαγή να συμβαίνει.

