number: 19
slug: symvaseis-koinonikos-antiktypos
theme: municipality
title: Δημόσιες συμβάσεις βάσει κοινωνικού αντικτύπου
one_line: >
  Συμβάσεις Αποτελεσμάτων (Payment by Results) σε επιλεγμένες κοινωνικές
  υπηρεσίες του Δήμου: ο πάροχος πληρώνεται για το τι πέτυχε, όχι για το τι
  έκανε.

problem:
  body: |
    Κάθε χρόνο, ο Δήμος Αθηναίων προκηρύσσει πολλές δημόσιες συμβάσεις για
    κοινωνικές υπηρεσίες — από προγράμματα απεξάρτησης και αποκατάστασης
    αστέγων, έως πρόνοια ηλικιωμένων και ενίσχυση παιδιών σε κίνδυνο. Το
    σημερινό μοντέλο πληρώνει για εισροές, όχι για αποτελέσματα. Ένας πάροχος
    κοινωνικών υπηρεσιών λαμβάνει αμοιβή για ώρες υπηρεσίας, παρεχόμενα γεύματα,
    ή αριθμό επωφελουμένων — ανεξάρτητα από το αν η κατάσταση των ωφελουμένων
    βελτιώθηκε. Ο πάροχος που παρέχει χιλιάδες ώρες φροντίδας χωρίς
    μακροπρόθεσμο αποτέλεσμα αμείβεται ακριβώς όπως αυτός που πετυχαίνει
    αποτελέσματα. Δεν υπάρχει κίνητρο για καινοτομία. Δεν υπάρχει τιμωρία για
    αναποτελεσματικότητα.

    Αυτή η αδυναμία έχει δύο συγκεκριμένες συνέπειες. Από τη μία πλευρά, ο
    Δήμος δεν γνωρίζει ποιες υπηρεσίες λειτουργούν. Η Ευρωπαϊκή Επιτροπή
    εκτιμά ότι 30–40% των δαπανών κοινωνικών υπηρεσιών στις χώρες της ΕΕ
    κατευθύνεται σε παρεμβάσεις χαμηλής ή μηδενικής αποτελεσματικότητας.^1
    Από την άλλη πλευρά, η απουσία αποτελεσματικών υπηρεσιών δεν είναι δωρεάν.
    Ένας άστεγος που παραμένει χωρίς στέγη κοστίζει στο σύστημα €30.000–50.000/
    έτος (π.χ. για επείγουσα φροντίδα, νοσηλείες) έναντι €8.000–15.000/έτος
    για ένα επιτυχές πρόγραμμα επανένταξης.^2

proposal:
  body: |
    Εισαγωγή **Συμβάσεων Αποτελεσμάτων (Payment by Results)** σε επιλεγμένες
    συμβάσεις κοινωνικών υπηρεσιών του Δήμου Αθηναίων, με πιλοτική εφαρμογή σε
    τρία πεδία υψηλής κοινωνικής ανάγκης με δύο κριτήρια: μετρήσιμα,
    επαληθεύσιμα αποτελέσματα και υπολογίσιμη εξοικονόμηση για τον Δήμο αν το
    αποτέλεσμα επιτευχθεί. Για παράδειγμα, στέγαση αστέγων, πρώιμη παιδική
    παρέμβαση, και επανένταξη νέων εκτός αγοράς εργασίας και εκπαίδευσης
    (NEET, 15–29 ετών).

    Κάθε σύμβαση αποτελεσμάτων έχει τριμερή δομή:

    1. Ο Δήμος ορίζει τους στόχους και τη βαθμίδα πληρωμής για κάθε επίπεδο
       επίτευξης — ο πάροχος αμείβεται για το τι πέτυχε, όχι για το τι έκανε.
       Αντί για «200 ώρες συμβουλευτικής», ο στόχος γίνεται «30 άτομα σε
       σταθερή στέγη μετά 12 μήνες». Αντί για «500 γεύματα», ο στόχος γίνεται
       «20 παιδιά που αποφεύγουν τον ιδρυματισμό».
    2. Ο πάροχος αναλαμβάνει το πρόγραμμα γνωρίζοντας εκ των προτέρων τι θα
       αμειφθεί και για τι.
    3. Ανεξάρτητος αξιολογητής επαληθεύει τα αποτελέσματα πριν από οποιαδήποτε
       πληρωμή.

implementation:
  body: |
    Το θεσμικό πλαίσιο υπάρχει. Ο Ν. 4412/2016 (Άρθρο 2, παρ. 1, εδ. η) ορίζει
    ότι οι συμβάσεις υπηρεσιών μπορούν να συνδέουν την αμοιβή με την επίτευξη
    αποτελεσμάτων. Το Άρθρο 131 προβλέπει συμβάσεις αποζημίωσης βάσει
    αποτελεσμάτων για ορισμένες κατηγορίες υπηρεσιών.

    Το πρώτο βήμα είναι ο ορισμός στόχων αποτελεσμάτων για κάθε πιλοτικό πεδίο.
    Αυτό δεν απαιτεί νέο προσωπικό — η υπάρχουσα Διεύθυνση Κοινωνικής Πολιτικής
    του Δήμου έχει την τεχνογνωσία και αναλαμβάνει τον συντονισμό. Τα
    αποτελέσματα πρέπει να είναι binary και εύκολα επαληθεύσιμα — σταθερή στέγη
    μετά 12 μήνες (ναι/όχι), νέος σε απασχόληση/εκπαίδευση (ναι/όχι). Δυσνόητοι
    δείκτες ανοίγουν παράθυρο σε αμφισβήτηση των αποτελεσμάτων. Η επαλήθευση
    ανατίθεται σε εξωτερικό τεχνικό σύμβουλο — κάποια ελεγκτική εταιρεία — ο
    οποίος επιβεβαιώνει τα αποτελέσματα πριν από οποιαδήποτε πληρωμή. Η
    εξωτερική επαλήθευση κάνει το σύστημα αξιόπιστο και για τους δύο: Δήμο και
    πάροχο.

limitations:
  - q: "Μη ελκυστικότητα για τον πάροχο: το σημερινό μοντέλο εγγυάται στον πάροχο έσοδα ανεξάρτητα από αποτέλεσμα — το νέο σύστημα τον εκθέτει σε κίνδυνο να μην πληρωθεί για δουλειά που έκανε. Ειδικά οι μικρότεροι πάροχοι, που δεν έχουν ρευστότητα να απορροφήσουν μια αποτυχία, θα αποφύγουν να συμμετάσχουν, αφήνοντας το πεδίο σε μεγαλύτερους που μπορεί να μην είναι οι καλύτεροι."
    a: >
      Πρώτον, το ανώτατο ύψος αμοιβής σε σύμβαση αποτελεσμάτων πρέπει να είναι
      ρητά υψηλότερο από το αντίστοιχο μιας κλασικής σύμβασης εισροών — ο
      πάροχος που επιτυγχάνει παίρνει περισσότερα, όχι τα ίδια. Αλλιώς δεν
      υπάρχει κίνητρο συμμετοχής. Δεύτερον, η σύμβαση μπορεί να προβλέπει
      ενδιάμεσες πληρωμές: ένα μέρος της αμοιβής μπορεί να αποδίδεται σε
      ενδιάμεσα επαληθεύσιμα στάδια — π.χ. ο άστεγος μπήκε σε στέγη (ακόμα και
      αν δεν έχει συμπληρώσει 12 μήνες). Έτσι ο πάροχος διατηρεί ρευστότητα.
      Τρίτον, η σύμβαση ορίζει ρητά τι συμβαίνει αν δεν επιτευχθούν ούτε κάποια
      ενδιάμεσα ορόσημα: ο πάροχος μπορεί να λαμβάνει ένα ελάχιστο κόστος
      λειτουργίας, όχι την πλήρη αμοιβή, αλλά αρκετό ώστε να μην καταρρεύσει
      οικονομικά και να μην διακόψει την υπηρεσία εν μέσω προγράμματος,
      επιβαρύνοντας τους ωφελούμενους.

  - q: "Κίνδυνος «cherry-picking»: αν ο πάροχος πληρώνεται για αποτελέσματα, έχει κίνητρο να επιλέγει τους ωφελούμενους με τις μεγαλύτερες πιθανότητες επιτυχίας, αφήνοντας εκτός τις πιο δύσκολες περιπτώσεις που έχουν την μεγαλύτερη ανάγκη. Αυτό δεν είναι υποθετικός κίνδυνος: τεκμηριώθηκε συστηματικά στα βρετανικά προγράμματα Payment by Results για ανέργους, όπου πάροχοι συστηματικά παρέκαμπταν άτομα με πολλαπλά εμπόδια απασχόλησης."
    a: >
      Η σύμβαση ορίζει εκ των προτέρων το προφίλ των ωφελουμένων και η
      αποζημίωση κλιμακώνεται αντίστροφα με την ευκολία: υψηλότερη πληρωμή για
      επιτυχία με δυσκολότερο προφίλ ωφελούμενου. Έτσι ο πάροχος έχει
      οικονομικό κίνητρο να πάρει τις δύσκολες περιπτώσεις, όχι να τις
      αποφύγει.

  - q: "Νομική αβεβαιότητα στη διαμόρφωση της σύμβασης: αν και ο Ν. 4412/2016 επιτρέπει συμβάσεις αποτελεσμάτων, δεν υπάρχει ακόμα τυποποιημένο ελληνικό υπόδειγμα για κοινωνικές υπηρεσίες — κάθε σύμβαση θα πρέπει να σχεδιαστεί από την αρχή, με κίνδυνο να νομικές αδυναμίες να αμφισβητηθούν από παρόχους ή ελεγκτικά όργανα."
    a: >
      Η λύση είναι η εκ των προτέρων εμπλοκή νομικού συμβούλου με εμπειρία στις
      δημόσιες συμβάσεις και η διαβούλευση με την ΕΑΔΗΣΥ (Ενιαία Αρχή Δημοσίων
      Συμβάσεων) πριν την προκήρυξη — η ΕΑΔΗΣΥ έχει εκδώσει κατευθυντήριες
      οδηγίες για καινοτόμες συμβάσεις και η προηγούμενη διαβούλευση μαζί της
      μειώνει δραστικά τον κίνδυνο μεταγενέστερης αμφισβήτησης.


