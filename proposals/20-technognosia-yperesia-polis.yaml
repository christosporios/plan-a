number: 20
slug: technognosia-yperesia-polis
theme: municipality
title: Τεχνογνωσία στην υπηρεσία του δήμου
one_line: >
  Ένα πρόγραμμα τοποθετήσεων που φέρνει στον δήμο δεξιότητες που του λείπουν:
  φοιτητές μέσω πρακτικής άσκησης και επαγγελματίες του ιδιωτικού τομέα μέσω
  secondment — πάντα με έναν υπάλληλο του δήμου ως εσωτερικό υπεύθυνο, ώστε η
  γνώση να μένει στον οργανισμό.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Πολλές από τις λύσεις που χρειάζεται η Αθήνα απαιτούν δεξιότητες που οι δημοτικές υπηρεσίες δεν διαθέτουν. Η πρόταση είναι ένα πρόγραμμα απασχόλησης δύο κατηγοριών ανθρώπινου δυναμικού στον δήμο: φοιτητών στο πλαίσιο της πρακτικής τους άσκησης, και επαγγελματιών από τον ιδιωτικό τομέα μέσω secondment από την εταιρεία τους, η οποία συνεχίζει να τους μισθοδοτεί ως δράση εταιρικής κοινωνικής ευθύνης. Και στις δύο περιπτώσεις, ένας υπάλληλος του δήμου αναλαμβάνει ρόλο εσωτερικού υπευθύνου, ώστε η τεχνογνωσία που αναπτυχθεί να παραμείνει εντός του οργανισμού.

# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΑΠΟΤΕΛΕΣΜΑΤΙΚΟΣ ΔΗΜΟΣ» ────────────────────────
contribution:
  body: |
    Πολλές από τις προτάσεις αυτού του σχεδίου απαιτούν δεξιότητες που οι δημοτικές υπηρεσίες σπάνια διαθέτουν σήμερα: ανάλυση δεδομένων, διαχείριση έργων, σχεδιασμός πολιτικής βασισμένης σε αποτελέσματα, αστικός σχεδιασμός, ψηφιακή ανάπτυξη. Αυτό δεν είναι κριτική στους υπαλλήλους του Δήμου – αφορά τη δομή της δημόσιας απασχόλησης στην Ελλάδα, που δεν επιτρέπει εύκολα ούτε στοχευμένες προσλήψεις ούτε ανάπτυξη εξειδικευμένης τεχνογνωσίας για συγκεκριμένα projects.

    Το αποτέλεσμα είναι μια χρόνια ασυμμετρία: οι ανάγκες της πόλης γίνονται πιο σύνθετες, αλλά οι δυνατότητες υλοποίησης δεν ενισχύονται. Πολιτικές που είναι σωστά σχεδιασμένες και καλά χρηματοδοτημένες αποτυγχάνουν στην εκτέλεση – όχι επειδή κάποιος δεν θέλει να τις υλοποιήσει, αλλά επειδή δεν υπάρχει ούτε η τεχνογνωσία ούτε και ο χρόνος ή το capacity για να αναπτυχθεί.

    Υπάρχουν ταυτόχρονα δύο αναξιοποίητες δεξαμενές ανθρώπινου δυναμικού:

    Η πρώτη είναι φοιτητές/ερευνητές από το ΕΜΠ, ΕΚΠΑ, Πάντειο, Οικονομικό Πανεπιστήμιο και άλλα ιδρύματα που εκπονούν διπλωματικές ή πρακτική άσκηση αποκομμένα από τα πραγματικά προβλήματα της πόλης.

    Η δεύτερη είναι, επαγγελματίες από τον ιδιωτικό τομέα – σύμβουλοι, αρχιτέκτονες, analysts, project managers, developers – που σε αρκετές περιπτώσεις θα ήθελαν να συνεισφέρουν στην πόλη, και δη για συγκεκριμένο χρονικό διάστημα, αλλά δεν υπάρχει κανένας δομημένος τρόπος να το κάνουν.

    Η πρόταση, λοιπόν, αφορά τη δημιουργία ενός προγράμματος τοποθετήσεων ανθρώπινου δυναμικού εντός του Δήμου.

    Πρώτον, για φοιτητές/ερευνητές. Το πρόγραμμα αυτό στηρίζεται στη συνεργασία με τμήματα πολιτικής επιστήμης, αρχιτεκτονικής, πολεοδομίας, οικονομικών, πληροφορικής και δημόσιας διοίκησης, ώστε φοιτητές να τοποθετούνται στις υπηρεσίες του Δήμου για 4 έως 6 μήνες. Η διαφορά από την τυπική πρακτική άσκηση είναι ότι ο φοιτητής δεν έρχεται απλώς να κάνει βοηθητικές εργασίες αλλά αναλαμβάνει ένα συγκεκριμένο, προκαθορισμένο αντικείμενο με παραδοτέο — μια ανάλυση δεδομένων, μια χαρτογράφηση υπηρεσιών, ένα σχέδιο πολιτικής, μια αξιολόγηση προγράμματος. Το αντικείμενο αυτό μπορεί παράλληλα να αποτελεί τη διπλωματική του εργασία, δημιουργώντας έτσι μια αμοιβαία συμφωνία: το πανεπιστήμιο αποκτά φοιτητές που εκπονούν έρευνα βασισμένη σε πραγματικά δεδομένα, ο Δήμος αποκτά ανάλυση που δεν θα μπορούσε να παράγει από τους ίδιους πόρους του.

    Ένα πρακτικό εργαλείο για τη διευκόλυνση αυτής της σύνδεσης είναι η δημοσίευση ενός καταλόγου ερευνητικών ερωτημάτων που διατυπώνει ο ίδιος ο δήμος και για τα οποία αναζητά ακαδημαϊκή συνδρομή, π.χ. τι συμβαίνει στις τιμές ενοικίων σε μια συνοικία μετά από επενδύσεις στο πράσινο, πόσο αποτελεσματικές είναι οι παρεμβάσεις σε σχολικές υποδομές σε σχέση με την επίδοση μαθητών, πώς χρησιμοποιείται πραγματικά ένας δημόσιος χώρος σε σχέση με τον τρόπο που σχεδιάστηκε. Δεν πρόκειται δηλαδή για ανοιχτή πρόσκληση σε οποιαδήποτε θεματολογία αποφασίσουν οι φοιτητές ή τα τμήματα αλλά για έναν κατάλογο πραγματικών, διατυπωμένων ερωτημάτων που ο Δήμος θέλει να απαντήσει και δεν έχει την ικανότητα να ερευνήσει μόνος του. Το Λονδίνο έχει αναπτύξει ακριβώς αυτό μέσα από το [London Research and Policy Partnership](https://www.london.gov.uk/programmes-strategies/business-and-economy/mayors-priorities-londons-economy-and-business/london-research-and-policy-partnership/areas-research-interest-london?ac-1060136=1060135)^1.

    Δεύτερον, μπορούν να προβλεφθούν και τοποθετήσεις επαγγελματιών από τον ιδιωτικό τομέα – σύμβουλοι, αρχιτέκτονες, analysts, project managers, developers – για διάστημα έως 12 μηνών. Η αφετηρία της τοποθέτησης μπορεί να είναι διπλή: είτε ένα project που έχει ήδη εγκριθεί και χρηματοδοτηθεί, αλλά του λείπει η ικανότητα υλοποίησης που δεν υπάρχει εσωτερικά, είτε ένα πρόβλημα που έχει διαπιστωθεί και ο Δήμος αναζητά κάποιον με δημιουργική σκέψη να προτείνει λύσεις – χωρίς δηλαδή να υπάρχει ήδη έτοιμο σχέδιο προς εκτέλεση.

    Η βασική λογική θα είναι η προσωρινή απόσπαση: ο επαγγελματίας παραχωρείται από την εταιρεία του, η οποία συνεχίζει να τον μισθοδοτεί εγια το διάστημα της τοποθέτησης. Ο δήμος δεν αναλαμβάνει κόστος μισθού, αλλά παρέχει χώρο εργασίας, πρόσβαση σε δεδομένα, θεσμική υποστήριξη. Η εταιρεία αποκτά ορατότητα και συνεισφορά στην πόλη: μια μορφή εταιρικής κοινωνικής ευθύνης χωρίς χρηματική δωρεά αλλά με απτό αντίκρισμα.

    Το παράδειγμα του Ηνωμένου Βασιλείου αξίζει να αναφερθεί: το [No10 Innovation Fellowship](https://fellows.ai.gov.uk/)^2 της κεντρικής κυβέρνησης τοποθετεί επαγγελματίες τεχνολογίας, data science και σχεδιασμού από εταιρείες και startups σε κυβερνητικά υπουργεία για 6-12 μήνες, με secondment που οργανώνεται απευθείας με τον εργοδότη. Οι fellows εργάζονται σε μικρές ομάδες πάνω σε συγκεκριμένα, προκαθορισμένα projects με σαφή παραδοτέα. Χαρακτηριστικό εύρημα από την πρώτη cohort: οι υπηρεσίες που δέχτηκαν fellows τους περιέγραψαν ως «force multipliers» – όχι επειδή παρήγαγαν απλώς παραδοτέα, αλλά επειδή άλλαξαν τον τρόπο που οι εσωτερικές ομάδες σκέφτονται για αντίστοιχα προβλήματα. Το πρόγραμμα αφορά κεντρική κυβέρνηση, αλλά η δομή του είναι πλήρως μεταφέρσιμη σε δημοτικό επίπεδο.

    Γι’αυτό και είναι κρίσιμο και στους δύο τύπους τοποθέτησης, να υπάρχει ένας εσωτερικός «υπεύθυνος υπηρεσίας» – ένας υπάλληλος του δήμου που συνεργάζεται στενά με τον εκάστοτε άνθρωπο, που θα παρακολουθεί και θα παραλαμβάνει το αποτέλεσμα με στόχο να αναλάβει τη διάχυσή του στον δήμο.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Πώς θα βρουν τον χρόνο οι ήδη πιεσμένοι δημοτικοί υπάλληλοι για να ασχοληθούν με αυτό το μοντέλο;"
    a: |
      Οι διευθύνσεις που είναι ήδη υποστελεχωμένες μπορεί να αντιληφθούν την τοποθέτηση ως επιπλέον βάρος, όχι ως ανακούφιση. Αυτός είναι ο βασικότερος λόγος που οι θέσεις πρέπει να είναι αυστηρά προκαθορισμένες – ο τοποθετημένος να φτάνει με σαφές αντικείμενο, όχι για να ρωτάει «τι να κάνω» και να επιβαρύνει την ομάδα του δήμου. Επιπλέον, η συμμετοχή μπορεί να είναι εθελοντική για κάθε διεύθυνση στην πρώτη φάση: μόνο αυτές που το ζητούν ενεργά να συμμετέχουν.

  - q: "Θα μείνει πραγματικά κάτι στον δήμο μετά την τοποθέτηση;"
    a: |
      Εύλογα γεννάται ο φόβος μήπως ο φοιτητής ή ο επαγγελματίας φύγει και φύγει και η τεχνογνωσία μαζί του. Γι’ αυτό και ο ρόλος τους «υπεύθηνου υπηρεσίας» δεν είναι απλώς να παραλάβει το τελικό παραδοτέο αλλά συμμετέχει ενεργά καθ' όλη τη διάρκεια της τοποθέτησης, με τακτικές συναντήσεις στις οποίες ο τοποθετημένος θα παρουσιάζει ενδιάμεσα ευρήματα, θα εξηγεί τη μεθοδολογία που ακολουθεί και θα απαντά σε ερωτήσεις. Η τοποθέτηση μπορεί να κλείνει πάντα με ανοιχτή παρουσίαση στη διεύθυνση όπου ο τοποθετημένος παρουσιάζει το αποτέλεσμα και η ομάδα μπορεί να ρωτήσει, να αμφισβητήσει, να κατανοήσει τις παραδοχές. Αυτή η διαδικασία έχει διπλή αξία: αφενός το παραδοτέο γίνεται κατανοητό από περισσότερους ανθρώπους στον δήμο και άρα πιο πιθανό να χρησιμοποιηθεί· αφετέρου, η διεύθυνση έχει πλέον εκτεθεί στη διεργασία – στον τρόπο που τέθηκε το ερώτημα, στα δεδομένα που χρησιμοποιήθηκαν, στη λογική που οδήγησε στα συμπεράσματα. Αυτό σημαίνει ότι την επόμενη φορά που θα προκύψει ανάλογη ανάγκη, η διεύθυνση δεν ξεκινά από μηδέν. Γνωρίζει τι έχει γίνει, πώς έγινε, και άρα μπορεί, σε μεγαλύτερο βαθμό, να το κάνει πλέον εσωτερικά.

  - q: "Πώς διασφαλίζεται το υψηλό επίπεδο όσων έρχονται;"
    a: |
      Υπάλληλοι του δήμου μπορούν να κάνουν συνέντευξη με τον υποψήφιο πριν την έγκριση της τοποθέτησης, ανεξάρτητα από το ποια εταιρεία ή ποιο πανεπιστήμιο τον στέλνει. Το κριτήριο είναι η συμβατότητα με το συγκεκριμένο αντικείμενο, όχι ο τίτλος ή η φορέας προέλευσης.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - category: peer-cities
    body: |
      Το Ηνωμένο Βασίλειο έχει αναπτύξει αυτό το μοντέλο με μεγάλη επιτυχία οπότε είναι χρήσιμο να διερευνηθούν επαφές που έχουν συνδράμει στον σχεδιασμό και τη λειτουργία αυτών των πλαισίων για να μοιραστούν ευκαιρίες και προκλήσεις που αναγνωρίζουν βάσει της εμπειρίας τους, που είναι δύσκολο να καταγραφούν πλήρως στη βιβλιογραφία.

  - category: financial-flow
    body: |
      Είναι σημαντικό αυτές οι τοποθετήσεις να μην παρουσιαστούν σαν εθελοντικός – και οι φοιτητές και οι επαγγελματίες πρέπει να αμείβονται, αλλιώς το πρόγραμμα προσελκύει μόνο όσους μπορούν να το αντέξουν οικονομικά, περιορίζοντας δραματικά το διαθέσιμο ταλέντο. Χρειάζεται να χαρτογραφηθεί ποιο νομικό πλαίσιο επιτρέπει τέτοιες πληρωμές, με ποιο τύπο σύμβασης και από ποια κονδύλια. Για τους φοιτητές, υπάρχει ήδη ένα φυσικό σημείο σύνδεσης: ευρωπαϊκά προγράμματα τύπου Erasmus+ χρηματοδοτούν ακριβώς αυτού του είδους τοποθετήσεις σε δημόσιους φορείς, χωρίς να απαιτείται δημοτική δαπάνη για τη μισθοδοσία. Για τους επαγγελματίες, η μορφή του secondment, όπου η εταιρεία συνεχίζει να μισθοδοτεί τον εργαζόμενο για το διάστημα της τοποθέτησης, επιλύει το ζήτημα κόστους για τον δήμο και ταυτόχρονα διατηρεί την εργασιακή σχέση ανέπαφη.

