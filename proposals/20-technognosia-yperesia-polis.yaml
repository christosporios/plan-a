# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «ΑΠΟΤΕΛΕΣΜΑΤΙΚΟΣ ΔΗΜΟΣ» ────────────────────────
contribution:
  body: |
    Πολλές από τις προτάσεις αυτού του σχεδίου απαιτούν δεξιότητες που οι
    δημοτικές υπηρεσίες σπάνια διαθέτουν σήμερα: ανάλυση δεδομένων, διαχείριση
    έργων, σχεδιασμό πολιτικής βασισμένο σε αποτελέσματα, αστικό σχεδιασμό,
    ψηφιακή ανάπτυξη. Αυτό δεν είναι κριτική στους υπαλλήλους του Δήμου — αφορά τη
    δομή της δημόσιας απασχόλησης στην Ελλάδα, που δεν επιτρέπει εύκολα ούτε
    στοχευμένες προσλήψεις ούτε ανάπτυξη εξειδικευμένης τεχνογνωσίας για
    συγκεκριμένα έργα.
  callouts:
    - |
      Η ελληνική δημόσια διοίκηση γερνά και δεν ανανεώνεται. Το 2023, μόλις το
      [2% των εργαζομένων στην κεντρική
      διοίκηση](https://www.oecd.org/en/publications/government-at-a-glance-2025-country-notes_da3361e1-en/greece_3bee4427-en.html)^1
      ήταν ηλικίας 18–34 ετών (έναντι μέσου όρου 19% στον ΟΟΣΑ), ενώ το 43% ήταν
      55 ετών και άνω (έναντι 27% στον ΟΟΣΑ). Αυτή η ηλικιακή ασυμμετρία σημαίνει
      ότι νέες δεξιότητες δύσκολα εισέρχονται στον οργανισμό.

      Πηγή: OECD, Government at a Glance 2025 — Greece
  body_after: |
    Το αποτέλεσμα είναι μια χρόνια ασυμμετρία: οι ανάγκες της πόλης γίνονται πιο
    σύνθετες, αλλά οι δυνατότητες υλοποίησης δεν ενισχύονται. Πολιτικές σωστά
    σχεδιασμένες και καλά χρηματοδοτημένες αποτυγχάνουν στην εκτέλεση — όχι επειδή
    κάποιος δεν θέλει να τις υλοποιήσει, αλλά επειδή λείπει ο χρόνος ή η
    τεχνογνωσία. Η ψηφιοποίηση των υπηρεσιών, που οι συμμετέχοντες στη
    διαβούλευση κατατάσσουν ως βασική προτεραιότητα, είναι ακριβώς ένα τέτοιο
    πεδίο όπου η εξειδίκευση σπανίζει.

    Η πρόταση αντιμετωπίζει αυτό το κενό αξιοποιώντας δύο δεξαμενές ανθρώπινου
    δυναμικού που σήμερα μένουν αναξιοποίητες: αφενός **φοιτητές** που εκπονούν
    διπλωματικές ή πρακτική άσκηση αποκομμένα από τα πραγματικά προβλήματα της
    πόλης· αφετέρου **επαγγελματίες του ιδιωτικού τομέα** που θα ήθελαν να
    συνεισφέρουν, αλλά δεν υπάρχει δομημένος τρόπος να το κάνουν.

    Το κρίσιμο σημείο για τον στόχο του αποτελεσματικού δήμου δεν είναι απλώς να
    «μπει» γνώση, αλλά να **μείνει**. Γι' αυτό κάθε τοποθέτηση κλείνει με ανοιχτή
    παρουσίαση στη διεύθυνση και έχει έναν υπεύθυνο υπηρεσίας που συμμετέχει σε
    όλη τη διάρκεια — ώστε η διεύθυνση να έχει εκτεθεί στη μεθοδολογία και την
    επόμενη φορά να μην ξεκινά από το μηδέν. Έτσι το πρόγραμμα δεν προσφέρει μόνο
    χέρια, αλλά αυξάνει διαρκώς την ικανότητα του ίδιου του οργανισμού.

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:
  - q: "Χρειάζεται νέο νομοθετικό πλαίσιο για να φιλοξενήσει ο Δήμος φοιτητές;"
    a: >
      Όχι. Το [άρθρο 69 του Ν.
      4957/2022](https://www.kodiko.gr/nomothesia/document/807164/nomos-4957-2022)^2
      ορίζει ρητά ότι η πρακτική άσκηση φοιτητών ΑΕΙ διεξάγεται και «σε δημόσιες
      υπηρεσίες, νομικά πρόσωπα δημοσίου δικαίου, Οργανισμούς Τοπικής
      Αυτοδιοίκησης α´ και β´ βαθμού». Ο Δήμος εγγράφεται ως [Φορέας Υποδοχής στο
      εθνικό σύστημα ΑΤΛΑΣ](https://atlas.grnet.gr/company-registration.html)^3 —
      η εγγραφή είναι απλή και δωρεάν, και μόλις ανακοινωθεί μια θέση γίνεται
      αυτόματα ορατή σε όλα τα τμήματα που επιλέγει ο Δήμος. Η σύμβαση ακολουθεί
      τυποποιημένο υπόδειγμα· δεν απαιτείται νέα νομοθεσία, παρά μόνο η απόφαση
      εγγραφής.

  - q: "Και το κόστος των φοιτητών;"
    a: >
      Είναι χαμηλό και προβλέψιμο. Μετά την τροποποίηση του άρθρου 69 το 2024, η
      συνολική μηνιαία αποζημίωση πλήρους απασχόλησης ορίζεται στα [350
      ευρώ](https://www.aueb.gr/el/internship/content/apofasi-gia-apozimiosi-foititon-apo-ak-etos-2024-2025)^4.
      Για τοποθετήσεις στο πλαίσιο ΕΣΠΑ, το πρόγραμμα επιδοτεί τον φοιτητή με
      [280 ευρώ τον
      μήνα](https://praktiki.teicm.gr/announcement/9-announcements-tei/235-01-01042024)^5
      και ο φορέας υποδοχής συμπληρώνει το υπόλοιπο — δηλαδή το καθαρό κόστος για
      τον Δήμο περιορίζεται σε λίγες δεκάδες ευρώ ανά φοιτητή τον μήνα.

  - q: "Για τους επαγγελματίες του ιδιωτικού τομέα δεν χρειάζεται διαγωνισμός ή νέα θέση;"
    a: >
      Εξαρτάται από τη μορφή. Στο **secondment** η σχέση εργασίας παραμένει
      μεταξύ εταιρείας και εργαζομένου· ο Δήμος δεν καταβάλλει μισθό, οπότε η
      τριμερής συμφωνία λαμβάνει τη μορφή Πρωτοκόλλου Συνεργασίας που εγκρίνεται
      με απόφαση Δημάρχου βάσει του [Ν.
      3852/2010](https://www.kodiko.gr/nomothesia/document/132966/nomos-3852-2010)^6
      και δεν υπάγεται στον νόμο περί δημοσίων συμβάσεων, αφού δεν υπάρχει
      χρηματική αντιπαροχή. Στο **project-based συμβόλαιο** εφαρμόζεται ο [Ν.
      4412/2016](https://www.taxheaven.gr/law/4412/2016)^7: για συμβάσεις
      υπηρεσιών έως 30.000 ευρώ (χωρίς ΦΠΑ) επιτρέπεται απευθείας ανάθεση με
      απόφαση Δημάρχου (άρθρο 118), εύρος στο οποίο εμπίπτουν συνήθως τα σύντομα
      συμβόλαια μεσαίας εξειδίκευσης. Σε καμία περίπτωση δεν δημιουργείται νέα
      οργανική θέση.

  - q: "Οι ήδη υποστελεχωμένες διευθύνσεις δεν θα δουν την τοποθέτηση ως επιπλέον βάρος;"
    a: >
      Γι' αυτό οι θέσεις πρέπει να είναι αυστηρά προκαθορισμένες — ο
      τοποθετημένος φτάνει με σαφές αντικείμενο, όχι για να ρωτήσει «τι να κάνω».
      Επιπλέον, στην πρώτη φάση η συμμετοχή είναι εθελοντική για κάθε διεύθυνση:
      συμμετέχουν μόνο όσες το ζητούν ενεργά.

  - q: "Πώς διασφαλίζεται ότι οι εταιρείες θα στείλουν ικανούς ανθρώπους και όχι όποιον θέλουν να «παρκάρουν»;"
    a: >
      Υπάλληλοι του Δήμου κάνουν συνέντευξη με τον υποψήφιο πριν την έγκριση,
      ανεξάρτητα από το ποια εταιρεία τον στέλνει. Το κριτήριο είναι η
      συμβατότητα με το συγκεκριμένο αντικείμενο, όχι ο τίτλος ή η εταιρεία
      προέλευσης.

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:
  - title: Γέφυρα μεταξύ πανεπιστημίου και πόλης
    body: >
      Οι διπλωματικές και η πρακτική άσκηση παύουν να είναι ασκήσεις επί χάρτου
      και αποκτούν πραγματικό αντικείμενο. Ο φοιτητής αποκτά εμπειρία σε
      πραγματικό περιβάλλον και ο Δήμος ένα παραδοτέο που μπορεί να χρησιμοποιήσει
      — μια σχέση που, όπως φάνηκε και στη διαβούλευση, βρίσκει ευρεία αποδοχή.

  - title: Εταιρική κοινωνική ευθύνη με ουσιαστικό αντίκρισμα
    body: >
      Το secondment δίνει στις εταιρείες έναν τρόπο να συνεισφέρουν στην πόλη με
      τεχνογνωσία αντί για χρηματική δωρεά. Είναι μια πρακτική με μακρά παράδοση:
      στο [βρετανικό δημόσιο](https://www.gov.uk/guidance/civil-service-secondments-and-loans-how-to-apply)^8
      ο εργαζόμενος παραμένει στη μισθοδοσία της εταιρείας του ενώ προσφέρει
      εργασία σε δημόσιο φορέα, σε δομημένα προγράμματα ανταλλαγής στελεχών
      δημόσιου και ιδιωτικού τομέα.

  - title: Διαρκής ενίσχυση της ικανότητας του οργανισμού
    body: >
      Επειδή κάθε τοποθέτηση κλείνει με παρουσίαση στη διεύθυνση και έχει
      εσωτερικό υπεύθυνο, η γνώση δεν φεύγει μαζί με τον τοποθετημένο. Με τον
      καιρό, ο Δήμος συσσωρεύει μεθοδολογίες, δεδομένα και πρακτικές — και
      αποκτά καλύτερο συντονισμό μεταξύ υπηρεσιών, κάτι που οι συμμετέχοντες στη
      διαβούλευση ανέδειξαν ως σημαντικό ζητούμενο.

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
next_steps:
  - title: Εγγραφή στο ΑΤΛΑΣ και πιλοτικές φοιτητικές θέσεις
    body: >
      Ο Δήμος να εγγραφεί ως Φορέας Υποδοχής στο σύστημα ΑΤΛΑΣ και να ανακοινώσει
      ένα μικρό πρώτο κύμα θέσεων με σαφές, προκαθορισμένο αντικείμενο, σε
      συνεργασία με τα γραφεία πρακτικής άσκησης επιλεγμένων τμημάτων. Αντί να
      περιμένει τους φοιτητές να ψάχνουν φορέα, ο Δήμος αντιστρέφει τη λογική
      δημοσιεύοντας ο ίδιος συγκεκριμένα παραδοτέα.

  - title: Πλαίσιο secondment και πρότυπο Πρωτόκολλο Συνεργασίας
    body: >
      Να συνταχθεί ένα τυποποιημένο Πρωτόκολλο Συνεργασίας (Δήμος–εταιρεία–
      επαγγελματίας) που να ρυθμίζει διάρκεια, αντικείμενο, ρόλο του υπεύθυνου
      υπηρεσίας και ζητήματα προστασίας δεδομένων, ώστε κάθε νέα τοποθέτηση να
      εγκρίνεται γρήγορα με απόφαση Δημάρχου χωρίς να ξαναχτίζεται από την αρχή.

