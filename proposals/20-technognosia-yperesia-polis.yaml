number: 20
slug: technognosia-yperesia-polis
theme: municipality
title: Τεχνογνωσία στην υπηρεσία της πόλης
one_line: >
  Πρόγραμμα τοποθετήσεων δύο τύπων εντός του Δήμου: φοιτητές από ελληνικά
  ΑΕΙ και επαγγελματίες από τον ιδιωτικό τομέα δουλεύουν σε συγκεκριμένα,
  προκαθορισμένα projects με σαφή παραδοτέα.

problem:
  body: |
    Πολλές από τις προτάσεις αυτού του σχεδίου απαιτούν δεξιότητες που οι
    δημοτικές υπηρεσίες σπάνια διαθέτουν σήμερα: ανάλυση δεδομένων, διαχείριση
    έργων, σχεδιασμός πολιτικής βασισμένης σε αποτελέσματα, αστικός σχεδιασμός,
    ψηφιακή ανάπτυξη. Αυτό δεν είναι κριτική στους υπαλλήλους του Δήμου —
    αφορά τη δομή της δημόσιας απασχόλησης στην Ελλάδα, που δεν επιτρέπει
    εύκολα ούτε στοχευμένες προσλήψεις ούτε ανάπτυξη εξειδικευμένης
    τεχνογνωσίας για συγκεκριμένα projects.

    Το αποτέλεσμα είναι μια χρόνια ασυμμετρία: οι ανάγκες της πόλης γίνονται
    πιο σύνθετες, αλλά οι δυνατότητες υλοποίησης δεν ενισχύονται. Πολιτικές
    που είναι σωστά σχεδιασμένες και καλά χρηματοδοτημένες αποτυγχάνουν στην
    εκτέλεση — όχι επειδή κάποιος δεν θέλει να τις υλοποιήσει, αλλά επειδή δεν
    υπάρχει ούτε ο χρόνος ούτε η τεχνογνωσία.

    Υπάρχουν ταυτόχρονα δύο αναξιοποίητες δεξαμενές ανθρώπινου δυναμικού:

    **Πρώτη**, φοιτητές από ΕΜΠ, ΕΚΠΑ, Πάντειο, Οικονομικό Πανεπιστήμιο και
    άλλα ιδρύματα που εκπονούν διπλωματικές ή πρακτική άσκηση αποκομμένα από
    τα πραγματικά προβλήματα της πόλης.

    **Δεύτερη**, επαγγελματίες από τον ιδιωτικό τομέα — σύμβουλοι, αρχιτέκτονες,
    analysts, project managers, developers — που σε αρκετές περιπτώσεις θα
    ήθελαν να συνεισφέρουν στην πόλη, αλλά δεν υπάρχει κανένας δομημένος τρόπος
    να το κάνουν.

proposal:
  body: |
    Δημιουργία ενός προγράμματος τοποθετήσεων (placement program) δύο τύπων,
    που να λειτουργούν εντός του Δήμου:

    **Τύπος Α — Φοιτητικές τοποθετήσεις:** Συνεργασία με τμήματα πολιτικής
    επιστήμης, αρχιτεκτονικής, πολεοδομίας, οικονομικών, πληροφορικής και
    δημόσιας διοίκησης για τοποθετήσεις διάρκειας 4–6 μηνών στις υπηρεσίες
    του Δήμου. Κάθε φοιτητής εργάζεται σε ένα συγκεκριμένο, προκαθορισμένο
    αντικείμενο — όχι απλά «βοηθητικά», αλλά με παραδοτέο: μια ανάλυση
    δεδομένων, μια χαρτογράφηση, ένα σχέδιο πολιτικής, μια αξιολόγηση
    προγράμματος. Το αντικείμενο μπορεί να αποτελεί και τη διπλωματική του
    εργασία.

    **Τύπος Β — Τοποθετήσεις από τον ιδιωτικό τομέα:** Επαγγελματίες από
    εταιρείες ή αυτοαπασχολούμενοι τοποθετούνται στον Δήμο για 3–12 μήνες. Η
    αφετηρία μπορεί να είναι διπλή: είτε ένα project που έχει ήδη εγκριθεί
    και χρηματοδοτηθεί και χρειάζεται ικανότητα υλοποίησης που δεν υπάρχει
    εσωτερικά, είτε ένα πρόβλημα που έχει διαπιστωθεί και ο Δήμος αναζητά
    κάποιον με δημιουργική σκέψη να προτείνει λύσεις — χωρίς δηλαδή να υπάρχει
    ήδη έτοιμο σχέδιο προς εκτέλεση. Υπάρχουν δύο παραλλαγές:

    - **Secondment:** ο επαγγελματίας παραχωρείται από την εταιρεία του, που
      συνεχίζει να τον μισθοδοτεί εν όλω ή εν μέρει. Ο Δήμος δεν πληρώνει
      μισθό, αλλά παρέχει χώρο, πρόσβαση σε δεδομένα και θεσμική υποστήριξη.
      Η εταιρεία αποκτά ορατότητα και συνεισφορά στην πόλη — μια μορφή
      εταιρικής κοινωνικής ευθύνης χωρίς χρηματική δωρεά.
    - **Project-based συμβόλαιο:** ο επαγγελματίας αμείβεται από τον Δήμο για
      συγκεκριμένο παραδοτέο με σύμβαση έργου σύντομης διάρκειας.

    Και στους δύο τύπους ισχύει μια βασική αρχή: κάθε τοποθέτηση έχει έναν
    εσωτερικό **«υπεύθυνο υπηρεσίας»** — υπάλληλο του Δήμου που συνεργάζεται
    στενά, παρακολουθεί και παραλαμβάνει το αποτέλεσμα. Ο ρόλος αυτός είναι
    κρίσιμος: χωρίς αυτόν, η τοποθέτηση δεν μεταφέρει τεχνογνωσία στον Δήμο.

implementation:
  body: |
    **Τύπος Α — Φοιτητικές τοποθετήσεις**

    Το άρθρο 69 του Ν. 4957/2022 ορίζει ρητά ότι η πρακτική άσκηση φοιτητών
    ΑΕΙ «διεξάγεται σε δημόσιες υπηρεσίες, νομικά πρόσωπα δημοσίου δικαίου,
    Οργανισμούς Τοπικής Αυτοδιοίκησης α´ και β´ βαθμού». Ο Δήμος Αθηναίων
    μπορεί να εγγραφεί ως Φορέας Υποδοχής Πρακτικής Άσκησης στο εθνικό
    σύστημα «ΑΤΛΑΣ», το οποίο διασυνδέει δημόσιους και ιδιωτικούς φορείς με
    όλα τα ΑΕΙ της χώρας. Η εγγραφή είναι απλή και δωρεάν. Μόλις ο Δήμος
    ανακοινώσει στο ΑΤΛΑΣ, αυτές γίνονται αυτόματα ορατές σε όλα τα τμήματα
    που επιλέγει.

    Ως προς το κόστος: αν οι τοποθετήσεις γίνουν στο πλαίσιο ΕΣΠΑ, το πρόγραμμα
    χρηματοδοτεί τον φοιτητή με €280/μήνα, ενώ ο φορέας υποδοχής — εδώ ο Δήμος
    — συμπληρώνει μέχρι το 80% του κατώτατου μισθού, ήτοι περίπου €417/μήνα,
    ώστε ο φοιτητής να λαμβάνει συνολικά ~€697/μήνα. Εναλλακτικά, για
    τοποθετήσεις εκτός ΕΣΠΑ — και ιδίως για διπλωματικές εργασίες που δεν
    εντάσσονται τυπικά στην πρακτική άσκηση — η αποζημίωση στον δημόσιο τομέα
    και τους ΟΤΑ καθορίζεται με Υπουργικές Αποφάσεις σε ~€176/μήνα, με
    ασφαλιστική κάλυψη αποκλειστικά για ατύχημα σε βάρος του Δήμου. Η σύμβαση
    μεταξύ φοιτητή, ΑΕΙ και Δήμου ακολουθεί τυποποιημένο υπόδειγμα που
    ορίζεται από τον εσωτερικό κανονισμό κάθε ΑΕΙ — δεν απαιτείται νέο
    νομοθετικό πλαίσιο από πλευράς Δήμου, παρά μόνο η απόφαση εγγραφής στο
    ΑΤΛΑΣ.

    Ένα πρακτικό σημείο: η αντιστοίχιση φοιτητών με θέσεις γίνεται σήμερα
    κυρίως με πρωτοβουλία του φοιτητή — αυτός ψάχνει φορέα. Ο Δήμος μπορεί να
    αντιστρέψει αυτή τη λογική ανακοινώνοντας ο ίδιος συγκεκριμένες θέσεις με
    σαφές αντικείμενο, οπότε τα τμήματα αντιστοιχίζουν φοιτητές κατόπιν
    επιλογής. Αυτό απαιτεί συνεργασία με τα γραφεία πρακτικής άσκησης των
    ιδρυμάτων — μια διοικητική επαφή, όχι επιπρόσθετη νομική διαδικασία.

    **Τύπος Β — Τοποθετήσεις από τον ιδιωτικό τομέα: νομικό πλαίσιο**

    Για το secondment, δεν υπάρχει ειδικό νομοθετικό πλαίσιο που να το ρυθμίζει
    ρητά στην ελληνική δημόσια διοίκηση — και αυτό είναι ακριβώς ο λόγος που
    δεν απαιτεί νομοθετική αλλαγή για να υλοποιηθεί. Η σχέση εργασίας
    παραμένει μεταξύ εταιρείας και εργαζομένου· ο Δήμος δεν αναλαμβάνει
    εργοδοτικές υποχρεώσεις και δεν καταβάλλει μισθό. Η τριμερής συμφωνία
    (Δήμος–εταιρεία–επαγγελματίας) λαμβάνει τη μορφή Memorandum of
    Understanding ή Πρωτοκόλλου Συνεργασίας, το οποίο εγκρίνεται με απόφαση
    Δημάρχου βάσει του Ν. 3852/2010. Δεν υπάγεται στον Ν. 4412/2016 περί
    δημοσίων συμβάσεων, επειδή δεν υπάρχει χρηματική αντιπαροχή από τον Δήμο.

    Για το project-based συμβόλαιο, το νομικό εργαλείο είναι η δημόσια σύμβαση
    παροχής υπηρεσιών βάσει Ν. 4412/2016. Αναλόγως του ύψους αμοιβής, ισχύουν
    διαφορετικές διαδικασίες: για συμβάσεις έως €30.000 (χωρίς ΦΠΑ)
    επιτρέπεται η απευθείας ανάθεση με απόφαση Δημάρχου, χωρίς διαγωνισμό· για
    ποσά από €30.000 έως ~€140.000 απαιτείται δημόσια πρόσκληση με διαδικασία
    συνοπτικού διαγωνισμού. Στην πράξη, για συμβόλαια διάρκειας 3–6 μηνών
    μεσαίας εξειδίκευσης, τα ποσά συνήθως εμπίπτουν στο εύρος της απευθείας
    ανάθεσης, που είναι και η ευκολότερη διοικητικά διαδρομή. Σε κάθε
    περίπτωση, δεν απαιτείται νέα οργανική θέση στον Δήμο — η σύμβαση έργου
    δεν δημιουργεί σχέση εξαρτημένης εργασίας.

limitations:
  - q: "«Δεν έχουμε χρόνο να τους διαχειριστούμε»: οι διευθύνσεις που είναι ήδη υποστελεχωμένες μπορεί να αντιληφθούν την τοποθέτηση ως επιπλέον βάρος, όχι ως ανακούφιση."
    a: >
      Αυτό είναι ο βασικότερος λόγος που οι θέσεις πρέπει να είναι αυστηρά
      προκαθορισμένες — ο τοποθετημένος φτάνει με σαφές αντικείμενο, όχι για
      να ρωτήσει «τι να κάνω». Επιπλέον, η συμμετοχή μπορεί να είναι
      εθελοντική για κάθε διεύθυνση στην πρώτη φάση: μόνο αυτές που το ζητούν
      ενεργά συμμετέχουν.

  - q: "Τοποθετήσεις που δεν ενισχύουν το capacity: ο φοιτητής ή ο επαγγελματίας φεύγει και η τεχνογνωσία φεύγει μαζί του."
    a: >
      Ο υπεύθυνος υπηρεσίας δεν είναι απλώς παραλήπτης του τελικού παραδοτέου:
      συμμετέχει ενεργά καθ' όλη τη διάρκεια της τοποθέτησης, με τακτικές
      συναντήσεις στις οποίες ο τοποθετημένος παρουσιάζει ενδιάμεσα ευρήματα,
      εξηγεί τη μεθοδολογία που ακολουθεί και απαντά σε ερωτήσεις. Η
      τοποθέτηση κλείνει πάντα με μια ανοιχτή παρουσίαση στη διεύθυνση όπου ο
      τοποθετημένος παρουσιάζει το αποτέλεσμα και η ομάδα μπορεί να ρωτήσει,
      να αμφισβητήσει, να κατανοήσει τις παραδοχές. Αυτή η διαδικασία έχει
      διπλή αξία: αφενός το παραδοτέο γίνεται κατανοητό από περισσότερους
      ανθρώπους στον Δήμο και άρα πιο πιθανό να χρησιμοποιηθεί· αφετέρου, η
      διεύθυνση έχει πλέον εκτεθεί στη διεργασία — στον τρόπο που τέθηκε το
      ερώτημα, στα δεδομένα που χρησιμοποιήθηκαν, στη λογική που οδήγησε στα
      συμπεράσματα. Αυτό σημαίνει ότι την επόμενη φορά που θα προκύψει ανάλογη
      ανάγκη, η διεύθυνση δεν ξεκινά από το μηδέν. Γνωρίζει τι έχει γίνει,
      πώς έγινε, και άρα μπορεί, σε μεγαλύτερο βαθμό, να το κάνει πλέον
      εσωτερικά.

  - q: "Ποιότητα secondments: δεν είναι βέβαιο ότι οι εταιρείες που θα ανταποκριθούν θα στέλνουν τους ικανότερους ανθρώπους τους — το secondment μπορεί να γίνει τρόπος να «παρκάρουν» κάποιον για λίγους μήνες."
    a: >
      Υπάλληλοι του Δήμου μπορούν να κάνουν συνέντευξη με τον υποψήφιο πριν
      την έγκριση της τοποθέτησης, ανεξάρτητα από το ποια εταιρεία τον
      στέλνει. Το κριτήριο είναι η συμβατότητα με το συγκεκριμένο αντικείμενο,
      όχι ο τίτλος ή η εταιρεία προέλευσης.

good_practices:
  - city: Ηνωμένο Βασίλειο
    body: >
      Στο Ηνωμένο Βασίλειο, το No10 Innovation Fellowship της κεντρικής
      κυβέρνησης τοποθετεί επαγγελματίες τεχνολογίας, data science και
      σχεδιασμού από εταιρείες και startups σε κυβερνητικά υπουργεία για 6–12
      μήνες, με secondment που οργανώνεται απευθείας με τον εργοδότη. Οι
      fellows εργάζονται σε μικρές ομάδες πάνω σε συγκεκριμένα, προκαθορισμένα
      projects με σαφή παραδοτέα. Χαρακτηριστικό εύρημα από την πρώτη cohort:
      οι υπηρεσίες που δέχτηκαν fellows τους περιέγραψαν ως «force multipliers»
      — όχι επειδή παρήγαγαν απλώς παραδοτέα, αλλά επειδή άλλαξαν τον τρόπο
      που οι εσωτερικές ομάδες σκέφτονται για αντίστοιχα προβλήματα. Το
      πρόγραμμα αφορά κεντρική κυβέρνηση, αλλά η δομή του είναι πλήρως
      μεταφέρσιμη σε δημοτικό επίπεδο.

  - city: Ρότερνταμ (Ολλανδία)
    body: >
      Στην Ολλανδία, ο Δήμος Ρότερνταμ διαχειρίζεται δομημένο πρόγραμμα
      φοιτητικών τοποθετήσεων σε όλα τα επίπεδα σπουδών μέσω επίσημου
      «Stagebureau» που λειτουργεί ως κεντρικό σημείο συντονισμού. Ο Δήμος
      δημοσιεύει θέσεις με καθορισμένο αντικείμενο και οι φοιτητές επιλέγονται
      βάσει συμβατότητας. Τα αντικείμενα καλύπτουν ευρύ φάσμα: από αστικό
      σχεδιασμό και ανάλυση δεδομένων μέχρι διοίκηση και επικοινωνία.

  - city: Βαρκελώνη
    body: >
      Στη Βαρκελώνη, το Barcelona Urban Lab λειτουργεί ως πεδίο δοκιμής για
      εταιρείες και ερευνητές που θέλουν να αναπτύξουν λύσεις σε αστικά
      προβλήματα. Εταιρείες υποβάλλουν πρόταση, η επιλογή γίνεται από κοινού
      με το Δημαρχείο, και αν εγκριθεί, ο Δήμος παρέχει δημόσιο χώρο, πρόσβαση
      σε δεδομένα και θεσμική υποστήριξη. Η ανταλλαγή δεν είναι χρηματική: η
      εταιρεία αποκτά reference case σε πραγματικό αστικό περιβάλλον, ο Δήμος
      αποκτά λύση που δοκιμάστηκε σε συνθήκες πόλης. Σε διάστημα αρκετών ετών
      υλοποιήθηκαν περίπου 100 τέτοια projects, από έξυπνα συστήματα φωτισμού
      μέχρι ηλιακά πάνελ σε κοινόχρηστους τοίχους.
