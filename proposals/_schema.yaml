# Plan A proposal schema — commented template.
# Copy this to `NN-slug.yaml` (e.g. 01-mikres-pezodromiseis.yaml) to create a proposal.
# Fields marked OPTIONAL can be omitted entirely.
#
# Section render order on the proposal page:
#   one_line (teaser) → proposal (Η πρόταση) → polis (Από το Pol.is)
#   → contribution (Πώς συμβάλλει στον στόχο «…») → limitations (Ζητήματα υλοποίησης)
#   → benefits (Επιπρόσθετα οφέλη) → next_steps (Δύο ενδεικτικά επόμενα βήματα)
#   → references (Παραπομπές)
#
# `problem` and `implementation` are LEGACY fields (older structure) still
# rendered if present, for proposals not yet migrated. New proposals use
# `contribution` instead of `problem`.
#
# CITATIONS: the final text style is an inline link IMMEDIATELY followed by a
# footnote marker, e.g.  [εκτός προδιαγραφών](https://…)^1  — the link target and
# the numbered reference (references[] with n: 1) point at the same source.
#
# CROSS-REFERENCES between proposals: link with an internal path,
# [Πρόταση 4](/4-apomakrynsi-paranomis-stathmeysis) — any href of the form
# /<number> or /<number>-<slug> renders as a themed cross-reference (accent
# color, subtle underline) and navigates within the SPA. No footnote marker.

number: 1                                # 1–20; also the URL number and image key (assets/proposals/NN.jpg)
slug: mikres-pezodromiseis               # URL-safe ASCII transliteration; canonical URL is /<number>-<slug>
theme: mobility                          # mobility | public-space | housing | identity | municipality (keys of THEMES)
title: Μικρές πεζοδρομήσεις ανά ομάδες οικοδομικών τετραγώνων
one_line: >                              # short teaser shown on the cover + OG image (1 sentence)
  Πεζοδρομώντας επιλεγμένους δρόμους ανά ομάδες οικοδομικών τετραγώνων, αποδίδουμε
  στη γειτονιά χώρο για πεζούς — χωρίς να ανατρέπεται η κίνηση της πόλης.

# ── Η ΠΡΟΤΑΣΗ ───────────────────────────────────────────────────────────────
proposal:
  body: |
    Free-flowing Greek prose — the "Η πρόταση" lead. Paragraph breaks are blank
    lines. Use **bold** / *italic* sparingly. Inline links: [label](https://…).
    Footnote citations: [label](url)^N where N matches a references[] entry.
  callouts: []                           # OPTIONAL — bordered call-out boxes (list of strings)

# ── ΑΠΟ ΤΟ POL.IS ───────────────────────────────────────────────────────────
# The most distinctive Plan A widget. One entry per statement (often 1–4 per proposal).
# Numbers from the source come as integer percentages.
polis:                                   # OPTIONAL
  - statement: "Η Αθήνα πρέπει να στοχεύει σε ανάπτυξη που αυξάνει την ποιότητα ζωής, όχι μόνο τον τουρισμό."
    statement_id: 1                      # OPTIONAL — statement # in original Pol.is dataset
    overall: { agree: 97, disagree: 0, pass: 1, count: 619 }
    groups:
      - { label: A, agree: 91, disagree: 1, pass: 7, count: 79 }
      - { label: B, agree: 100, disagree: 0, pass: 0, count: 96 }
      - { label: C, agree: 97, disagree: 0, pass: 1, count: 444 }

# ── ΠΩΣ ΣΥΜΒΑΛΛΕΙ ΣΤΟΝ ΣΤΟΧΟ «{goal}» ───────────────────────────────────────
# The goal name in the heading is the proposal's theme label (THEMES[theme].label),
# rendered automatically — don't put it in the body.
contribution:                            # OPTIONAL (replaces the legacy `problem` section)
  body: |
    The problem framing + why the proposal moves the goal. Prose shown ABOVE any
    callouts/charts.
  callouts:                              # OPTIONAL — same shape as proposal.callouts
    - |
      Βάσει των προδιαγραφών… το 70% των πεζοδρομίων είναι [εκτός
      προδιαγραφών](https://walkable.cityofathens.gr/map)^1.
  charts: []                             # OPTIONAL — see `charts` shape below
  body_after: |                          # OPTIONAL — prose shown BELOW the callouts/charts
    Continuation prose after the callout/chart (e.g. the concrete mechanism).

# ── (LEGACY) ΤΟ ΠΡΟΒΛΗΜΑ / ΥΛΟΠΟΙΗΣΗ ────────────────────────────────────────
# problem: { body, callouts }            # legacy — prefer `contribution`
# implementation: { body }               # legacy prose section

# ── ΖΗΤΗΜΑΤΑ ΥΛΟΠΟΙΗΣΗΣ ──────────────────────────────────────────────────────
limitations:                             # OPTIONAL — Q&A pattern
  - q: "Τι γίνεται με όσους θέλουν να παρκάρουν στο πάρκινγκ του σπιτιού τους;"
    a: "Το μέτρο θα εφαρμοστεί σε δρόμους όπου τα κτίρια εκατέρωθεν δεν διαθέτουν ιδιόκτητο πάρκινγκ…"

# ── ΕΠΙΠΡΟΣΘΕΤΑ ΟΦΕΛΗ ───────────────────────────────────────────────────────
benefits:                                # OPTIONAL
  - title: Λιγότερη ηχορύπανση
    body: |
      Στο superblock του Sant Antoni, [η ηχορύπανση μειώθηκε](https://…)^6 κατά 4,1 dB…
    callouts:                            # OPTIONAL — bordered boxes inside the benefit
      - |
        Σύμφωνα με τον ΠΟΥ, τουλάχιστον [1,6 εκατομμύρια υγιή χρόνια ζωής χάνονται](https://…)^7…

# ── ΔΥΟ ΕΝΔΕΙΚΤΙΚΑ ΕΠΟΜΕΝΑ ΒΗΜΑΤΑ ──────────────────────────────────────────────
# Usually two items, sometimes one. Each item's `category` is a fixed key from
# src/lib/next-steps.mjs — the displayed heading is derived from it, and the
# /epomena-vimata page groups every proposal's steps by shared category. When a
# proposal has two steps of the SAME category they auto-number "(1)"/"(2)".
# Categories: mapping | legal | pricing | costing | digital | financial-flow |
#             peer-cities
next_steps:                              # OPTIONAL — category + body list
  - category: mapping                    # → «Χαρτογράφηση σημείων εφαρμογής»
    body: |
      Να εντοπιστούν δρόμοι που πληρούν δύο κριτήρια ταυτόχρονα…

# ── CHARTS (on-brand bar charts, e.g. EU "Quality of Life in European Cities") ─
# Attach under contribution.charts. Multiple charts render as a single swipeable
# group (prev/next + dots) and the shared `source` line is shown once for the
# whole group. data is PRE-SORTED in display order; `highlight` is emphasised in
# the accent color. `label` is the short name shown in the carousel control.
charts_example:
  - title: Ικανοποίηση από τις συγκοινωνίες ως προς την Προσιτότητα, 2023
    label: Προσιτότητα                  # short label shown in the carousel control
    subtitle: Ποσοστό κατοίκων ικανοποιημένων από την προσιτότητα των δημόσιων συγκοινωνιών.
    unit: ""                             # value suffix on labelled bars (e.g. "%"); often omitted
    highlight: Αθήνα                     # OPTIONAL — defaults to "Αθήνα"
    source: Survey on the Quality of Life in European Cities (DG REGIO)
    source_url: https://ec.europa.eu/regional_policy/…
    year: 2023
    data:
      - { label: Ζυρίχη, value: 93 }
      - { label: Αθήνα, value: 59 }
      - { label: Ρώμη, value: 48 }

# ── ΠΑΡΑΠΟΜΠΕΣ ──────────────────────────────────────────────────────────────
references:                              # OPTIONAL — numbered footnotes referenced by ^N
  - n: 1
    text: "Πρότυπο Γεωχωρικό Παρατηρητήριο Βαδισιμότητας Δήμου Αθηναίων."
    url: "https://walkable.cityofathens.gr/map"
  - n: 2
    author: "S. Nello-Deakin"
    title: "Exploring traffic evaporation: Findings from tactical urbanism interventions in Barcelona"
    year: 2022
    publication: "Case Studies on Transport Policy"
    url: "https://www.sciencedirect.com/science/article/pii/S2213624X22002085"
