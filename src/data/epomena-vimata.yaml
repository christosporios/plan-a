title: Επόμενα βήματα
body: |
  Το Plan A δεν ολοκληρώνεται με τη δημοσίευσή του. Τουναντίον, αναζητούμε όσους θέλουν να μας βοηθήσουν για να προχωρήσει, όπως:

  - ερευνητές που έχουν δουλέψει κάποιες από αυτές τις προτάσεις
  - μηχανικούς που θα ελέγξουν περαιτέρω τη βιωσιμότητα όσων προτείνουμε
  - νομικούς που θα δώσουν περισσότερο feedback για το υφιστάμενο ρυθμιστικό πλαίσιο
  - ανθρώπους της αυτοδιοίκησης που ενδιαφέρονται να μοιραστούν την εμπειρία τους ή να τρέξουν κάποια πιλοτική εφαρμογή
  - επενδυτές και επιχειρηματίες που μπορεί να δουν εμπορική ευκαιρία σε κάποια από τις ιδέες
  - δημοσιογράφους που θέλουν να ανοίξουν τη δημόσια συζήτηση γύρω από τις προτάσεις

  αλλά και κάθε πολίτη ή φορέα που θέλει να ακούσει για τις προτάσεις και που θα ήταν ανοιχτός να συμβάλει στην υλοποίησή τους.

  Επικοινωνήστε μαζί μας στο: [vasiliki@astylab.gr](mailto:vasiliki@astylab.gr) & [adam@astylab.gr](mailto:adam@astylab.gr).
