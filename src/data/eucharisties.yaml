# Acknowledgments — single source for the /eucharisties page, the PDF report's
# "Ευχαριστίες" section, and the presentation-mode "Ευχαριστίες" slide.
#
# Fields are split so each surface reuses only the parts it needs:
#   page + PDF  → everything (intro essay → bridge → funding → Adam → experts →
#                 Pol.is → development credit → disclaimer → signature)
#   slide       → experts list + funding + short thanks to Adam
#                 (essay, Pol.is and development credit omitted)
