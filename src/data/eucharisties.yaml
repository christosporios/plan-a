# Personal essay — page + PDF only.
intro: |
  Όταν ξεκίνησα να δουλεύω το Plan A, ένιωθα μια δημιουργική αμηχανία μπροστά στην αφθονία της πληροφορίας και στην επιθυμία να βγει κάτι που να είναι πραγματικά χρήσιμο.

  Κάποιες φορές, ήταν δύσκολο να σταματήσεις να αναρωτιέσαι. Από πού ξεκινάς, τι συμπεριλαμβάνεις, τι αφήνεις απ' έξω, πώς ισορροπείς ανάμεσα στα σημαντικά, γνωστά θέματα χωρίς να πέφτεις σε κλισέ, και σε καινούριες ιδέες χωρίς να γίνεσαι αιθεροβάμων. Πώς φτιάχνεις κάτι που, σε μια συζήτηση για την πόλη που είναι ήδη ζωντανή, έχει κάτι ουσιαστικό να προσθέσει.

  Αλλά μέσα από όλες αυτές τις σκέψεις, κάποια πράγματα έμειναν σταθερά. Κάποιες ιδέες άντεξαν τις συζητήσεις, τις ανατροφοδοτήσεις, τις αναζητήσεις — και έγιναν η ραχοκοκαλιά αυτής της δουλειάς.

  Οι μήνες που έψαχνα, έγραφα και συζητούσα για το Plan A ήταν πολύ όμορφοι. Έμαθα πράγματα που δεν ήξερα, άφησα τον εαυτό μου ανοιχτό να αναρωτηθεί για πράγματα που πίστευα ότι ήξερα, και συνεργάστηκα με ανθρώπους που γνώριζα ή γνώρισα, γύρω από ένα πολύ ωραίο κοινό σκοπό. Και έχω τη χαρά να πιστεύω ότι αυτό που βγήκε είναι προσεγμένο και — αν και σίγουρα όχι πλήρες, γιατί κάτι τέτοιο είναι ανέφικτο — μπορεί να είναι αφετηρία για ωραίες συζητήσεις και χρήσιμες δράσεις.

# Bridge into the thanks — page + PDF only.
bridge: >-
  Πολλές δεκάδες άνθρωποι βοήθησαν για να φτάσει αυτή η δουλειά στα χέρια σας — και
  ανυπομονούμε να γνωρίσουμε όσους θέλουν να πάνε αυτές τις ιδέες ένα βήμα παραπέρα,
  με οποιονδήποτε τρόπο!

# Funding — long version (page + PDF + slide).
funding: >-
  Το Plan A είναι μια δράση της **Astylab**, με χρηματοδότηση του προγράμματος
  «Σημεία Στήριξης», που συγχρηματοδοτείται από το Κοινωφελές Ίδρυμα Ιωάννη Σ.
  Λάτση, το TIMA Κοινωφελές Ίδρυμα, το Ίδρυμα Καπετάν Βασίλη & Κάρμεν
  Κωνστανταντακόπουλου, το Ίδρυμα Α. Γ. Λεβέντη, το Κοινωφελές Ίδρυμα Αθανάσιος
  Κ. Λασκαρίδης, το Costas M. Lemos Foundation, το The Hellenic Initiative
  Canada, το Ίδρυμα Αθηνάς Ι. Μαρτίνου, το Helidoni Foundation, και το Ίδρυμα
  Μποδοσάκη.

# Funding — short version (footer small print).
funding_short: >-
  Η δράση υλοποιείται με την υποστήριξη του Helidoni Foundation στο πλαίσιο του
  προγράμματος «Σημεία Στήριξης», το οποίο συγχρηματοδοτείται από δέκα κοινωφελείς
  οργανισμούς.

# Special thanks to Adam — long version (page + PDF).
adam: >-
  Ιδιαίτερες ευχαριστίες στον **Αδάμ Μαρκάκη**, ιδρυτή της Astylab — που
  οραματίστηκε το Plan A, που μου εμπιστεύτηκε να το αναπτύξω και με στήριξε με
  ιδέες και ενέργεια σε κάθε βήμα, αλλά και που με ό,τι κάνει για αυτή την πόλη
  μάς δίνει λόγους να είμαστε αισιόδοξοι ότι αλλαγή είναι εφικτή. Η συνεργασία
  μαζί του είναι πάντα πηγή έμπνευσης.

