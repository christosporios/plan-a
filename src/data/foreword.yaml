# Πρόλογος — shown on the landing cover and on its own page in the PDF report.
# Single source for both; edit the text here.
text: >-
  Η Αθήνα δεν είναι χαμένη υπόθεση. Το Plan A διατυπώνει είκοσι συγκεκριμένες
  προτάσεις για την πόλη. Δεν λύνουν τα πάντα αλλά είναι επιλεγμένες ώστε να
  φέρουν αισθητό όφελος στους περισσότερους, με μικρό κόστος εφαρμογής, χωρίς
  εκτεταμένες ρυθμιστικές αλλαγές. Σε πολλές περιπτώσεις ο δήμος μπορεί να είναι
  ο βασικός φορέας υλοποίησης· σε άλλες, η κεντρική κυβέρνηση αλλά και ιδιώτες
  που θέλουν να συμβάλουν.
