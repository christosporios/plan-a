# Methodology content — single source for the app (via src/lib/methodology.js)
# and the Node PDF build script (which reads this YAML directly at build time).
# `body` fields are markdown-ish text. The presentation deck shows only the
# principle titles.
title: Τι είναι το Plan A
lead: 'Το Plan A διατυπώνει είκοσι προτάσεις για την Αθήνα με τις εξής βάσεις:'

principles:
  - title: Η Αθήνα δεν είναι χαμένη υπόθεση
    body: >-
      Δεν χρειάζεται γκρέμισμα και χτίσιμο πάλι από την αρχή. Ούτε και χρειάζεται
      μόνο να αγαπάμε να τη μισούμε. Η ιδέα ότι η Αθήνα είναι μία παράξενη
      περίπτωση πόλης όπου τίποτε, ποτέ δεν μπορεί να αλλάξει είναι εντελώς
      αβάσιμη αλλά και επικίνδυνη: λειτουργεί σαν άλλοθι για την απουσία δράσης.

  - title: Πολλές μικρές αλλαγές, όχι μία μεγάλη ιδέα
    body: >-
      Τα προβλήματα της πόλης πρέπει να διατυπώνονται ρητά και με ακρίβεια, και οι
      λύσεις να αναζητούνται εκεί που έχουν ήδη δοκιμαστεί και αποδώσει. Η Αθήνα
      δεν θα αλλάξει με μία μεγάλη ιδέα, αλλά με πολλές μικρές αλλαγές:
      συγκεκριμένες, εφαρμόσιμες και βασισμένες σε στοιχεία.

  - title: Διεθνείς καλές πρακτικές, τοπική εφαρμογή
    body: >-
      Δεν χρειάζεται να επανεφεύρουμε τον τροχό. Αλλά αυτό δεν σημαίνει ότι ό,τι
      φέρει αποτελέσματα στο Άμστερνταμ ή στη Βαρκελώνη, θα είναι αποτελεσματικό
      αυτόματα και στην Αθήνα. Μια καλή πρακτική δεν λειτουργεί ως συνταγή για
      αντιγραφή-επικόλληση αλλά ως αφετηρία για σκέψη και προβληματισμό του πώς
      κάποια εργαλεία μπορούν να προσαρμοστούν στις συνθήκες της δικής μας πόλης.

  - title: Είκοσι συγκεκριμένες προτάσεις, όχι περισσότερες
    body: >-
      Επιλέξαμε είκοσι προτάσεις παρόλο που γνωρίζουμε ότι πολλά ακόμη θα
      μπορούσαν να προταθούν. Κι αυτό γιατί δεν μας αρέσει ο μεταρρυθμιστικός
      πληθωρισμός — ούτε στην πολιτική, ούτε στον δημόσιο διάλογο. Όταν
      προτείνονται πολλά ταυτόχρονα, η προσοχή διαχέεται, οι προτεραιότητες
      χάνονται και η πιθανότητα εφαρμογής μειώνεται για όλα. Λιγότερες ιδέες αλλά
      συγκεντρωμένες έχουν καλύτερες πιθανότητες να γίνουν πράξη.

  - title: Πέρα από τα αυτονόητα
    body: >-
      Οι είκοσι αυτές προτάσεις δεν υποκαθιστούν τα βασικά, το ότι δηλαδή ο Δήμος
      έχει υποχρεώσεις που πρέπει να εκπληρώνονται και εργαλεία που πρέπει να
      χρησιμοποιούνται καλύτερα. Εστιάσαμε όμως αλλού: σε ιδέες που είναι
      καινούριες ή που ενεργοποιούν με νέο τρόπο δυνατότητες που ήδη υπάρχουν αλλά
      παραμένουν αναξιοποίητες. Το ενδιαφέρον μας είναι εκεί που τα υφιστάμενα
      εργαλεία δεν φτάνουν ή δεν αποδίδουν.

  - title: Μέγιστος αντίκτυπος με το χαμηλότερο κόστος
    body: >-
      Η επιλογή των είκοσι αυτών προτάσεων ακολούθησε μια λογική Pareto: ποιες
      παρεμβάσεις θα μπορούσαν να φέρουν το μεγαλύτερο όφελος στους περισσότερους
      με το μικρότερο κόστος εφαρμογής. Αυτό σημαίνει και κάτι άλλο: σε καμία
      περίπτωση αυτές οι είκοσι προτάσεις δεν θα λύσουν τα πάντα. Η εξάντληση κάθε
      δυνατής λύσης είναι άπιαστη ως στόχος. Το ζητούμενο είναι ο μέγιστος δυνατός
      αντίκτυπος από τις λύσεις που επιλέγονται.

  - title: Εντός του υφιστάμενου ρυθμιστικού πλαισίου
    body: >-
      Στην ελληνική πολιτική υπάρχει μια οικεία δικαιολογία: θέλουμε να κάνουμε
      αλλαγές, αλλά δεν μας αφήνει το νομικό πλαίσιο. Επιλέξαμε συνειδητά
      προτάσεις που δεν απαιτούν εκτεταμένη νομοτεχνική επεξεργασία, καθώς
      πιστεύουμε ότι υπάρχουν λύσεις που κινούνται εντός των υφιστάμενων πλαισίων,
      με τους δρώντες που ήδη υπάρχουν, αρκεί να υπάρχει η βούληση να τις δει
      κανείς. Σε πολλές περιπτώσεις ο Δήμος μπορεί να είναι ο βασικός φορέας
      υλοποίησης, σε άλλες η κεντρική κυβέρνηση. Υπάρχουν όμως και προτάσεις που
      δεν απαιτούν καμία πολιτική παρέμβαση: μπορούν να υλοποιηθούν αμιγώς από
      ιδιώτες.

  - title: Προτάσεις που ενώνουν
    body: >-
      Οι προτάσεις επιλέχθηκαν και με ένα άλλο κριτήριο: να μην αποτελούν πεδίο
      οξείας αντιπαράθεσης. Όχι γιατί πιστεύουμε ότι η πολιτική δεν έχει θέση στη
      συζήτηση για την πόλη — έχει, και μάλιστα κεντρική. Αλλά δεν χρειάζεται κάθε
      πρόβλημα να ανάγεται αυτόματα σε πεδίο ιδεολογικής και κομματικής μάχης.
      Υπάρχει ένας ελάχιστος κοινός παρονομαστής — πράγματα που οι περισσότεροι θα
      συμφωνούσαν ότι αξίζει να γίνουν, ανεξάρτητα από το πού στέκονται πολιτικά.
      Ξεκινάμε από εκεί.

# Long-form sections after the principles. `body` is markdown-ish text.
sections:
  - id: how-we-worked
    title: Πώς δουλέψαμε
    body: >-
      Για να φτάσουμε σε αυτές τις είκοσι προτάσεις, χρειάστηκε πολλή δουλειά. Το
      υλικό είναι, άλλωστε, άφθονο. Η δουλειά μας ήταν να ξεχωρίσουμε τι πραγματικά
      αξίζει να συζητηθεί στην Αθήνα απ' όλον αυτόν τον όγκο πληροφορίας. Κάναμε,
      λοιπόν, εκτενή βιβλιογραφική έρευνα. Παράλληλα, συνεργαστήκαμε με 29 ειδικούς
      — ερευνητές, πανεπιστημιακούς, αρχιτέκτονες, δρώντες από την κοινωνία των
      πολιτών αλλά και από τον ιδιωτικό τομέα, άτομα με εμπειρία στη χάραξη
      πολιτικής. Και πραγματοποιήσαμε [μια δημόσια διαβούλευση μέσω της πλατφόρμας
      Pol.is](https://pol.is/report/r7brycbsvbxe94w2mufnf) όπου συμμετείχαν 2.089 πολίτες οι οποίοι κατέθεσαν 817 σχόλια και
      ψήφισαν για 126.819 statements συνολικά. Βασιστήκαμε, επομένως, τόσο στην
      ακαδημαϊκή γνώση όσο και στη γνώση που αποκομίζει κανείς μέσα από την
      επαγγελματική εμπειρία αλλά και από το καθημερινό βίωμα.

  - id: how-to-read-polis
    title: Πώς διαβάζουμε το Pol.is
    body: |-
      Μέσω της πλατφόρμας Pol.is, δεν πραγματοποιείται μια απλή ψηφοφορία. Ο αλγόριθμός της πλατφόρμας ομαδοποιεί τους συμμετέχοντες σε ομάδες απόψεων με βάση τα μοτίβα ψήφου τους. Στη συγκεκριμένη διαβούλευση προέκυψαν τρεις τέτοιες ομάδες – άνθρωποι που σκέφτονται για την πόλη με αρκετά διαφορετικό τρόπο. Αυτό που μας ενδιέφερε δεν ήταν τα statements όπου συμφώνησε η μία ομάδα. Ήταν τα statements όπου συμφώνησαν και οι τρεις – εκεί όπου μένει ο κοινός παρονομαστής που φαίνεται να εκφράζει όλη την πόλη, ανεξαρτήτως των σημείων διαφωνίας. Σε αυτές τις συνθήκες, τα συνολικά ποσοστά έχουν μικρή πληροφοριακή αξία: αντικατοπτρίζουν κυρίως τις απόψεις της πλειοψηφικής ομάδας. Γι' αυτό το πιο ενδιαφέρον εύρημα δεν είναι το πόσοι συμφώνησαν με κάτι αλλά αν συμφώνησαν με αυτό και οι τρεις ομάδες, ανεξάρτητα από το μέγεθός τους.

      Γι' αυτό και αρκετές από τις προτάσεις που ακολουθούν θα δείτε ένα μικρό πλαίσιο με τίτλο «Από τη διαβούλευση». Εκεί παραθέτουμε statements από το Pol.is όπου και οι τρεις ομάδες γνώμης ψήφισαν θετικά. Είναι ο τρόπος μας να δείξουμε ποιες από τις ιδέες αυτού του σχεδίου αντανακλούν μια ευρύτερη συναίνεση ανθρώπων που ακόμα και όταν διαφωνούν για άλλα θέματα, σε κάποια ζητήματα συγκλίνουν.

      Να σημειώσουμε, βέβαια, ότι η ψηφοφορία στο Pol.is δεν περιλαμβάνει ένα απόλυτα αντιπροσωπευτικό δείγμα των κατοίκων – συμμετέχουν όσοι ήδη σε κάποιο βαθμό νοιάζονται για τα ζητήματα της πόλης. Αυτό όμως δεν αναιρεί την αξία των ευρημάτων ως αφετηρία για συζήτηση.
